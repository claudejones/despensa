/* V21 inline post-win celebration: keep the solved board visible. */
.completionPanel{
  width:min(100%,880px);margin:0 auto 12px;padding:14px 16px 16px;
  background:#fffefa;border:1px solid #dce2e6;border-radius:18px;

}
.completionPanel.show{display:block;animation:completionRise .24s ease-out both}

.completionTop{display:flex;align-items:center;justify-content:center;gap:10px;text-align:left}
.completionTop img{width:68px;height:58px;object-fit:contain;flex:0 0 auto}
.completionTop h2{margin:0;font-size:22px;line-height:1.05}

.completionScores{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:11px 0}
.completionScore{background:#f5f5f2;border-radius:12px;padding:9px 10px;text-align:center;min-height:68px}
.completionScore small{display:block;color:#75808a;font-size:9px;font-weight:900;letter-spacing:.11em}
.completionScore strong{display:block;font-size:22px;line-height:1.15;margin-top:1px}
.completionScore .newbest{min-height:13px;margin-top:2px}
.completionContinue{width:100%;min-height:44px}

<script>
(()=>{"use strict";
const KEY="cat-territory-v26-75";
const oldKey="cat-territory-v25-75";
const tiers=[
{id:"kitten",name:"Kitten Grounds",desc:"Learn the hunt. Clean deductions and smaller territories.",sizes:[6,6,6,6,6,6,6,6,7,7,6,7,7,6,7,7,7,6,7,7,7,7,7,7,7],tint:"#fff0e7",tone:"#e87842"},
{id:"domain",name:"Cat's Domain",desc:"Think two moves ahead. More territory interactions.",sizes:[8,8,8,8,8,8,8,9,8,9,8,9,9,8,9,8,9,9,8,9,9,9,9,9,9],tint:"#eaf7f5",tone:"#38a697"},
{id:"lion",name:"Lion's Territory",desc:"Master the grid. Less obvious deductions and larger hunts.",sizes:[9,9,9,10,9,10,9,10,10,9,10,9,10,10,9,10,10,10,9,10,10,10,10,10,10],tint:"#eef0ff",tone:"#6b6ee7"}];
const colors=["#dff2cf","#d9cef6","#fde8a9","#f7c5cf","#bfe2f7","#f7cca8","#cdebbf","#c9edf4","#ead5f8","#ffdcb7"];
const $=x=>document.getElementById(x);let data={settings:{auto:true,conflicts:true},puzzles:{},unlockedTiers:[true,false,false]},cur=null,timer=null,lastTick=Date.now();
function R(seed){return()=>{let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function solution(n,seed){const q=R(seed),a=[...Array(n).keys()];for(let z=0;z<800;z++){for(let i=n-1;i;i--){let j=Math.floor(q()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(a.every((c,r)=>r===0||Math.abs(c-a[r-1])>1))return a.slice()}throw Error("solution")}
function regions(sol,seed){let n=sol.length,q=R(seed),g=Array.from({length:n},()=>Array(n).fill(-1)),cs=Array.from({length:n},()=>[]),ds=[[1,0],[-1,0],[0,1],[0,-1]];for(let r=0;r<n;r++){g[r][sol[r]]=r;cs[r].push([r,sol[r]])}let left=n*n-n;while(left){let min=Math.min(...cs.map(x=>x.length)),choices=[];for(let id=0;id<n;id++){if(cs[id].length>min+2)continue;let f=[],s=new Set;for(let [r,c]of cs[id])for(let[d,e]of ds){let rr=r+d,cc=c+e,k=rr+","+cc;if(rr>=0&&cc>=0&&rr<n&&cc<n&&g[rr][cc]<0&&!s.has(k)){s.add(k);f.push([rr,cc])}}if(f.length)choices.push([id,f])}if(!choices.length){for(let id=0;id<n;id++){let f=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(g[r][c]<0&&ds.some(([d,e])=>r+d>=0&&c+e>=0&&r+d<n&&c+e<n&&g[r+d][c+e]===id))f.push([r,c]);if(f.length)choices.push([id,f])}}let[id,f]=choices[Math.floor(q()*choices.length)],p=f[Math.floor(q()*f.length)];g[p[0]][p[1]]=id;cs[id].push(p);left--}return g}
function def(t,p){let n=tiers[t].sizes[p],seed=9001+t*100000+p*3371,s=solution(n,seed);return{t,p,n,key:tiers[t].id+"-"+p,sol:s,regions:regions(s,seed+771)}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x?.puzzles)data=x;else{let o=JSON.parse(localStorage.getItem(oldKey));if(o?.puzzles){data.puzzles=o.puzzles;data.settings=o.settings||data.settings}}}catch(e){}
 // V20 no longer stores or exposes solved boards. Keep records, but discard legacy solved-state snapshots.
 Object.values(data.puzzles||{}).forEach(r=>{if(r?.done){delete r.state;delete r.moves;delete r.elapsed}});
 syncUnlocks()}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function count(t){let n=0;for(let p=0;p<25;p++)if(data.puzzles[tiers[t].id+"-"+p]?.done)n++;return n}
function syncUnlocks(){data.unlockedTiers=[true,count(0)===25||data.unlockedTiers?.[1],count(1)===25||data.unlockedTiers?.[2]]}
function puzzleUnlocked(t,p){if(!data.unlockedTiers[t])return false;if(p===0)return true;return !!data.puzzles[tiers[t].id+"-"+(p-1)]?.done}
function total(){return count(0)+count(1)+count(2)}
function home(){saveCur();stop();document.body.classList.remove("gameMode");$("game").classList.remove("active");$("home").classList.add("active");renderHome()}
function globalPuzzleNumber(t,p){return t*25+p+1}
function tileStateMarkup(t,p,u,done){
 const num=globalPuzzleNumber(t,p);
 if(!u)return `<span class="tileStack"><span class="tileNum">${num}</span><span class="lockshape" aria-hidden="true"></span></span><span class="srOnly">Puzzle ${num}, locked</span>`;
 if(done)return `<span class="tileStack"><span class="tileNum">${num}</span><span class="completeStar" aria-hidden="true">★</span></span><span class="srOnly">Puzzle ${num}, completed</span>`;
 return `<span class="tileStack"><span class="tileNum">${num}</span></span>`;
}
function renderHome(){syncUnlocks();save();$("tiers").innerHTML="";tiers.forEach((t,ti)=>{let c=count(ti),card=document.createElement("div");card.className="tier";card.style.cssText=`--tint:${t.tint};--tone:${t.tone}`;card.innerHTML=`<div class="tierhead"><img class="territory-art" src="assets/${["CT-TERR-01.png","CT-TERR-02.png","CT-TERR-03.png"][ti]}" alt=""><div class="eyebrow">Territory ${ti+1}</div><h3>${t.name}</h3><p>${t.desc}</p></div><div class="tierbody"><div class="tierbar"><span style="width:${c*4}%"></span></div><div class="grid25"></div>${ti>0&&!data.unlockedTiers[ti]?`<div class="locknote"><span class="locknoteIcon" aria-hidden="true">🔒</span><span>Complete <strong>${tiers[ti-1].name}</strong> to unlock.</span></div>`:""}</div>`;let g=card.querySelector(".grid25");for(let p=0;p<25;p++){let rec=data.puzzles[t.id+"-"+p],u=puzzleUnlocked(ti,p),b=document.createElement("button");b.className="ptile "+(!u?"locked":rec?.done?"done":p===c?"active":"");b.style.setProperty("--tone",t.tone);b.disabled=!u;b.innerHTML=tileStateMarkup(ti,p,u,!!rec?.done);if(rec?.done)b.title=`Puzzle ${globalPuzzleNumber(ti,p)} • Best ${fmt(rec.bestTime||rec.elapsed||0)} • ${rec.bestMoves||rec.moves||0} moves • ${rec.solves||1} solve${(rec.solves||1)>1?"s":""}`;b.onclick=()=>open(ti,p);g.appendChild(b)}$("tiers").appendChild(card)});setupTerritoryCarousel()}
function setupTerritoryCarousel(){
 const track=$("tiers"),pager=$("territoryPager"); if(!track||!pager)return;
 pager.innerHTML=tiers.map((t,i)=>`<button class="territoryDot ${i===0?"active":""}" data-i="${i}" aria-label="Show ${t.name}"></button>`).join("");
 const cards=[...track.querySelectorAll(".tier")];
 const setActive=i=>pager.querySelectorAll(".territoryDot").forEach((d,n)=>d.classList.toggle("active",n===i));
 pager.querySelectorAll(".territoryDot").forEach(d=>d.onclick=()=>cards[Number(d.dataset.i)]?.scrollIntoView({behavior:"smooth",inline:"start",block:"nearest"}));
 let raf=0;track.onscroll=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{
   let cx=track.scrollLeft+track.clientWidth/2,best=0,dist=Infinity;
   cards.forEach((c,i)=>{let cc=c.offsetLeft+c.offsetWidth/2,dd=Math.abs(cc-cx);if(dd<dist){dist=dd;best=i}});setActive(best)
 })};
}
function hasActiveAttempt(r,n){return !!(r?.done&&Array.isArray(r.activeState)&&r.activeState.length===n*n)}
function open(t,p){
 if(!puzzleUnlocked(t,p))return;
 saveCur();
 cur=def(t,p);
 cur.tool="cat";
 let x=data.puzzles[cur.key]||{}, solved=!!x.done, activeReplay=hasActiveAttempt(x,cur.n);
 if(solved){
   // A completed tile means play again. Resume an unfinished replay if one exists; otherwise start fresh.
   cur.state=activeReplay?x.activeState.slice():Array(cur.n*cur.n).fill(0);
   cur.moves=activeReplay?(x.activeMoves||0):0;
   cur.elapsed=activeReplay?(x.activeElapsed||0):0;
   cur.replay=true;
   cur.done=false;
 }else{
   cur.state=Array.isArray(x.state)&&x.state.length===cur.n*cur.n?x.state.slice():Array(cur.n*cur.n).fill(0);
   cur.moves=x.moves||0;
   cur.elapsed=x.elapsed||0;
   cur.replay=false;
   cur.done=false;
 }
 document.body.classList.add("gameMode");
 $("home").classList.remove("active");
 $("game").classList.add("active");
 lastTick=Date.now();
 start();
 renderGame()
}
function saveCur(){if(!cur)return;let old=data.puzzles[cur.key]||{};
 // A just-completed run is already committed by complete(); never turn that solved board into an active replay.
 if(cur.done){data.settings=data.settings||{auto:true,conflicts:true};save();return}
 if(old.done||cur.replay){
   old.activeState=cur.state.slice();old.activeMoves=cur.moves;old.activeElapsed=cur.elapsed;
 }else{
   old.state=cur.state.slice();old.moves=cur.moves;old.elapsed=cur.elapsed;
 }
 data.puzzles[cur.key]=old;data.settings=data.settings||{auto:true,conflicts:true};save()}
function rc(i){return[Math.floor(i/cur.n),i%cur.n]}
function cats(){let a=[];cur.state.forEach((v,i)=>v===2&&a.push(i));return a}
function sameRegion(i,j){let[r,c]=rc(i),[a,b]=rc(j);return cur.regions[r][c]===cur.regions[a][b]}
function autoBlocked(i){
 if(data.settings.auto===false||cur.state[i]===2)return false;
 let[r,c]=rc(i);
 return cats().some(j=>{
   if(j===i)return false;
   let[a,b]=rc(j);
   return Math.abs(a-r)<=1&&Math.abs(b-c)<=1
 })
}
function bad(){let s=new Set,a=cats();for(let i=0;i<a.length;i++){let[r,c]=rc(a[i]);for(let j=i+1;j<a.length;j++){let[x,y]=rc(a[j]);if(r===x||c===y||sameRegion(a[i],a[j])||(Math.abs(r-x)<=1&&Math.abs(c-y)<=1)){s.add(a[i]);s.add(a[j])}}}return s}
function cat(){return`<img class="cat catmark" src="assets/CT-GAME-01.png" alt="">`}
function edge(r,c,d,e){let rr=r+d,cc=c+e,id=cur.regions[r][c];return rr<0||cc<0||rr>=cur.n||cc>=cur.n||cur.regions[rr][cc]!==id?"3px solid #26323c":"1px solid rgba(38,50,60,.38)"}
function shakeCell(i){
 const cell=$("board")?.children?.[i];
 if(!cell)return;
 cell.classList.remove("rejectShake");
 void cell.offsetWidth;
 cell.classList.add("rejectShake");
 setTimeout(()=>cell.classList.remove("rejectShake"),360)
}
function renderGame(){
 let b=$("board"),conf=data.settings.conflicts===false?new Set:bad(),record=data.puzzles[cur.key]||{};
 b.innerHTML="";
 b.style.gridTemplateColumns=`repeat(${cur.n},1fr)`;
 for(let r=0;r<cur.n;r++)for(let c=0;c<cur.n;c++){
   let i=r*cur.n+c,x=document.createElement("button");
   x.className="cell"+(conf.has(i)?" conflict":"");
   x.style.cssText=`--region:${colors[cur.regions[r][c]%colors.length]};--bt:${edge(r,c,-1,0)};--br:${edge(r,c,0,1)};--bb:${edge(r,c,1,0)};--bl:${edge(r,c,0,-1)}`;
   let z=cur.state[i]===2?cat():cur.state[i]===1?'<img class="xmarkImg" src="assets/UI-X-01.png" alt="X">':autoBlocked(i)?'<img class="xmarkImg auto" src="assets/UI-X-01.png" alt="">':"";
   x.innerHTML='<span class="cell-content">'+z+"</span>";
   x.onclick=()=>cycle(i);
   b.appendChild(x)
 }
 $("gameTitle").textContent=`${tiers[cur.t].name} • Puzzle ${globalPuzzleNumber(cur.t,cur.p)}`;
 $("gameSub").textContent=`${cur.n}×${cur.n} board${cur.replay?" • Replay for a new best":""}`;
 $("resetTopBtn").style.display="grid";
 $("resetTopBtn").setAttribute("aria-label",cur.done?"Replay puzzle":"Reset puzzle");
 $("resetTopBtn").setAttribute("title",cur.done?"Replay":"Reset");
 if(!cur.done){let cp=$("completionPanel");if(cp){cp.classList.remove("show");cp.innerHTML=""}}
 $("movesLabel").textContent="Moves";
 $("timeLabel").textContent="Time";
 $("moves").textContent=cur.moves;
 $("timer").textContent=fmt(cur.elapsed);
 $("cats").textContent=`Cats ${cats().length} / ${cur.n}`;
 $("catsTop").textContent=`${cats().length} / ${cur.n}`;
 const tool=cur.tool||"cat";
 $("catToolBtn").classList.toggle("active",tool==="cat");
 $("xToolBtn").classList.toggle("active",tool==="x");
 $("catToolBtn").setAttribute("aria-pressed",tool==="cat"?"true":"false");
 $("xToolBtn").setAttribute("aria-pressed",tool==="x"?"true":"false");
 $("catToolBtn").disabled=!!cur.done; $("xToolBtn").disabled=!!cur.done;
}
function cycle(i){
 if(cur.done)return;
 const state=cur.state[i];
 const visualAutoX=state===0&&autoBlocked(i);
 const tool=cur.tool||"cat";
 let catDecision=false;

 if(tool==="x"){
   // X mode is a direct editing tool: empty -> X, X -> empty, cat -> X.
   // X-tool edits are notes and do not increment Moves, even when replacing a cat.
   if(state===2)cur.state[i]=1;
   else if(state===1)cur.state[i]=0;
   else if(visualAutoX)cur.state[i]=1; // convert derived Auto-X to a manual X
   else cur.state[i]=1;
 }else{
   // CAT mode is also direct: the tapped cell is the intended cat destination.
   if(state===2){
     cur.state[i]=0;
     catDecision=true;
   }else{
     const territoryCat=cats().find(j=>j!==i&&sameRegion(i,j));
     if(territoryCat!==undefined){
       // Manual X = true swap. Empty/Auto-X keeps the established move behavior.
       cur.state[territoryCat]=state===1?1:0;
       cur.state[i]=2;
       catDecision=true;
     }else{
       if(cats().length>=cur.n){shakeCell(i);return}
       cur.state[i]=2;
       catDecision=true;
     }
   }
 }
 if(catDecision)cur.moves++;
 if(check())return;
 saveCur();renderGame()
}
function check(){let a=cats();if(a.length!==cur.n)return false;let rs=new Set,cs=new Set,gs=new Set;for(let i of a){let[r,c]=rc(i);rs.add(r);cs.add(c);gs.add(cur.regions[r][c])}if(rs.size!==cur.n||cs.size!==cur.n||gs.size!==cur.n||bad().size)return false;complete();return true}
function complete(){
 cur.done=true;stop();
 let old=data.puzzles[cur.key]||{},was=!!old.done,oldTime=old.bestTime,oldMoves=old.bestMoves,
 newTime=!oldTime||cur.elapsed<oldTime,newMoves=!oldMoves||cur.moves<oldMoves;
 old.done=true;old.solves=(old.solves||0)+1;old.lastTime=cur.elapsed;old.lastMoves=cur.moves;
 old.totalTime=(old.totalTime||0)+cur.elapsed;old.bestTime=newTime?cur.elapsed:oldTime;old.bestMoves=newMoves?cur.moves:oldMoves;
 delete old.state;delete old.moves;delete old.elapsed;delete old.activeState;delete old.activeMoves;delete old.activeElapsed;
 data.puzzles[cur.key]=old;syncUnlocks();save();
 // Render once more so the final cat and the entire solved layout are visible and frozen.
 renderGame();
 confetti(cur.p===24?120:55);
 let territoryDone=count(cur.t)===25&&!was,allDone=total()===75;
 if(allDone)return finale();
 if(territoryDone)return territoryWin(cur.t);
 puzzleWin(newTime,newMoves,oldTime,oldMoves)
}
function puzzleWin(nt,nm,ot,om){
 let next=cur.p<24?cur.p+1:null,panel=$("completionPanel");
 panel.innerHTML=`
 <div class="completionTop">
   <img src="assets/CT-WIN-01.png" alt="" aria-hidden="true">
   <div><h2>Puzzle Complete!</h2><p>${tiers[cur.t].name} • Puzzle ${globalPuzzleNumber(cur.t,cur.p)}</p></div>
 </div>
 <div class="completionScores">
   <div class="completionScore"><small>TIME</small><strong>${fmt(cur.elapsed)}</strong>${nt?'<div class="newbest">NEW BEST</div>':'<div class="newbest"></div>'}</div>
   <div class="completionScore"><small>MOVES</small><strong>${cur.moves}</strong>${nm?'<div class="newbest">NEW BEST</div>':'<div class="newbest"></div>'}</div>
 </div>
 ${next!==null?`<button class="btn primary completionContinue" id="continueInlineBtn">Continue to Puzzle ${globalPuzzleNumber(cur.t,next)}</button>`:''}`;

   $("continueInlineBtn").onclick=()=>open(cur.t,next);
 }
 // Keep the player at the top of the completion state: celebration/CTA first,
 // with the solved board directly below for review.

}

 let next=t+1, winArt=["CT-WIN-02A.png","CT-WIN-02B.png","CT-WIN-02C.png"][t],
 unlockArt=next===1?"CT-UNLOCK-01.png":next===2?"CT-UNLOCK-02.png":null;
 $("modalBox").innerHTML=`<img class="assetHero large" src="assets/${winArt}" alt="">
 <h2>${tiers[t].name} Complete!</h2>
 <p><strong>25 / 25 puzzles mastered.</strong><br>Every completed puzzle remains available for replay and record chasing.</p>
 <div class="scorecards"><div class="score"><small>TOTAL SOLVES</small><strong>${tierSolves(t)}</strong></div><div class="score"><small>TERRITORY</small><strong>25/25</strong></div></div>
 ${next<3?`<img class="unlockArt" src="assets/${unlockArt}" alt=""><h3>New Territory Unlocked</h3><p><strong>${tiers[next].name}</strong><br>${tiers[next].desc}</p>`:""}

 $("mapBtn").onclick=()=>{hideModal();home()}
}
function finale(){
 $("modalBox").innerHTML=`<img class="assetHero large" src="assets/CT-WIN-03.png" alt="">
 <h2>Territory Master!</h2>
 <p>You completed all 75 Cat Territory puzzles. Every puzzle is now available for replay — chase faster times and fewer moves.</p>
 <div class="scorecards"><div class="score"><small>PUZZLES</small><strong>75/75</strong></div><div class="score"><small>TOTAL SOLVES</small><strong>${tierSolves(0)+tierSolves(1)+tierSolves(2)}</strong></div></div>

function tierSolves(t){let n=0;for(let p=0;p<25;p++)n+=data.puzzles[tiers[t].id+"-"+p]?.solves||0;return n}
function replay(){
 cur.state=Array(cur.n*cur.n).fill(0);
 cur.moves=0;
 cur.elapsed=0;
 cur.done=false;
 cur.replay=true;
 lastTick=Date.now();
 start();
 saveCur();
 renderGame()
}
function reset(){
 const box=$("modalBox"); box.className="modalbox resetModalBox"; box.innerHTML=`<img class="resetArt" src="assets/CT-RESET-01.png" alt="Reset Puzzle? This will clear the current puzzle and you’ll start fresh. Your progress for this puzzle won’t be saved."><div class="resetActions"><div class="modalactions"><button class="btn primary" id="confirmReset">Reset Puzzle</button><button class="btn" id="cancelReset">Keep Playing</button></div></div>`; $("modal").classList.add("show"); $("confirmReset").onclick=()=>{cur.state=Array(cur.n*cur.n).fill(0);cur.moves=0;cur.elapsed=0;cur.done=false;lastTick=Date.now();start();saveCur();renderGame();hideModal()}; $("cancelReset").onclick=hideModal;
}
function fmt(s){s=Math.max(0,s||0);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function start(){stop();timer=setInterval(()=>{if(cur&&!cur.done&&!document.hidden){let n=Date.now();if(n-lastTick>900){cur.elapsed++;lastTick=n;$("timer").textContent=fmt(cur.elapsed);if(cur.elapsed%5===0)saveCur()}}else lastTick=Date.now()},1000)}function stop(){if(timer){clearInterval(timer);timer=null}}
function showModal(){$("modal").classList.add("show")}function hideModal(){$("modal").classList.remove("show");$("modalBox").className="modalbox"}
function confetti(n){let box=$("confetti");box.innerHTML="";let cc=["#e87842","#38a697","#6b6ee7","#f2c94c","#ef7992"];for(let i=0;i<n;i++){let x=document.createElement("i");x.style.cssText=`left:${Math.random()*100}%;--d:${1.7+Math.random()*2.3}s;--x:${-100+Math.random()*200}px;--r:${Math.random()*360}deg;--c:${cc[i%cc.length]}`;box.appendChild(x)}setTimeout(()=>box.innerHTML="",4300)}
function openDrawer(title,subtitle,tabs,content){
 $("drawerTitle").textContent=title;
 $("drawerSubtitle").textContent=subtitle||"";
 $("drawerTabs").innerHTML=tabs||"";
 $("drawerContent").innerHTML=content||"";

}
function closeDrawer(){$("shade").classList.remove("show");$("drawer").classList.remove("show")}
function guide(){
 let content=`<img class="guideMascot" src="assets/CT-HELP-01.png" alt="">
 <div class="guideSection"><h3>How to Play</h3><ol><li>Exactly one cat in every row.</li><li>Exactly one cat in every column.</li><li>Exactly one cat in every colored territory.</li><li>Cats cannot touch, even diagonally.</li></ol></div>
<div class="guideSection"><h3>Cell Cycle</h3><p><strong>Tap 1:</strong> X → <strong>Tap 2:</strong> Cat → <strong>Tap 3:</strong> Empty</p><p><strong>Moves count cat decisions only:</strong> placing, repositioning, swapping, or removing a cat counts as one move. X marks—manual or Auto-X—do not count.</p><p>Once the required number of cats is placed, additional cats cannot be added until one is removed or repositioned within a territory.</p></div>`;
 openDrawer("How to Play","The rules are simple. The deductions get harder.","",content)
}
function settingsPanel(){
 let content=`<div class="settingsSection"><h3>Gameplay Settings</h3>
 <label class="toggle"><input id="dAuto" type="checkbox" ${data.settings.auto!==false?"checked":""}> Auto-fill blocked X's</label><p class="settingHelp">Automatically marks only the eight cells touching a placed cat. Row, column, and territory deductions remain yours to solve. These marks recalculate when cats move.</p>

 <div class="settingsSection"><h3>About Saving</h3><p>Your progress, records, and settings are stored locally in this browser.</p></div>`;
 openDrawer("Settings","Adjust how the puzzle behaves.","",content);
 $("dAuto").onchange=e=>{data.settings.auto=e.target.checked;save();if(cur)renderGame()};
 $("dConflict").onchange=e=>{data.settings.conflicts=e.target.checked;save();if(cur)renderGame()}
}
function totalPlayTime(){
 let s=0;
 for(let ti=0;ti<3;ti++)for(let p=0;p<25;p++){
   let r=data.puzzles[tiers[ti].id+"-"+p];
   if(r)s+=r.totalTime||r.lastTime||0
 }
 return s
}
function fmtLong(s){
 s=Math.max(0,s||0);let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
 return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
}
function recentAchievements(){
 let a=[];
 for(let ti=0;ti<3;ti++)for(let p=0;p<25;p++){
   let r=data.puzzles[tiers[ti].id+"-"+p];
   if(r?.done)a.push({ti,p,time:r.lastTime||r.bestTime||0,moves:r.lastMoves||r.bestMoves||0,solves:r.solves||1})
 }
 a.sort((x,y)=>(y.solves-x.solves)||(y.p-x.p));
 return a.slice(0,4)
}
function statsBack(){
 return `<button class="statsBack" id="statsBack" aria-label="Back to statistics overview"><span aria-hidden="true">←</span> Overview</button>`
}
function openStats(active="overview"){
 let totalSolves=tierSolves(0)+tierSolves(1)+tierSolves(2), pct=Math.round(total()/75*100);

 for(let ti=0;ti<3;ti++)for(let p=0;p<25;p++){
   let r=data.puzzles[tiers[ti].id+"-"+p];
   if(r?.done){if(bestT===null||r.bestTime<bestT)bestT=r.bestTime;if(bestM===null||r.bestMoves<bestM)bestM=r.bestMoves}
 }
 let content="", sub="Track your progress and beat your best times!", chrome="";
 if(active==="overview"){
   let arts=["CT-STAT-01.png","CT-STAT-02.png","CT-STAT-03.png"];
   let rows=tiers.map((t,ti)=>`<button class="territoryRow" data-openstat="t${ti}">

   let ach=recentAchievements();
   let achievements=ach.length?`<div class="achievementList">${ach.map(x=>`<div class="achievement"><div class="badge">🏆</div><div><strong>${tiers[x.ti].name} • Puzzle ${globalPuzzleNumber(x.ti,x.p)}</strong><br><small>${fmt(x.time)} • ${x.moves} moves</small></div></div>`).join("")}</div>`:
   `<div class="achievementEmpty"><div style="font-size:44px;opacity:.3">🏆</div><strong>No achievements yet!</strong><p>Complete puzzles to see your best times, move counts, and milestones here.</p></div>`;
   content=`<div class="statsCard"><h3>Overall Progress</h3><div class="overallGrid">
     <div class="ring" style="--pct:${pct*3.6}deg"><strong>${pct}%</strong></div>
     <div class="metricList">
       <div class="metricRow"><span>Puzzles completed</span><strong>${total()} / 75</strong></div>
       <div class="metricRow"><span>Total solves</span><strong>${totalSolves}</strong></div>
       <div class="metricRow"><span>Total play time</span><strong>${fmtLong(totalPlayTime())}</strong></div>
       <div class="metricRow"><span>Best time (any puzzle)</span><strong>${bestT===null?"—":fmt(bestT)}</strong></div>
       <div class="metricRow"><span>Best moves (any puzzle)</span><strong>${bestM===null?"—":bestM}</strong></div>
     </div></div></div>
     <div class="statsCard"><h3>🏆 Recent Achievements</h3>${achievements}</div>
     <div class="statsCard"><h3>🏅 Territory Progress</h3><div class="territoryRows">${rows}</div></div>`;
 } else {
   let ti=Number(active.slice(1)),t=tiers[ti],arts=["CT-STAT-01.png","CT-STAT-02.png","CT-STAT-03.png"],rows="";
   sub=t.name+" records"; chrome=statsBack();
   for(let p=0;p<25;p++){
     let r=data.puzzles[t.id+"-"+p],done=!!r?.done,active=done&&hasActiveAttempt(r,t.sizes[p]);
     let action=done?`<button class="recordActionBtn ${active?"resume":""}" data-replay-ti="${ti}" data-replay-p="${p}" aria-label="${active?"Resume":"Replay"} Puzzle ${globalPuzzleNumber(ti,p)}" title="${active?"Resume":"Replay"}">${active?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg>'}</button>`:"—";
     rows+=`<tr><td>${globalPuzzleNumber(ti,p)}</td><td>${done?fmt(r.bestTime):"—"}</td><td>${done?r.bestMoves:"—"}</td><td>${r?.solves||0}</td><td>${action}</td></tr>`
   }
   let range=ti===0?"1–25":ti===1?"26–50":"51–75", territoryPct=count(ti)*4, complete=territoryPct===100;
   content=`<div class="statsCard territoryProgressCard">
     <div class="territoryProgressIdentity">
       <img src="assets/${arts[ti]}" alt="">
       <div><h3>${t.name}</h3><p>Puzzles ${range}</p></div>
     </div>
     <div class="territoryRingWrap ${complete?"complete":""}">
       <div class="territoryRing" style="--territory-pct:${territoryPct*3.6}deg"><strong>${territoryPct}%</strong></div>
       ${complete?'<span class="territoryMedalStar" aria-label="Territory completed">★</span>':""}
     </div>
   </div>
   <div class="statsCard recordsCard"><h3>Puzzle Records</h3><table class="statsTable"><thead><tr><th>Puzzle</th><th>Best Time</th><th>Best Moves</th><th>Solves</th><th>Replay</th></tr></thead><tbody>${rows}</tbody></table></div>`;
 }
 openDrawer("Statistics",sub,chrome,content);
 let back=$("statsBack"); if(back)back.onclick=()=>openStats("overview");
 document.querySelectorAll("[data-openstat]").forEach(x=>x.onclick=()=>openStats(x.dataset.openstat));
 document.querySelectorAll("[data-replay-ti]").forEach(x=>x.onclick=()=>{let ti=Number(x.dataset.replayTi),p=Number(x.dataset.replayP);closeDrawer();open(ti,p)});
}
$("catToolBtn").onclick=()=>{if(cur&&!cur.done){cur.tool="cat";renderGame()}};$("xToolBtn").onclick=()=>{if(cur&&!cur.done){cur.tool="x";renderGame()}};$("homeBtn").onclick=home;$("statsBtn").onclick=()=>openStats("overview");$("guideTopBtn").onclick=guide;$("settingsTopBtn").onclick=settingsPanel;$("resetTopBtn").onclick=()=>cur?.done?replay():reset();$("brandHome").onclick=e=>{e.preventDefault();closeDrawer();home()};$("drawerClose").onclick=closeDrawer;$("shade").onclick=closeDrawer;document.addEventListener("visibilitychange",()=>{if(document.hidden)saveCur();lastTick=Date.now()});window.addEventListener("beforeunload",saveCur);
