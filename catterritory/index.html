<script>
(()=>{"use strict";
const KEY="cat-territory-v12-75";
const oldKey="cat-territory-v3-75";
const tiers=[
{id:"kitten",name:"Kitten Grounds",desc:"Learn the hunt. Clean deductions and smaller territories.",sizes:[6,6,6,6,6,6,6,6,7,7,6,7,7,6,7,7,7,6,7,7,7,7,7,7,7],tint:"#fff0e7",tone:"#e87842"},
{id:"domain",name:"Cat's Domain",desc:"Think two moves ahead. More territory interactions.",sizes:[8,8,8,8,8,8,8,9,8,9,8,9,9,8,9,8,9,9,8,9,9,9,9,9,9],tint:"#eaf7f5",tone:"#38a697"},
{id:"lion",name:"Lion's Territory",desc:"Master the grid. Less obvious deductions and larger hunts.",sizes:[9,9,9,10,9,10,9,10,10,9,10,9,10,10,9,10,10,10,9,10,10,10,10,10,10],tint:"#eef0ff",tone:"#6b6ee7"}];

const $=x=>document.getElementById(x);let data={settings:{auto:true,conflicts:true},puzzles:{},unlockedTiers:[true,false,false]},cur=null,timer=null,lastTick=Date.now();
function R(seed){return()=>{let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

function def(t,p){let n=tiers[t].sizes[p],seed=9001+t*100000+p*3371,s=solution(n,seed);return{t,p,n,key:tiers[t].id+"-"+p,sol:s,regions:regions(s,seed+771)}}

function renderHome(){syncUnlocks();save();let all=total();$("overallText").textContent=all+" / 75 complete";$("overallBar").style.width=(all/75*100)+"%";$("tiers").innerHTML="";tiers.forEach((t,ti)=>{let c=count(ti),card=document.createElement("div");card.className="tier";card.style.cssText=`--tint:${t.tint};--tone:${t.tone}`;card.innerHTML=`<div class="tierhead"><img class="territory-art" src="assets/${["CT-TERR-01.png","CT-TERR-02.png","CT-TERR-03.png"][ti]}" alt=""><div class="eyebrow">Territory ${ti+1}</div><h3>${t.name}</h3><p>${t.desc}</p><div class="tiermeta">${c} / 25 completed</div></div><div class="tierbody"><div class="tierbar"><span style="width:${c*4}%"></span></div><div class="grid25"></div>${ti>0&&!data.unlockedTiers[ti]?`<div class="locknote"><span class="locknoteIcon" aria-hidden="true">🔒</span><span>Complete all 25 puzzles in <strong>${tiers[ti-1].name}</strong> to unlock.</span></div>`:""}</div>`;let g=card.querySelector(".grid25");for(let p=0;p<25;p++){let rec=data.puzzles[t.id+"-"+p],u=puzzleUnlocked(ti,p),b=document.createElement("button");b.className="ptile "+(!u?"locked":rec?.done?"done":p===c?"active":"");b.style.setProperty("--tone",t.tone);b.disabled=!u;b.innerHTML=u?String(p+1):'<span class="lockshape" aria-hidden="true"></span><span class="srOnly">Locked</span>';if(rec?.done)b.title=`Best ${fmt(rec.bestTime||rec.elapsed||0)} • ${rec.bestMoves||rec.moves||0} moves • ${rec.solves||1} solve${(rec.solves||1)>1?"s":""}`;b.onclick=()=>open(ti,p);g.appendChild(b)}$("tiers").appendChild(card)});setupTerritoryCarousel()}
function setupTerritoryCarousel(){
 const track=$("tiers"),pager=$("territoryPager"); if(!track||!pager)return;
 pager.innerHTML=tiers.map((t,i)=>`<button class="territoryDot ${i===0?"active":""}" data-i="${i}" aria-label="Show ${t.name}"></button>`).join("");
 const cards=[...track.querySelectorAll(".tier")];
 const setActive=i=>pager.querySelectorAll(".territoryDot").forEach((d,n)=>d.classList.toggle("active",n===i));
 pager.querySelectorAll(".territoryDot").forEach(d=>d.onclick=()=>cards[Number(d.dataset.i)]?.scrollIntoView({behavior:"smooth",inline:"start",block:"nearest"}));
 let raf=0;track.onscroll=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{
   let cx=track.scrollLeft+track.clientWidth/2,best=0,dist=Infinity;
   cards.forEach((c,i)=>{let cc=c.offsetLeft+c.offsetWidth/2,dd=Math.abs(cc-cx);if(dd<dist){dist=dd;best=i}});setActive(best)
 })};
}
function open(t,p){if(!puzzleUnlocked(t,p))return;saveCur();cur=def(t,p);let x=data.puzzles[cur.key]||{};cur.state=Array.isArray(x.state)&&x.state.length===cur.n*cur.n?x.state.slice():Array(cur.n*cur.n).fill(0);cur.moves=x.done?0:(x.moves||0);cur.elapsed=x.done?0:(x.elapsed||0);cur.replay=!!x.done;cur.done=false;document.body.classList.add("gameMode");$("home").classList.remove("active");$("game").classList.add("active");lastTick=Date.now();start();renderGame()}
function saveCur(){if(!cur)return;let old=data.puzzles[cur.key]||{};if(!old.done){old.state=cur.state.slice();old.moves=cur.moves;old.elapsed=cur.elapsed}data.puzzles[cur.key]=old;data.settings=data.settings||{auto:true,conflicts:true};save()}
function rc(i){return[Math.floor(i/cur.n),i%cur.n]}function cats(){let a=[];cur.state.forEach((v,i)=>v===2&&a.push(i));return a}
function blocked(i){if(data.settings.auto===false||cur.state[i])return false;let[r,c]=rc(i);return cats().some(j=>{let[a,b]=rc(j);return a===r||b===c||(Math.abs(a-r)<=1&&Math.abs(b-c)<=1)})}
function bad(){let s=new Set,a=cats();for(let i=0;i<a.length;i++){let[r,c]=rc(a[i]);for(let j=i+1;j<a.length;j++){let[x,y]=rc(a[j]);if(r===x||c===y||cur.regions[r][c]===cur.regions[x][y]||(Math.abs(r-x)<=1&&Math.abs(c-y)<=1)){s.add(a[i]);s.add(a[j])}}}return s}
function cat(){return`<img class="cat catmark" src="assets/CT-GAME-01.png" alt="">`}
function edge(r,c,d,e){let rr=r+d,cc=c+e,id=cur.regions[r][c];return rr<0||cc<0||rr>=cur.n||cc>=cur.n||cur.regions[rr][cc]!==id?"3px solid #26323c":"1px solid rgba(38,50,60,.38)"}
function renderGame(){let b=$("board"),conf=data.settings.conflicts===false?new Set:bad();b.innerHTML="";b.style.gridTemplateColumns=`repeat(${cur.n},1fr)`;for(let r=0;r<cur.n;r++)for(let c=0;c<cur.n;c++){let i=r*cur.n+c,x=document.createElement("button");x.className="cell"+(conf.has(i)?" conflict":"");x.style.cssText=`--region:${colors[cur.regions[r][c]%colors.length]};--bt:${edge(r,c,-1,0)};--br:${edge(r,c,0,1)};--bb:${edge(r,c,1,0)};--bl:${edge(r,c,0,-1)}`;let z=cur.state[i]===2?cat():cur.state[i]===1?'<img class="xmarkImg" src="assets/UI-X-01.png" alt="X">':blocked(i)?'<img class="xmarkImg auto" src="assets/UI-X-01.png" alt="">':"";x.innerHTML='<span class="cell-content">'+z+"</span>";x.onclick=()=>cycle(i);b.appendChild(x)}$("gameTitle").textContent=`${tiers[cur.t].name} • Puzzle ${cur.p+1}`;$("gameSub").textContent=`${cur.n}×${cur.n} board${cur.replay?" • Replay for a new best":""}`;$("moves").textContent=cur.moves;$("timer").textContent=fmt(cur.elapsed);$("cats").textContent=`Cats ${cats().length} / ${cur.n}`;$("catsTop").textContent=`${cats().length} / ${cur.n}`}
function cycle(i){if(cur.done)return;cur.state[i]=cur.state[i]===0?(blocked(i)?2:1):cur.state[i]===1?2:0;cur.moves++;if(check())return;saveCur();renderGame()}
function check(){let a=cats();if(a.length!==cur.n)return false;let rs=new Set,cs=new Set,gs=new Set;for(let i of a){let[r,c]=rc(i);rs.add(r);cs.add(c);gs.add(cur.regions[r][c])}if(rs.size!==cur.n||cs.size!==cur.n||gs.size!==cur.n||bad().size)return false;complete();return true}
function complete(){cur.done=true;stop();let old=data.puzzles[cur.key]||{},was=!!old.done,oldTime=old.bestTime,oldMoves=old.bestMoves,newTime=!oldTime||cur.elapsed<oldTime,newMoves=!oldMoves||cur.moves<oldMoves;old.done=true;old.solves=(old.solves||0)+1;old.lastTime=cur.elapsed;old.lastMoves=cur.moves;old.totalTime=(old.totalTime||0)+cur.elapsed;old.bestTime=newTime?cur.elapsed:oldTime;old.bestMoves=newMoves?cur.moves:oldMoves;old.state=cur.state.slice();data.puzzles[cur.key]=old;let beforeTier=data.unlockedTiers[cur.t+1];syncUnlocks();save();confetti(cur.p===24?120:55);let territoryDone=count(cur.t)===25&&!was,allDone=total()===75;if(allDone)return finale();if(territoryDone)return territoryWin(cur.t);puzzleWin(newTime,newMoves,oldTime,oldMoves)}
function puzzleWin(nt,nm,ot,om){
 let next=cur.p<24?cur.p+1:null;
 $("modalBox").innerHTML=`<img class="assetHero" src="assets/CT-WIN-01.png" alt="">
 <h2>Puzzle Complete!</h2><p>${tiers[cur.t].name} • Puzzle ${cur.p+1}</p>
 <div class="scorecards">
   <div class="score"><small>TIME</small><strong>${fmt(cur.elapsed)}</strong>${nt&&ot?`<div class="newbest">NEW BEST −${fmt(ot-cur.elapsed)}</div>`:nt?'<div class="newbest">NEW BEST</div>':""}</div>
   <div class="score"><small>MOVES</small><strong>${cur.moves}</strong>${nm&&om?`<div class="newbest">NEW BEST −${om-cur.moves}</div>`:nm?'<div class="newbest">NEW BEST</div>':""}</div>
 </div>
 <div class="modalactions">${next!==null?'<button class="btn primary" id="continueBtn">Continue to Puzzle '+(next+1)+'</button>':""}<button class="btn" id="mapBtn">Territory Map</button><button class="btn" id="replayBtn">Replay</button></div>`;
 showModal();
 if(next!==null)$("continueBtn").onclick=()=>{hideModal();open(cur.t,next)};
 $("mapBtn").onclick=()=>{hideModal();home()};
 $("replayBtn").onclick=()=>{hideModal();replay()}
}
function territoryWin(t){
 let next=t+1, winArt=["CT-WIN-02A.png","CT-WIN-02B.png","CT-WIN-02C.png"][t],
 unlockArt=next===1?"CT-UNLOCK-01.png":next===2?"CT-UNLOCK-02.png":null;
 $("modalBox").innerHTML=`<img class="assetHero large" src="assets/${winArt}" alt="">
 <h2>${tiers[t].name} Complete!</h2>
 <p><strong>25 / 25 puzzles mastered.</strong><br>Every completed puzzle remains available for replay and record chasing.</p>
 <div class="scorecards"><div class="score"><small>TOTAL SOLVES</small><strong>${tierSolves(t)}</strong></div><div class="score"><small>TERRITORY</small><strong>25/25</strong></div></div>
 ${next<3?`<img class="unlockArt" src="assets/${unlockArt}" alt=""><h3>New Territory Unlocked</h3><p><strong>${tiers[next].name}</strong><br>${tiers[next].desc}</p>`:""}
 <div class="modalactions">${next<3?'<button class="btn primary" id="enterBtn">Enter '+tiers[next].name+'</button>':""}<button class="btn" id="mapBtn">Back to Map</button></div>`;
 showModal();
 if(next<3)$("enterBtn").onclick=()=>{hideModal();home();setTimeout(()=>document.querySelectorAll(".tier")[next]?.scrollIntoView({behavior:"smooth"}),50)};
 $("mapBtn").onclick=()=>{hideModal();home()}
}
function finale(){
 $("modalBox").innerHTML=`<img class="assetHero large" src="assets/CT-WIN-03.png" alt="">
 <h2>Territory Master!</h2>
 <p>You completed all 75 Cat Territory puzzles. Every puzzle is now available for replay — chase faster times and fewer moves.</p>
 <div class="scorecards"><div class="score"><small>PUZZLES</small><strong>75/75</strong></div><div class="score"><small>TOTAL SOLVES</small><strong>${tierSolves(0)+tierSolves(1)+tierSolves(2)}</strong></div></div>
 <div class="modalactions"><button class="btn primary" id="mapBtn">View All Territories</button><button class="btn" id="statsModal">View Stats</button></div>`;
 showModal();
 $("mapBtn").onclick=()=>{hideModal();home()};
 $("statsModal").onclick=()=>{hideModal();openStats()}
}
function tierSolves(t){let n=0;for(let p=0;p<25;p++)n+=data.puzzles[tiers[t].id+"-"+p]?.solves||0;return n}
function replay(){cur.state=Array(cur.n*cur.n).fill(0);cur.moves=0;cur.elapsed=0;cur.done=false;cur.replay=true;lastTick=Date.now();start();renderGame()}
function hint(){if(cur.done)return;let a=[];for(let r=0;r<cur.n;r++){let i=r*cur.n+cur.sol[r];if(cur.state[i]!==2)a.push(i)}if(a.length){cur.state[a[Math.floor(Math.random()*a.length)]]=2;cur.moves++;if(!check()){saveCur();renderGame()}}}
function reset(){
 const box=$("modalBox"); box.className="modalbox resetModalBox"; box.innerHTML=`<img class="resetArt" src="assets/CT-RESET-01.png" alt="Reset Puzzle? This will clear the current puzzle and you’ll start fresh. Your progress for this puzzle won’t be saved."><div class="resetActions"><div class="modalactions"><button class="btn primary" id="confirmReset">Reset Puzzle</button><button class="btn" id="cancelReset">Keep Playing</button></div></div>`; $("modal").classList.add("show"); $("confirmReset").onclick=()=>{cur.state=Array(cur.n*cur.n).fill(0);cur.moves=0;cur.elapsed=0;cur.done=false;lastTick=Date.now();start();renderGame();hideModal()}; $("cancelReset").onclick=hideModal;
}
function fmt(s){s=Math.max(0,s||0);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function start(){stop();timer=setInterval(()=>{if(cur&&!cur.done&&!document.hidden){let n=Date.now();if(n-lastTick>900){cur.elapsed++;lastTick=n;$("timer").textContent=fmt(cur.elapsed);if(cur.elapsed%5===0)saveCur()}}else lastTick=Date.now()},1000)}function stop(){if(timer){clearInterval(timer);timer=null}}
function showModal(){$("modal").classList.add("show")}function hideModal(){$("modal").classList.remove("show");$("modalBox").className="modalbox"}
function confetti(n){let box=$("confetti");box.innerHTML="";let cc=["#e87842","#38a697","#6b6ee7","#f2c94c","#ef7992"];for(let i=0;i<n;i++){let x=document.createElement("i");x.style.cssText=`left:${Math.random()*100}%;--d:${1.7+Math.random()*2.3}s;--x:${-100+Math.random()*200}px;--r:${Math.random()*360}deg;--c:${cc[i%cc.length]}`;box.appendChild(x)}setTimeout(()=>box.innerHTML="",4300)}
function openDrawer(title,subtitle,tabs,content){
 $("drawerTitle").textContent=title;
 $("drawerSubtitle").textContent=subtitle||"";
 $("drawerTabs").innerHTML=tabs||"";
 $("drawerContent").innerHTML=content||"";
 $("shade").classList.add("show");$("drawer").classList.add("show")
}
function closeDrawer(){$("shade").classList.remove("show");$("drawer").classList.remove("show")}
function guide(){
 let content=`<img class="guideMascot" src="assets/CT-HELP-01.png" alt="">
 <div class="guideSection"><h3>How to Play</h3><ol><li>Exactly one cat in every row.</li><li>Exactly one cat in every column.</li><li>Exactly one cat in every colored territory.</li><li>Cats cannot touch, even diagonally.</li></ol></div>
 <div class="guideSection"><h3>Cell Cycle</h3><p><strong>Tap 1:</strong> X → <strong>Tap 2:</strong> Cat → <strong>Tap 3:</strong> Empty</p></div>`;
 openDrawer("How to Play","The rules are simple. The deductions get harder.","",content)
}
function settingsPanel(){
 let content=`<div class="settingsSection"><h3>Gameplay Settings</h3>
 <label class="toggle"><input id="dAuto" type="checkbox" ${data.settings.auto!==false?"checked":""}> Auto-fill blocked X's</label>
 <label class="toggle"><input id="dConflict" type="checkbox" ${data.settings.conflicts!==false?"checked":""}> Highlight conflicts</label></div>
 <div class="settingsSection"><h3>About Saving</h3><p>Your progress, records, and settings are stored locally in this browser.</p></div>`;
 openDrawer("Settings","Adjust how the puzzle behaves.","",content);
 $("dAuto").onchange=e=>{data.settings.auto=e.target.checked;save();if(cur)renderGame()};
 $("dConflict").onchange=e=>{data.settings.conflicts=e.target.checked;save();if(cur)renderGame()}
}
function totalPlayTime(){
 let s=0;
 for(let ti=0;ti<3;ti++)for(let p=0;p<25;p++){
   let r=data.puzzles[tiers[ti].id+"-"+p];
   if(r)s+=r.totalTime||r.lastTime||0
 }
 return s
}
function fmtLong(s){
 s=Math.max(0,s||0);let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
 return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
}
function recentAchievements(){
 let a=[];
 for(let ti=0;ti<3;ti++)for(let p=0;p<25;p++){
   let r=data.puzzles[tiers[ti].id+"-"+p];
   if(r?.done)a.push({ti,p,time:r.lastTime||r.bestTime||0,moves:r.lastMoves||r.bestMoves||0,solves:r.solves||1})
 }
 a.sort((x,y)=>(y.solves-x.solves)||(y.p-x.p));
 return a.slice(0,4)
}
function statsBack(){
 return `<button class="statsBack" id="statsBack" aria-label="Back to statistics overview"><span aria-hidden="true">←</span> Overview</button>`
}
function openStats(active="overview"){
 let totalSolves=tierSolves(0)+tierSolves(1)+tierSolves(2), pct=Math.round(total()/75*100);
 let bestT=null,bestM=null;
 for(let ti=0;ti<3;ti++)for(let p=0;p<25;p++){
   let r=data.puzzles[tiers[ti].id+"-"+p];
   if(r?.done){if(bestT===null||r.bestTime<bestT)bestT=r.bestTime;if(bestM===null||r.bestMoves<bestM)bestM=r.bestMoves}
 }
 let content="", sub="Track your progress and beat your best times!", chrome="";
 if(active==="overview"){
   let arts=["CT-STAT-01.png","CT-STAT-02.png","CT-STAT-03.png"];
   let rows=tiers.map((t,ti)=>`<button class="territoryRow" data-openstat="t${ti}">
      <img src="assets/${arts[ti]}" alt="">
      <span><strong>${t.name}</strong><span>${count(ti)} / 25</span><span class="miniBar"><span style="width:${count(ti)*4}%"></span></span></span>
      <span class="chev">›</span>
   </button>`).join("");
   let ach=recentAchievements();
   let achievements=ach.length?`<div class="achievementList">${ach.map(x=>`<div class="achievement"><div class="badge">🏆</div><div><strong>${tiers[x.ti].name} • Puzzle ${x.p+1}</strong><br><small>${fmt(x.time)} • ${x.moves} moves</small></div></div>`).join("")}</div>`:
   `<div class="achievementEmpty"><div style="font-size:44px;opacity:.3">🏆</div><strong>No achievements yet!</strong><p>Complete puzzles to see your best times, move counts, and milestones here.</p></div>`;
   content=`<div class="statsCard"><h3>Overall Progress</h3><div class="overallGrid">
     <div class="ring" style="--pct:${pct*3.6}deg"><strong>${pct}%</strong></div>
     <div class="metricList">
       <div class="metricRow"><span>Puzzles completed</span><strong>${total()} / 75</strong></div>
       <div class="metricRow"><span>Total solves</span><strong>${totalSolves}</strong></div>
       <div class="metricRow"><span>Total play time</span><strong>${fmtLong(totalPlayTime())}</strong></div>
       <div class="metricRow"><span>Best time (any puzzle)</span><strong>${bestT===null?"—":fmt(bestT)}</strong></div>
       <div class="metricRow"><span>Best moves (any puzzle)</span><strong>${bestM===null?"—":bestM}</strong></div>
     </div></div></div>
     <div class="statsCard"><h3>🏅 Territory Progress</h3><div class="territoryRows">${rows}</div></div>
     <div class="statsCard"><h3>🏆 Recent Achievements</h3>${achievements}</div>`;
 } else {
   let ti=Number(active.slice(1)),t=tiers[ti],arts=["CT-STAT-01.png","CT-STAT-02.png","CT-STAT-03.png"],rows="";
   sub=t.name+" records"; chrome=statsBack();
   for(let p=0;p<25;p++){let r=data.puzzles[t.id+"-"+p];rows+=`<tr><td>${p+1}</td><td>${r?.done?fmt(r.bestTime):"—"}</td><td>${r?.done?r.bestMoves:"—"}</td><td>${r?.solves||0}</td></tr>`}
   content=`<div class="statsCard"><div class="territoryDetailHead"><img src="assets/${arts[ti]}" alt=""><div><h3 style="margin:0">${t.name}</h3><p style="margin:2px 0">${count(ti)} / 25 completed</p></div></div>
   <div class="statsSummary"><div class="statsMetric"><small>Completed</small><strong>${count(ti)}/25</strong></div><div class="statsMetric"><small>Solves</small><strong>${tierSolves(ti)}</strong></div><div class="statsMetric"><small>Progress</small><strong>${count(ti)*4}%</strong></div></div></div>
   <div class="statsCard"><h3>Puzzle Records</h3><table class="statsTable"><tr><th>Puzzle</th><th>Best Time</th><th>Best Moves</th><th>Solves</th></tr>${rows}</table></div>`;
 }
 openDrawer("Statistics",sub,chrome,content);
 let back=$("statsBack"); if(back)back.onclick=()=>openStats("overview");
 document.querySelectorAll("[data-openstat]").forEach(x=>x.onclick=()=>openStats(x.dataset.openstat))
}
$("homeBtn").onclick=home;$("statsBtn").onclick=()=>openStats("overview");$("guideTopBtn").onclick=guide;$("settingsTopBtn").onclick=settingsPanel;$("hintTopBtn").onclick=hint;$("resetTopBtn").onclick=reset;$("brandHome").onclick=e=>{e.preventDefault();closeDrawer();home()};$("drawerClose").onclick=closeDrawer;$("shade").onclick=closeDrawer;document.addEventListener("visibilitychange",()=>{if(document.hidden)saveCur();lastTick=Date.now()});window.addEventListener("beforeunload",saveCur);load();renderHome();
})();
</script></body></html>
