    </div>

      <span class="pb-tray__label">What you can say</span>
      <button class="pb-tile">Tengo fiebre</button>
      <button class="pb-tile">Desde ayer</button>
      <button class="pb-tile">Me duele el estómago</button>
      <button class="pb-tile">Desde hace una semana</button>
