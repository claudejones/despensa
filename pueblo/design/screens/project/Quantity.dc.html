<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mercado: how much</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pueblo/tokens.css">
<link rel="stylesheet" href="ds/pueblo/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Lilita+One&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F1B16}a:hover{color:#1B3FB5}
</style>
</helmet>
<div class="pb" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--cal); display: flex; flex-direction: column; overflow: hidden">
  <header class="pb-topbar">
    <a class="pb-iconbtn" href="Match.dc.html" aria-label="Back one step"><svg class="pb-ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></a>
    <h1 class="pb-topbar__title">Mercado</h1>
    <div class="pb-topbar__end"><span class="pb-chip pb-chip--coins"><svg class="pb-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6" /><path d="M18.09 10.37A6 6 0 1 1 10.34 18" /><path d="M7 6h1v4" /><path d="m16.71 13.88.7.71-2.82 2.82" /></svg>$120</span></div>
  </header>
  <div style="padding: 0 16px 10px">
    <div class="pb-progress pb-progress--steps" style="height: 8px" role="img" aria-label="Step 2 of 3"><i class="on"></i><i class="on"></i><i></i></div>
  </div>

  <div style="padding: 0 16px 14px">
    <div class="pb-encounter" data-place="mercado">
      <img class="pb-px pb-encounter__who" src="/_blob/d2a0c215f7af7c06c06cff3a70b1dd61" alt="Doña Carmen, talking" style="width: 117px; height: 124px">
      <div class="pb-dialogue">
        <p class="pb-dialogue__es">¿Cuánto le doy de zanahoria?</p>
        <p class="pb-dialogue__en">How much carrot shall I give you?</p>
      </div>
      <button class="pb-iconbtn pb-iconbtn--tonal pb-encounter__say" aria-label="Hear it again"><svg class="pb-ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" /><path d="M16 9a5 5 0 0 1 0 6" /><path d="M19.364 18.364a9 9 0 0 0 0-12.728" /></svg></button>
    </div>
  </div>

  <div style="flex: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0">
    <p class="body">Slide to the amount on your list.</p>
    <div class="pb-card" style="display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span class="pb-listrow__pic pb-listrow__pic--art"><img class="pb-px" src="/_blob/0a7ae3182b04fff94c595dbf2c068fd4" alt="" style="width: 40px; height: 41px"></span>
        <div style="flex: 1"><p class="title">carrots</p><p class="label" style="color: var(--ink-muted)">Your list says: a kilo and a half</p></div>
      </div>
      <div class="pb-slider" style="--pct: 50%">
        <div class="pb-slider__value">un kilo</div>
        <div class="pb-slider__rail">
          <div class="pb-slider__track"></div>
          <input type="range" min="0" max="4" step="1" value="2" aria-label="Amount of carrot">
          <div class="pb-slider__handle"></div>
        </div>
        <div class="pb-slider__stops"><span>¼</span><span>½</span><span>1</span><span>1½</span><span>2</span></div>
      </div>
    </div>
    <div class="pb-card pb-card--flat" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px">
      <p class="label" style="color: var(--ink-muted)">In your basket</p>
      <div style="display: flex; align-items: center; gap: 8px">
        <img class="pb-px" src="/_blob/c2c2ece97dd2d7b3230162525e6dabe2" alt="" style="width: 33px; height: 29px">
        <span class="title" style="flex: 1">limes</span>
        <span class="word">medio kilo</span>
      </div>
    </div>
  </div>

  <div style="padding: 0 16px 24px; display: flex; gap: 8px; align-items: center">
    <button class="pb-iconbtn pb-iconbtn--tonal pb-iconbtn--lg" aria-label="Hint, costs 5 pesos"><svg class="pb-ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" /><path d="M9 18h6" /><path d="M10 22h4" /></svg></button>
    <a class="pb-btn" href="Pay.dc.html" style="text-decoration: none; box-sizing: border-box; flex: 1">That much</a>
  </div>
</div>
</x-dc>

</body>
</html>
