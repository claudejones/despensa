<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mercado: results</title>

<link rel="stylesheet" href="ds/pueblo/components/bundle.css">

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Lilita+One&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F1B16}a:hover{color:#1B3FB5}
</style>
</helmet>
<div class="pb" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--cal); display: flex; flex-direction: column; overflow: hidden">
  <header class="pb-topbar">
    <h1 class="pb-topbar__title" style="padding-left: 12px">Mercado</h1>
    <div class="pb-topbar__end"><span class="pb-chip pb-chip--coins"><svg class="pb-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6" /><path d="M18.09 10.37A6 6 0 1 1 10.34 18" /><path d="M7 6h1v4" /><path d="m16.71 13.88.7.71-2.82 2.82" /></svg>$155</span></div>
  </header>

  <div style="padding: 0 16px 14px">
    <div class="pb-encounter" data-place="mercado">
      <img class="pb-px pb-encounter__who" src="/_blob/1c8bd78eb738e97d7e7cab88e01bf6d8" alt="Doña Carmen, happy" style="width: 117px; height: 124px">
      <div class="pb-dialogue">
        <p class="pb-dialogue__es">¡Muy bien! Que le vaya bonito.</p>
        <p class="pb-dialogue__en">Very good! Have a lovely day.</p>
      </div>
      <button class="pb-iconbtn pb-iconbtn--tonal pb-encounter__say" aria-label="Hear it again"><svg class="pb-ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" /><path d="M16 9a5 5 0 0 1 0 6" /><path d="M19.364 18.364a9 9 0 0 0 0-12.728" /></svg></button>
    </div>
  </div>

  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0">
    <h2 class="headline">Trip done</h2>
    <div class="pb-stat">
      <div><b>3</b><span>of 3 right</span></div>
      <div><b>0</b><span>hints used</span></div>
      <div><b style="color: var(--ocre-ink)">$35</b><span>earned</span></div>
    </div>
    <div class="pb-card pb-results" style="padding: 8px 16px">
      <div class="pb-results__row">
        <div class="pb-token pb-shape-sunny" data-state="known">Known</div>
        <div class="pb-results__body"><p class="pb-results__es">limones</p><p class="pb-results__en">limes · moved up</p></div>
      </div>
      <div class="pb-results__row">
        <div class="pb-token pb-shape-cookie" data-state="familiar">Familiar</div>
        <div class="pb-results__body"><p class="pb-results__es">zanahorias</p><p class="pb-results__en">carrots · moved up</p></div>
      </div>
      <div class="pb-results__row">
        <div class="pb-token pb-shape-clover" data-state="learning">Learning</div>
        <div class="pb-results__body"><p class="pb-results__es">kilo y medio</p><p class="pb-results__en">a kilo and a half · new today</p></div>
      </div>
    </div>
  </div>

  <div style="padding: 0 16px 24px; display: flex; flex-direction: column; gap: 4px; align-items: center">
    <a class="pb-btn" href="TownMap.dc.html" style="text-decoration: none; box-sizing: border-box">Back to town</a>
    <a class="pb-btn pb-btn--text" href="ChallengeIntro.dc.html" style="text-decoration: none">Another trip</a>
  </div>
</div>
</x-dc>

</body>
</html>
