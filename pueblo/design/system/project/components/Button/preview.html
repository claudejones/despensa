<!-- @dsCard group="Controls" height=288 subtitle="One primary action per screen" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: var(--cal); }
  .stage { padding: 16px; max-width: 412px; display: grid; gap: 12px; }
  .cap { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .5px; color: var(--ink-muted); }
  .line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

</style>
</head>
<body>
<div class="pb stage">
<button class="pb-btn">Go to checkout<span data-ic="chevron-right"></span></button>
<button class="pb-btn pb-btn--medium pb-btn--tonal">Hear it again</button>
<div class="line"><button class="pb-btn pb-btn--small">Next</button><button class="pb-btn pb-btn--small pb-btn--tonal">Skip</button><button class="pb-btn pb-btn--small pb-btn--outline">Hint</button><button class="pb-btn pb-btn--text">Not now</button></div>
<button class="pb-btn" disabled>Check</button>
</div>
</body>
</html>
