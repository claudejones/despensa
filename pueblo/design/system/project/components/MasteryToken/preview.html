<!-- @dsCard group="Controls" height=160 subtitle="The shape is the state" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: var(--cal); }
  .stage { padding: 16px; max-width: 412px; display: grid; gap: 12px; }
  .cap { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .5px; color: var(--ink-muted); }
  .line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

</style>
</head>
<body>
<div class="pb stage">
<div class="line" id="l"></div>
<p class="cap">New, learning, familiar, known. A word that slips moves back a step.</p>
</div>
<script>
(function () {
document.getElementById('l').innerHTML = Pueblo.MASTERY.map(function (m) { return '<div class="pb-token" data-state="' + m.id + '" data-shape="' + m.shape + '">' + m.label + '</div>'; }).join('');
Pueblo.applyShapes();
})();
</script>
</body>
</html>
