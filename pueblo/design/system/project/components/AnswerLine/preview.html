<!-- @dsCard group="Challenge" height=360 subtitle="Tiles arranged into a sentence" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: var(--cal); }
  .stage { padding: 16px; max-width: 412px; display: grid; gap: 12px; }
  .cap { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .5px; color: var(--ink-muted); }
  .line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

</style>
</head>
<body>
<div class="pb stage">
<p class="cap">I would like half a kilo of limes, please.</p>
<div class="pb-answer"><span class="pb-tile">Quisiera</span><span class="pb-tile">medio kilo</span><span class="pb-tile">de</span></div>
<div class="pb-tray"><span class="pb-tray__label">Your words</span><span class="pb-tile">limones</span><span class="pb-tile">por favor</span><span class="pb-tile">un</span><span class="pb-tile">tomates</span></div>
</div>
</body>
</html>
