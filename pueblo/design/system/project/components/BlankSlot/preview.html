<!-- @dsCard group="Challenge" height=180 subtitle="Where a Spanish word lands" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: var(--cal); }
  .stage { padding: 16px; max-width: 412px; display: grid; gap: 12px; }
  .cap { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .5px; color: var(--ink-muted); }
  .line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

</style>
</head>
<body>
<div class="pb stage">
<div class="line"><span class="pb-slot"></span><span class="pb-slot pb-slot--filled">limones</span></div>
<div class="line"><span class="pb-slot pb-slot--correct"><span data-ic="check" data-size="18" data-sw="3"></span>limones</span><span class="pb-slot pb-slot--wrong"><span data-ic="x" data-size="18" data-sw="3"></span>limas</span></div>
<p class="cap">Empty, filled, correct, wrong.</p>
</div>
</body>
</html>
