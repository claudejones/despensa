<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Lilita+One&family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: var(--cal); }
  .stage { padding: 16px; max-width: 412px; display: grid; gap: 12px; }
  .cap { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .5px; color: var(--ink-muted); }
  .line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

</style>
</head>
<body>
<div class="pb stage">
<div class="pb-dialog">
  <div class="pb-dialog__icon" data-ic="rotate-ccw" data-size="28"></div>
  <p class="pb-dialog__title">Reset your progress?</p>
  <p class="pb-dialog__text">Every word goes back to new and your town is repainted blank. This cannot be undone.</p>
  <div class="pb-dialog__actions"><button class="pb-btn pb-btn--text">Keep my progress</button><button class="pb-btn pb-btn--small">Reset</button></div>
</div>
</div>
</body>
</html>
