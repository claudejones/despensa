<style>
:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; background: #141210; overflow: hidden; overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#stage {
  position: fixed; inset: 0;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  display: flex; align-items: center; justify-content: center; box-sizing: border-box;
}
#game { display: block; touch-action: none; background: #1C1A17; }
#rotate {
  position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  background: #141210; color: #EFE3C8; font: 600 20px/1.4 "Trebuchet MS", system-ui, sans-serif; text-align: center; padding: 24px; z-index: 5;
}
#rotate.art { background-size: cover; background-position: 32% center; }
#rotate .rot-logo { width: min(78vw, 360px); height: auto; margin-bottom: 18px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6)); }
#rotate p { margin: 0; text-shadow: 0 2px 6px #000; font-size: 22px; }
#rotate .rot-icon { width: 64px; height: 104px; border: 4px solid #EFE3C8; border-radius: 10px; background: rgba(20,18,16,0.5); box-shadow: 0 0 0 3px rgba(0,0,0,0.35); animation: rot 1.8s ease-in-out infinite; }
@keyframes rot { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
/* owner 2026-10-24: the turn-your-phone screen waits until the game has loaded (html.ready); a loading screen comes first */
@media (orientation: portrait) { html.ready #rotate { display: flex; } }
#boot { position: fixed; inset: 0; z-index: 10; background: #141210; display: flex; align-items: center; justify-content: center; pointer-events: none; transition: opacity 0.4s ease; }
#boot.gone { opacity: 0; }
#boot .boot-art { position: absolute; inset: -20px; background-size: cover; background-position: 40% center; filter: blur(8px); opacity: 0.5; }
#boot .boot-box { position: relative; text-align: center; color: #EFE3C8; font: 600 18px/1.4 "Trebuchet MS", system-ui, sans-serif; padding: 24px; }
#boot .boot-title { font-size: 30px; color: #FFB547; margin-bottom: 18px; text-shadow: 0 2px 8px #000; }
#boot p { margin: 14px 0 0; text-shadow: 0 2px 6px #000; }
#boot .boot-bar { width: min(60vw, 280px); height: 8px; margin: 0 auto; border-radius: 4px; background: rgba(239,227,200,0.2); overflow: hidden; }
#boot .boot-bar i { display: block; width: 35%; transition: width 0.2s; height: 100%; border-radius: 4px; background: #FFB547; animation: bootbar 1.2s ease-in-out infinite; }
@keyframes bootbar { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
@media (prefers-reduced-motion: reduce) { #boot .boot-bar i { animation: none; width: 100%; opacity: 0.6; } }
@media (prefers-reduced-motion: reduce) { #rotate .rot-icon { animation: none; transform: rotate(-90deg); } }

</style>

function drawCutscene(g, name, k = 9) {
  const im = propImg("cut-" + name); if (!im) return false;
  const m = calm() ? 0 : Math.min(1, k / 12), z = 1.06 + 0.03 * m, w = W * z, h = H * z; // reduced motion: no drift

// Placeholder actors (M0/M2). Shapes only, seen from above, facing right; replaced by production sprites in M3.
// Each is registered with drawSprite so the game never draws a creature directly.
// Placeholders draw facing RIGHT and never rotate themselves: drawSprite applies o.rot (a second turn here turned
// every placeholder twice, found in the M0 Bottom-mode test).

// Where an arrow leaves the bow for the hero centred at (x, y), aiming at angle a. Re-measure on the M3 sprite.
function heroTip(x, y, a) { return { x: x + Math.cos(a) * 34, y: y + Math.sin(a) * 34 }; }

// Hero from above: shoulders, hooded head, bow held forward. o.aiming bends the bow (drawn back).
function drawHeroTop(g, x, y, o = {}) {

// Particles for hits and pickups. Overhead view: no gravity, they spread and slow down.
const parts = [];
function burst(x, y, color, n = 12, speed = 220) {
  if (calm()) n = Math.ceil(n / 3);
  for (let i = 0; i < n; i++) { const a = rand(0, Math.PI * 2), s = rand(speed * 0.3, speed); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 0.8), color, r: rand(2, 5) }); }
}
function updateParts(dt) {
  const drag = Math.pow(0.04, dt);
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; p.vx *= drag; p.vy *= drag; p.x += p.vx * dt; p.y += p.vy * dt; if (p.life <= 0) parts.splice(i, 1); }
}
function drawParts(g) {
  for (const p of parts) { g.globalAlpha = clamp(p.life * 2, 0, 1); g.fillStyle = p.color; g.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r); }
  g.globalAlpha = 1;
}

// ---- 35-aim.js ----
// Shared slingshot aiming (owner-approved in L1): press anywhere, pull back, let go to shoot.
// Pull back into the ring at the press point to cancel; second finger / Esc also cancel.
// Keyboard: arrows aim, hold Space (power cycles up and down), release to shoot, Esc cancels.

const AIM_CANCEL_R = 44;
const AIM_PREVIEW_SECS = 0.32; // preview shows only the start of the flight; the Sight perk / QA full path shows it all

class Slingshot {
  // keysLR: false leaves ← → (and A/D) free for walking; the angle then uses ↑ ↓ (W/S) only
  // wasd: false leaves W A S D free for moving the hero (the angle uses the arrow keys only)
  constructor({ minA = -1.45, maxA = 0.3, angle = -0.35, keysLR = true, wasd = true } = {}) {
    Object.assign(this, { minA, maxA, angle, keysLR, wasd, power: 0, dir: 1, active: false, drag: null, keyCancelled: false });
  }
  reset() { this.drag = null; this.active = false; this.power = 0; this.dir = 1; }
  cancel() {
    if (this.drag && this.drag.wasOut) toast.show("Shot cancelled", 1.2);
    this.reset();
  }
  // returns true if the pointer was taken
  down(x, y, id) {
    if (this.drag && this.drag.id !== id) { this.cancel(); return true; }
    if (!this.drag) { this.drag = { id, sx: x, sy: y, cx: x, cy: y, inCancel: true, wasOut: false }; return true; }
    return false;
  }
  move(x, y, id) {
    const d = this.drag;
    if (!d || d.id !== id) return;
    d.cx = x; d.cy = y;
    const dx = d.sx - x, dy = d.sy - y, dist = Math.hypot(dx, dy);
    d.inCancel = dist < AIM_CANCEL_R;
    if (d.inCancel) { this.active = false; return; }
    d.wasOut = true;
    this.active = true;
    this.angle = clamp(Math.atan2(dy, dx), this.minA, this.maxA);
    this.power = clamp((dist - AIM_CANCEL_R) / 180, 0.05, 1);
  }
  // returns "fire" when a shot should be taken
  up(x, y, id) {
    const d = this.drag;
    if (!d || d.id !== id) return null;
    const dist = Math.hypot(d.sx - x, d.sy - y);
    const fire = dist >= AIM_CANCEL_R;
    if (!fire && d.wasOut) toast.show("Shot cancelled", 1.2);
    this.drag = null; this.active = false;
    return fire ? "fire" : null;
  }
  // keyboard; returns "fire" on Space release, "cancel" on Esc while aiming
  key(code, down) {
    if (down && code === "Escape" && (this.drag || (this.active && keys.has("Space")))) {
      if (this.drag) this.cancel(); else { this.reset(); this.keyCancelled = true; toast.show("Shot cancelled", 1.2); }
      return "cancel";
    }
    if (!down && code === "Space") {
      if (this.keyCancelled) { this.keyCancelled = false; return null; }
      if (this.power > 0.08 && !this.drag) return "fire";
    }
    return null;
  }
  update(dt) {
    if (this.drag) return;
    const lr = this.keysLR, wa = this.wasd;
    if (keys.has("ArrowUp") || (wa && keys.has("KeyW")) || (lr && (keys.has("ArrowLeft") || (wa && keys.has("KeyA"))))) this.angle = clamp(this.angle - 1.2 * dt, this.minA, this.maxA);
    if (keys.has("ArrowDown") || (wa && keys.has("KeyS")) || (lr && (keys.has("ArrowRight") || (wa && keys.has("KeyD"))))) this.angle = clamp(this.angle + 1.2 * dt, this.minA, this.maxA);
    if (keys.has("Space") && !this.keyCancelled) {
      this.active = true; this.power += this.dir * dt / 1.1;
      if (this.power >= 1) { this.power = 1; this.dir = -1; } else if (this.power <= 0.05) { this.power = 0.05; this.dir = 1; }
    }
  }
  afterFire() { this.power = 0; this.dir = 1; this.active = false; }
  // power meter + slingshot pad (the level draws its own flight preview)
  draw(g) {
    if (this.active) {
      roundRect(g, 40, 300, 22, 130, 8); g.fillStyle = "rgba(20,18,16,0.6)"; g.fill();
      const ph = 122 * this.power; g.fillStyle = this.power > 0.85 ? C.red : C.ochre; g.fillRect(44, 426 - ph, 14, ph);
    }
    const d = this.drag;
    if (!d) return;
    g.beginPath(); g.arc(d.sx, d.sy, AIM_CANCEL_R, 0, Math.PI * 2);
    g.fillStyle = d.inCancel ? "rgba(212,44,28,0.25)" : "rgba(20,18,16,0.25)"; g.fill();
    g.lineWidth = 3; g.strokeStyle = d.inCancel ? C.red : "rgba(252,244,236,0.8)"; g.stroke();
    g.beginPath(); g.arc(d.sx, d.sy, 6, 0, Math.PI * 2); g.fillStyle = C.plaster; g.fill();
    if (!d.inCancel) {
      g.lineWidth = 4; g.strokeStyle = "rgba(252,244,236,0.85)";
      g.beginPath(); g.moveTo(d.sx, d.sy); g.lineTo(d.cx, d.cy); g.stroke();
      g.beginPath(); g.arc(d.cx, d.cy, 12, 0, Math.PI * 2); g.fillStyle = C.ochre; g.fill(); g.lineWidth = 3; g.strokeStyle = C.outline; g.stroke();
    }
    const ly = d.sy - AIM_CANCEL_R - 14 < 130 ? d.sy + AIM_CANCEL_R + 28 : d.sy - AIM_CANCEL_R - 14;
    text(g, d.inCancel ? (d.wasOut ? "Let go here to cancel" : "Pull back to aim") : "Let go to shoot · back to circle to cancel",
      clamp(d.sx, 200, W - 200), ly, { size: 18, align: "center", color: C.plaster, outline: C.outline });
  }
}

// Draw preview dots along a list of points [[x,y,t],...] (t = flight time), fading with time.
// Kukulcán lesson: the full path through every bounce was too busy to aim with. The preview runs to the FIRST
// bounce, marks it with a ring and shows a short faded hint of where the shot goes next; the Sight perk sees one
// bounce further. pts: [x, y, t] along the flight.
function drawPreviewDots(g, pts, secs, sight = hasPower("sight") || assist.fullArc()) {
  let cut = pts.length, skip = sight ? 1 : 0;
  for (let i = 2; i < pts.length; i++) {
    const ax = pts[i - 1][0] - pts[i - 2][0], ay = pts[i - 1][1] - pts[i - 2][1], bx = pts[i][0] - pts[i - 1][0], by = pts[i][1] - pts[i - 1][1];
    const la = Math.hypot(ax, ay), lb = Math.hypot(bx, by); if (la < 0.5 || lb < 0.5) continue;
    if ((ax * bx + ay * by) / (la * lb) < 0.8) { if (skip-- > 0) { i += 2; continue; } cut = i; break; } // turned more than ~37 degrees: a bounce
  }
  if (cut < pts.length) {
    const [bx, by] = pts[cut - 1]; g.beginPath(); g.arc(bx, by, 10, 0, Math.PI * 2); g.lineWidth = 3; g.strokeStyle = "rgba(252,244,236,0.85)"; g.stroke();
    pts.slice(cut, cut + 4).forEach(([x, y], k) => { g.beginPath(); g.arc(x, y, 2.5, 0, Math.PI * 2); g.fillStyle = `rgba(252,244,236,${0.45 - k * 0.1})`; g.fill(); }); // the bounce's direction, faint
    pts = pts.slice(0, cut);
  }
  pts.forEach(([x, y, t], i) => {
    if (i % 3) return;
    const fade = Math.max(0.25, 1 - t / secs);
    g.beginPath(); g.arc(x, y, 3 + 3 * fade, 0, Math.PI * 2);
    g.fillStyle = `rgba(252,244,236,${0.35 + 0.6 * fade})`; g.fill();
    g.lineWidth = 1.5; g.strokeStyle = `rgba(20,18,16,${0.3 + 0.5 * fade})`; g.stroke();
  });
}

const SEAL_COLORS = ["#E8641E", "#9FE3F5", "#9A8F7C", "#F5E663", "#B48CF0"]; // fire, ice, stone, lightning, the fifth

function drawCavernTitleBackdrop(g, t) {
  g.fillStyle = "#0E0C12"; g.fillRect(0, 0, W, H);
  // rock masses, lit warm from the torch at the lower left
  const glow = g.createRadialGradient(200, 400, 20, 200, 400, 520);
  glow.addColorStop(0, "rgba(255,181,71,0.45)"); glow.addColorStop(0.4, "rgba(232,100,30,0.16)"); glow.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = C.rockDark;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(W, 0); g.lineTo(W, 70); g.quadraticCurveTo(700, 140, 520, 90); g.quadraticCurveTo(300, 40, 0, 150); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(0, H); g.lineTo(W, H); g.lineTo(W, 470); g.quadraticCurveTo(720, 420, 520, 480); g.quadraticCurveTo(250, 520, 0, 430); g.closePath(); g.fill();
  g.fillStyle = glow; g.fillRect(0, 0, W, H);
  // the five seals, glowing faintly in a row
  SEAL_COLORS.forEach((c, i) => {
    const x = 110 + i * 92, y = 300, p = calm() ? 0.6 : 0.5 + 0.3 * Math.sin(t * 1.6 + i);
    const gl = g.createRadialGradient(x, y, 4, x, y, 44); gl.addColorStop(0, c); gl.addColorStop(1, "rgba(0,0,0,0)");
    g.globalAlpha = p; g.fillStyle = gl; g.beginPath(); g.arc(x, y, 44, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
    g.beginPath(); g.arc(x, y, 26, 0, Math.PI * 2); g.fillStyle = C.rock; g.fill(); g.lineWidth = 3; g.strokeStyle = c; g.stroke();
    g.fillStyle = c; for (let k = 0; k <= 5; k++) { const a = -Math.PI / 2 + k * Math.PI * 2 / 5, r = k === 5 ? 0 : 14; g.beginPath(); g.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, k === 5 ? 5 : 3, 0, Math.PI * 2); g.fill(); } // five marks around a centre
  });
  drawTorch(g, 60, 470, 0.9, t);
}

// ---- 45-challenge.js ----
// Time Challenge (SPEC §3.9): replay finished stages against a stopwatch, intros skipped,
// best time per stage saved in save.best. Story mode has no countdowns.

const RUN = { mode: "story", t: 0, levelId: null };
const isChallenge = () => RUN.mode === "challenge";

function fmtTime(s) {
  const m = Math.floor(s / 60), r = s - m * 60;
  return m + ":" + (r < 10 ? "0" : "") + r.toFixed(1);
}

// Where "quit" and "done" lead from inside a level (the map arrives in M2; until then the title).
function levelExit() { go(isChallenge() ? ChallengeScene() : typeof MapScene === "function" ? MapScene() : TitleScene()); }

// Call every frame from a level's update while the player is in control.
function challengeTick(dt) { if (isChallenge()) RUN.t += dt; }

function drawChallengeClock(g) {
  if (!isChallenge()) return;
  const best = save.best && save.best[RUN.levelId];
  roundRect(g, W / 2 - 110, H - 52, 220, 40, 10); g.fillStyle = "rgba(20,18,16,0.75)"; g.fill();
  text(g, "⏱ " + fmtTime(RUN.t) + (best ? "   best " + fmtTime(best) : ""), W / 2, H - 25, { size: 18, align: "center", color: C.ochre });
}

// Level finished in challenge mode: record the time and show the result.
function challengeFinish() {
  save.best = save.best || {};
  const prev = save.best[RUN.levelId];
  const isBest = !assist.any() && (!prev || RUN.t < prev); // assisted runs don't set best times
  if (isBest) save.best[RUN.levelId] = RUN.t;
  if (assist.any()) toast.show("Assist on: this time isn't saved", 3);
  writeSave();
  Sfx.play(isBest ? "chime" : "round");
  go(ChallengeResultScene(RUN.levelId, RUN.t, prev, isBest));
}

function startChallenge(levelId) {
  RUN.mode = "challenge"; RUN.t = 0; RUN.levelId = levelId;
  go(LEVEL_SCENES[levelId]());
}

function ChallengeScene() {
  const s = {};
  RUN.mode = "story";
  // one tab per realm that has stages; 2 columns × 3 rows of stages
  const realms = () => REALMS.filter(r => r.stages.some(st => st.ready));
  let tab = 0;
  const bBack = new Button("Back", 20, H - 84, 150, 64, () => go(GamesScene()), { kind: "dark" });
  const tabs = () => { const R = realms(), n = R.length, gap = 8, w = Math.min(200, Math.floor((W - 40 - gap * (n - 1)) / n)), x0 = (W - (n * w + gap * (n - 1))) / 2; /* (fit.mjs 2026-11-08: the fifth tab was off screen) */ return R.map((r, i) => { const b = new Button(r.name.replace(/^The /, ""), x0 + i * (w + gap), 116, w, 48, () => { tab = i; Sfx.play("ui"); }, { kind: i === tab ? "primary" : "dark" }); return b; }); };
  const available = id => QA.on || save.levelProgress[id] === "done";
  const rows = () => (realms()[tab] || { stages: [] }).stages.filter(st => st.ready);
  const cell = i => ({ x: 100 + (i % 2) * 390, y: 180 + Math.floor(i / 2) * 84, w: 370, h: 72 });
  const btns = () => [bBack, ...tabs()];
  s.down = (x, y) => btnDown(btns(), x, y);
  s.up = (x, y) => {
    if (btnUp(btns(), x, y)) return;
    rows().forEach((site, i) => {
      const c = cell(i);
      if (x < c.x || x > c.x + c.w || y < c.y || y > c.y + c.h) return;
      if (!available(site.id)) { toast.show("Finish " + site.name + " in the story first"); return; }
      Sfx.play("ui"); startChallenge(site.id);
    });
  };
  s.key = (code, down) => { if (down && code === "Escape") go(GamesScene()); if (down && code === "Tab") tab = (tab + 1) % Math.max(1, realms().length); };
  s.draw = g => {
    g.fillStyle = C.carbon; g.fillRect(0, 0, W, H);
    text(g, "Time Challenge", 100, 58, { size: 34, color: C.torch, maxW: 760 });
    text(g, "Replay a stage against the clock. No story scenes. Beat your best time.", 100, 94, { size: 17, weight: 400, color: C.lime, maxW: 760 });
    tabs().forEach(b => b.draw(g));
    rows().forEach((site, i) => {
      const c = cell(i), ok = available(site.id), best = save.best && save.best[site.id];
      roundRect(g, c.x, c.y, c.w, c.h, 12); g.fillStyle = ok ? C.shadow : "rgba(42,37,48,0.4)"; g.fill();
      g.lineWidth = 2; g.strokeStyle = ok ? C.torch : C.stoneDark; g.stroke();
      text(g, site.name, c.x + 20, c.y + 32, { size: 21, color: ok ? C.plaster : C.stoneMid });
      text(g, ok ? (best ? "Best " + fmtTime(best) : "No time yet") : "Locked", c.x + 20, c.y + 58, { size: 16, weight: 400, color: ok ? C.torch : C.stoneMid });
    });
    bBack.draw(g);
    drawToast(g, 1 / 60);
  };
  if (TEST_MODE) s.testState = () => ({ tab, rows: rows().map(r => r.id) });
  return s;
}

function ChallengeResultScene(levelId, t, prev, isBest) {
  const s = {};
  const site = stageById(levelId);
  const bAgain = new Button("Play again", W / 2 - 250, 360, 240, 68, () => startChallenge(levelId));
  const bList = new Button("All challenges", W / 2 + 10, 360, 240, 68, () => go(ChallengeScene()), { kind: "dark" });
  s.down = (x, y) => btnDown([bAgain, bList], x, y);
  s.up = (x, y) => btnUp([bAgain, bList], x, y);

    text(g, fmtTime(t), W / 2, 220, { size: 72, align: "center", color: C.plaster, outline: C.outline });

    bAgain.draw(g); bList.draw(g);
  };
  return s;
}

// Treasure Gallery (owner design 2026-10-25, SPEC §3.7): the stand-and-aim mini-game at camps. Press anywhere, pull
// back, let go (the shared Slingshot); arrows fly straight, slow down and bounce off the walls and pillars (the same
// physics as the stages: sbArrowStep). A turn = up to 5 arrows at 1 coin each; break a target to win the prize shown on
// it; broken targets stay broken between visits (save.galleries[id].broken). The training keeper's first 5 are free.
// A lit room (lanterns), no darkness: it's a shop.

const GAL = { x0: 120, x1: 840, y0: 110, y1: 520, hero: { x: 480, y: 478 }, arrows: 5, r: { pot: 26, lantern: 19, bell: 13, jewel: 15 } };
const galRoom = def => ({ layout: "gallery", bounds: { x0: GAL.x0, x1: GAL.x1, y0: GAL.y0, y1: GAL.y1, wallX: true, wallY: true }, pillars: def.pillars || [] });
const galTargetPos = (tg, t) => tg.move ? { x: tg.x + Math.sin(t * tg.move.speed + tg.move.ph) * tg.move.amp, y: tg.y } : { x: tg.x, y: tg.y };
const galPrizeIcon = p => ({ coins: "coin", oil: "oil", potion: "potion", shield: "shield", charge: "charge", gem: "gem", jewel: "jewel", arrows: "arrow" })[p.type];
const galPrizeName = p => p.type === "jewel" ? JEWELS[p.id].name : ({ coins: p.n + " coins", oil: "Torch oil", potion: "Healing potion", shield: "Shield (next stage)", charge: "Element arrows", gem: "A gem" })[p.type];
// a jewel's stone guard: a bar just below it that moves with it and bounces arrows away (owner 2026-10-25: the jewel
// was far too easy, a slow straight shot). You have to bank a shot off a wall and come in from the side or above.
const galGuard = (tg, t) => { if (!tg.guard) return null; const p = galTargetPos(tg, t); return { x0: p.x - tg.guard.w / 2, x1: p.x + tg.guard.w / 2, y: p.y + tg.guard.dy }; };
// one arrow step in a gallery: the stages' physics (walls, pillars) + the guards of the targets still standing
function galArrowStep(a, room, targets, t, dt) {
  let bounced = sbArrowStep(a, room, dt);
  for (const tg of targets) {
    const gd = galGuard(tg, t); if (!gd || a.spent) continue;
    if ((a.py - gd.y) * (a.y - gd.y) <= 0 && a.py !== a.y) { const k = (gd.y - a.py) / (a.y - a.py), cx = a.px + (a.x - a.px) * k; if (cx >= gd.x0 - 3 && cx <= gd.x1 + 3) { a.y = 2 * gd.y - a.y; a.vy = -a.vy; a.bounces = (a.bounces || 0) + 1; bounced = true; } }
  }
  return bounced;
}
function galState(id) { const all = save.galleries || (save.galleries = {}); return all[id] || (all[id] = { broken: [], lesson: false }); }

// one target, drawn by kind (difficulty) with the prize's icon on it (owner: "the target has the icon of the thing you are after")
function drawGalleryTarget(g, tg, x, y, t) {

  g.save(); g.lineWidth = 3; g.strokeStyle = C.outline;
  // lanterns swing on a cord from a fixed hook; bells slide along a rail (their cord stays straight)
  if (tg.kind === "lantern" || tg.kind === "bell") { g.strokeStyle = "rgba(201,187,156,0.7)"; g.lineWidth = 2; g.beginPath(); g.moveTo(tg.kind === "lantern" ? tg.x : x, GAL.y0); g.lineTo(x, y - r); g.stroke(); g.strokeStyle = C.outline; g.lineWidth = 3; }
  const guard = () => { const w = tg.guard.w, gy = y + tg.guard.dy; if (artImg("gal-guard")) drawUiStretch(g, artImg("gal-guard"), x - w / 2, gy - 9, w, 18); else { roundRect(g, x - w / 2, gy - 6, w, 12, 5); g.fillStyle = C.stoneMid; g.fill(); g.lineWidth = 3; g.strokeStyle = C.outline; g.stroke(); } };
  if (tg.kind === "jewel") { // golden glow behind the land's jewel in its glass case
    const p = calm() ? 0.7 : 0.55 + 0.35 * Math.sin(t * 3);
    const gl = g.createRadialGradient(x, y, 4, x, y, r * 3); gl.addColorStop(0, `rgba(255,212,71,${p})`); gl.addColorStop(1, "rgba(255,212,71,0)");

  const art = { pot: [r * 2.3], lantern: [r * 2.5, 0, -r * 0.2], bell: [r * 2.3], jewel: [r * 2.6] }[tg.kind];
  if (art && drawProp(g, "gal-" + tg.kind, x, y + (art[2] || 0), art[0])) { g.restore(); drawIcon(g, icon, x, y + (tg.kind === "pot" ? 1 : 0), tg.kind === "pot" ? 24 : tg.kind === "jewel" ? 20 : 18); if (tg.prize.n > 1) text(g, "×" + tg.prize.n, x + r - 2, y + r + 2, { size: 13, color: C.plaster, outline: C.outline }); return; } // painted (M3)
  if (tg.kind === "pot") {

    g.fillStyle = "#7A3B1E"; g.beginPath(); g.ellipse(x, y - r * 0.55, r * 0.55, r * 0.2, 0, 0, Math.PI * 2); g.fill(); // the pot's mouth
  } else if (tg.kind === "lantern") {

  } else if (tg.kind === "bell") {
    g.fillStyle = "#B8862E"; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); g.stroke();

    g.fillStyle = "rgba(220,240,255,0.35)"; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); g.lineWidth = 2; g.strokeStyle = "#FFE28A"; g.stroke();

}

// the title's Games menu: Time Challenge and Target Trials

  const s = { music: "camp" };

KEEPER_LINES["lesson"] = [{"who":"GRANDPA TOBBLE","text":"Welcome, traveller! I'm Grandpa Tobble. Step up to my Treasure Gallery."},{"who":"GRANDPA TOBBLE","text":"Break a target and its prize is yours. The small, quick ones pay best."},{"who":"GRANDPA TOBBLE","text":"Five arrows on me. After that, the Tobble rule: a coin an arrow!"},{"who":"GRANDPA TOBBLE","text":"The golden one at the back is my Heart Jewel. Its guard stops straight shots."},{"who":"GRANDPA TOBBLE","text":"So bounce one off the wall. You'll need a stout heart down there."}];
KEEPER_LINES["lessonEnd"] = [{"who":"GRANDPA TOBBLE","text":"Not bad at all! My family keeps galleries all over the deep places."},{"who":"GRANDPA TOBBLE","text":"Four of them, down there. Only three ever write. ...Never mind me."},{"who":"GRANDPA TOBBLE","text":"They'll make you pay, mind. A coin an arrow. No Tobble forgets that!"}];
KEEPER_LINES["jewel"] = [{"who":"GRANDPA TOBBLE","text":"My Heart Jewel... keep it. You've earned it."},{"who":"GRANDPA TOBBLE","text":"Only, if you find another jewel like it down there, bring it to an old man?"},{"who":"FLICK","text":"We will! Won't we? We will."}];
KEEPER_LINES["back"] = [{"who":"GRANDPA TOBBLE","text":"Back again! The pots missed you."}];
KEEPER_LINES["paid"] = [{"who":"GRANDPA TOBBLE","text":"A coin an arrow, up to five a turn. What you miss waits for you."}];
KEEPER_LINES["empty"] = [{"who":"GRANDPA TOBBLE","text":"You've cleaned me out! Come back once you've been deeper in."}];
KEEPER_LINES["restock"] = [{"who":"GRANDPA TOBBLE","text":"New pots, fresh from the kiln! And a shelf of things you'll want."}];
KEEPER_LINES["notice"] = [{"who":"GRANDPA TOBBLE","text":"Is that a new seal in your quiver? It's warmer in here already!"}];
STORY["DROP_before"] = [{"who":"FLICK","text":"A shaft. Straight down. Into the dark. Of course it is."},{"who":"FLICK","text":"Clear each ledge, then walk to the edge and down we go."}];
STORY["DROP_after"] = [{"who":"FLICK","text":"It's warm down here. Too warm. Something is breathing."}];
STORY["HOT_before"] = [{"who":"FLICK","text":"This tunnel is HOT. Everything down here is running out of it!"},{"who":"FLICK","text":"Bitey-bats! Crawly-things! Straight at us, from every side!"},{"who":"ROWAN","text":"Then we fight our way through."}];
STORY["HOT_after"] = [{"who":"FLICK","text":"They're gone. Whatever chased them out is still in there."},{"who":"FLICK","text":"And it's breathing louder."},{"who":"ROWAN","text":"Then I'll shoot it."}];
BOSS_LINES.sizzle["before"] = [{"who":"SIZZLE","text":"A little archer with a little torch! In MY cave!"},{"who":"SIZZLE","text":"I am Sizzle, and everyone is AFRAID of me. Aren't you afraid?"},{"who":"ROWAN","text":"No. Give back the seal."},{"who":"FLICK","text":"She's quite small, for a dragon."},{"who":"SIZZLE","text":"I HEARD that! When my chest glows, you'll RUN!"}];
BOSS_LINES.sizzle["phase1"] = {"who":"FLICK","text":"Watch her chest glow before she breathes. Then move!"};
BOSS_LINES.sizzle["taunt2"] = {"who":"SIZZLE","text":"Up here I'm TERRIFYING! Nobody's scary on the ground!"};
BOSS_LINES.sizzle["phase2"] = {"who":"FLICK","text":"She's flying! Shoot when she lands."};
BOSS_LINES.sizzle["taunt3"] = {"who":"SIZZLE","text":"My scales! Stop it! Cracked scales are NOT frightening!"};

BOSS_LINES.sizzle["after"] = [{"who":"SIZZLE","text":"Fine! FINE. Take it. It was too hot to hold anyway."},{"who":"SIZZLE","text":"Nyx said it would be fun down here. She said nobody would come."},{"who":"FLICK","text":"Who's Nyx?"},{"who":"ROWAN","text":"Whoever she is, I'll stop her."}];

STORY["ICEFALL_before"] = [{"who":"FLICK","text":"Ice. Everywhere. My wings hate this. And frost wisps drink light."},{"who":"ROWAN","text":"Then I'll shoot them first."},{"who":"FLICK","text":"And shelly-crawlers! Er, ice-shell crawlers. Your fire melts them."}];
STORY["ICEFALL_after"] = [{"who":"FLICK","text":"There's a gallery down here. Of course there is. There's always a Tobble."}];
GALLERIES.ice.lines.first = [{"who":"ICE TOBBLE","text":"Grandpa sent you? He gives arrows away. I don't."},{"who":"ICE TOBBLE","text":"A coin an arrow. Not one coin less. And my jewel is not for beginners."}];
GALLERIES.ice.lines.back = [{"who":"ICE TOBBLE","text":"You again. Coins first."}];
GALLERIES.ice.lines.paid = [{"who":"ICE TOBBLE","text":"Up to five a turn. What you don't break waits for you."}];
GALLERIES.ice.lines.empty = [{"who":"ICE TOBBLE","text":"Nothing left. Go and bother a dragon."}];
GALLERIES.ice.lines.restock = [{"who":"ICE TOBBLE","text":"Fresh pots. Try not to break them all. Actually, do. It's good for business."}];

STORY["GATE_before"] = [{"who":"FLICK","text":"Something's coming up the tunnel. Lots of somethings. Get ready!"},{"who":"FLICK","text":"They'll come from every side. Keep moving, keep shooting!"}];

BOSS_LINES.icefang["before"] = [{"who":"ICEFANG","text":"You... are... the one who beat... the little drake."},{"who":"ICEFANG","text":"Down here... nothing moves. Nothing melts. I like it... still."},{"who":"ICEFANG","text":"Stand still... archer. Let the cold... keep you."},{"who":"FLICK","text":"He talks slowly. Shoot quickly."}];

BOSS_LINES.icefang["taunt3"] = {"who":"ICEFANG","text":"Frozen... all through. Nothing gets in... nothing... but fire."};

BOSS_LINES.icefang["after"] = [{"who":"ICEFANG","text":"Take it... then. The cold... was getting... lonely."},{"who":"ICEFANG","text":"Nyx... promised us... a world of our own. It is... so empty."},{"who":"ROWAN","text":"Why did you follow her?"},{"who":"ICEFANG","text":"She asked. Nobody... up there... ever asked."}];

STORY["HALLS_before"] = [{"who":"FLICK","text":"From too cold to too hot. Could we have a nice medium cave, just once?"},{"who":"FLICK","text":"The big stompy ones! Golems. Wait for the cracks to glow, then shoot."},{"who":"FLICK","text":"Ember imps throw your own fire back. Ice works better on them."}];

GALLERIES.lava.lines.first = [{"who":"LAVA TOBBLE","text":"The best Tobble gallery is MINE. Ask anyone. Don't ask my cousins."},{"who":"LAVA TOBBLE","text":"A coin an arrow, hot from the forge! Fair prices. Mostly fair."}];
GALLERIES.lava.lines.back = [{"who":"LAVA TOBBLE","text":"Back for more? Of course you are."}];
GALLERIES.lava.lines.paid = [{"who":"LAVA TOBBLE","text":"Hot prizes, five arrows a turn! Make them count."}];

GALLERIES.lava.lines.restock = [{"who":"LAVA TOBBLE","text":"Fresh pots, still warm from the forge!"}];

BOSS_LINES.rockjaw["taunt2"] = {"who":"ROCKJAW","text":"Cold? Cold can't hold Rockjaw for long!"};

GALLERIES.night.lines.first = [{"who":"NIGHT TOBBLE","text":"You found me. Most don't. I keep my gallery where nobody comes."},{"who":"NIGHT TOBBLE","text":"A coin an arrow. Grandpa's rule. I left the family. Not the rule."},{"who":"NIGHT TOBBLE","text":"If you see him again... tell him I said hello."}];

STORY["DEEP_after"] = [{"who":"FLICK","text":"The air's gone still. Like someone is holding their breath."}];

BOSS_LINES.nyx["form_ice"] = {"who":"NYX","text":"Icefang wanted things still. I gave him a hundred quiet years."};
BOSS_LINES.nyx["flick_ice"] = {"who":"FLICK","text":"Blue now, cold as Icefang! Ice arrows!"};
BOSS_LINES.nyx["form_stone"] = {"who":"NYX","text":"Rockjaw wanted one place no one could move him. I gave him one."};

BOSS_LINES.nyx["open"] = {"who":"FLICK","text":"Her shield's down! Now!"};
BOSS_LINES.nyx["wrong_1"] = {"who":"FLICK","text":"That arrow just bounced! Match her colour: the same seal, held long."};
BOSS_LINES.nyx["wrong_2"] = {"who":"FLICK","text":"Match her colour!"};
BOSS_LINES.nyx["wrong_3"] = {"who":"FLICK","text":"Same colour seal. Heavy arrow."};

// Boot.
// Turn-your-phone screen (shown by CSS whenever the screen is portrait, once the game is ready): dressed with the
// title art and logo when they exist.
{
  const rot = document.getElementById("rotate"), art = LAYER_SRC["TITLE:far"], logo = PROP_SRC.logo;
  if (rot && art) { rot.style.backgroundImage = `linear-gradient(rgba(20,18,16,0.55), rgba(20,18,16,0.85)), url(${art})`; rot.classList.add("art"); }
  if (rot && logo) { const im = document.createElement("img"); im.src = logo; im.alt = "The Five Seals"; im.className = "rot-logo"; im.style.width = "78vw"; im.style.maxWidth = "380px"; rot.prepend(im); }
}
go(TitleScene());
cloudInit(() => { go(TitleScene()); toast.show("Progress loaded from your account", 2.6); }); // (the claude.ai test build only: see cloudInit)
requestAnimationFrame(frame);
// loading screen → game: wait for every picture (the public build loads them as side files art/*: Pulse Kart), with
// the bar showing real progress; a picture that fails or a slow line never blocks: go on after 25 s regardless
{
  const done = () => { document.documentElement.classList.add("ready"); const b = document.getElementById("boot"); if (b) { b.classList.add("gone"); setTimeout(() => b.remove(), 450); } };
  const all = [LAYER_IMG, PROP_IMG, SPRITE_IMG, PORTRAITS, REVIEW_LAYER_IMG, REVIEW_PROP_IMG, REVIEW_IMG].flatMap(o => Object.values(o || {}));
  const bar = document.querySelector("#boot .boot-bar i"), settled = im => im.complete, t0 = performance.now();
  if (bar && all.some(im => !settled(im))) { bar.style.animation = "none"; bar.style.width = "4%"; }
  const check = () => {
    const n = all.filter(settled).length;
    if (bar && bar.style.animation === "none") bar.style.width = Math.max(4, Math.round(100 * n / Math.max(1, all.length))) + "%";
    if (n >= all.length || performance.now() - t0 > 25000) { const title = LAYER_IMG["TITLE:far"]; (title && title.decode ? title.decode().catch(() => {}) : Promise.resolve()).then(done); return; }
    setTimeout(check, 100);
  };
  if (TEST_MODE) window.__bootArt = () => ({ total: all.length, done: all.filter(settled).length });
  check();
}
if (TEST_MODE) { window.__drawHeroPlaceholder = (g, x, y) => SPRITE_PLACEHOLDER.hero.fn(g, x, y, {}); window.__drawReview = (g, id, x, y, o, scale) => { const f = artPreviewForce; artPreviewForce = true; drawSprite(g, id, x, y, { ...o, scale }); artPreviewForce = f; }; }
