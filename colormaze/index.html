for(let attempt=0;attempt<18000;attempt++){let head=[Math.floor(random()*w),Math.floor(random()*h)],d=DIRS[Math.floor(random()*4)];if(!inMask(...head,w,h,shape)||occupied.has(key(head)))continue;let ray=new Set(),clear=true;for(let k=1;k<=Math.max(w,h);k++){let q=[head[0]+d[0]*k,head[1]+d[1]*k];if(q[0]<0||q[0]>=w||q[1]<0||q[1]>=h)break;ray.add(key(q));if(occupied.has(key(q))){clear=false;break;}}if(!clear)continue;let body=[head],used=new Set([key(head)]),target=3+Math.floor(random()*(n<3?7:13));let back=[head[0]-d[0],head[1]-d[1]];if(!inMask(...back,w,h,shape)||occupied.has(key(back)))continue;body.push(back);used.add(key(back));for(let j=2;j<target;j++){let prev=body[body.length-1],choices=DIRS.map(v=>[prev[0]+v[0],prev[1]+v[1]]).filter(q=>inMask(...q,w,h,shape)&&!used.has(key(q))&&!occupied.has(key(q))&&!ray.has(key(q)));if(!choices.length)break;let q=choices[Math.floor(random()*choices.length)];body.push(q);used.add(key(q));}if(body.length<2)continue;body.reverse();body.forEach(q=>occupied.add(key(q)));out.push({id:out.length,points:body,color:PALETTE[Math.floor(random()*PALETTE.length)]});}
// Densify empty pockets by extending tails, preserving reverse-order solvability.
for(let pass=0;pass<4;pass++)for(let i=out.length-1;i>=0;i--){let a=out[i],forbidden=new Set();for(let j=i;j<out.length;j++){let b=out[j],tip=b.points[b.points.length-1],v=direction(b.points);for(let k=1;k<=Math.max(w,h);k++){let q=[tip[0]+v[0]*k,tip[1]+v[1]*k];if(q[0]<0||q[0]>=w||q[1]<0||q[1]>=h)break;forbidden.add(key(q));}}for(let step=0;step<8;step++){let tail=a.points[0],choices=DIRS.map(v=>[tail[0]+v[0],tail[1]+v[1]]).filter(q=>inMask(...q,w,h,shape)&&!occupied.has(key(q))&&!forbidden.has(key(q)));if(!choices.length)break;let q=choices[Math.floor(random()*choices.length)];a.points.unshift(q);occupied.add(key(q));}}
return{w,h,paths:out,shape};}
const boardCache=new Map();
function generate(n){if(!boardCache.has(n)){let best=null,score=-1;for(let v=0;v<8;v++){let g=generateCandidate(n,v),count=g.paths.reduce((sum,a)=>sum+a.points.length,0);if(count>score){score=count;best=g;}}boardCache.set(n,best);}return JSON.parse(JSON.stringify(boardCache.get(n)));}
function obstacle(a,active=paths){let head=a.points[a.points.length-1],d=direction(a.points),best=Infinity,blocker=null;for(let b of active){if(b.id===a.id)continue;for(let q of b.points){let dx=q[0]-head[0],dy=q[1]-head[1],dist=dx*d[0]+dy*d[1];if(dx*d[1]-dy*d[0]===0&&dist>0&&dist<best){best=dist;blocker=b.id;}}}return{distance:best,id:blocker};}
function save(){sessions[level]={removed:[...removed],mistakes,hints};try{localStorage.setItem(KEY,JSON.stringify({version:1,boardRevision:3,level,unlocked,removed,mistakes,hints,prefs,completed,sessions}));}catch{}}
function load(n,restore){view="game";$("gallery").hidden=true;$("game").hidden=false;level=Math.max(1,Math.min(30,n));let g=generate(level);cols=g.w;rows=g.h;paths=g.paths;total=paths.length;removed=restore?.removed?.filter(id=>Number.isInteger(id)&&id>=0&&id<total)||[];paths=paths.filter(p=>!removed.includes(p.id));mistakes=restore?.mistakes||0;hints=restore?.hints||0;history=[];anim=null;hintId=-1;zoom=1;pan={x:0,y:0};$('title').textContent=PUZZLES[level-1].name;$('levelText').textContent='LEVEL '+String(level).padStart(2,'0');say('Tap a line. Its arrowhead points the way out.');update();resize();save();if(!paths.length)win();else if(prefs.challenge&&mistakes>=3)lost();}
function update(){$('remaining').textContent=paths.length;$('total').textContent=' / '+total;$('progress').style.width=(100*(total-paths.length)/total)+'%';$('modeLabel').textContent=prefs.challenge?'♥'.repeat(Math.max(0,3-mistakes))+' · challenge':'arrows remaining';$('undo').disabled=!history.length||!!anim;$('hint').disabled=!!anim||!paths.length;$('restart').disabled=!!anim;}
function say(t){$('message').textContent=t;}
function tone(good){if(!prefs.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type='sine';o.frequency.setValueAtTime(good?660:180,audio.currentTime);o.frequency.exponentialRampToValueAtTime(good?990:110,audio.currentTime+.13);g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.start();o.stop(audio.currentTime+.2);}catch{}}
function tap(a){if(anim||!$('overlay').hidden)return;hintId=-1;let b=obstacle(a),good=!isFinite(b.distance),d=direction(a.points),head=a.points.at(-1);let edge=d[0]>0?cols-head[0]:d[0]<0?head[0]+1:d[1]>0?rows-head[1]:head[1]+1;let distance=good?a.points.length+edge+2:Math.max(.08,b.distance-.72);anim={id:a.id,start:performance.now(),good,distance,duration:prefs.reduced?120:good?Math.min(1800,350+distance*28):Math.min(800,330+distance*35),blocker:b.id};tone(good);say(good?'Making room…':'Another line is in the way.');update();}
function finish(){let a=anim;anim=null;if(a.good){history.push({id:a.id,mistakes});removed.push(a.id);paths=paths.filter(p=>p.id!==a.id);say('A little more breathing room.');}else{mistakes++;say(prefs.challenge?'Blocked — one heart lost.':'Blocked. Clear the line in front first.');}save();update();if(!paths.length)win();else if(prefs.challenge&&mistakes>=3)lost();}
function pointAt(p,t){let len=p.length-1;if(t>=len){let d=direction(p),h=p[len];return[h[0]+(t-len)*d[0],h[1]+(t-len)*d[1]];}let i=Math.max(0,Math.floor(t)),f=t-i;return[p[i][0]*(1-f)+p[i+1][0]*f,p[i][1]*(1-f)+p[i+1][1]*f];}
function shifted(p,s){let len=p.length-1,out=[pointAt(p,s)];for(let i=Math.floor(s)+1;i<len&&i<s+len;i++)out.push(p[i]);out.push(pointAt(p,s+len));return out;}
function resize(){let r=canvas.getBoundingClientRect();width=r.width;height=r.height;let dpr=Math.min(devicePixelRatio||1,3);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);unit=Math.min((width-22)/(cols+1),(height-26)/(rows+1));}
function transform(){let s=unit*zoom;ox=(width-(cols-1)*s)/2+pan.x;oy=(height-(rows-1)*s)/2+pan.y;return s;}
function draw(now){if(view==='gallery'){requestAnimationFrame(draw);return;}ctx.clearRect(0,0,width,height);let s=transform();ctx.fillStyle='#1d2437';for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){ctx.beginPath();ctx.arc(ox+x*s,oy+y*s,.9,0,Math.PI*2);ctx.fill();}let complete=false;for(let a of paths){let offset=0,color=a.color,glow=false;if(anim&&a.id===anim.id){let t=Math.min(1,(now-anim.start)/anim.duration);offset=anim.good?anim.distance*t:anim.distance*Math.sin(Math.PI*t);if(!anim.good)color='#ff747f';if(t===1)complete=true;}if(a.id===hintId&&now<hintUntil)glow=true;let p=shifted(a.points,offset),head=p.at(-1),d=direction(a.points);ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=Math.max(2,s*.32);ctx.lineCap='round';ctx.lineJoin='round';if(glow){ctx.shadowColor=color;ctx.shadowBlur=18;ctx.globalAlpha=.65+.35*Math.sin(now/140);}ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(ox+q[0]*s,oy+q[1]*s):ctx.moveTo(ox+q[0]*s,oy+q[1]*s));ctx.stroke();let hx=ox+head[0]*s,hy=oy+head[1]*s;ctx.beginPath();ctx.moveTo(hx+d[0]*s*.24,hy+d[1]*s*.24);ctx.lineTo(hx-d[0]*s*.22-d[1]*s*.24,hy-d[1]*s*.22+d[0]*s*.24);ctx.lineTo(hx-d[0]*s*.22+d[1]*s*.24,hy-d[1]*s*.22-d[0]*s*.24);ctx.closePath();ctx.fill();ctx.restore();}if(complete)finish();requestAnimationFrame(draw);}
function show(html){lastFocus=document.activeElement;$('panel').innerHTML=html;$('overlay').hidden=false;$('panel').querySelector('button,input,select')?.focus();}
function close(){$('overlay').hidden=true;lastFocus?.focus();}
function win(){if(!completed.includes(level))completed.push(level);unlocked=Math.max(unlocked,Math.min(30,level+1));save();show('<div class="badge">✧</div><div class="level">MAZE COMPLETE</div><h2 id="dialogTitle">Room to breathe.</h2><p>Every arrow found its way.<br>'+mistakes+' blocked taps · '+hints+' hints used</p><button class="primary" id="next">'+(level===30?'Back to level 1':'Next maze →')+'</button><button class="primary secondary" id="galleryWin">Puzzle gallery</button><button class="primary secondary" id="replay">Play this maze again</button>');$('next').onclick=()=>{close();load(level===30?1:level+1);};$('galleryWin').onclick=()=>{close();openGallery();};$('replay').onclick=()=>{close();load(level);};}
function lost(){show('<div class="badge">↶</div><h2 id="dialogTitle">Take another look.</h2><p>Three blocked taps used your hearts. Try the same maze again, or switch to relaxed play for unlimited attempts.</p><button class="primary" id="retry">Try again</button><button class="primary secondary" id="relax">Continue in relaxed mode</button>');$('retry').onclick=()=>{close();load(level);};$('relax').onclick=()=>{prefs.challenge=false;close();update();save();};}
$('hint').onclick=()=>{if(anim)return;let a=paths.find(p=>!isFinite(obstacle(p).distance));if(a){hints++;hintId=a.id;hintUntil=performance.now()+3500;say('Follow the glowing arrow — its exit is clear.');save();}};
$('undo').onclick=()=>{if(anim||!history.length)return;let last=history.pop();removed=removed.filter(id=>id!==last.id);paths=generate(level).paths.filter(p=>!removed.includes(p.id));mistakes=last.mistakes;save();update();say('Last arrow restored.');};
$('restart').onclick=()=>{if(anim)return;show('<h2 id="dialogTitle">Start this maze over?</h2><p>Your level progress is kept. This board will reset.</p><button class="primary" id="yes">Restart maze</button><button class="primary secondary" id="no">Keep playing</button>');$('yes').onclick=()=>{close();load(level);};$('no').onclick=close;};
$('settings').onclick=()=>{if(anim)return;show('<div class="level">MAKE YOURSELF AT HOME</div><h2 id="dialogTitle">Your kind of calm.</h2><label class="row">Sound<input id="soundToggle" type="checkbox" '+(prefs.sound?'checked':'')+'></label><label class="row">Reduced motion<input id="motionToggle" type="checkbox" '+(prefs.reduced?'checked':'')+'></label><label class="row">Play mode<select id="playMode"><option value="relaxed">Relaxed</option><option value="challenge">3-heart challenge</option></select></label><p class="small">Tap anywhere on a line. The head travels straight; its tail follows the bends. Clear its exit before tapping. All colors obey the same rules.</p><p class="small">Pinch to zoom, or use + / −. Drag to pan when zoomed. ⌖ fits the board. Progress saves on this browser.</p><button class="primary" id="done">Back to the maze</button>');$('playMode').value=prefs.challenge?'challenge':'relaxed';$('done').onclick=()=>{let challenge=$('playMode').value==='challenge';if(challenge!==prefs.challenge)mistakes=0;prefs={sound:$('soundToggle').checked,reduced:$('motionToggle').checked,challenge};close();update();save();};};
function silhouette(n){let p=PUZZLES[n-1];return '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="'+p.poly.map(q=>q.join(',')).join(' ')+'" fill="currentColor"/></svg>';}
function openGallery(){if(anim)return;save();view='gallery';$('game').hidden=true;$('gallery').hidden=false;$('galleryProgress').textContent=completed.length+' / 30 puzzles complete';$('puzzleCards').innerHTML='';for(let n=1;n<=30;n++){let p=PUZZLES[n-1],locked=n>unlocked,done=completed.includes(n),current=n===unlocked&&!done,b=document.createElement('button');b.className='puzzle-card '+(locked?'locked':done?'completed':current?'active':'available');b.disabled=locked;b.setAttribute('aria-label','Level '+n+': '+p.name+', '+(locked?'locked':done?'completed, replay':current?'current puzzle':'available'));b.innerHTML='<div class="card-top"><span>'+String(n).padStart(2,'0')+'</span><span>'+(locked?'Locked':done?'✓ Complete':current?'Play next':'Play')+'</span></div>'+silhouette(n)+'<strong>'+p.name+'</strong><small>'+p.category+'</small>';b.onclick=()=>{let resume=completed.includes(n)?null:sessions[n];load(n,resume);};$('puzzleCards').appendChild(b);}window.scrollTo?.(0,0);}
$('levelButton').onclick=openGallery;$('galleryBack').onclick=openGallery;
function setZoom(z){zoom=Math.max(1,Math.min(3,z));if(zoom===1)pan={x:0,y:0};else{pan.x=Math.max(-width*(zoom-1)/2,Math.min(width*(zoom-1)/2,pan.x));pan.y=Math.max(-height*(zoom-1)/2,Math.min(height*(zoom-1)/2,pan.y));}}
$('zoomIn').onclick=()=>setZoom(zoom+.4);$('zoomOut').onclick=()=>setZoom(zoom-.4);$('fit').onclick=()=>setZoom(1);
let pointers=new Map(),gesture=null;
canvas.addEventListener('pointerdown',e=>{if(anim)return;canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)gesture={x:e.clientX,y:e.clientY,pan:{...pan},moved:false};else if(pointers.size===2){let a=[...pointers.values()];gesture={pinch:true,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),z:zoom,moved:true};}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!gesture)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&gesture.pinch){let a=[...pointers.values()];setZoom(gesture.z*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/Math.max(1,gesture.d));}else if(!gesture.pinch){let dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.hypot(dx,dy)>8)gesture.moved=true;if(zoom>1){pan={x:gesture.pan.x+dx,y:gesture.pan.y+dy};setZoom(zoom);}}});
function pick(x,y){let s=transform(),best=null,dist=Infinity;for(let a of paths){let p=a.points;for(let i=1;i<p.length;i++){let ax=ox+p[i-1][0]*s,ay=oy+p[i-1][1]*s,bx=ox+p[i][0]*s,by=oy+p[i][1]*s,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy))),dd=Math.hypot(x-ax-t*dx,y-ay-t*dy);if(dd<dist){dist=dd;best=a;}}}return dist<Math.max(9,s*.43)?best:null;}
canvas.addEventListener('pointerup',e=>{if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(gesture&&!gesture.moved&&!gesture.pinch&&!anim){let r=canvas.getBoundingClientRect(),a=pick(e.clientX-r.left,e.clientY-r.top);if(a)tap(a);}if(!pointers.size)gesture=null;});canvas.addEventListener('pointercancel',()=>{pointers.clear();gesture=null;});
$('overlay').addEventListener('keydown',e=>{if(e.key!=='Tab')return;let f=[...$('panel').querySelectorAll('button:not(:disabled),input,select')],first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}});
let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY));if(saved?.version===1){prefs={...prefs,...saved.prefs};unlocked=Math.max(1,Math.min(30,saved.unlocked||1));completed=Array.isArray(saved.completed)?saved.completed.filter(n=>Number.isInteger(n)&&n>=1&&n<=30):Array.from({length:unlocked-1},(_,i)=>i+1);sessions=saved.sessions||{};}else saved=null;}catch{}if(saved&&saved.boardRevision!==3){sessions={};if(saved.level>2)saved={...saved,removed:[],mistakes:0,hints:0};}load(saved?.level||1,saved);$('overlay').hidden=true;openGallery();new ResizeObserver(resize).observe($('board'));requestAnimationFrame(draw);
</script></body></html>
