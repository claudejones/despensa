/* ---------------------------------------------------------------
   YEAR GRID — iOS-Calendar-style year view, opened by tapping the
   month/year label in Monthly's subhead. Reuses the same bottom sheet as
   every other dialog, just with a 12-tile grid instead of a form.
--------------------------------------------------------------- */
function openYearGridSheet(year){
  const dlg = document.getElementById("dlg");
  const body = document.getElementById("dlgBody");
  const curYear = yearOfYM(ui.ym);
  const curMonth = monthOfYM(ui.ym);
  const todayYMval = todayYM();

  const tiles = MONTHS.map((mn,i)=>{
    const ym = ymOf(year, i);
    const isCurrent = year===curYear && i===curMonth;
    const isToday = ym===todayYMval;
    const isSeeded = isMonthSeeded(ym);
    // An unconfigured PAST month reads as quiet history (no dashed border,
    // no "not set up" flag) — only a current/future unconfigured month is
    // still a pending setup task worth flagging.
    const isPast = ym < todayYMval;
    const unsetClass = isSeeded ? "" : (isPast ? "unset-past" : "unset");
    return `
      <button type="button" class="monthtile ${isCurrent?"active":""} ${isToday?"today":""} ${unsetClass}" data-ym="${ym}">
        <span>${mn}</span>
        ${isSeeded ? `<span class="monthtile-dot"></span>` : `<span class="monthtile-unset">${isPast?"no data":"not set up"}</span>`}
      </button>
    `;
  }).join("");

  const { minYear, maxYear } = yearNavBounds();
  body.innerHTML = `
    <div class="row" style="align-items:center">
      <button class="navbtn" id="ygPrev" aria-label="Previous year" ${year<=minYear?"disabled":""}>‹</button>
      <h3 style="flex:1; text-align:center; margin:0">${year}</h3>
      <button class="navbtn" id="ygNext" aria-label="Next year" ${year>=maxYear?"disabled":""}>›</button>
    </div>
    <div class="yeargrid">${tiles}</div>
    <div class="dialog-actions"><button class="btn ghost" id="ygClose">Close</button></div>
  `;
  body.querySelector("#ygPrev").onclick = ()=>{ if(year>minYear) openYearGridSheet(year-1); };
  body.querySelector("#ygNext").onclick = ()=>{ if(year<maxYear) openYearGridSheet(year+1); };
  body.querySelector("#ygClose").onclick = ()=> dlg.close();
  body.querySelectorAll("[data-ym]").forEach(btn=>{
    btn.onclick = ()=>{
      ui.ym = parseInt(btn.dataset.ym,10);
      dlg.close();
      render();
    };
  });
  openSheet();
}

// Annual Outlook's own picker — year only, no month tiles, since Outlook
// has no per-month concept. Reuses the same bottom sheet and .yeargrid/
// .monthtile styling as the Year Grid, just with a 12-year window
// instead of 12 months, centered on `year` and shiftable a window at a
// time via the same ‹/› controls.
function openYearOnlySheet(year){
  const dlg = document.getElementById("dlg");
  const body = document.getElementById("dlgBody");
  const curYear = yearOfYM(ui.ym);
  const todayYear = yearOfYM(todayYM());
  const { minYear, maxYear } = yearNavBounds();
  const windowStart = year - 5;

  const tiles = Array.from({length:12}, (_,i)=> windowStart + i).map(y=>{
    const inBounds = y>=minYear && y<=maxYear;
    const isCurrent = y===curYear;
    const isToday = y===todayYear;
    return `
      <button type="button" class="monthtile ${isCurrent?"active":""} ${isToday?"today":""}" data-year="${y}" ${inBounds?"":"disabled"}>
        <span>${y}</span>
      </button>
    `;
  }).join("");

  body.innerHTML = `
    <div class="row" style="align-items:center">
      <button class="navbtn" id="ygPrev" aria-label="Earlier years" ${windowStart<=minYear?"disabled":""}>‹</button>
      <h3 style="flex:1; text-align:center; margin:0">${windowStart}–${windowStart+11}</h3>
      <button class="navbtn" id="ygNext" aria-label="Later years" ${windowStart+11>=maxYear?"disabled":""}>›</button>
    </div>
    <div class="yeargrid">${tiles}</div>
    <div class="dialog-actions"><button class="btn ghost" id="ygClose">Close</button></div>
  `;
  body.querySelector("#ygPrev").onclick = ()=>{ if(windowStart>minYear) openYearOnlySheet(year-12); };
  body.querySelector("#ygNext").onclick = ()=>{ if(windowStart+11<maxYear) openYearOnlySheet(year+12); };
  body.querySelector("#ygClose").onclick = ()=> dlg.close();
  body.querySelectorAll("[data-year]:not(:disabled)").forEach(btn=>{
    btn.onclick = ()=>{
      const y = parseInt(btn.dataset.year,10);
      ui.ym = ymOf(y, monthOfYM(ui.ym));
      dlg.close();
      render();
    };
  });
  openSheet();
}

/* ---------------------------------------------------------------
   RENDER: CATEGORIES
--------------------------------------------------------------- */
function renderCategories(main){
  const ym = ui.ym;
  const wrap = el("div","stack");

  const allCats = state.categories.slice().sort((a,b)=>a.order-b.order);
  // "Global" = no onlyYM, or onlyYM pointing at some OTHER month — it still
  // shows in the normal list everywhere except its own scoped month.
  const globalCats = allCats.filter(c=> c.onlyYM !== ym);
  const monthCats = allCats.filter(c=> c.onlyYM === ym);

  const globalList = el("div","card stack");
  // Same section-title + "+" pattern as Monthly's "Allocated by category"
  // card — the action lives on the card it actually adds to, not in the
  // Target/Allocated/Unallocated summary above, which never said what it
  // was for.
  const header = el("div","section-title");
  header.innerHTML = `
    <div class="eyebrow">Categories</div>
    <button class="infobtn accent" type="button" id="catAddBtn" aria-label="New category" style="font-size:18px; line-height:1">+</button>
  `;
  header.querySelector("#catAddBtn").onclick = ()=> openCategoryDialog(ym);
  globalList.appendChild(header);
  if(!globalCats.length) globalList.appendChild(el("div","empty","No categories yet — tap + to add one."));
  globalCats.forEach(c=> globalList.appendChild(renderCategoryRow(c, ym, globalCats)));
  wrap.appendChild(globalList);

  if(monthCats.length){
    const divider = el("div","list-divider");
    divider.innerHTML = `<div class="eyebrow">This month only</div>`;
    wrap.appendChild(divider);
    const monthList = el("div","card stack");
    monthCats.forEach(c=> monthList.appendChild(renderCategoryRow(c, ym, monthCats)));
    wrap.appendChild(monthList);
  }

  main.appendChild(wrap);
}

// The next `order` value for a newly created or duplicated category.
// NOT state.categories.length — once any category has ever been deleted,
// length no longer equals max(order)+1, so new categories collide with an
// existing order value and the up/down reorder swap (moveCategory) breaks
// for whichever pair shares a value. Always one past the current max instead.
function nextCategoryOrder(){
  return state.categories.reduce((max,c)=> Math.max(max, c.order||0), -1) + 1;
}

// Swaps `cat`'s `order` with its neighbor in `dir` (-1 = up, +1 = down)
// within `siblings` — the same-section list (global or "this month only")
// it belongs to, so a move never jumps a category across sections (that's
// what "Promote to master" is for). Persists both affected rows immediately
// and re-renders so the new order is visible right away.
async function moveCategory(cat, dir, siblings){
  const i = siblings.indexOf(cat);
  const j = i + dir;
  if(i<0 || j<0 || j>=siblings.length) return;
  const other = siblings[j];
  const tmp = cat.order;
  cat.order = other.order;
  other.order = tmp;
  await dbSet("categories", cat.id, cat);
  await dbSet("categories", other.id, other);
  render();
}

function categorySummaryAmount(c, ym){
  return c.baseAmountUSD || 0;
}

// One clean tap target per category. No inline inputs — tapping opens the
// detail sheet, which is where everything (amount, payment type, advanced
// schedule, delete) actually lives. `siblings` is the same-section list
// (global or "this month only") this row's up/down buttons reorder within.
function renderCategoryRow(c, ym, siblings){
  const items = state.lineitems.filter(li=>li.categoryId===c.id);
  const amt = categorySummaryAmount(c, ym);
  const idx = siblings.indexOf(c);
  // A div, not a button — it hosts its own nested up/down + "+" buttons
  // (per-row add, consistent with Monthly's per-row add) alongside the
  // row's main tap target, and a button can't validly contain another button.
  const row = el("div","setuprow");
  row.setAttribute("role","button");
  row.tabIndex = 0;
  // One meta-note span, always — folding "Excluded by default" into
  // whatever this line already says (instead of adding a second stacked
  // span) means toggling it only ever changes text, never row height. The
  // name-wrap column stacks every child of its own on a new line, so a
  // second span here was the actual cause of the jump when this was tried
  // as its own line.
  const metaBase = items.length===1 ? paymentLabel(items[0].paymentMethod)
    : items.length>1 ? `${items.length} items`
    : "Not set";
  const metaClass = items.length===1 ? paymentMetaClass(items[0].paymentMethod) : "mm-neutral";
  const meta = c.excludedDefault
    ? `<span class="meta-note" style="color:var(--accent)">${metaBase} · Excluded by default</span>`
    : `<span class="meta-note ${metaClass}">${metaBase}</span>`;
  row.innerHTML = `
    <span class="movebtns">
      <button class="movebtn" type="button" data-up aria-label="Move ${escapeHtml(c.name)} up" ${idx<=0?"disabled":""}>${iconChevronUp()}</button>
      <button class="movebtn" type="button" data-down aria-label="Move ${escapeHtml(c.name)} down" ${idx>=siblings.length-1?"disabled":""}>${iconChevronDown()}</button>
    </span>
    <span class="name-wrap">
      <span class="name">${c.name}</span>
      ${meta}
    </span>
    <span class="amt num" style="color:${amt<0?'var(--bad)':'inherit'}">${fmtUSD(amt)}</span>
    <span class="rowchev" aria-hidden="true">${iconChevronRight()}</span>
  `;
  // Content dims, controls stay at full strength (same as Monthly's Excluded
  // rows) — the meta line above already says why.
  if(c.excludedDefault) row.classList.add("is-excluded");
  row.onclick = ()=> openCategoryDetailSheet(c.id, ym);
  row.onkeydown = (ev)=>{ if(ev.key==="Enter" || ev.key===" "){ ev.preventDefault(); openCategoryDetailSheet(c.id, ym); } };
  row.querySelector("[data-up]").onclick = (ev)=>{
    ev.stopPropagation();
    moveCategory(c, -1, siblings);
  };
  row.querySelector("[data-down]").onclick = (ev)=>{
    ev.stopPropagation();
    moveCategory(c, 1, siblings);
  };
  return row;
}

// Budget Setup's item list for a category — these are planned recurring
// items only (Target/Allocated). Actual spend is logged separately, in
// Monthly.
function openCategoryDetailSheet(categoryId, ym){
  const dlg = document.getElementById("dlg");
  const body = document.getElementById("dlgBody");
  const c = state.categories.find(x=>x.id===categoryId);
  const mIdx = monthOfYM(ym);
  const rate = yearSettings(yearOfYM(ym)).baseRate;
  const items = state.lineitems.filter(li=>li.categoryId===categoryId);
  const target = roundCents(c.baseAmountUSD || 0);
  const planned = categoryPlannedForMonth(c.id, ym);
  const unallocated = roundCents(target - planned);

  const itemRows = items.length ? items.map(li=>{
    const amt = toUSD(li.schedule[mIdx]||0, li.currency, li.rate||rate);
    const freq = freqLabel(li.frequency);
    // A month-only item (onlyYM) only ever applies to the one (year, month)
    // it was created for — call that out here, since it otherwise looks
    // like an ordinary recurring item everywhere else it's listed.
    const onlyNote = li.onlyYM ? `Only ${MONTHS[monthOfYM(li.onlyYM)]} ${yearOfYM(li.onlyYM)}` : "";
    const meta = [paymentLabel(li.paymentMethod), freq, onlyNote].filter(Boolean).join(" · ");
    // A div, not a button — it hosts its own nested edit/delete icon
    // buttons alongside the row's main tap target, and a button can't
    // validly contain another button (same pattern as renderCategoryRow).
    return `
      <div class="setuprow" role="button" tabindex="0" data-item="${li.id}">
        <span class="name-wrap">
          <span class="name">${escapeHtml(li.name)}</span>
          <span class="meta-note ${paymentMetaClass(li.paymentMethod)}">${meta}</span>
        </span>
        <span class="amt num">${fmtUSD(amt)}</span>
        <span class="rowchev" aria-hidden="true">${iconChevronRight()}</span>
      </div>
    `;
  }).join("") : `<div class="empty">No expenses yet — add what makes up ${escapeHtml(c.name)}.</div>`;

  body.innerHTML = `
    <h3>Edit Category</h3>
    <label>Name<input type="text" id="dName" value="${escapeHtml(c.name)}" placeholder="e.g. Pet care"></label>
    <label>Amount (USD)<input type="number" inputmode="decimal" step="0.01" id="dAmount" value="${(c.baseAmountUSD||0).toFixed(2)}"></label>
    <label class="sheet-row" style="flex-direction:row; align-items:center; gap:10px; background:var(--surface-2); border-radius:10px; padding:10px 12px">
      <input type="checkbox" id="dExcluded" style="width:auto" ${c.excludedDefault?"checked":""}>
      <span style="flex:1">
        <span style="display:block">Exclude from totals by default</span>
        <span class="muted" style="font-size:12px; display:block">New months will start ${escapeHtml(c.name)} Excluded — override per month anytime. Already-set-up months aren't changed retroactively.</span>
      </span>
    </label>
    <p class="muted" id="dSummaryLine">Budget: <strong class="num">${fmtUSD(target)}</strong> · Planned <strong class="num">${fmtUSD(planned)}</strong> · Unallocated <strong class="num" style="color:${unallocated<0?'var(--bad)':'inherit'}">${fmtUSD(unallocated)}</strong></p>
    <div class="stack" id="dItems" style="gap:0">${itemRows}</div>
    <button class="btn accent block" id="dAddItem">${iconPlus()}<span>Add Expense</span></button>
    ${c.onlyYM ? `<div class="danger-zone"><button class="btn small block" id="dPromote">Also add to master Budget Setup</button></div>` : ""}
    <div class="danger-zone" style="display:flex; gap:10px">
      <button class="btn small ghost" id="dDuplicate">${iconCopy()}<span>Duplicate category</span></button>
      <button class="btn small danger" id="dDelCat">${iconTrash()}<span>Delete category</span></button>
    </div>
    <div class="dialog-actions">
      <button class="btn ghost" id="dClose">Cancel</button>
      <button class="btn primary" id="dSave">Save</button>
    </div>
  `;
  // Duplicate should only ever clone the last-SAVED category — disable it
  // the moment Name/Amount have unsaved edits, same pattern as the line
  // item dialog's Duplicate.
  let formDirty = false;
  function markDirty(){
    if(formDirty) return;
    formDirty = true;
    const dupBtn = body.querySelector("#dDuplicate");
    if(dupBtn) dupBtn.disabled = true;
  }
  body.querySelector("#dName").addEventListener("input", markDirty);
  body.querySelector("#dExcluded").addEventListener("change", markDirty);
  // Live recompute — Budget/Unallocated previously only reflected a new
  // Amount after Save closed and reopened this sheet.
  body.querySelector("#dAmount").addEventListener("input", (ev)=>{
    markDirty();
    const newTarget = roundCents(parseFloat(ev.target.value||"0") || 0);
    const newUnallocated = roundCents(newTarget - planned);
    body.querySelector("#dSummaryLine").innerHTML = `Budget: <strong class="num">${fmtUSD(newTarget)}</strong> · Planned <strong class="num">${fmtUSD(planned)}</strong> · Unallocated <strong class="num" style="color:${newUnallocated<0?'var(--bad)':'inherit'}">${fmtUSD(newUnallocated)}</strong>`;
  });
  // Has Name / Amount / Exclude-by-default changed versus what's saved?
  function hasPendingEdits(){
    const nameField = body.querySelector("#dName");
    if(!nameField) return false;
    return nameField.value.trim() !== (c.name||"")
      || roundCents(parseFloat(body.querySelector("#dAmount").value||"0") || 0) !== roundCents(c.baseAmountUSD||0)
      || body.querySelector("#dExcluded").checked !== !!c.excludedDefault;
  }
  // Same fields and blank-Name rule as the Save button; false = didn't save.
  async function savePendingEdits(){
    const name = body.querySelector("#dName").value.trim();
    if(!name){ formError(body, "Enter a name.", body.querySelector("#dName")); return false; }
    c.name = name;
    c.baseAmountUSD = parseFloat(body.querySelector("#dAmount").value||"0") || 0;
    c.excludedDefault = body.querySelector("#dExcluded").checked;
    await dbSet("categories", c.id, c);
    render();
    return true;
  }
  // Opens an expense straight away when nothing changed; otherwise asks
  // whether to save first (Cancel/Save in the expense return to this sheet).
  const openItem = (li)=>{
    if(!hasPendingEdits()){ openLineItemDialog(categoryId, li, ym); return; }
    promptSaveBeforeContinue(body, async ()=>{
      if(!(await savePendingEdits())) return false;
      openLineItemDialog(categoryId, li, ym);
    });
  };
  body.querySelectorAll("[data-item]").forEach(row=>{
    row.onclick = ()=> openItem(items.find(x=>x.id===row.dataset.item));
    row.onkeydown = (ev)=>{
      if(ev.key==="Enter" || ev.key===" "){
        ev.preventDefault();
        openItem(items.find(x=>x.id===row.dataset.item));
      }
    };
  });
  onceClick(body.querySelector("#dSave"), async ()=>{
    const name = body.querySelector("#dName").value.trim();
    if(!name){ formError(body, "Enter a name.", body.querySelector("#dName")); return; }
    const amount = parseFloat(body.querySelector("#dAmount").value||"0") || 0;
    c.name = name;
    c.baseAmountUSD = amount;
    c.excludedDefault = body.querySelector("#dExcluded").checked;
    await dbSet("categories", c.id, c);
    dlg.close();
    showToast(`Updated ${name}`);
    render();
  });
  body.querySelector("#dAddItem").onclick = ()=> openItem(null);
  if(c.onlyYM){
    body.querySelector("#dPromote").onclick = async ()=>{
      delete c.onlyYM;
      await dbSet("categories", c.id, c);
      showToast(`${c.name} added to Budget Setup for every month`);
      render();
      openCategoryDetailSheet(categoryId, ym);
    };
  }
  onceClick(body.querySelector("#dDuplicate"), async ()=>{
    const newId = uid("cat");
    const copy = { ...c, id: newId, name: c.name + " (copy)", order: nextCategoryOrder() };
    state.categories.push(copy);
    await dbSet("categories", newId, copy);
    const newItems = items.map(li=> ({ ...li, id: uid("li"), categoryId: newId }));
    for(const li of newItems){
      state.lineitems.push(li);
      await dbSet("lineitems", li.id, li);
    }
    showToast(`Duplicated ${c.name}`);
    render();
    openCategoryDetailSheet(newId, ym);
  });
  body.querySelector("#dDelCat").onclick = ()=> confirmAction(`Delete "${c.name}"${items.length?` and its ${items.length} expense${items.length===1?"":"s"}`:""}?`, async ()=>{
    // This only removes the TEMPLATE: the Budget Setup category itself and
    // its planning items. It never touches state.actuals or any month's
    // monthCategoryData — those were already forked into their own
    // independent copies (name/color included — see forkTemplateIntoMonth),
    // so a month that used this category keeps its real logged spend and
    // its own display info exactly as it was, with or without the template.
    // The only effect going forward is that future unconfigured months no
    // longer see this category in their Budget Setup projection.
    state.categories = state.categories.filter(x=>x.id!==c.id);
    state.lineitems = state.lineitems.filter(x=>x.categoryId!==c.id);
    await dbDelete("categories", c.id);
    for(const li of items) await dbDelete("lineitems", li.id);
    showToast(`Deleted ${c.name}`);
    render();
  }, ()=> openCategoryDetailSheet(categoryId, ym));
  body.querySelector("#dClose").onclick = ()=> dlg.close();
  openSheet();
}

// Name + a direct flat amount — creating a category no longer forces a trip
// through the full "New item" dialog just to give it a simple monthly
// number. `baseAmountUSD` is the category's whole budget, full stop —
// items added later are just planning templates and never touch it (see
// categoryBaseForMonth above).
// A new Budget Setup category is always part of the recurring template —
// a month-only category has its own dedicated flow in Monthly ("New
// category just for this month", openMonthNewLocalCategoryDialog), which
// doesn't touch state.categories at all. No "only this month" option here.

    <label>Amount (USD)<input type="number" inputmode="decimal" step="0.01" id="cAmount" placeholder="0.00"></label>

  openSheet();
}

// The item editor — name, linked USD/MXN amount, payment method, and a
// single Amount field that, by default, IS the item's one flat number —
// matching how the category's own Amount field already works, with no
// hidden per-month variation. Internally an item still stores 12 monthly
// slots (so a genuinely seasonal expense — a bigger December travel line,
// say — can still be modeled), but unless "costs a different amount in
// different months" is explicitly checked, every Save flattens all 12
// slots to the one Amount typed here. This replaced an earlier design
// where editing "the" amount silently touched only the current month's
// hidden slot (unchecked by default) — which is exactly what made the
// template look like it was randomly reverting: you were always editing
// one invisible slot among twelve, never a single flat value, and this
// screen never told you which slot that was.
const WEEKS_PER_MONTH = 52/12;
const BIWEEKS_PER_MONTH = 26/12;

function openLineItemDialog(categoryId, existing, ym){
  const dlg = document.getElementById("dlg");
  const body = document.getElementById("dlgBody");
  const mIdx = monthOfYM(ym);
  const sched = existing ? existing.schedule.slice() : new Array(12).fill(0);
  const curCurrency = existing ? existing.currency : "USD";
  const baseRate = yearSettings(yearOfYM(ym)).baseRate;
  const curRate = existing ? (existing.rate || baseRate) : baseRate;
  const curFreq = existing ? (existing.frequency || "monthly") : "monthly";
  const nativeThisMonth = existing ? (existing.schedule[mIdx]||0) : 0;
  const usdInit = curCurrency==="MXN" ? nativeThisMonth/curRate : nativeThisMonth;
  const mxnInit = curCurrency==="MXN" ? nativeThisMonth : nativeThisMonth*curRate;
  const isOnlyThisMonth = existing ? existing.onlyYM===ym : false;
  const monthLabel = `${MONTHS[mIdx]} ${yearOfYM(ym)}`;
  // Already varies by month (someone genuinely set it up that way, or it
  // drifted from the old per-slot-editing behavior) — default to the
  // "varies" state so existing data is never silently flattened out from
  // under you; a brand-new item, or one that's already flat, defaults off.
  const alreadyVaries = existing ? !sched.every(v=> v===sched[0]) : false;

  body.innerHTML = `
    <h3>${existing?"Edit":"New"} Expense</h3>
    <label>Name<input type="text" id="iName" value="${existing?escapeHtml(existing.name):""}" placeholder="e.g. Netflix"></label>
    ${currencyFieldsHTML()}
    <div class="muted" id="iPerPeriod" style="display:none"></div>
    <label>Payment method
      <select id="iPay">
        <option value="card" ${!existing||existing.paymentMethod==="card"?"selected":""}>Card</option>
        <option value="cash" ${existing&&existing.paymentMethod==="cash"?"selected":""}>Cash (ATM)</option>
        <option value="transfer" ${existing&&existing.paymentMethod==="transfer"?"selected":""}>Bank transfer</option>
        <option value="service" ${existing&&existing.paymentMethod==="service"?"selected":""}>Transfer service</option>
      </select>
    </label>
    <label>How often it actually recurs
      <select id="iFreq">
        <option value="monthly" ${curFreq==="monthly"?"selected":""}>Monthly</option>
        <option value="weekly" ${curFreq==="weekly"?"selected":""}>Weekly</option>
        <option value="biweekly" ${curFreq==="biweekly"?"selected":""}>Every 2 weeks</option>
        <option value="onetime" ${curFreq==="onetime"?"selected":""}>One-time / as needed</option>
      </select>
    </label>
    <label class="sheet-row" id="iVaryRow" style="flex-direction:row; align-items:center; gap:8px">
      <input type="checkbox" id="iVary" style="width:auto" ${alreadyVaries?"checked":""} ${isOnlyThisMonth?"disabled":""}>
      <span>Costs a different amount in different months (e.g. bigger in December) — leave unchecked for one flat amount every month</span>
    </label>
    <details class="advanced" id="iAdv" ${alreadyVaries?"open":""}>
      <summary>All 12 months</summary>
      <div class="schedule-grid" id="schedGrid"></div>
      <div class="row" style="gap:10px">
        <button class="btn small" id="iZeroAll">Zero out all months</button>
      </div>
    </details>
    ${existing && existing.onlyYM ? `<div class="danger-zone"><button class="btn small block" id="iPromote">Also add to master Budget Setup</button></div>` : ""}
    ${existing ? `<div class="danger-zone" style="display:flex; gap:10px"><button class="btn small ghost" id="iDuplicate">${iconCopy()}<span>Duplicate expense</span></button><button class="btn small danger" id="iDelete">${iconTrash()}<span>Delete expense</span></button></div>` : ""}
    <div class="dialog-actions">
      <button class="btn ghost" id="iCancel">Cancel</button>
      <button class="btn primary" id="iSave">Save</button>
    </div>
  `;
  const grid = body.querySelector("#schedGrid");
  MONTHS.forEach((mn,i)=>{
    const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="mlabel">${mn}</div><input type="number" inputmode="decimal" step="0.01" value="${sched[i]}" data-idx="${i}">`;
    grid.appendChild(wrap);
  });

  const linked = wireLinkedCurrency(body, "USD");
  body.querySelector("#itUSD").value = usdInit.toFixed(2);
  body.querySelector("#itMXN").value = mxnInit.toFixed(2);
  body.querySelector("#itRate").value = curRate;
  if(curCurrency==="MXN") body.querySelector("#itCurMXN").click();

  // Budget Setup has no "only this month" control anymore — new items
  // created here are always part of the recurring template. If you're
  // editing an item that already has onlyYM set (from before this change,
  // or promoted-and-reverted some other way), that flag is simply
  // preserved on save without any checkbox to toggle it — "varies by
  // month" doesn't apply to something that only ever fires once, and the
  // only way out is the "Also add to master Budget Setup" button.
  const varyRow = body.querySelector("#iVaryRow");
  if(isOnlyThisMonth) varyRow.style.opacity = .45;

  // Live preview, updated as you type. The common case (vary unchecked):
  // the Amount field IS the item's one number, so every one of the 12
  // slots mirrors it — that's what makes Save write a genuinely flat
  // template value instead of one hidden month-of-year slot. Checked: this
  // is a deliberately month-varying item, so only the month you're
  // actually looking at follows the Amount field; the rest stay exactly
  // what's already in the grid (manual control, same as "Zero out all
  // months" below surviving further edits here).
  function previewSchedule(){
    const amt = linked.getNativeAmount();
    const vary = body.querySelector("#iVary").checked;
    if(!vary){
      grid.querySelectorAll("input").forEach(inp=>{ inp.value = amt; });
    } else {
      const preview = [...grid.querySelectorAll("input")].map(inp=> parseFloat(inp.value||"0"));
      preview[mIdx] = amt;
      grid.querySelectorAll("input").forEach((inp,i)=>{ inp.value = preview[i]; });
    }
  }
  // Duplicate (when editing an existing, saved expense) should only ever
  // clone the last-SAVED state — never the current, possibly-unsaved form
  // contents. Rather than silently discarding in-progress edits, disable
  // Duplicate the moment anything in the form changes, and only it's
  // available again once those changes are actually saved.
  let formDirty = false;
  function markDirty(){
    if(formDirty) return;
    formDirty = true;
    const dupBtn = body.querySelector("#iDuplicate");
    if(dupBtn) dupBtn.disabled = true;
  }
  function clearDirty(){
    formDirty = false;
    const dupBtn = body.querySelector("#iDuplicate");
    if(dupBtn) dupBtn.disabled = false;
  }
  // Read-only per-period breakdown, for reference only — the monthly amount
  // above is still what drives the budget math.
  function updatePerPeriod(){
    const per = body.querySelector("#iPerPeriod");
    const freq = body.querySelector("#iFreq").value;
    const usd = parseFloat(body.querySelector("#itUSD").value||"0");
    const mxn = parseFloat(body.querySelector("#itMXN").value||"0");
    const div = freq==="weekly" ? WEEKS_PER_MONTH : freq==="biweekly" ? BIWEEKS_PER_MONTH : null;
    const label = freq==="weekly" ? "week" : freq==="biweekly" ? "2 weeks" : null;
    if(div && label){
      per.style.display = "";
      per.textContent = `≈ ${fmtUSD(usd/div)} / ${label} · ${fmtMXN(mxn/div)} / ${label}`;
    } else {
      per.style.display = "none";
    }
  }
  ["#itUSD","#itMXN","#itRate"].forEach(sel=>{
    body.querySelector(sel).addEventListener("input", ()=>{ previewSchedule(); updatePerPeriod(); markDirty(); });
  });
  body.querySelector("#itCurUSD").addEventListener("click", markDirty);
  body.querySelector("#itCurMXN").addEventListener("click", markDirty);
  body.querySelector("#iVary").addEventListener("change", ()=>{
    // Unchecking "varies by month" immediately flattens whatever's in the
    // grid back to the single Amount value — checking it just leaves the
    // grid (currently flat, or whatever was there) alone for manual editing.
    previewSchedule();
    const adv = body.querySelector("#iAdv");
    if(adv && body.querySelector("#iVary").checked) adv.open = true;
    markDirty();
  });
  body.querySelector("#iFreq").addEventListener("change", ()=>{ updatePerPeriod(); markDirty(); });
  body.querySelector("#iName").addEventListener("input", markDirty);
  body.querySelector("#iPay").addEventListener("change", markDirty);
  grid.querySelectorAll("input").forEach(inp=> inp.addEventListener("input", markDirty));
  updatePerPeriod();

  body.querySelector("#iZeroAll").onclick = ()=>{
    grid.querySelectorAll("input").forEach(inp=>{ inp.value = 0; });
    markDirty();
  };

  body.querySelector("#iCancel").onclick = ()=> openCategoryDetailSheet(categoryId, ym);
  // Single Save path: always reads the 12-month grid directly, which
  // previewSchedule() keeps live-synced to the Amount field and the "varies
  // by month" checkbox, and which "Zero out all months" edits directly —
  // so whatever the grid shows is exactly what gets saved, with no separate
  // recompute to disagree with it.
  onceClick(body.querySelector("#iSave"), async ()=>{
    const name = body.querySelector("#iName").value.trim();
    if(!name){ formError(body, "Enter a name.", body.querySelector("#iName")); return; }
    const currency = linked.getCurrency();
    const rate = linked.getRate();
    const onlyMonth = isOnlyThisMonth;
    const frequency = body.querySelector("#iFreq").value;
    const newSched = [...grid.querySelectorAll("input")].map(inp=> parseFloat(inp.value||"0"));

    const rec = { id: existing ? existing.id : uid("li"), categoryId, name, schedule:newSched, paymentMethod: body.querySelector("#iPay").value, currency, rate, frequency };
    if(onlyMonth) rec.onlyYM = ym;
    if(existing){
      const idx = state.lineitems.findIndex(x=>x.id===existing.id);
      state.lineitems[idx] = rec;
    } else {
      state.lineitems.push(rec);
    }
    await dbSet("lineitems", rec.id, rec);
    clearDirty();
    showToast(`${existing?"Updated":"Added"} ${name}`);
    render();
    openCategoryDetailSheet(categoryId, ym);
  });
  if(existing && existing.onlyYM){
    body.querySelector("#iPromote").onclick = async ()=>{
      const rec = { ...existing };
      delete rec.onlyYM;
      const idx = state.lineitems.findIndex(x=>x.id===existing.id);
      state.lineitems[idx] = rec;
      await dbSet("lineitems", rec.id, rec);
      showToast(`${existing.name} added to Budget Setup for every month`);
      render();
      openCategoryDetailSheet(categoryId, ym);
    };
  }
  if(existing){
    onceClick(body.querySelector("#iDuplicate"), async ()=>{
      const rec = { ...existing, id: uid("li"), name: existing.name + " (copy)" };
      state.lineitems.push(rec);
      await dbSet("lineitems", rec.id, rec);
      showToast(`Duplicated ${existing.name}`);
      render();
      openCategoryDetailSheet(categoryId, ym);
    });
    body.querySelector("#iDelete").onclick = ()=> confirmAction(`Delete "${existing.name}"?`, async ()=>{
      state.lineitems = state.lineitems.filter(x=>x.id!==existing.id);
      await dbDelete("lineitems", existing.id);
      showToast(`Deleted ${existing.name}`);
      render();
      openCategoryDetailSheet(categoryId, ym);
    }, ()=> openLineItemDialog(categoryId, existing, ym));
  }
  openSheet();
}

/* ---------------------------------------------------------------
   RENDER: SETTINGS
--------------------------------------------------------------- */
function renderSettings(main){
  const wrap = el("div","stack");

  const curView = state.settings.monthlyDefaultView || "ledger";
  const viewCard = el("div","card stack");
  viewCard.innerHTML = `
    <div class="eyebrow">Monthly opens to</div>
    <div class="viewtoggle">
      <button type="button" class="viewbtn ${curView==="ledger"?"active":""}" id="dvLedger" style="flex:1; justify-content:center">Ledger</button>
      <button type="button" class="viewbtn ${curView==="dash"?"active":""}" id="dvDash" style="flex:1; justify-content:center">Dashboard</button>
    </div>`;
  viewCard.querySelector("#dvLedger").onclick = async ()=>{
    state.settings.monthlyDefaultView = "ledger";
    await dbSetSettings();
    showToast("Monthly will open to Ledger");
    render();
  };
  viewCard.querySelector("#dvDash").onclick = async ()=>{
    state.settings.monthlyDefaultView = "dash";
    await dbSetSettings();
    showToast("Monthly will open to Dashboard");
    render();
  };
  wrap.appendChild(viewCard);

  // Everything below the picker is per-year (perYear[year], cashflow.years[year]).
  // Each section is a collapsed card with a one-line summary; Cash Flow's
  // "Set up" button opens Settings straight to its section (ui.settingsAnchor).
  const settingsYear = ui.settingsYear || yearOfYM(ui.ym);
  ui.settingsYear = settingsYear;
  const ys = yearSettings(settingsYear);

  const panelHead = el("div","card");
  const { minYear: setMinYear, maxYear: setMaxYear } = yearNavBounds();
  panelHead.innerHTML = `
    <div class="eyebrow">Year settings</div>
    <div class="row" style="margin-top:6px">
      <div style="font-weight:600; font-size:22px" class="num">${settingsYear}</div>
      <div class="row" style="gap:6px; width:auto">
        <button class="navbtn" id="setPrevY" aria-label="Previous year" ${settingsYear<=setMinYear?"disabled":""}>‹</button>
        <button class="navbtn" id="setNextY" aria-label="Next year" ${settingsYear>=setMaxYear?"disabled":""}>›</button>
      </div>
    </div>`;
  panelHead.querySelector("#setPrevY").onclick = ()=>{ if(settingsYear>setMinYear){ ui.settingsYear = settingsYear - 1; render(); } };
  panelHead.querySelector("#setNextY").onclick = ()=>{ if(settingsYear<setMaxYear){ ui.settingsYear = settingsYear + 1; render(); } };
  wrap.appendChild(panelHead);

  // Budget: annual total + base exchange rate, one Save.
  wrap.appendChild(accCard(ui.setOpen, "budget", "Budget", `${cfMoney0(ys.yearBudgetUSD)} · rate ${ys.baseRate}`, b=>{
    b.innerHTML = `
      <label>Annual budget for ${settingsYear} (USD)
        <input type="number" inputmode="decimal" id="sYearBudget" value="${ys.yearBudgetUSD}">
      </label>
      <div class="muted" style="font-size:12px; margin-top:-6px">Monthly baseline ${fmtUSD(ys.yearBudgetUSD/12)}.</div>
      <label>Base exchange rate, USD → MXN
        <input type="number" inputmode="decimal" id="sRate" step="0.01" value="${ys.baseRate}">
      </label>
      <div class="muted" style="font-size:12px; margin-top:-6px">New items start at this rate. Existing items keep theirs.</div>
      <button class="btn primary" id="saveBudget">Save</button>`;
    b.querySelector("#saveBudget").onclick = async ()=>{
      await setYearSetting(settingsYear, {
        yearBudgetUSD: parseFloat(b.querySelector("#sYearBudget").value||"0"),
        baseRate: parseFloat(b.querySelector("#sRate").value||"17.79")
      });
      showToast(`${settingsYear} budget saved`);
      render();
    };
  }));

  // Cash Flow: the year's opening balances (the buffer), reserve goal and
  // annual income estimate. Monthly/quarterly estimates and actuals are
  // entered on the Cash Flow tab.
  const cfRec = cfYearRec(settingsYear);
  const cfAcc = (cfRec && cfRec.accounts) || [];
  const cfById = id=> cfAcc.find(a=> a.id===id);
  const cfExtras = cfAcc.filter(a=> a.id!=="cf_ms" && a.id!=="cf_nfcu");
  const cfM = cfModel(settingsYear);
  const cfIncV = cfInherit(settingsYear, "annualIncomeUSD", 0);
  wrap.appendChild(accCard(ui.setOpen, "cf", "Cash Flow",
    cfM.hasSetup ? `Opening ${cfMoney0(cfM.opening)} · ${cfM.reserveMonths}-month reserve goal` : "Not set up", b=>{
    b.innerHTML = `
      <div class="muted" style="font-size:12px">Your cash on Jan 1, ${settingsYear}. Leave an account blank if it isn't part of ${settingsYear}.</div>
      <label>Morgan Stanley (USD)
        <input type="number" inputmode="decimal" step="0.01" id="cfMS" value="${cfById("cf_ms") ? cfById("cf_ms").amountUSD : ""}" placeholder="0.00">
      </label>
      <label>Navy Federal Credit Union (USD)
        <input type="number" inputmode="decimal" step="0.01" id="cfNF" value="${cfById("cf_nfcu") ? cfById("cf_nfcu").amountUSD : ""}" placeholder="0.00">
      </label>
      <div id="cfExtra" class="stack"></div>
      <button type="button" class="btn small" id="cfAddX">Add account</button>
      <label>Reserve goal (months of spending)
        <input type="number" inputmode="numeric" step="1" min="1" id="cfRes" value="${cfInherit(settingsYear, "reserveMonths", 12)}">
      </label>
      <label>Annual income estimate (USD)
        <input type="number" inputmode="decimal" step="0.01" min="0" id="cfInc" value="${cfIncV || ""}" placeholder="0.00">
      </label>
      <div class="muted" style="font-size:12px; margin-top:-6px">After-tax investment income. Months with no estimate use this ÷ 12. The reserve goal and income estimate carry to later years until you change them.</div>
      <button class="btn primary" id="saveCF">Save</button>`;
    const addExtra = (a)=>{
      const r = el("div","stack");
      r.dataset.xrow = "1"; if(a) r.dataset.id = a.id;
      r.innerHTML = `<div class="row" style="gap:8px"><input type="text" data-xname placeholder="Account name" value="${a ? escapeHtml(a.label) : ""}" style="flex:1"><button type="button" class="btn small ghost" data-xdel aria-label="Remove account">Remove</button></div>
        <input type="number" inputmode="decimal" step="0.01" data-xamt placeholder="0.00" value="${a ? a.amountUSD : ""}">`;
      r.querySelector("[data-xdel]").onclick = ()=> r.remove();
      b.querySelector("#cfExtra").appendChild(r);
    };
    cfExtras.forEach(addExtra);
    b.querySelector("#cfAddX").onclick = ()=> addExtra(null);
    b.querySelector("#saveCF").onclick = async ()=>{
      const q = sel=> b.querySelector(sel);
      const asOf = settingsYear + "-01-01";
      const accounts = [];
      const ms = cfParseMoney(q("#cfMS").value), nf = cfParseMoney(q("#cfNF").value);
      if(ms!=null) accounts.push({ id:"cf_ms", label:"Morgan Stanley", amountUSD: roundCents(ms), asOf });
      if(nf!=null) accounts.push({ id:"cf_nfcu", label:"Navy Federal Credit Union", amountUSD: roundCents(nf), asOf });
      let incomplete = false;
      b.querySelectorAll("[data-xrow]").forEach(r=>{
        const name = r.querySelector("[data-xname]").value.trim(), amt = cfParseMoney(r.querySelector("[data-xamt]").value);
        if(!name && amt==null) return;
        if(!name || amt==null){ incomplete = true; return; }
        accounts.push({ id: r.dataset.id || uid("cfa"), label: name, amountUSD: roundCents(amt), asOf });
      });
      if(incomplete){ showToast("Each added account needs a name and a balance"); return; }
      const resRaw = q("#cfRes").value.trim();
      const resN = resRaw==="" ? null : parseInt(resRaw, 10);
      if(resN!=null && !(resN>=1 && resN<=120)){ showToast("Reserve goal: enter a whole number of months, 1 or more"); return; }
      const incN = cfParseMoney(q("#cfInc").value);
      if(incN!=null && incN<0){ showToast("Annual income can't be negative"); return; }
      const rec = cfEnsureYear(settingsYear);
      rec.accounts = accounts;
      rec.reserveMonths = resN;
      rec.annualIncomeUSD = incN==null ? null : roundCents(incN);
      const keep = new Set(accounts.map(a=> a.id));
      Object.values(rec.quarters||{}).forEach(qq=>{ if(qq.balances) Object.keys(qq.balances).forEach(k=>{ if(!keep.has(k)) delete qq.balances[k]; }); });
      await dbSet("cashflow", String(settingsYear), rec);
      showToast(`${settingsYear} Cash Flow saved`);
      render();
    };
  }));

  // Add funds: raises the year's overall budget.
  const yearFundEvents = state.fundevents.filter(f=> yearOfYM(f.targetYM)===settingsYear);
  wrap.appendChild(accCard(ui.setOpen, "funds", "Add funds", yearFundEvents.length ? `${yearFundEvents.length} added in ${settingsYear}` : "Raise this year's budget", b=>{
    b.innerHTML = `<div class="muted" style="font-size:12px">Raises this year's overall budget: split evenly across all 12 months, or ramped in from the month you're viewing. For one category, use Transfer funds on Monthly.</div>`;
    const addFundBtn = el("button","btn accent block");
    addFundBtn.innerHTML = `${iconPlus()}<span>Add funds</span>`;
    addFundBtn.onclick = ()=> openFundDialog(ymOf(settingsYear, monthOfYM(ui.ym)));
    b.appendChild(addFundBtn);
    if(yearFundEvents.length){
      const list = el("div","stack");
      yearFundEvents.slice().reverse().forEach(f=>{
        const row = el("div","row");
        row.style.borderTop = "1px solid var(--line)";
        row.style.paddingTop = "8px";
        const label = `${MONTHS[monthOfYM(f.targetYM)]} ${yearOfYM(f.targetYM)}`;
        const modeDesc = f.mode==="oneshot" ? `one-time, ${label}` : f.mode==="evenly" ? "evenly across all 12 months" : `spread from ${label}`;

        list.appendChild(row);
      });
      b.appendChild(list);
    }
  }));

  // Data: this year's download/clear, and the full export.
  const configuredN = (state.settings.seededYMs||[]).filter(ym=>yearOfYM(ym)===settingsYear).length;
  const dataCard = el("div","card");
  dataCard.innerHTML = `<div class="eyebrow">Data</div>
    <div class="muted" style="font-size:12px; margin-top:3px">${configuredN} of 12 months configured for ${settingsYear}</div>
    <div class="cf-row taprow" id="dlYear" style="margin-top:8px"><span class="nm" style="flex:1">Download ${settingsYear} data</span><span class="rowchev">${iconChevronRight()}</span></div>
    <div class="cf-row taprow" id="clrYear"><span class="nm" style="flex:1; color:var(--bad)">Clear ${settingsYear}</span><span class="rowchev">${iconChevronRight()}</span></div>
    <div class="cf-row taprow" id="expAll"><span class="nm" style="flex:1">Export everything (JSON)</span><span class="rowchev">${iconChevronRight()}</span></div>`;
  dataCard.querySelector("#dlYear").onclick = ()=> exportYearData(settingsYear);
  dataCard.querySelector("#expAll").onclick = exportData;
  dataCard.querySelector("#clrYear").onclick = ()=>{
    const actualsN = state.actuals.filter(a=>yearOfDate(a.date)===settingsYear).length;
    const transfersN = state.transfers.filter(t=>yearOfDate(t.date)===settingsYear).length;
    const fundN = state.fundevents.filter(fe=>yearOfYM(fe.targetYM)===settingsYear).length;
    const seededN = (state.settings.seededYMs||[]).filter(ym=>yearOfYM(ym)===settingsYear).length;
    confirmAction(
      `This will delete ${actualsN} actual entr${actualsN===1?"y":"ies"}, ${transfersN} transfer${transfersN===1?"":"s"}, and ${fundN} fund event${fundN===1?"":"s"}, and reset all ${seededN} configured month${seededN===1?"":"s"} of ${settingsYear} (out of 12) to unconfigured. This can't be undone.`,
      async ()=>{
        await clearYearData(settingsYear);
        showToast(`${settingsYear} cleared`);
        render();

  const aboutCard = el("div","card stack");
  aboutCard.innerHTML = `<div class="eyebrow">About</div><div class="muted">Ledger Casa ${escapeHtml(APP_BUILD)}</div>`;
  wrap.appendChild(aboutCard);

  main.appendChild(wrap);

    requestAnimationFrame(()=>{ const t = wrap.querySelector(`[data-acc="${key}"]`); if(t) t.scrollIntoView({ block:"start" }); });

}

// Shared by Settings (year-level only — adding funds there always means
// "this affects the whole year's budget," never a single category) and
// Monthly's fund-adjustments sheet (always the month you're already
// looking at — `opts.lockMonth` swaps the Year field for a plain label,
// since picking a year you're already in is just noise, and forces
// mode:"oneshot" since Monthly's Add Funds is always this-month-only now;
// Monthly's category-targeted case goes through the Transfer dialog's
// "External source" option instead, not this screen at all).
// `opts.onSaved`/`opts.onCancel`, when given, replace the default "just
// close" behavior — lets the Monthly entry point return you to the
// adjustments sheet you came from (via Save OR Cancel) instead of
// dropping you with no dialog open at all.
function openFundDialog(targetYm, opts){
  const { onSaved, onCancel, lockMonth } = opts || {};
  const dlg = document.getElementById("dlg");
  const body = document.getElementById("dlgBody");
  const seedYm = targetYm!=null ? targetYm : ui.ym;
  const defaultYear = yearOfYM(seedYm);
  // "Apply from active month moving forward" needs an anchor month —
  // whatever month is currently selected in the app, if that's within the
  // year being edited, otherwise January (there's no "active month" in a
  // year you're not even looking at).
  const anchorMIdx = yearOfYM(ui.ym)===defaultYear ? monthOfYM(ui.ym) : 0;
  const yearField = lockMonth
    ? `<p class="muted">Applying to <strong>${MONTHS[monthOfYM(seedYm)]} ${defaultYear}</strong></p>`
    : `<label>Year<input type="number" inputmode="numeric" id="fdYear" step="1" value="${defaultYear}"></label>`;
  // Locked to one month, there's no real choice to make — one-time, this
  // month only, is the only thing "Add funds" from Monthly ever means.
  // Settings is year-level, so its only two real questions are whether the
  // year's new money lands evenly across all 12 months, or ramps in from
  // wherever you currently are and holds for the rest of the year.
  const modeField = lockMonth
    ? ""
    : `<label>How should it apply?
      <select id="fdMode">
        <option value="evenly">Apply evenly across all 12 months</option>
        <option value="redistribute">Apply from ${MONTHS[anchorMIdx]} moving forward</option>
      </select>
    </label>`;
  body.innerHTML = `
    <h3>Add funds</h3>
    <label>Amount (USD)<input type="number" inputmode="decimal" id="fdAmt" step="0.01" placeholder="5000"></label>
    <label>Date received<input type="date" id="fdDate" value="${new Date().toISOString().slice(0,10)}"></label>
    ${yearField}
    ${modeField}
    <label>Note (optional)<input type="text" id="fdNote" placeholder="e.g. tax refund"></label>
    <div class="dialog-actions">
      <button class="btn ghost" id="fdCancel">Cancel</button>
      <button class="btn primary" id="fdSave">Save</button>
    </div>
  `;
  body.querySelector("#fdCancel").onclick = ()=>{ dlg.close(); if(onCancel) onCancel(); };
  onceClick(body.querySelector("#fdSave"), async ()=>{
    const amt = parseFloat(body.querySelector("#fdAmt").value||"0");
    if(!amt){ formError(body, "Enter an amount.", body.querySelector("#fdAmt")); return; }
    const id = uid("fund");
    const year = lockMonth ? defaultYear : (parseInt(body.querySelector("#fdYear").value,10) || defaultYear);
    const mIdx = lockMonth ? monthOfYM(seedYm) : anchorMIdx;
    const note = body.querySelector("#fdNote").value.trim();
    const rec = {
      id, date: body.querySelector("#fdDate").value,
      amountUSD: amt,
      targetYM: ymOf(year, mIdx),
      mode: lockMonth ? "oneshot" : body.querySelector("#fdMode").value,
    };
    if(note) rec.note = note;
    state.fundevents.push(rec);
    await dbSet("fundevents", id, rec);
    dlg.close();
    showToast(`Added ${fmtUSD(amt)} to the budget`);
    render();
    if(onSaved) onSaved();
  });
  openSheet();
}

   UTIL
--------------------------------------------------------------- */
// Guards a save/delete button against double-submit — a fast double-tap
// (easy to do on a bottom sheet) could otherwise fire the handler twice
// before the first write finished, creating a duplicate record. Disables
// the button for the duration of the handler, always re-enabling after.
function onceClick(btn, handler){
  btn.onclick = async ()=>{
    if(btn.disabled) return;
    btn.disabled = true;
    try{ await handler(); }
    finally{ btn.disabled = false; }
  };
}

// Visible validation failure — every Save handler used to just `return`
// silently when a required field was missing, which looked exactly like a
// broken button. This puts a message in the dialog itself (toast is no
// good here: it renders behind the open <dialog>'s top layer) and, when an
// input is given, highlights it and clears itself the moment that field
// changes.
// "Save your changes first?" — shown inside the open category sheet (not as a
// separate dialog, which would replace the sheet and lose the unsaved
// fields). Stay here just dismisses it with every edit intact; Save and
// continue runs saveFn, which returns false when it declined to save (e.g.
// a blank Name) so the person stays put.
function promptSaveBeforeContinue(body, saveFn, what){
  what = what || "category";
  const existing = body.querySelector("#unsavedPrompt");
  if(existing){ existing.scrollIntoView({ block:"center" }); return; }
  const box = document.createElement("div");
  box.id = "unsavedPrompt";
  box.style.cssText = "background:var(--surface-2); border:1px solid var(--accent); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:10px";
  box.innerHTML = `
    <div style="font-weight:600">Save your changes first?</div>
    <div class="muted" style="font-size:12px">You've changed this ${what} but haven't saved. Save before you continue.</div>
    <div class="row" style="justify-content:flex-end; gap:10px">
      <button type="button" class="btn small ghost" id="upStay">Stay here</button>
      <button type="button" class="btn small primary" id="upSave">Save and continue</button>
    </div>`;
  const actions = body.querySelector(".dialog-actions");
  if(actions) actions.parentNode.insertBefore(box, actions); else body.appendChild(box);
  box.scrollIntoView({ block:"center" });
  box.querySelector("#upStay").onclick = ()=> box.remove();
  onceClick(box.querySelector("#upSave"), async ()=>{
    const ok = await saveFn();
    if(ok === false) box.remove();
  });
}
function formError(body, message, input){
  let msg = body.querySelector(".form-err-msg");
  if(!msg){
    msg = document.createElement("div");
    msg.className = "form-err-msg";
    const actions = body.querySelector(".dialog-actions");
    if(actions) actions.parentNode.insertBefore(msg, actions);
    else body.appendChild(msg);
  }
  msg.textContent = message;
  if(input){
    input.classList.add("err");
    input.focus();
    input.addEventListener("input", ()=>{ input.classList.remove("err"); if(msg.isConnected) msg.remove(); }, {once:true});
  }
}

// Strips whatever a paste brings in (currency symbols, thousands commas,
// stray spaces) down to a plain decimal string a number field can actually
// use. Needed because the linked USD/MXN fields are plain text inputs (a
// native type="number" field silently rejects/clears a pasted "$150.00" or
// "1,500.00" before any recalculation ever sees it).
function cleanNumStr(v){
  if(v==null) return "";
  let s = String(v).replace(/[^0-9.\-]/g, "");
  const parts = s.split(".");
  if(parts.length > 2) s = parts[0] + "." + parts.slice(1).join("");
  return s;
}

// Triggers a plain browser download of a Blob — the fallback used when
// the platform's "downloads" capability isn't available at all (e.g. a
// standalone/offline deployment with no `claude` runtime). A temporary,
// never-attached <a download> is the standard way to do this without any
// host cooperation.
function downloadBlobDirect(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

// Downloads the full working state as one JSON file — the whole point is
// a clean, complete snapshot someone can hand back to Claude later (as an
// attachment) so a rebuild works from real data instead of a description.
// Prefers the platform's downloads capability when present; falls back to
// a direct browser download (see downloadBlobDirect) when running
// standalone with no `claude` runtime at all.
async function exportData(){
  const dl = await (async ()=>{ try{ return await claude.use("downloads"); } catch(e){ return null; } })();
  const payload = {
    exportedAt: new Date().toISOString(),
    settings: state.settings,
    categories: state.categories,
    lineitems: state.lineitems,
    actuals: state.actuals,
    fundevents: state.fundevents,
    transfers: state.transfers,
    monthCategoryData: state.monthCategoryData,
    cashflow: state.cashflow,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const filename = `ledgercasa-export-${new Date().toISOString().slice(0,10)}.json`;
  if(!dl){
    try{ downloadBlobDirect(blob, filename); showToast("Downloaded"); }
    catch(e){ showToast("Couldn't download — try again"); }
    return;
  }
  try{
    await dl.save({ filename, data: blob });
    showToast("Downloaded");
  } catch(e){
    if(e && e.code==="declined") return;
    showToast("Couldn't download — try again");
  }
}

// Downloads just one year's data — the actuals, transfers and fund events
// that belong to it, its perYear settings (if configured), and any onlyYM
// line items scoped into it. Mirrors exportData()'s download mechanism,
// just filtered to a single year instead of everything.
async function exportYearData(year){
  const dl = await (async ()=>{ try{ return await claude.use("downloads"); } catch(e){ return null; } })();
  const payload = {
    exportedAt: new Date().toISOString(),
    year,
    actuals: state.actuals.filter(a=>yearOfDate(a.date)===year),
    transfers: state.transfers.filter(t=>yearOfDate(t.date)===year),
    fundevents: state.fundevents.filter(fe=>yearOfYM(fe.targetYM)===year),
    perYearSettings: (state.settings.perYear||{})[year] || null,
    lineitems: state.lineitems.filter(li=>li.onlyYM!==undefined && yearOfYM(li.onlyYM)===year),
    monthCategoryData: Object.fromEntries(Object.entries(state.monthCategoryData||{}).filter(([ym])=>yearOfYM(Number(ym))===year)),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const filename = `ledger-casa-${year}-backup.json`;
  if(!dl){
    try{ downloadBlobDirect(blob, filename); showToast("Downloaded"); }
    catch(e){ showToast("Couldn't download — try again"); }
    return;
  }
  try{
    await dl.save({ filename, data: blob });
    showToast("Downloaded");
  } catch(e){
    if(e && e.code==="declined") return;
    showToast("Couldn't download — try again");
  }
}

// Wipes a single year's data — actuals, transfers, fund events, its
// perYear settings, seeded months, and any onlyYM line items scoped into
// it — without touching any other year. A month-only line item that only
// existed for this (now-cleared) year is deleted outright rather than
// promoted to the master template, unlike the normal "remove onlyYM" path.
async function clearYearData(year){
  const keepActuals = [];
  const dropActuals = [];
  state.actuals.forEach(a=> (yearOfDate(a.date)===year ? dropActuals : keepActuals).push(a));
  state.actuals = keepActuals;

  const keepTransfers = [];
  const dropTransfers = [];
  state.transfers.forEach(t=> (yearOfDate(t.date)===year ? dropTransfers : keepTransfers).push(t));
  state.transfers = keepTransfers;

  const keepFund = [];
  const dropFund = [];
  state.fundevents.forEach(fe=> (yearOfYM(fe.targetYM)===year ? dropFund : keepFund).push(fe));
  state.fundevents = keepFund;

  const keepItems = [];
  const dropItems = [];
  state.lineitems.forEach(li=> (li.onlyYM!==undefined && yearOfYM(li.onlyYM)===year ? dropItems : keepItems).push(li));
  state.lineitems = keepItems;

  if(state.settings.perYear) delete state.settings.perYear[year];
  state.settings.seededYMs = (state.settings.seededYMs||[]).filter(ym=>yearOfYM(ym)!==year);
  Object.keys(state.monthCategoryData||{}).forEach(ym=>{
    if(yearOfYM(Number(ym))===year) delete state.monthCategoryData[ym];
  });

  for(const a of dropActuals) await dbDelete("actuals", a.id);
  for(const t of dropTransfers) await dbDelete("transfers", t.id);
  for(const fe of dropFund) await dbDelete("fundevents", fe.id);
  for(const li of dropItems) await dbDelete("lineitems", li.id);
  await dbSetSettings();
  await dbSetMonthCategoryData();
}
