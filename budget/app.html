// The sticky subhead: status + the one action that matters most while
// scrolling this tab. Annual Outlook has no per-month concept and Settings
// has nothing worth pinning, so both stay hidden here.
function renderSubhead(){
  const sub = document.getElementById("subhead");
  const toggleBox = document.getElementById("monthlyToggleSticky");
  sub.innerHTML = "";
  sub.classList.remove("show");
  sub.style.borderBottom = "";
  toggleBox.innerHTML = "";
  toggleBox.classList.remove("show");
  if(!ui.loaded) return;
  const ym = ui.ym;

  if(ui.tab==="monthly"){
    // Available / Spent / Surplus, not Budget / Allocated / Surplus —
    // Allocated is Budget Setup's static planned-items number, which never
    // moves when an unbudgeted category (Entertainment, Unaccounted for
    // Expenses) actually gets spent. This trio always reconciles instead:
    // Available minus Spent is Surplus, exactly, every time, because Spent
    // is every actual dollar logged this month, budgeted or not.
    const seeded = isMonthSeeded(ym);
    // A current/future month that hasn't been set up yet still gets a real
    // Available figure here — it's genuinely knowable (template budget +
    // whatever has genuinely rolled forward from already-seeded prior
    // months, same totalAvailableForMonth every seeded month uses). Spent
    // and Surplus stay a flat "—" until the month is actually set up —
    // Spent isn't knowable yet, and Available minus an unknown Spend isn't
    // a meaningful Surplus. A PAST unconfigured month shows "—" across the
    // board, same as before (see monthNotSetUpCard).
    const futureUnconfigured = !seeded && ym >= todayYM();
    const showAvail = seeded || futureUnconfigured;
    // visibleAvailableForMonth/visibleSpentForMonth already fold in any
    // Excluded categories for this month (and fall back to the plain
    // totals when nothing's excluded) — Surplus below comes out identical
    // to the un-adjusted figure either way, since the same amount is
    // removed from both Available and Spent. For a future unconfigured
    // month there's no seeded history to compute a real rollover-inclusive
    // figure from, so Available falls back to the flat per-month template
    // (yearBudgetUSD/12) instead — nothing has happened to this month yet.
    const avail = seeded
      ? visibleAvailableForMonth(ym)
      : (futureUnconfigured ? roundCents(yearSettings(yearOfYM(ym)).yearBudgetUSD/12) : null);
    const spent = seeded ? visibleSpentForMonth(ym) : null;
    const surplus = seeded ? roundCents(avail - spent) : null;
    // No note line here — the sliders icon is the one signal pointing at
    // the sheet's full reconciliation (Template, Fund adjustments,
    // Transfers, Rollover, Excluded). The badge number counts only
    // itemized rows (fund events + transfers); Rollover/Excluded get a
    // separate dot (see dotFor) since they're states,
    // not counts — v94 tried folding them into the one number and it broke
    // down visibly once someone excluded 3+ categories and the badge
    // stayed stuck at "1". The whole button is hidden for an unseeded
    // month: Add Funds/Add Transfer only live inside this sheet, so without
    // this guard someone could add activity to a month before it's set up,
    // which contradicts Spent/Surplus staying "—" until it is.
    const adjCount = seeded ? fundAdjustmentsCountForMonth(ym) : 0;
    const dotHtml = seeded ? dotFor("m"+ym, excludedCountForMonth(ym), rolloverSignForMonth(ym)) : "";
    sub.innerHTML = `
      <div class="sh-info" style="flex-direction:row; gap:14px; align-items:baseline">
        <div${showAvail?"":` style="text-align:center"`}><div class="sh-tiny">Available</div><div class="num sh-amt">${showAvail?fmtUSD(avail):"—"}</div></div>
        <div${seeded?"":` style="text-align:center"`}><div class="sh-tiny">Spent</div><div class="num sh-amt">${seeded?fmtUSD(spent):"—"}</div></div>
        <div${seeded?"":` style="text-align:center"`}><div class="sh-tiny">Surplus</div><div class="num sh-amt"${seeded?` style="color:${surplus>=0?'var(--good)':'var(--bad)'}"`:""}>${seeded?fmtUSD(surplus):"—"}</div></div>
      </div>
      <div class="sh-actions">
        ${seeded?`<button class="iconbtn" id="shFundAdj" aria-label="Fund adjustments and transfers this month">${iconSliders()}${adjCount>0?`<span class="iconbtn-badge">${adjCount}</span>`:""}${dotHtml}</button>`:""}
      </div>
    `;
    sub.classList.add("show");
    sub.style.borderBottom = "none";
    if(seeded) sub.querySelector("#shFundAdj").onclick = ()=> openFundAdjustmentsSheet(ym);
    toggleBox.appendChild(viewToggleRow(ym));
    toggleBox.classList.add("show");
  } else if(ui.tab==="categories"){
    const rawTarget = roundCents(yearSettings(yearOfYM(todayYM())).yearBudgetUSD/12);
    const rawAllocated = roundCents(state.categories.filter(c=>categoryAppliesToYM(c,ym)).reduce((s,c)=> s+(c.baseAmountUSD||0), 0));
    // Excluded categories' Budget amounts. Same "remove the same real
    // figure from both sides" rule Monthly already uses for
    // visibleAvailableForMonth/visibleSpentForMonth (so Surplus never
    // swings off exclusion alone) — applied here to Target AND Allocated,
    // so Unallocated stays exactly what it'd be with nothing excluded.
    // Subtracting it from only one side (an earlier version of this screen)
    // made Unallocated swing deeply negative for a template where most of
    // Allocated happens to be Excluded, which doesn't reflect reality: that
    // money was never going to come out of this reduced Target either.
    const excludedAmt = roundCents(state.categories.filter(c=>categoryAppliesToYM(c,ym) && c.excludedDefault).reduce((s,c)=> s+(c.baseAmountUSD||0), 0));
    const target = roundCents(rawTarget - excludedAmt);
    const allocated = roundCents(rawAllocated - excludedAmt);
    const unallocated = roundCents(target - allocated);
    // No "+" here — New category moved onto the category list card itself
    // (renderCategories), matching where Monthly's own "+ add category"
    // lives: on the card it actually adds to, not in this summary strip.
    // No inline Excluded note either — same reasoning as Monthly's v94
    // change: a sliders icon + breakdown sheet replaces it. No badge number
    // here at all, ever — Budget Setup has no itemized events/transfers to
    // count, only the one Excluded on/off state, so a number would always
    // just be 0 or 1 and never actually count anything. A dot is the
    // honest representation; same one-time-pulse-on-transition rule as
    // Monthly's dot.
    const dotHtml = dotFor("bs", state.categories.filter(c=>categoryAppliesToYM(c,ym) && c.excludedDefault).length, 0);
    sub.innerHTML = `
      <div class="sh-info" style="flex-direction:row; gap:16px; align-items:baseline">
        <div><div class="sh-tiny">Target</div><div class="num sh-amt">${fmtUSD(target)}</div></div>
        <div><div class="sh-tiny">Allocated</div><div class="num sh-amt">${fmtUSD(allocated)}</div></div>
        <div><div class="sh-tiny">Unallocated</div><div class="num sh-amt" style="color:${unallocated>=0?'var(--good)':'var(--bad)'}">${fmtUSD(unallocated)}</div></div>
      </div>
      <div class="sh-actions">
        <button class="iconbtn" id="shBudgetAdj" aria-label="Budget breakdown">${iconSliders()}${dotHtml}</button>
      </div>
    `;
    sub.querySelector("#shBudgetAdj").onclick = ()=> openBudgetSetupBreakdownSheet(ym, rawTarget, rawAllocated, excludedAmt);
    sub.classList.add("show");
  }
}

function renderSkeleton(main){
  const wrap = el("div","stack");
  const bar = (h, w)=>{ const d = el("div","skel"); d.style.height = h; if(w) d.style.width = w; return d; };
  const card1 = el("div","card stack");
  card1.appendChild(bar("14px","40%"));
  card1.appendChild(bar("34px","60%"));
  wrap.appendChild(card1);
  for(let i=0;i<4;i++){
    const c = el("div","card stack");
    c.appendChild(bar("13px", (55+i*8)+"%"));
    c.appendChild(bar("10px","90%"));
    wrap.appendChild(c);
  }
  main.appendChild(wrap);
}

document.querySelectorAll("nav.tabs button").forEach(b=>{
  b.addEventListener("click", ()=>{
    const next = b.dataset.tab;
    // Re-entering Monthly from elsewhere always lands on the saved default
    // view, not wherever you last left it mid-session — that's what makes
    // the Settings toggle actually mean something.
    if(next==="monthly" && ui.tab!=="monthly"){
      ui.monthlyView = state.settings.monthlyDefaultView || "ledger";
    }
    ui.tab = next;
    render();
  });
});


/* ---------------------------------------------------------------
   CASH FLOW
   The funding side of the budget: investment income in, the year's
   budget out, cash left over, and how many months of next year's
   spending that cash covers. Spending is never entered here — each
   month's spending is exactly Monthly's own top-line total for that
   month (annual ÷ 12 plus any Add funds / External-source transfers),
   so the two tabs cannot disagree.
   Per year (state.cashflow.years[y]):
     accounts:      [{id,label,amountUSD,asOf}]   opening cash accounts
     reserveMonths: number                          reserve goal, in months
     annualIncomeUSD: number|null                   fallback ÷ 12 for months with no estimate
     months:        {0..11: {est?, act?}}           monthly income estimate / actual
     quarters:      {1..4: {asOf, balances:{accId:amt}}}  actual balances at quarter end
--------------------------------------------------------------- */
const CF_QEND = ["Mar 31","Jun 30","Sep 30","Dec 31"];
const CF_QEND_MD = ["-03-31","-06-30","-09-30","-12-31"];
function cfYearRec(y){ const ys = state.cashflow && state.cashflow.years; return (ys && ys[y]) || null; }
function cfEnsureYear(y){
  if(!state.cashflow) state.cashflow = { years:{} };
  if(!state.cashflow.years) state.cashflow.years = {};
  if(!state.cashflow.years[y]) state.cashflow.years[y] = { accounts:[], reserveMonths:null, annualIncomeUSD:null, months:{}, quarters:{} };
  return state.cashflow.years[y];
}
// A year with no value of its own inherits the nearest earlier year's,
// same rule yearSettings uses for the budget.
function cfInherit(y, key, def){
  const ys = (state.cashflow && state.cashflow.years) || {};
  if(ys[y] && ys[y][key]!=null) return ys[y][key];
  const prior = Object.keys(ys).map(Number).filter(k=> k<y && ys[k][key]!=null).sort((a,b)=> b-a);
  return prior.length ? ys[prior[0]][key] : def;
}
function cfSigned(v){ return (v>=0 ? "+" : "-") + fmtUSD(Math.abs(v)); }
// Base allocation of every category the user marked Excluded for this month
// (Monthly's Exclude). Cash Flow subtracts the allocation, not logged spend,
// because it forecasts months that have nothing logged yet. Anything added to
// that category (Add funds, external transfers) still counts as cash out.
function cfExcludedForMonth(ym){
  const data = state.monthCategoryData[ym] || {};
  const items = [];
  Object.keys(data).forEach(id=>{
    if(id===DROPPED_CREDITS_KEY || !data[id] || !data[id].excluded) return;
    const base = roundCents(data[id].baseAmountUSD || 0);
    if(base<=0) return;
    const cat = state.categories.find(x=> x.id===id);
    items.push({ id, name: data[id].name || (cat && cat.name) || "Category", amount: base });
  });
  return items;
}
function cfModel(y){
  const rec = cfYearRec(y) || { accounts:[], months:{}, quarters:{} };
  const accounts = (rec.accounts || []).filter(a=> a.amountUSD!=null);
  const opening = roundCents(accounts.reduce((s,a)=> s + (a.amountUSD||0), 0));
  const annualInc = cfInherit(y, "annualIncomeUSD", 0);
  const reserveMonths = cfInherit(y, "reserveMonths", 12);
  const ysBudget = yearSettings(y).yearBudgetUSD || 0;
  const hasOwnBudget = !!(state.settings.perYear && state.settings.perYear[y]);
  const monthly = ysBudget/12;
  // The reserve is the goal months x THIS year's monthly budget. It does not
  // move when funds are added or money is transferred in; those are cash out.
  const reserve = roundCents(reserveMonths * monthly);
  // Running cash is built from exact (unrounded) cumulative income and cash
  // out, rounded once per step, so the year lands on the true figure. Income
  // for a month is the actual if entered, else the estimate, else annual / 12.
  const rows = [], cash = [opening];
  let cumInc = 0, cumOut = 0, exclTotal = 0;
  for(let m=0; m<12; m++){
    const mm = (rec.months||{})[m] || {};
    const placeholder = mm.est==null && mm.act==null;
    const incExact = mm.act!=null ? mm.act : (mm.est!=null ? mm.est : annualInc/12);
    const ym = ymOf(y, m);
    const spend = totalBudgetForMonth(ym);
    const base = roundCents(monthly);
    const excl = cfExcludedForMonth(ym);
    const exclAmt = roundCents(excl.reduce((s,e)=> s + e.amount, 0));
    const outExact = (spend - base) + monthly - exclAmt;
    cumInc += incExact; cumOut += outExact; exclTotal += exclAmt;
    cash.push(roundCents(opening + cumInc - cumOut));
    const net = roundCents(incExact - outExact);
    const end = cash[m+1];
    const light = end < reserve ? "bad" : (net >= 0 ? "good" : "warn");
    rows.push({ m, ym, inc: roundCents(incExact), incExact, placeholder, src: mm.act!=null ? "actual" : (mm.est!=null ? "estimate" : "annual"), est: mm.est==null ? null : mm.est, act: mm.act==null ? null : mm.act,
      spend, base, added: roundCents(spend - base), excl, exclAmt, outExact, out: roundCents(outExact), net, end, above: roundCents(end - reserve), light });
  }
  const spendTotal = roundCents(cumOut), incTotal = roundCents(cumInc);
  const end = cash[12];
  const runway = monthly>0 ? end / monthly : null;
  const quarters = [];
  for(let q=0; q<4; q++){
    const qrec = (rec.quarters||{})[q+1] || {};
    const bals = qrec.balances || {};

function cfNice(lo, hi, n){
  const raw = ((hi-lo)/n) || 1, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m=> m*mag).find(s=> s>=raw);
  return { a: Math.floor(lo/step)*step, b: Math.ceil(hi/step)*step, step };
}
// Cash chart. A small dot marks each month-end (tap one: month + balance),

function cfSvgChart(pts, opts){
  opts = opts || {};

  const w = 322, h = 200;
  const vals = pts.concat(rev.map(p=>p[1]), dots.map(p=>p[1]), wi, reserve!=null ? [reserve] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi-lo)*0.08 || 1000; lo -= pad; hi += pad;
  const t = cfNice(lo, hi, 4), a = t.a, b = t.b;
  const x = i=> 44 + i*(w-56)/12;
  const y = v=> h-26 - (v-a)/(b-a)*(h-46);
  const lab = v=> (t.step>=1000 ? String(Math.round(v/1000)) : (v/1000).toFixed(1)) + "k";
  let s = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block" role="img" aria-label="${escapeHtml(opts.label||"Cash by month")}">`;
  for(let v=a; v<=b+t.step/1000; v+=t.step){
    s += `<line x1="44" x2="${w-12}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" style="stroke:var(--line)" stroke-dasharray="3 4"/><text x="38" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="10" style="fill:var(--ink-soft)">${lab(v)}</text>`;
  }
  if(reserve!=null) s += `<line x1="44" x2="${w-12}" y1="${y(reserve).toFixed(1)}" y2="${y(reserve).toFixed(1)}" stroke-width="2" stroke-dasharray="6 5" style="stroke:var(--accent)"/><text x="50" y="${(y(reserve)-5).toFixed(1)}" font-size="10" style="fill:var(--accent)">Reserve ${escapeHtml(cfMoney0(reserve))}</text>`;
  s += `<polyline fill="none" stroke-width="2.5" style="stroke:var(--primary)" points="${pts.map((v,i)=> x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ")}"/>`;
  if(rev.length) s += `<polyline fill="none" stroke-width="2.5" stroke-dasharray="6 4" style="stroke:var(--transfer)" points="${rev.map(p=> x(p[0]).toFixed(1)+","+y(p[1]).toFixed(1)).join(" ")}"/>`;
  if(wi.length) s += `<polyline fill="none" stroke-width="2.5" stroke-dasharray="6 4" style="stroke:var(--transfer)" points="${wi.map((v,i)=> x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ")}"/>`;
  if(!opts.noDots){
    for(let i=1; i<=12; i++) s += `<circle cx="${x(i).toFixed(1)}" cy="${y(pts[i]).toFixed(1)}" r="3.2" stroke-width="1.5" style="fill:var(--primary);stroke:var(--surface)"/>`;
  }
  dots.forEach(p=>{ s += `<circle cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="5.5" stroke-width="2" style="fill:var(--transfer);stroke:var(--surface)"/>`; });
  [0,3,6,9,12].forEach(i=>{ s += `<text x="${x(i).toFixed(1)}" y="${h-8}" font-size="10" text-anchor="middle" style="fill:var(--ink-soft)">${i===0 ? "Open" : MONTHS[i-1]}</text>`; });
  if(!opts.noDots){
    for(let i=1; i<=12; i++) s += `<circle class="cf-hit" data-i="${i}" data-cx="${x(i).toFixed(1)}" data-cy="${y(pts[i]).toFixed(1)}" cx="${x(i).toFixed(1)}" cy="${y(pts[i]).toFixed(1)}" r="13" fill="transparent" style="cursor:pointer"/>`;
  }

}

    q("#wiAbv").textContent = cfMoney0(abv); q("#wiAbv").className = abv>0 ? "cf-good" : "";

    const delta = end - M.endEff;
    const line = M.cash.map((v,i)=> roundCents(v + (M.endEff - M.end) * (i>=(M.latest ? 3*M.latest.q : 0) ? 1 : 0) + delta*i/12));
    q("#wiChart").innerHTML = cfSvgChart(M.cash, { wi: line, noDots:true, reserve: M.reserve, label:`Estimate and what-if cash for ${y}` });
  };

function cfQuarterSheet(y, q){
  const rec = cfEnsureYear(y);
  const M = cfModel(y);
  const Q = M.quarters[q-1];
  const qrec = (rec.quarters[q] = rec.quarters[q] || { asOf:null, balances:{} });
  qrec.balances = qrec.balances || {};

  const incRows = Q.rows.map((r,i)=> `<div class="row" style="gap:8px"><span style="width:38px">${MONTHS[r.m]}</span>

      <input type="number" inputmode="decimal" step="0.01" min="0" data-act="${r.m}" value="${r.act==null ? "" : r.act}" placeholder="—" style="flex:1"></div>`).join("");
  const balRows = M.accounts.length ? M.accounts.map(a=> `<label>${escapeHtml(a.label||"Account")}<input type="number" inputmode="decimal" step="0.01" data-bal="${a.id}" value="${qrec.balances[a.id]==null ? "" : qrec.balances[a.id]}" placeholder="0.00"></label>`).join("") : `<div class="muted">Set up this year in Settings first.</div>`;
  const mons = ["Jan–Mar","Apr–Jun","Jul–Sep","Oct–Dec"];

    <h3>Q${q} · ${mons[q-1]} ${y}</h3>
    <div class="eyebrow">Income</div>
    <div class="row" style="gap:8px; margin:0"><span style="width:38px"></span><span class="muted" style="flex:1; text-align:center">Estimate</span><span class="muted" style="flex:1; text-align:center">Actual</span></div>
    ${incRows}
    <div class="muted" style="font-size:12px">Leave an estimate blank to use annual ÷ 12. Leave an actual blank until you have it.</div>
    <div class="eyebrow" style="margin-top:8px">Balances at ${CF_QEND[q-1]} (actual)</div>
    <label>As of<input type="date" id="cqDate" value="${qrec.asOf || dflt}"></label>
    ${balRows}
    <div class="muted" style="font-size:12px">Actual cash shows once every account has a balance.</div>
    <div class="dialog-actions"><button class="btn ghost" id="cqCancel">Cancel</button><button class="btn primary" id="cqSave">Save</button></div>`);
  body.querySelector("#cqCancel").onclick = ()=> dlg.close();
  onceClick(body.querySelector("#cqSave"), async ()=>{
    const bad = [...body.querySelectorAll("[data-est],[data-act]")].find(i=>{ const v = cfParseMoney(i.value); return v!=null && v<0; });
    if(bad){ formError(body, "Income can't be negative.", bad); return; }
    Q.rows.forEach(r=>{
      const mm = (rec.months[r.m] = rec.months[r.m] || {});
      const e = cfParseMoney(body.querySelector(`[data-est="${r.m}"]`).value);
      const a = cfParseMoney(body.querySelector(`[data-act="${r.m}"]`).value);
      if(e==null) delete mm.est; else mm.est = roundCents(e);
      if(a==null) delete mm.act; else mm.act = roundCents(a);
    });
    const balances = {};
    body.querySelectorAll("[data-bal]").forEach(i=>{ const v = cfParseMoney(i.value); if(v!=null) balances[i.dataset.bal] = roundCents(v); });
    qrec.balances = balances; qrec.asOf = body.querySelector("#cqDate").value || dflt;
    await dbSet("cashflow", String(y), rec); dlg.close(); render();
  });
}

// The Monthly tab's visual sub-view (toggled from its subhead) — this
// month's own numbers, laid out for glancing rather than editing. No
// remaining/available/spent hero here: the subhead directly above already
// carries those three, and repeating them was the original Dashboard-vs-
// Monthly duplication this whole restructure exists to fix.
function renderMonthlyDash(main, ym){
  const mIdx = monthOfYM(ym);
  const wrap = el("div", "stack");

  if(!isMonthSeeded(ym)){
    if(ym < todayYM()) wrap.appendChild(monthNotSetUpCard(ym));
    else appendMonthForecast(wrap, ym);
    main.appendChild(wrap);
    return;
  }

  // Anything flagged for reimbursement leads (it's money to send), then the
  // payment-method split (what was paid how), the per-category detail, and
  // last the month's exchange rate paid. Every figure that adds up to the
  // header's Spent is reconciled to it, so the cards never drift from it by
  // a cent; MXN is the sum of each entry's own rate, never USD times the
  // year's baseline.
  const reimb = reimbursementsCard(ym, mIdx);
  if(reimb) wrap.appendChild(reimb);
  wrap.appendChild(paymentMethodCard(ym, mIdx));
  wrap.appendChild(categoryMxnBreakdownCard(ym, mIdx));
  const fx = fxMonthCard(ym, mIdx);
  wrap.appendChild(fx.card);

  main.appendChild(wrap);

  fx.draw();
}

// One look for every Chart.js tooltip in the app — the card surface, hairline
// border, rounded corners and 2-decimal figures — so charts never fall back
// to Chart.js's default dark-grey box.
function chartTooltip(callbacks, extra){

// Spending by payment method — a donut plus a row per method (all four are
// always listed, at $0 / 0% when unused). USD/MXN toggle is local to this
// card. Same Excluded filter as the month's Spent, and the USD figures are
// allocated by largest remainder so they add up to exactly the header's
// Spent, not a cent off from rounding each entry on its own.
const PAY_METHODS = [["cash","Cash","--cash"],["card","Card","--primary"],["transfer","Bank transfer","--transfer"],["service","Transfer service","--service"]];
function paymentMethodData(ym){
  const baseRate = yearSettings(yearOfYM(ym)).baseRate;
  const data = state.monthCategoryData[ym] || {};
  const excludedIds = new Set(Object.keys(data).filter(id=> data[id] && data[id].excluded));
  const ex = {}; PAY_METHODS.forEach(([k])=> ex[k] = { usd:0, mxn:0, items:[] });
  state.actuals.filter(a=>ymOfDate(a.date)===ym && !excludedIds.has(a.categoryId)).forEach(a=>{
    const rate = a.rate || baseRate;
    const k = ex[a.paymentMethod] ? a.paymentMethod : "card";
    ex[k].usd += toUSD(a.amount||0, a.currency, rate);
    ex[k].mxn += toMXN(a.amount||0, a.currency, rate);
    ex[k].items.push(a);
  });
  const keys = PAY_METHODS.map(([k])=>k);
  const sumUsd = roundCents(keys.reduce((s,k)=> s+ex[k].usd, 0));
  const header = visibleSpentForMonth(ym);
  // Only snap to the header when the gap is rounding-sized; a bigger gap
  // means something else is going on and the honest figure is the sum.
  const totalUsd = Math.abs(header - sumUsd) <= 0.05 ? header : sumUsd;
  const usdVals = allocateCents(keys.map(k=> ex[k].usd), totalUsd);
  const mxnTotal = Math.round(keys.reduce((s,k)=> s+ex[k].mxn, 0));
  const mxnVals = allocateUnits(keys.map(k=> ex[k].mxn), mxnTotal);
  const tenths = allocateTenths(usdVals);
  const out = {};
  keys.forEach((k,i)=>{ out[k] = { usd:usdVals[i], mxn:mxnVals[i], pct:tenths[i]/10, items:ex[k].items }; });
  return { by: out, totalUsd, totalMxn: mxnTotal };
}
function paymentMethodCard(ym, mIdx){
  const card = el("div","card stack");
  const d = paymentMethodData(ym);
  let primary = "USD"; // local to this card only — never written to state
  card.innerHTML = `
    <div class="row" style="align-items:center">
      <div class="eyebrow" style="flex:1">Spending by payment method</div>
      <div class="row" style="gap:4px; flex:none">
        <button type="button" class="btn small active" id="pmUSD">USD</button>
        <button type="button" class="btn small" id="pmMXN">MXN</button>
      </div>
    </div>
    <div id="pmWrap"></div>
  `;
  function donut(){
    const r = 62, cx = 80, cy = 80, C = 2*Math.PI*r;
    let off = 0, arcs = "";
    PAY_METHODS.forEach(([k,,cv])=>{
      const v = d.by[k];
      if(!(v.usd>0) || !(d.totalUsd>0)) return;
      const L = C * v.usd / d.totalUsd;
      const dash = Math.max(L-2, 0.1);
      arcs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:var(${cv})" stroke-width="22" stroke-dasharray="${dash.toFixed(2)} ${(C-dash).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
      off += L;
    });
    const big = primary==="USD" ? fmtUSD(d.totalUsd) : fmtMXN(d.totalMxn);
    const small = primary==="USD" ? fmtMXN(d.totalMxn) : fmtUSD(d.totalUsd);
    return `<svg width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Spent ${escapeHtml(big)}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:var(--surface-2)" stroke-width="22"/>
      <g transform="rotate(-90 ${cx} ${cy})">${arcs}</g>
      <text x="${cx}" y="${cy-8}" style="fill:var(--ink-soft)" font-size="11" text-anchor="middle">Spent</text>
      <text x="${cx}" y="${cy+10}" style="fill:var(--ink)" font-size="16" font-weight="700" text-anchor="middle">${big}</text>
      <text x="${cx}" y="${cy+26}" style="fill:var(--ink-soft)" font-size="11" text-anchor="middle">${small}</text>
    </svg>`;
  }
  function renderBody(){
    card.querySelector("#pmWrap").innerHTML = `
      <div style="display:flex; justify-content:center; margin:10px 0 6px">${donut()}</div>
      ${PAY_METHODS.map(([k,label,cv])=>{
        const v = d.by[k];
        const n = v.items.length;
        const main_ = primary==="USD" ? fmtUSD(v.usd) : fmtMXN(v.mxn);
        const alt = primary==="USD" ? fmtMXN(v.mxn) : fmtUSD(v.usd);
        const tappable = n>0;
        return `
          <div class="row ${tappable?"taprow":""}" ${tappable?`role="button" tabindex="0" data-pm="${k}"`:""} style="gap:10px; padding:9px 0; border-top:1px solid var(--line); align-items:flex-start; ${tappable?"":"opacity:.6"}">
            <span style="width:10px; height:10px; border-radius:3px; background:var(${cv}); margin-top:4px; flex:none"></span>
            <span style="flex:1; min-width:0">
              <span style="display:block; font-weight:600; font-size:14px">${label} <span class="muted" style="font-weight:500; font-size:12px">· ${v.pct.toFixed(1)}%</span></span>
              <span class="muted" style="display:block; font-size:11px">${n} ${n===1?"entry":"entries"}</span>
            </span>
            <span style="text-align:right"><span class="num" style="display:block; font-weight:600; font-size:14px">${main_}</span><span class="num muted" style="display:block; font-size:11px">${alt}</span></span>
            <span class="rowchev" style="margin-top:3px; ${tappable?"":"visibility:hidden"}">${iconChevronRight()}</span>
          </div>`;
      }).join("")}
    `;
    card.querySelectorAll("[data-pm]").forEach(r=>{
      const open = ()=> openPaymentMethodSheet(ym, r.dataset.pm, primary);
      r.onclick = open;
      r.onkeydown = (ev)=>{ if(ev.key==="Enter" || ev.key===" "){ ev.preventDefault(); open(); } };
    });
  }
  function setPrimary(cur){
    primary = cur;
    card.querySelector("#pmUSD").classList.toggle("active", cur==="USD");
    card.querySelector("#pmMXN").classList.toggle("active", cur==="MXN");
    renderBody();
  }
  card.querySelector("#pmUSD").onclick = ()=> setPrimary("USD");
  card.querySelector("#pmMXN").onclick = ()=> setPrimary("MXN");
  renderBody();
  return card;
}
// Read-only list of the entries behind one payment-method row — same filter

  body.innerHTML = `

    <div class="dialog-actions"><button class="btn ghost" id="pmClose">Close</button></div>
  `;
  body.querySelector("#pmClose").onclick = ()=> dlg.close();
  openSheet();
}

// Exchange rate paid, this month. Two views of the same entries (those that
// carry a rate — cash at the ATM rate, card charges at the statement rate,
// transfer-service transfers at the service's rate; bank transfers carry none):
//  - By date: one dot per entry on a day axis. Hollow = dated after today.
//  - By rate: one row per rate, bar = dollars spent at it. The default — it
//    answers "what rates did I pay", and it still reads when most entries
//    share a date (imports, scheduled-only months), where a date axis just
//    stacks everything into one column.
// The average and "cost you / saved you" come from the same
// exchangeImpactForMonth the rest of the app already uses.
function fxMonthCard(ym, mIdx){
  const card = el("div","card stack");
  const baseRate = yearSettings(yearOfYM(ym)).baseRate;
  const entries = state.actuals
    .filter(a=>ymOfDate(a.date)===ym && a.amount && a.rate)
    .sort((a,b)=> a.date<b.date ? -1 : a.date>b.date ? 1 : 0);
  const todayStr = new Date().toISOString().slice(0,10);
  const scheduled = entries.filter(a=> a.date > todayStr).length;
  const fx = exchangeImpactForMonth(ym);
  let view = "rate"; // always opens on By rate; local to this card, never written to state
  const deltaTxt = fx ? (fx.deltaUSD<=0 ? "Saved you "+fmtUSD(Math.abs(fx.deltaUSD)) : "Cost you "+fmtUSD(fx.deltaUSD)) : "";
  const deltaCol = fx && fx.deltaUSD<=0 ? "var(--good)" : "var(--bad)";
  const statsHTML = fx ? `
    <div class="row" style="align-items:flex-start; gap:16px; justify-content:flex-start">
      <div><div class="muted" style="font-size:11px">Avg rate paid</div><div class="num" style="font-weight:700; font-size:16px">${fx.avgRate.toFixed(2)}</div></div>
      <div><div class="muted" style="font-size:11px">vs. baseline ${baseRate.toFixed(2)}</div><div class="num" style="font-weight:700; font-size:16px; color:${deltaCol}">${deltaTxt}</div></div>
    </div>` : "";
  const footHTML = (hint)=> `<div class="muted" style="font-size:11px">${entries.length} ${entries.length===1?"entry":"entries"} with a rate${scheduled?`; ${scheduled} dated after today`:""}. ${hint}</div>`;
  card.innerHTML = entries.length ? `
    <div class="row" style="align-items:center">
      <div class="eyebrow" style="flex:1">Exchange rate paid</div>
      <button type="button" class="infobtn" id="fxDetail" aria-label="View entries with a rate">${iconDocument()}</button>
    </div>
    <div class="row" style="gap:4px; justify-content:flex-start">
      <button type="button" class="btn small" id="fxByRate">By rate</button>
      <button type="button" class="btn small" id="fxByDate">By date</button>
    </div>
    <div id="fxBody" class="stack"></div>
  ` : `
    <div class="eyebrow">Exchange rate paid</div>
    <div class="empty">No rate entries logged yet this month.</div>
  `;
  const detailBtn = card.querySelector("#fxDetail");
  if(detailBtn) detailBtn.onclick = ()=> openRateEntriesSheet(`Exchange rate paid, ${MONTHS[mIdx]}`, entries, baseRate);

  // By-rate rows: one per distinct rate (rounded to 0.05 buckets once there
  // are more than ten, so the list stays short). Bars are dollars at that
  // rate; green = better than baseline, red = worse. Tap a row for a tooltip
  // styled like the chart tooltips.
  function rateGroups(){
    let key = a=> Math.round(a.rate*10000)/10000;
    if(new Set(entries.map(key)).size > 10) key = a=> Math.round(a.rate/0.05)*0.05;
    const g = new Map();
    entries.forEach(a=>{ const k = key(a); (g.get(k) || g.set(k,[]).get(k)).push(a); });
    return [...g.entries()].sort((x,y)=> y[0]-x[0]).map(([rate,list])=>({ rate, list, usd: roundCents(list.reduce((t,a)=> t+toUSD(a.amount, a.currency, a.rate), 0)) }));
  }
  function renderRateView(body){
    const groups = rateGroups();
    const max = Math.max(...groups.map(g=>g.usd)) || 1;
    body.innerHTML = `
      <div class="muted" style="font-size:11px">Dollars spent at each rate. Green is better than your ${baseRate.toFixed(2)} baseline, red is worse.</div>
      <div class="stack" style="gap:2px" id="fxRows">
        ${groups.map((g,i)=>{
          const diff = g.rate - baseRate, same = Math.abs(diff) < 0.005;
          const col = same ? "var(--primary)" : diff>0 ? "var(--good)" : "var(--bad)";
          return `
          <div data-grp="${i}" style="position:relative; display:grid; grid-template-columns:62px 1fr 96px; column-gap:8px; align-items:center; padding:7px 0; cursor:pointer">
            <span><span class="num" style="display:block; font-weight:700; font-size:14px">${g.rate.toFixed(2)}</span><span class="muted" style="display:block; font-size:11px">${same?"baseline":(diff>0?"+":"")+diff.toFixed(2)}</span></span>
            <span style="display:block; height:16px; border-radius:6px; background:var(--surface-2)"><span style="display:block; height:100%; width:${(g.usd/max*100).toFixed(1)}%; min-width:4px; border-radius:6px; background:${col}"></span></span>
            <span style="text-align:right"><span class="num" style="display:block; font-weight:600; font-size:13px">${fmtUSD(g.usd)}</span><span class="muted" style="display:block; font-size:11px">${g.list.length} ${g.list.length===1?"entry":"entries"}</span></span>
          </div>`;
        }).join("")}
      </div>
      ${statsHTML}
      ${footHTML("Tap a row for details.")}
    `;
    let openTip = null;
    function closeTip(){ if(openTip){ openTip.remove(); openTip = null; } }
    body.querySelectorAll("[data-grp]").forEach(row=>{
      row.onclick = (ev)=>{
        ev.stopPropagation();
        const wasOpen = openTip && openTip.parentNode === row;
        closeTip();
        if(wasOpen) return;
        const g = groups[Number(row.dataset.grp)];
        const names = g.list.map(a=> a.name || "Expense");
        const shown = names.slice(0,3).join(", ") + (names.length>3 ? `, +${names.length-3} more` : "");
        const t = el("div");
        t.style.cssText = "position:absolute; left:70px; right:8px; top:100%; z-index:5; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; line-height:1.4; box-shadow:0 4px 14px rgba(0,0,0,.25)";
        t.innerHTML = `<div style="font-weight:600; color:var(--ink)">${g.rate.toFixed(2)} · ${g.list.length} ${g.list.length===1?"entry":"entries"}</div><div style="color:var(--ink-soft)">${escapeHtml(shown)}</div><div style="color:var(--ink-soft)">${fmtUSD(g.usd)} at this rate</div>`;
        row.appendChild(t); openTip = t;
      };
    });
    body.onclick = closeTip;
  }

  function renderDateView(body){
    body.innerHTML = `
      <div style="position:relative; height:190px"><canvas id="chartFxMonth"></canvas></div>
      <div class="row" style="justify-content:flex-start; gap:12px; flex-wrap:wrap; font-size:11px">
        <span class="muted"><span style="display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--primary); margin-right:4px"></span>Entry</span>
        <span class="muted"><span style="display:inline-block; width:7px; height:7px; border-radius:50%; border:1.5px solid var(--primary); margin-right:4px"></span>Dated after today</span>
        <span class="muted"><span style="display:inline-block; width:14px; border-top:1.5px dashed var(--ink-soft); margin-right:4px; vertical-align:middle"></span>Baseline ${baseRate.toFixed(2)}</span>
        <span class="muted"><span style="display:inline-block; width:14px; border-top:2px solid var(--accent); margin-right:4px; vertical-align:middle"></span>Month average</span>
      </div>
      ${statsHTML}
      ${footHTML("Tap a dot for details.")}
    `;
    drawDateChart(body.querySelector("#chartFxMonth"));
  }

  function drawDateChart(ctx){
    if(!ctx || typeof Chart==="undefined") return;
    const dim = new Date(yearOfYM(ym), mIdx+1, 0).getDate();
    const seen = {};
    const pts = entries.map(a=>{
      const day = parseInt(a.date.slice(8,10),10);
      const k = day+"|"+a.rate.toFixed(2);
      seen[k] = (seen[k]||0) + 1;
      return { x: day + (seen[k]-1)*0.3, y: a.rate, a, day, future: a.date > todayStr };
    });
    const rates = entries.map(a=>a.rate).concat([baseRate]);
    // Axis snaps to 0.2 steps so the ticks are round numbers (18.00, 18.20…)
    // instead of whatever min/max the data happens to have.
    const lo = Math.floor((Math.min(...rates) - 0.05) / 0.2 + 1e-9) * 0.2;
    const hi = Math.ceil((Math.max(...rates) + 0.05) / 0.2 - 1e-9) * 0.2;
    const primary = cssVar("--primary"), soft = cssVar("--ink-soft");
    const datasets = [
      { label:"Entry", isPoint:true, data: pts.filter(p=>!p.future), backgroundColor: primary, borderColor: primary, pointRadius:4.5, pointHoverRadius:7 },
      { label:"Dated after today", isPoint:true, data: pts.filter(p=>p.future), backgroundColor: cssVar("--surface"), borderColor: primary, borderWidth:1.5, pointRadius:4.5, pointHoverRadius:7 },
      { type:"line", label:"Baseline", data:[{x:0,y:baseRate},{x:dim+1,y:baseRate}], borderColor: soft, borderDash:[5,4], borderWidth:1.5, pointRadius:0, tension:0 },
    ];
    if(fx) datasets.push({ type:"line", label:"Month average", data:[{x:0,y:fx.avgRate},{x:dim+1,y:fx.avgRate}], borderColor: cssVar("--accent"), borderWidth:2, pointRadius:0, tension:0 });
    try{
      if(charts.fxMonth) charts.fxMonth.destroy();
      charts.fxMonth = new Chart(ctx, {
        type:"scatter",
        data:{ datasets },
        options:{
          responsive:true, maintainAspectRatio:false,
          interaction:{ mode:"nearest", intersect:true },
          plugins:{
            legend:{ display:false },
            tooltip: chartTooltip({
              title:(items)=>{ const r = items[0].raw; return `${r.a.name || "Entry"} · ${MONTHS[mIdx]} ${r.day}`; },
              label:(c)=>{
                const r = c.raw, a = r.a;
                const amt = a.currency==="MXN" ? fmtMXN(a.amount) : fmtUSD(a.amount);
                return [`${amt} at ${a.rate.toFixed(4)}`].concat(r.future ? ["Dated after today"] : []);
              },
            }, { filter:(item)=> !!item.dataset.isPoint }),
          },
          scales:{
            x:{ type:"linear", min:0, max:dim+1, ticks:{ color:soft, stepSize:5, callback:(v)=> (v>=1 && v<=dim) ? v : "" }, grid:{display:false} },
            y:{ min:lo, max:hi, ticks:{ color:soft, stepSize:0.2, callback:(v)=> Number(v).toFixed(2) }, grid:{color:cssVar("--line")} },
          },
        },
      });
    } catch(e){ chartRenderError(ctx, e); }
  }

  function renderView(){
    const body = card.querySelector("#fxBody");
    if(!body) return;
    card.querySelector("#fxByDate").classList.toggle("active", view==="date");
    card.querySelector("#fxByRate").classList.toggle("active", view==="rate");
    if(view!=="date" && charts.fxMonth){ charts.fxMonth.destroy(); charts.fxMonth = null; }
    view==="date" ? renderDateView(body) : renderRateView(body);
  }
  if(entries.length){
    card.querySelector("#fxByDate").onclick = ()=>{ view = "date"; renderView(); };
    card.querySelector("#fxByRate").onclick = ()=>{ view = "rate"; renderView(); };
  }
  return { card, draw: renderView };
}

// Read-only drawer listing the entries behind a rate card — same standard

function sheetDate(iso){ return `${MONTHS[parseInt(iso.slice(5,7),10)-1].slice(0,3)} ${parseInt(iso.slice(8,10),10)}`; }

// Reimbursements due — expenses flagged "Reimburse to" for this month,
// totalled per person. Name + total only; the document icon opens the read-only list.
// Omitted entirely when nothing is flagged.
function reimbursementTotalsForMonth(ym){
  const baseRate = yearSettings(yearOfYM(ym)).baseRate;
  const out = {};
  state.actuals.forEach(a=>{
    if(!a.reimburseTo || ymOfDate(a.date)!==ym) return;
    const o = out[a.reimburseTo] || (out[a.reimburseTo] = { usd:0, items:[] });
    o.usd = roundCents(o.usd + toUSD(a.amount||0, a.currency, a.rate||baseRate));
    o.items.push(a);
  });
  return out;
}
function reimbursementsCard(ym, mIdx){
  const totals = reimbursementTotalsForMonth(ym);
  const people = REIMBURSE_OPTIONS.filter(o=> o.id && totals[o.id]);
  if(!people.length) return null;

      ${people.map(o=>`
        <div class="row taprow" role="button" tabindex="0" data-person="${o.id}" aria-label="View expenses to reimburse ${escapeHtml(o.label)}" style="align-items:center; gap:10px; background:var(--surface-2); border-radius:10px; padding:10px 12px">
          <span style="flex:1; font-weight:600">${escapeHtml(o.label)}</span>

}

    <div class="row" style="align-items:center"><span class="muted" style="flex:1">Total to send</span><span class="num" style="font-weight:700; font-size:16px; color:var(--accent)">${fmtUSD(t.usd)}</span></div>
    <div class="dialog-actions"><button class="btn ghost" id="reClose">Close</button></div>

// Per-category USD/MXN/effective-rate breakdown for the month — a table,
// not a chart: past ~7-8 classes (the dataviz skill's ceiling), a ranked
// bar or chart stops being reliably distinguishable and a table is the
// right form regardless of color. Sorted largest-spend-first in USD, a
// fixed order that doesn't reshuffle when the USD/MXN toggle is flipped
// (reshuffling rows on every toggle would make the table harder to scan,
// not easier). The toggle only changes which currency reads as primary
// (bold) vs. secondary (muted, smaller) — both are always visible, so
// switching never hides data, consistent with every other USD/MXN control
// in this app being local to its own card, never a global setting.
// monthCategoryList(ym), not state.categories, so month-local categories'
// spend shows up here too.
function categoryMxnBreakdownForMonth(catId, ym){
  const baseRate = yearSettings(yearOfYM(ym)).baseRate;
  let usd = 0, mxn = 0;
  state.actuals.filter(a=>a.categoryId===catId && ymOfDate(a.date)===ym).forEach(a=>{
    const rate = a.rate || baseRate;
    const amt = a.amount || 0;
    if(a.currency==="MXN"){ mxn += amt; usd += amt/rate; }
    else { usd += amt; mxn += amt*rate; }
  });
  const usdExact = usd, mxnExact = mxn;
  usd = roundCents(usd);
  mxn = roundCents(mxn);
  return { usd, mxn, usdExact, mxnExact, rate: usd>0 ? mxn/usd : baseRate };
}
function categoryMxnBreakdownCard(ym, mIdx){
  const card = el("div","card stack");
  const rows = monthCategoryList(ym)
    .map(c=> ({ c, excluded: !!(c.entry && c.entry.excluded), ...categoryMxnBreakdownForMonth(c.id, ym) }))
    .filter(r=> r.usd > 0)
    .sort((a,b)=> b.usd - a.usd);
  // Excluded rows stay in the list (their own real numbers are never
  // hidden, same as everywhere else this works) but drop out of the Total
  // and the % — the same category whose spend doesn't count toward this
  // month in the ledger shouldn't count toward this card's Total either.
  // The counted rows are allocated by largest remainder so they add up to
  // exactly the header's Spent (only when the gap is rounding-sized).
  const counted = rows.filter(r=>!r.excluded);
  const sumUsd = roundCents(counted.reduce((s,r)=> s+r.usdExact, 0));
  const header = visibleSpentForMonth(ym);
  const totalUsd = Math.abs(header - sumUsd) <= 0.05 ? header : sumUsd;
  const usdVals = allocateCents(counted.map(r=> r.usdExact), totalUsd);
  const totalMxn = Math.round(counted.reduce((s,r)=> s+r.mxnExact, 0));
  const mxnVals = allocateUnits(counted.map(r=> r.mxnExact), totalMxn);
  const tenths = allocateTenths(usdVals);
  counted.forEach((r,i)=>{ r.usd = usdVals[i]; r.mxn = mxnVals[i]; r.pct = tenths[i]/10; });
  let primary = "USD"; // local to this card only — never written to state

  // The rate stays on each row's sub line next to its share of the month —
  // "Rate X MXN/USD" can only read as the exchange rate used for the row.
  function amtCell(usd, mxn, bold){
    const primaryText = primary==="USD" ? fmtUSD(usd) : fmtMXN(mxn);
    const secondaryText = primary==="USD" ? fmtMXN(mxn) : fmtUSD(usd);
    return `<span class="num" style="display:block; font-weight:${bold?700:600}; font-size:${bold?'14px':'13px'}">${primaryText}</span><span class="num muted" style="display:block; font-size:11px">${secondaryText}</span>`;
  }

  function renderBody(){
    const wrap = card.querySelector("#bdWrap");
    wrap.innerHTML = rows.length ? `
      <div class="stack" style="gap:0">
        ${rows.map(r=>`
          <div class="taprow" role="button" tabindex="0" data-cat="${escapeHtml(r.c.id)}" style="padding:9px 0; border-top:1px solid var(--line); ${r.excluded?"opacity:.55":""}">
            <div class="row" style="align-items:center; gap:8px">
              <span style="flex:1; min-width:0">
                <span class="name" style="display:block; font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${escapeHtml(r.c.name)}${r.excluded?` <span class="muted" style="font-weight:500; font-size:11px">· excluded</span>`:""}</span>
                <span class="muted num" style="display:block; font-size:11px">${r.excluded ? "" : `${r.pct.toFixed(1)}% of spend · `}Rate ${r.rate.toFixed(2)}</span>
              </span>
              <span style="text-align:right">${amtCell(r.usd, r.mxn, false)}</span>
              <span class="rowchev" aria-hidden="true">${iconChevronRight()}</span>
            </div>
            ${r.excluded ? "" : `<div class="catbar" style="margin-top:6px; height:5px"><div style="width:${Math.max(0, Math.min(100, r.pct))}%; min-width:3px; background:var(--primary)"></div></div>`}
          </div>
        `).join("")}
      </div>
      <div class="row" style="padding-top:10px; align-items:center; border-top:1px solid var(--line)">
        <span style="font-weight:700; flex:1">Total <span class="muted" style="font-weight:500; font-size:12px">· 100%</span></span>
        <span style="text-align:right">${amtCell(totalUsd, totalMxn, true)}</span>
      </div>
    ` : `<div class="empty">Nothing logged yet this month.</div>`;
    wrap.querySelectorAll("[data-cat]").forEach(r=>{
      const open = ()=> openMonthlyCategoryDetailSheet(r.dataset.cat, ym);
      r.onclick = open;
      r.onkeydown = (ev)=>{ if(ev.key==="Enter" || ev.key===" "){ ev.preventDefault(); open(); } };
    });
  }

  card.innerHTML = `
    <div class="row" style="align-items:center">
      <div class="eyebrow" style="flex:1">Spending by category</div>
      <div class="row" style="gap:4px; flex:none">
        <button type="button" class="btn small ${primary==="USD"?"active":""}" id="bdUSD">USD</button>
        <button type="button" class="btn small ${primary==="MXN"?"active":""}" id="bdMXN">MXN</button>
      </div>
    </div>
    <div id="bdWrap"></div>
  `;
  function setPrimary(cur){
    primary = cur;
    card.querySelector("#bdUSD").classList.toggle("active", primary==="USD");
    card.querySelector("#bdMXN").classList.toggle("active", primary==="MXN");
    renderBody();
  }
  card.querySelector("#bdUSD").onclick = ()=> setPrimary("USD");
  card.querySelector("#bdMXN").onclick = ()=> setPrimary("MXN");
  renderBody();
  return card;
}

   RENDER: ANNUAL OUTLOOK
