<!doctype html>
<meta charset="utf-8">
<title>Ledger Casa</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger Casa">
<meta name="theme-color" content="#1A2C28">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#F6F3EC;
    --surface:#FFFFFF;
    --surface-2:#EFEAE0;
    --ink:#1E2A28;
    --ink-soft:#5B6B67;
    --line:#DDD6C8;
    --primary:#1D3B36;
    --primary-ink:#F6F3EC;
    --accent:#B8862E;
    --accent-ink:#FFFFFF;
    --good:#3F8F5F;
    --good-bg:#E4F2E9;
    --bad:#B23B3B;
    --bad-bg:#FBE7E7;
    --status-met:#4A6B8A;
    --cash:#B8862E;
    --cash-bg:#F7ECD6;
    --transfer:#4E7A8F;
    --transfer-bg:#E4EDF0;
    --service:#7A5BA6;
    --shadow: 0 1px 2px rgba(30,42,40,.06), 0 4px 16px rgba(30,42,40,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12201D;
      --surface:#1A2C28;
      --surface-2:#213732;
      --ink:#EDEDE4;
      --ink-soft:#9DB0AB;
      --line:#2C443E;
      --primary:#8FC9B4;
      --primary-ink:#0E1917;
      --accent:#E0B15C;
      --accent-ink:#1E1608;
      --good:#6BC08C;
      --good-bg:#1C3A2A;
      --bad:#E08585;
      --bad-bg:#3B2222;
      --status-met:#7CAFCE;
      --cash:#E0B15C;
      --cash-bg:#3A2E17;
      --transfer:#7FB3CC;
      --transfer-bg:#1E3540;
    --service:#B79BD8;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12201D;
    --surface:#1A2C28;
    --surface-2:#213732;
    --ink:#EDEDE4;
    --ink-soft:#9DB0AB;
    --line:#2C443E;
    --primary:#8FC9B4;
    --primary-ink:#0E1917;
    --accent:#E0B15C;
    --accent-ink:#1E1608;
    --good:#6BC08C;
    --good-bg:#1C3A2A;
    --bad:#E08585;
    --bad-bg:#3B2222;
    --status-met:#7CAFCE;
    --cash:#E0B15C;
    --cash-bg:#3A2E17;
    --transfer:#7FB3CC;
    --transfer-bg:#1E3540;
    --service:#B79BD8;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  *{box-sizing:border-box}
  /* 100vh, not 100%: on iOS 26 Home Screen apps using black-translucent +
     viewport-fit=cover, a 100%-tall html/body is measured against a
     containing block that stops short of the physical screen (WebKit bug
     301108). Unverified on-device whether this alone closes it — see the
     viewport readout in Settings > About. */
  html,body{height:100vh}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Work Sans', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces', Georgia, serif; font-weight:600; text-wrap:balance; margin:0}
  .num{font-family:'IBM Plex Mono', 'Courier New', monospace; font-variant-numeric:tabular-nums}
  button, input, select{font-family:inherit; font-size:inherit; color:inherit}
  a{color:var(--primary)}

  /* min-height uses the DYNAMIC viewport unit (dvh), not just 100% — a
     short page (e.g. an unconfigured month's single CTA card) has nothing
     to scroll, so the mobile browser's address bar never collapses, and a
     100%-tall #app would stop short of the true visible bottom. Sizing
     against 100dvh instead means #app always fills the actual visible
     viewport regardless of content length, so main's flex:1 (below) has
     real remaining space to fill and nav.tabs — the last flex child,
     position:sticky — lands flush with the real screen edge on every
     screen, short or tall. 100% stays first as the fallback for browsers
     without dvh support. */
  #app{max-width:640px; margin:0 auto; padding-inline:16px; min-height:100%; min-height:100dvh; display:flex; flex-direction:column}

  /* Sticky header + subhead move together as one unit, so a per-tab
     subhead always sits flush under the app header regardless of the
     app header's own height. */
  #stickyTop{ position:sticky; top:0; z-index:5; background:var(--bg); padding-top:env(safe-area-inset-top,0px) }
  /* Swipe's live preview pieces — fixed overlays positioned over the real
     subhead/toggle/main's own rects at drag start, parked off to one side
     until the drag reveals them. Above the live sticky header (z-index 5)
     so a dragged-in preview of the subhead/toggle is never hidden behind
     it; below the bottom nav (10), which a drag should never cover. */
  .swipe-ghost{ position:fixed; z-index:6; overflow:hidden; pointer-events:none; background:var(--bg) }

  /* App identity — left side of the single header row, no row of its
     own. Compact so it doesn't fight the date widget on the right for
     space on narrow phones. */
  .brand-row{
    display:flex; align-items:center; gap:8px; flex:none;
  }
  .brand-row img{ width:24px; height:24px; border-radius:6px; flex:none; display:block }
  .brand-row span{
    font-family:'Fraunces',serif; font-size:15px; font-weight:600;
    letter-spacing:.03em; text-transform:uppercase; color:var(--ink-soft);
    white-space:nowrap;
  }
  header.top{
    background:var(--bg); padding-block:10px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-bottom:1px solid var(--line);
  }
  /* The floated label (below) needs room below the icon before the
     border — but only on tabs that actually show the widget. Toggled by
     renderHeaderStepper() so Budget Setup/Settings stay at the tighter
     10px and don't grow just because this rule exists. */
  header.top.has-stepper{ padding-bottom:26px; }
  /* The one place the current period is ever shown — Monthly steps by
     month, Annual Outlook steps by year; Budget Setup is a template and
     Settings has its own independent year control, so both render
     nothing here. A single compact widget, right side of the same row as
     the brand (not a row of its own — that left too much dead space):
     chevrons flank the calendar icon, which is the real tap target —
     opening month+year picker (Year Grid) on Monthly, year-only picker
     on Outlook — with a small caps label inline naming the period. The
     chevrons just step by one unit, no dialog. */
  .hdr-stepper{display:flex; align-items:center; gap:2px; min-width:0}
  .hdr-stepper .navbtn-ghost{
    background:none; border:none; color:var(--ink-soft); cursor:pointer;
    width:28px; height:28px; font-size:17px; display:flex; align-items:center;
    justify-content:center; padding:0; flex:none;
  }
  .hdr-stepper .navbtn-ghost:active{ opacity:.6 }
  .hdr-stepper .navbtn-ghost:disabled{ opacity:.3; cursor:default }
  .hdr-stepper .cal-btn{
    background:none; border:none; color:var(--ink); cursor:pointer;
    width:28px; height:28px; display:flex; align-items:center; justify-content:center;
    padding:0; flex:none;
  }
  .hdr-stepper .cal-btn:active{ opacity:.6 }
  /* cal-stack sizes to the icon alone (not the label) — the label is
     pulled out of flow and floated underneath it instead of sharing the
     stack's width, so it can't inflate this box and push the arrows away
     from the icon. That also means the stepper's total width is always
     just icon+arrows, constant regardless of label text, which is what
     stops the whole cluster from shifting Monthly <-> Outlook. */
  .hdr-stepper .cal-stack{ position:relative }
  .hdr-stepper .hdr-label2{
    position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:2px;
    font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    color:var(--ink-soft); white-space:nowrap;
  }

  /* Per-tab subhead — status + the one action that matters most while
     scrolling that tab. Empty/hidden on tabs with nothing to pin. */
  .subhead{
    display:none; align-items:center; gap:10px; padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .subhead.show{ display:flex }
  .subhead .sh-info{ display:flex; flex-direction:column; gap:1px; min-width:0; flex:1 }
  .subhead .sh-label{ font-family:'Fraunces',serif; font-size:17px; font-weight:600; white-space:nowrap }
  .subhead .sh-sub{ font-size:12px }
  .subhead .sh-tiny{ font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft) }
  .subhead .sh-amt{ font-size:14px; font-weight:600 }
  .subhead .sh-actions{ display:flex; align-items:center; gap:8px; flex:none }
  .navbtn{
    width:44px; height:44px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-size:15px; cursor:pointer; flex:none;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .navbtn:disabled{ opacity:.35; cursor:default }
  .subhead .iconbtn{
    width:34px; height:34px; border-radius:50%; border:1px solid transparent;
    background:var(--accent); color:var(--accent-ink); font-size:19px; cursor:pointer; flex:none;
    display:flex; align-items:center; justify-content:center; padding:0; line-height:1;
  }
  .subhead .iconbtn:active{ opacity:.85 }
  .subhead .iconbtn{ position:relative }
  .iconbtn-badge{
    position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; padding:0 3px;
    border-radius:999px; background:var(--primary); color:#fff; font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center; line-height:1; pointer-events:none;
  }
  /* Slider-icon state dot, bottom-left so it never collides with the badge
     number (top-right). Yellow 14px = at least one category Excluded (and
     the only dot that ever pulses). Its 4px centre = Rollover: green for
     surplus carried in, red for a deficit. With nothing Excluded, Rollover
     alone is a 10px dot (6px core + the 2px ring) — deliberately larger
     than the 4px centre, since alone it has to read without the yellow. */
  .iconbtn-dot{
    position:absolute; bottom:-3px; left:-3px; width:14px; height:14px;
    border-radius:50%; background:var(--accent); border:2px solid var(--bg);
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .iconbtn-dot i{ display:block; width:4px; height:4px; border-radius:50% }
  .iconbtn-dot i.pos{ background:var(--good) }
  .iconbtn-dot i.neg{ background:var(--bad) }
  .iconbtn-dot.solo{ width:10px; height:10px; bottom:-1px; left:-1px }
  .iconbtn-dot.solo.pos{ background:var(--good) }
  .iconbtn-dot.solo.neg{ background:var(--bad) }
  .iconbtn-dot.pulse{ animation:dotPulse .6s ease-out; }
  @keyframes dotPulse{
    0%{ box-shadow:0 0 0 0 rgba(227,178,92,.55); }
    100%{ box-shadow:0 0 0 14px rgba(227,178,92,0); }
  }
  /* Transfer funds + Ledger/Dashboard toggle — pinned as the bottom slice
     of the sticky header stack (brand row, subhead, this), so it's always
     reachable without scrolling back up, on every tab it applies to. Empty
     and hidden on every tab but Monthly (renderSubhead fills/clears it). */
  .monthly-toggle-sticky{ display:none; padding-bottom:10px; border-bottom:1px solid var(--line) }
  .monthly-toggle-sticky.show{ display:block }
  /* Ledger/Dashboard view toggle — its own row, not the subhead itself (too
     tight on a real phone width once the Available/Spent/Surplus stats are
     already there). Labeled, not just icon-only, since it now has room to
     say what it does. */
  .viewtoggle-row{ display:flex; align-items:center; justify-content:space-between; gap:10px }
  .viewtoggle{
    display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; flex:none;
  }
  .viewbtn{
    display:flex; align-items:center; gap:6px; padding:8px 14px; border:none;
    background:var(--surface); color:var(--ink-soft); font-weight:600; font-size:12px; cursor:pointer;
  }
  .viewbtn + .viewbtn{ border-left:1px solid var(--line) }
  .viewbtn.active{ background:var(--primary); color:var(--primary-ink) }

  /* touch-action is read once, at the moment a touch begins, before any JS
     runs — so it can stop the browser's own native handling of horizontal
     movement on this element (panning, rubber-band bounce) from engaging
     at all, whereas wireSwipeNav's e.preventDefault() only fires after
     it's classified the drag as horizontal (past an 8px threshold), by
     which point native handling already had a few pixels to react to.
     pan-y keeps ordinary vertical scrolling working exactly as before —
     it only hands off horizontal movement to wireSwipeNav's own JS. This
     plus that preventDefault() is what actually keeps the page from
     scrolling during a horizontal swipe (see wireSwipeNav's comment on
     why that's no longer also done by locking html/body's overflow). */
  main{flex:1; padding-top:18px; display:flex; flex-direction:column; gap:20px; touch-action:pan-y}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:18px; box-shadow:var(--shadow);
  }
  .card + .card{margin-top:0}
  .stack{display:flex; flex-direction:column; gap:14px}

  /* Settings: groups the year-scoped cards (selector, data, budget, rate,
     funds) into one bordered panel so they read as a single unit instead
     of five separate cards. A tinted background (same --surface-2 used
     for .banner's highlight) is what sets it apart from the plain cards
     before/after it; a top-border rule above each .yp-section (not the
     first, the year selector itself) stands in for the gaps a separate
     .card would otherwise have. */
  .yearpanel{ background:var(--surface-2); display:flex; flex-direction:column; gap:20px; }
  .yearpanel .yp-head{ padding-bottom:14px; }
  .yearpanel .yp-section{ padding:18px 0 0; border-top:1px solid var(--line); }
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  @media (max-width:420px){ .grid2{grid-template-columns:1fr} }

  .eyebrow{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); font-weight:600}
  .big{font-size:34px; font-weight:600}
  .muted{color:var(--ink-soft); font-size:13px}

  .pill{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600}
  .pill.good{background:var(--good-bg); color:var(--good)}
  .pill.bad{background:var(--bad-bg); color:var(--bad)}
  .pill.cash{background:var(--cash-bg); color:var(--cash)}
  .pill.transfer{background:var(--transfer-bg); color:var(--transfer)}
  .pill.pmcard{background:var(--surface-2); color:var(--primary)}
  .pill.neutral{background:var(--surface-2); color:var(--ink-soft)}

  .catbar{height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden}
  .catbar > div{height:100%; border-radius:999px}

  .catrow{display:flex; flex-direction:column; gap:6px; padding:12px 0; border-bottom:1px solid var(--line)}
  .catrow:last-child{border-bottom:none}
  /* Excluded rows: the content dims, the buttons don't — they all still
     work, so they shouldn't look disabled. */
  .catrow.is-excluded > :not(.head), .catrow.is-excluded .head .name{ opacity:.6 }
  .setuprow.is-excluded .name-wrap, .setuprow.is-excluded .amt{ opacity:.6 }
  .catrow .head{display:flex; justify-content:space-between; align-items:center; gap:8px}
  .catrow .head .name{font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .catrow .head .amt{font-size:14px}
  .catrow .head .chev{color:var(--ink-soft); font-size:18px; flex:none}
  .rowchev{ color:var(--ink-soft); flex:none; display:flex; align-items:center }
  .taprow{ cursor:pointer }
  .taprow:active{ background:var(--surface-2) }
  .infobtn{
    flex:none; width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink-soft); font-size:15px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .infobtn:active{ background:var(--line) }
  /* Same accent treatment as .subhead .iconbtn (the fund-adjustments
     button) and .btn.accent (Add Expense, etc.) — for the two "+" buttons
     that add a NEW category/row to a list, as opposed to every other
     .infobtn circle on a row, which only ever acts on that one existing
     category (manage, log an expense, toggle excluded) and should read as
     secondary next to it. */
  .infobtn.accent{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent) }
  .infobtn.accent:active{ opacity:.85; background:var(--accent) }
  /* Bare icon buttons for a tight row — Fund adjustments' rows carry a
     full sentence of description plus an amount already, so the fuller
     circle-button treatment above (.infobtn) would crowd a narrow phone;
     these are just the glyph, no background, sized to match the "delete"
     text link they replace. */
  .fa-iconbtn{
    flex:none; background:none; border:none; padding:4px; margin:-4px 0;
    color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  }
  .fa-iconbtn:active{ color:var(--ink) }

  /* A single clean tap target — no inline controls competing for space.
     Opens a detail sheet instead of growing in place. */
  .setuprow{
    display:flex; align-items:center; gap:12px; min-height:56px; padding:10px 2px;
    border-bottom:1px solid var(--line); cursor:pointer; background:none; border-top:none; border-left:none; border-right:none;
    width:100%; text-align:left; color:var(--ink); font-family:inherit;
  }
  .setuprow:last-child{border-bottom:none}
  .setuprow:active{background:var(--surface-2)}
  .setuprow .dot{width:10px; height:10px; border-radius:50%; flex:none}
  .setuprow .name{font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .setuprow .name-wrap{display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; text-align:left}
  .setuprow .name-wrap .name{flex:none}
  .setuprow .freq-note{font-size:11px; font-weight:500; color:var(--ink-soft)}
  /* Small all-caps text under the name instead of a pill — a fixed-width
     pill next to the name was the thing eating the row's width and
     truncating longer category names (e.g. "Entertainment / Activities").
     This carries the same at-a-glance info (payment method, item count,
     frequency) with zero width cost. */
  .setuprow .meta-note{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em}
  .setuprow .meta-note.mm-card{color:var(--primary)}
  .setuprow .meta-note.mm-cash{color:var(--cash)}
  .setuprow .meta-note.mm-transfer{color:var(--transfer)}
  .setuprow .meta-note.mm-service{color:var(--service)}
  .setuprow .meta-note.mm-neutral{color:var(--ink-soft)}
  .setuprow .amt{font-size:14px; white-space:nowrap; flex:none}
  .setuprow .chev{color:var(--ink-soft); font-size:18px; flex:none}
  /* Up/down reorder buttons — a plain, boring replacement for the old
     pointer-drag grip (removed: two attempts at drag both shipped visual
     bugs). Stacked tight at the row's leading edge so they read as one
     compact unit instead of competing with the row's main tap target. */
  .setuprow .movebtns{ display:flex; flex-direction:column; gap:2px; flex:none; margin:-4px -2px -4px -6px }
  .setuprow .movebtn{
    width:22px; height:18px; border:none; background:none; color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0; border-radius:4px;
  }
  .setuprow .movebtn:active{ background:var(--surface-2) }
  .setuprow .movebtn:disabled{ opacity:.25; cursor:default }

  /* Section divider for a called-out subset of a list — same horizontal-
     rule-with-header convention as .yearpanel's .yp-section, reused here
     for Budget Setup's "This month only" category section. */
  .list-divider{ border-top:1px solid var(--line); padding-top:14px; margin-top:4px }

  /* position:sticky rather than fixed, and a real last flex child of #app
     (main is flex:1 above it) rather than an independently-overlaid layer —
     on a short page (nothing to scroll) main's flex:1 pushes this flush to
     the bottom of the dvh-tall #app on its own; on a tall page it sticks to
     the viewport bottom as the page scrolls, same end result as fixed. The
     difference is that a sticky element's position is computed as part of
     normal layout/scroll, not pinned to a separately-tracked viewport layer,
     which avoids the class of iOS Safari bug where a position:fixed element
     visibly lags or jumps while the dynamic toolbar is animating (touched
     off by a touch-drag gesture even when overflow:hidden blocks the actual
     scroll — see wireSwipeNav's lockScroll). margin-inline cancels #app's
     own padding-inline so the bar still reaches #app's full edge instead of
     sitting inset by it now that it's part of #app's padded flow.
  */
  nav.tabs{
    position:sticky; bottom:0; z-index:10; margin-inline:-16px;
    background:var(--surface); border-top:1px solid var(--line);
    padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));
    display:flex; justify-content:center;
  }
  nav.tabs .wrap{max-width:640px; width:100%; display:grid; grid-template-columns:repeat(5,1fr); gap:4px}
  nav.tabs button{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    min-height:44px; padding:6px 2px; border-radius:10px; color:var(--ink-soft); cursor:pointer; font-size:11px; font-weight:600;
    box-sizing:border-box;
  }
  nav.tabs button.active{color:var(--primary); background:var(--surface-2)}
  nav.tabs button svg{flex:none}
  /* Cash Flow */
  .cf-tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .cf-tile{background:var(--surface-2); border-radius:12px; padding:12px; min-width:0}
  .cf-k{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700}
  .cf-v{font-size:20px; font-weight:600; margin-top:4px; overflow-wrap:anywhere}
  .cf-sub{font-size:12px; color:var(--ink-soft); margin-top:2px}
  .cf-good{color:var(--good)} .cf-bad{color:var(--bad)} .cf-warn{color:var(--accent)}
  .cf-table{border-collapse:collapse; width:100%; font-size:11.5px; font-variant-numeric:tabular-nums}
  .cf-table th,.cf-table td{padding:8px 3px; text-align:right; border-top:1px solid var(--line)}
  .cf-table th{border-top:none; font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); font-weight:700}

  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; min-width:0; box-sizing:border-box; padding:10px 12px; border-radius:9px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); height:41px;
    /* iOS Safari auto-zooms the whole page on focus for any field under
       16px — this is what was making a dropdown or dialog jump to a wide
       zoomed-in view the moment you tapped into it. 16px is the iOS
       threshold, not a design choice, so it can't be smaller than this. */
    font-size:16px;
  }
  textarea{ height:auto }
  /* iOS renders <input type=date>'s value centered and taller than every
     other field by default — this pins it to the same box, left-aligned,
     as the text/number/select fields beside it. */
  input[type=date]{ -webkit-appearance:none; appearance:none; text-align:left; }
  input[type=date]::-webkit-date-and-time-value{ text-align:left; }
  label{display:flex; flex-direction:column; gap:5px; font-size:13px; color:var(--ink-soft); min-width:0}
  /* Stacked by default — a native date/number input can render at its own
     intrinsic width on iOS regardless of a half-width flex container,
     which overlapped neighboring fields. Side-by-side only once there's
     enough room for that not to happen. */
  .field-row{display:flex; flex-direction:column; gap:10px}
  .field-row > label{flex:1; min-width:0}
  @media (min-width:480px){ .field-row{flex-direction:row} }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:10px 16px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-weight:600; cursor:pointer;
  }
  .btn.primary{background:var(--primary); color:var(--primary-ink); border-color:var(--primary)}
  .btn.accent{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .btn.small{padding:6px 10px; font-size:12px}
  .btn.block{width:100%}
  .btn.ghost{background:transparent}
  .btn.small.active{background:var(--primary); color:var(--primary-ink); border-color:var(--primary)}
  .btn.danger{background:var(--bad); border-color:var(--bad); color:#fff}
  /* Every other disabled control in the app (.navbtn, .hdr-stepper
     .navbtn-ghost, .setuprow .movebtn, .monthtile) dims on :disabled —
     .btn never had the matching rule, so any button using it (every
     dialog's primary/ghost/accent buttons) looked fully active even once
     JS set .disabled = true, with no visual sign it was non-functional. */
  .btn:disabled{ opacity:.35; cursor:default; pointer-events:none }

  table.simple{width:100%; border-collapse:collapse; font-size:13px}
  table.simple th{text-align:left; color:var(--ink-soft); font-weight:600; padding:6px 4px; border-bottom:1px solid var(--line); font-size:11px; text-transform:uppercase; letter-spacing:.04em}
  table.simple td{padding:8px 4px; border-bottom:1px solid var(--line)}
  table.simple tr:last-child td{border-bottom:none}

  .section-title{display:flex; align-items:center; justify-content:space-between}

  .banner{background:var(--surface-2); border:1px dashed var(--line); border-radius:12px; padding:14px; font-size:13px; color:var(--ink-soft)}

  .schedule-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
  .schedule-grid input{padding:6px; font-size:12px; text-align:center}
  .schedule-grid .mlabel{font-size:10px; text-align:center; color:var(--ink-soft); text-transform:uppercase}

  /* Year grid — iOS-Calendar-style month tiles, opened from Monthly's
     subhead label. Three columns of large tappable tiles reads better on
     a phone than the 4x3 grid iOS itself uses. */
  .yeargrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .monthtile{
    position:relative; aspect-ratio:1.3; border-radius:14px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-family:'Fraunces', serif; font-weight:600; font-size:16px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .monthtile:active{ background:var(--line) }
  .monthtile.today{ border-color:var(--accent); color:var(--accent) }
  .monthtile.active{ background:var(--primary); color:var(--primary-ink); border-color:var(--primary) }
  .monthtile-dot{ position:absolute; bottom:9px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; background:currentColor; opacity:.55 }
  /* Unconfigured months need to read as a different state at a glance, not
     just "missing a dot" — dimmed + dashed, same tokens as everywhere else
     in the app. Skipped on the active tile so the month you're currently
     viewing never looks washed out. */
  .monthtile.unset:not(.active){ opacity:.5; border-style:dashed; color:var(--ink-soft) }
  /* A PAST unconfigured month is quiet history, not a pending task — plain
     dimmed tile, no dashed "needs attention" border. */
  .monthtile.unset-past:not(.active){ opacity:.45; color:var(--ink-soft) }
  /* Year-only picker reuses these tiles for years instead of months; a
     year outside the nav bounds is just unreachable, not "unset". */
  .monthtile:disabled{ opacity:.3; cursor:default; pointer-events:none }
  .monthtile-unset{ position:absolute; bottom:8px; left:50%; transform:translateX(-50%); font-size:8px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); white-space:nowrap }

  /* Bottom sheet — anchored to the bottom edge instead of centered, the
     mobile-idiomatic pattern for actions and details. */
  dialog{
    border:none; border-radius:20px 20px 0 0; padding:0; background:var(--surface); color:var(--ink);
    box-shadow:var(--shadow);
    position:fixed; left:50%; right:auto; top:auto; bottom:0; margin:0;
    width:100%; max-width:640px; transform:translateX(-50%);
    max-height:85vh;
    /* Flex column so .dialog-body takes exactly the space left after the
       handle (flex:1, min-height:0) instead of a hardcoded vh-minus-guess. */
    display:flex; flex-direction:column;
  }
  dialog:not([open]){ display:none }
  dialog:focus{ outline:none }
  dialog::backdrop{background:rgba(18,32,29,.5)}
  /* Scroll lock while a sheet is open — prevents the page behind the sheet
     from scrolling along with it. `overflow:hidden` alone (the previous
     approach) doesn't reliably block touch-driven scrolling in mobile
     Safari, and leaves no record of where the page was scrolled to, so the
     background can end up a little scrolled by the time the sheet closes.
     Taking body fully out of flow with position:fixed (top offset by the
     saved scroll position, restored on close — see openSheet/the dialog
     "close" handler) is the robust mobile fix: nothing behind the sheet can
     move — including nav.tabs, whose own position:sticky depends on there
     being no scroll to react to — and the page reappears exactly where it
     was, so nothing is ever left reflecting a page that silently scrolled
     while hidden. */
  body.sheet-open{ position:fixed; left:0; right:0; width:100% }
  dialog[open]{ animation: sheetUp .22s cubic-bezier(.2,.8,.2,1) both; }
  @media (prefers-reduced-motion: reduce){ dialog[open]{ animation:none; } }
  @keyframes sheetUp{ from{ transform:translateX(-50%) translateY(24px); opacity:.4 } to{ transform:translateX(-50%) translateY(0); opacity:1 } }
  .sheet-handle{ display:flex; justify-content:center; padding:10px 0 2px; touch-action:none; flex:0 0 auto }
  .sheet-handle span{ width:36px; height:4px; border-radius:999px; background:var(--line) }
  .dialog-body{
    padding:6px 20px 0;
    display:flex; flex-direction:column; gap:16px;
    flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  }
  /* A sheet with no .dialog-actions bar (nothing owns the bottom padding)
     still needs clearance below its last row + the safe area. */
  .dialog-body:not(:has(.dialog-actions)){ padding-bottom:calc(20px + env(safe-area-inset-bottom,0px)) }
  /* Sticky to the bottom of .dialog-body's own scroll box (not the page) —
     a long checklist/category list inside a sheet otherwise buries Cancel/
     Apply below everything, forcing a scroll to find them. Harmless on a
     short dialog that never scrolls: sticky with nothing to stick against
     just renders in its normal flow position. `bottom` is pulled down by
     .dialog-body's own bottom padding (20px + safe-area) so the sticky bar
     reaches that padding box's true outer edge instead of stopping short
     of it and leaving dead space below the buttons; margin-inline cancels
     the body's side padding the same way so it reaches full width; its own
     padding then re-adds the safe-area clearance for the buttons. Opaque
     background + top border so scrolled rows don't show through under it. */
  .dialog-actions{
    display:flex; gap:10px; justify-content:flex-end;
    position:sticky; bottom:0;
    background:var(--surface); margin-inline:-20px; margin-top:4px; padding:12px 20px calc(8px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--line);
  }
  .sheet-row{ min-height:44px; display:flex; align-items:center }

  details.advanced{ border-top:1px solid var(--line); padding-top:10px }
  details.advanced summary{ cursor:pointer; font-weight:600; font-size:13px; color:var(--ink-soft); list-style:none; display:flex; align-items:center; gap:6px; min-height:32px }
  details.advanced summary::-webkit-details-marker{ display:none }
  details.advanced summary::before{ content:"›"; display:inline-block; transition:transform .15s; font-size:16px }
  details.advanced[open] summary::before{ transform:rotate(90deg) }
  details.advanced > *:not(summary){ margin-top:12px }
  details.xferpick summary{ font-size:14px; color:var(--ink); flex-wrap:wrap; row-gap:4px }
  details.xferpick summary .eyebrow{ font-size:11px; color:var(--ink-soft); font-weight:700 }
  details.xferpick summary .pickval{ flex-basis:100%; margin-left:22px; font-weight:600; font-size:14px; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:calc(100% - 22px); display:flex; align-items:center }
  details.xferpick[open] summary .pickval{ display:none }
  input.err, select.err, textarea.err{ border-color:var(--bad) !important }
  .form-err-msg{ color:var(--bad); font-size:13px; font-weight:600; margin:2px 0 8px }

  .danger-zone{ border-top:1px solid var(--line); padding-top:14px; margin-top:4px }

  .empty{text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13px}
  .sync{font-size:11px; color:var(--ink-soft); display:flex; align-items:center; gap:5px}
  .sync .led{width:6px; height:6px; border-radius:50%; background:var(--good)}
  .sync.off .led{background:var(--bad)}

  /* Toast */
  .toast{
    position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%) translateY(8px); z-index:20;
    background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:999px;
    font-size:13px; font-weight:600; box-shadow:var(--shadow);
    opacity:0; transition:opacity .18s, transform .18s; pointer-events:none;
    max-width:88vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0) }

  /* Loading skeleton */
  .skel{ background:linear-gradient(90deg, var(--surface-2) 25%, var(--line) 37%, var(--surface-2) 63%); background-size:400% 100%; animation:skelShine 1.4s ease infinite; border-radius:8px }
  @media (prefers-reduced-motion: reduce){ .skel{ animation:none } }
  @keyframes skelShine{ 0%{background-position:100% 50%} 100%{background-position:0% 50%} }

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------
   CONSTANTS / STATE
--------------------------------------------------------------- */
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const SEED_YEAR = 2027; // the year the original seed data was written for
// Bumped by hand with every published revision (see Settings' "About"
// card) — the only reliable way to tell, from on-device, whether a
// home-screen install actually picked up the latest publish yet, since
// iOS can hold a suspended copy of the page open for a long time without
// reloading it.
const APP_BUILD = "v111";
// Categories no longer carry an assigned identity color — past ~8
// categories a generated hue stops being reliably distinguishable (see
// the dataviz skill), and the category set here is unlimited/custom, so
// per-category color never scaled. Every category row instead uses the
// same generic icon (iconCategoryTag) as a scan aid; identity comes from
// the name text next to it. Any `color` field still present on existing
// stored categories (from the old PALETTE system) is simply unused now.

const SEED_VERSION = 3;

// Every month in the app's life is addressed as one number — year*12+month
// — instead of a bare 0-11 index implicitly scoped to "the" year. That's
// what makes multi-year navigation and cross-year rollover possible: a
// linear index just keeps counting instead of needing separate year/month
// state and wraparound logic at every Dec→Jan boundary.
function ymOf(year, m){ return year*12 + m; }
function yearOfYM(ym){ return Math.floor(ym/12); }
function monthOfYM(ym){ return ((ym%12)+12)%12; }
function yearOfDate(dateStr){ return new Date(dateStr+"T00:00:00").getFullYear(); }
function monthOfDate(dateStr){ return new Date(dateStr+"T00:00:00").getMonth(); }
function ymOfDate(dateStr){ return ymOf(yearOfDate(dateStr), monthOfDate(dateStr)); }
// The real-world current month, as a ym — used to tell an unconfigured
// PAST month (quiet, non-actionable history) from an unconfigured
// current/future one (still a pending setup task).
function todayYM(){ return ymOf(new Date().getFullYear(), new Date().getMonth()); }

let state = {
  // yearBudgetUSD/baseRate at the top level are legacy fields, kept only so
  // an existing saved doc has something to migrate from — perYear is what
  // every function actually reads now (see yearSettings/migrateToMultiYear).
  settings: { yearBudgetUSD: 80004, baseRate: 17.79, year: SEED_YEAR, seedVersion: SEED_VERSION, monthlyDefaultView: "ledger", perYear: {}, seededYMs: [] },
  categories: [],   // {id, name, order, color}
  // Budget Setup: planned recurring items — the master template, reused
  // every year unless a specific month says otherwise. Each one's
  // schedule[m] feeds the category's Target/Allocated for that calendar
  // month, every year, UNLESS onlyYM is set — an item with onlyYM only
  // applies to that one specific (year, month) and doesn't touch the
  // master template at all until explicitly promoted to it.
  lineitems: [],    // {id, categoryId, name, schedule:[12], paymentMethod, currency, rate, onlyYM?}
  // Monthly: actual spend, logged as it happens — the Actual Spend side,
  // independent of Target. One entry per purchase, or just one entry with
  // no name for a lump total; either way they sum per category per month.
  actuals: [],      // {id, categoryId, name, date, amount, currency, rate, paymentMethod}
  fundevents: [],   // {id, date, amountUSD, mode, targetYM}
  transfers: [],    // {id, date, fromCategoryId, toCategoryId, amountUSD, note}
  // Per-month, per-category independent copy — created the moment a month
  // is set up (see openMonthSeedChoiceDialog), forking that month away from
  // the Budget Setup template from then on. Keyed by ym then catId:
  // { baseAmountUSD, items:[{id,name,amount,paymentMethod}], source:"template"|"local" }.
  // source:"template" means it originated from a real template category
  // (catId matches a state.categories id); source:"local" means it was
  // created directly within the month with no template counterpart at all
  // (catId is then a freshly generated id that never appears in
  // state.categories). See categoryBaseForMonth/rolloverForMonth below for
  // how this drives the money math.
  monthCategoryData: {},
  // Cash Flow: per-year opening accounts, reserve goal, income estimates/actuals,
  // quarter-end balances. See the CASH FLOW section.
  cashflow: { years: {} },
};

// monthlyView switches the Monthly tab between its ledger (category list)
// and dash (this-month visuals) sub-views. Seeded from state.settings once
// the DB loads, then also reset to that saved default every time you
// re-enter the Monthly tab from elsewhere — see the nav click handler.
// ym defaults to the real current calendar month, not a fixed Jan-of-the-
// seed-year — the app should open on whatever month you're actually
// managing right now.
let ui = { tab: "monthly", ym: todayYM(), loaded: false, monthlyView: "ledger", settingsYear: null, cfQ: null, cfQY: null, cfOpen: {}, cfWI: null, setOpen: {}, settingsAnchor: null };
// Tracks which tab was on screen for the previous render() call, so we can
// tell an actual tab switch (scroll back to top) apart from a re-render of
// the same tab (e.g. a chart update) which should leave scroll position alone.
let lastRenderedTab = null;

function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }

// One-time, idempotent upgrade from the single-year shape to the multi-
// year one. Runs on every load; each check is a no-op once done, so it's
// safe to call repeatedly rather than needing its own SEED_VERSION bump.
// Nothing here discards data — every legacy field just becomes the seed
// for its multi-year replacement.
function migrateToMultiYear(){
  if(!state.settings.perYear || !Object.keys(state.settings.perYear).length){
    const y = state.settings.year || SEED_YEAR;
    state.settings.perYear = { [y]: { yearBudgetUSD: state.settings.yearBudgetUSD||80004, baseRate: state.settings.baseRate||17.79 } };
  }
  if(!state.settings.seededYMs){
    const y = state.settings.year || SEED_YEAR;
    state.settings.seededYMs = (state.settings.seededMonths||[]).map(m=> ymOf(y, m));
  }
  state.fundevents = state.fundevents.map(fe=>{
    if(fe.targetYM!==undefined) return fe;
    const y = state.settings.year || SEED_YEAR;
    return { ...fe, targetYM: ymOf(y, fe.targetMonth||0) };
  });
}

// One-time, idempotent per-category upgrade: categories created before
// baseAmountUSD existed had no fixed budget field of their own and were
// displayed using the sum of their line items instead (the old "itemized
// mode" branch of categoryBaseForMonth, since removed — see above). This
// gives each such category a real baseAmountUSD now, computed the exact
// same way that old branch used to for a representative month, so nothing
// anyone already built resets to $0. Guarded by checking the field itself
// (not a version flag) — a category that already has a baseAmountUSD
// (including every category made through the newer "New category" dialog)
// is left completely untouched, which is also what makes this naturally
// safe to call on every load.
function migrateCategoryBaseAmounts(){
  const ym = todayYM();
  const mIdx = monthOfYM(ym);
  const rate = yearSettings(yearOfYM(ym)).baseRate;
  const changed = [];
  state.categories.forEach(c=>{
    if(c.baseAmountUSD) return;
    const sum = state.lineitems
      .filter(li=>li.categoryId===c.id && (!li.onlyYM || li.onlyYM===ym))
      .reduce((s,li)=> s + toUSD(li.schedule[mIdx]||0, li.currency, li.rate||rate), 0);
    c.baseAmountUSD = roundCents(sum);
    changed.push(c);
  });
  return changed;
}

// One-time, idempotent cleanup for the `order` collision bug: categories
// created or duplicated while `order` was wrongly assigned from
// state.categories.length (instead of max(order)+1 — see nextCategoryOrder)
// can end up sharing the same order value once any category has ever been
// deleted, which breaks the up/down reorder swap (moveCategory) for
// whichever pair collides. Detects an actual collision or gap before
// touching anything, and only then renumbers everything 0..n-1 by the
// existing sort order (ties broken by array position) — a no-op, and so
// safe to call on every load, whenever orders are already clean.
function migrateCategoryOrders(){
  const sorted = state.categories.slice().sort((a,b)=> (a.order||0)-(b.order||0));
  const seen = new Set();
  let needsFix = false;
  sorted.forEach((c,i)=>{
    const o = c.order||0;
    if(seen.has(o) || o!==i) needsFix = true;
    seen.add(o);
  });
  if(!needsFix) return [];
  sorted.forEach((c,i)=>{ c.order = i; });
  return sorted;
}

// Falls back to the nearest configured year's figures — prefers the most
// recent PRIOR year, so viewing a future year you haven't set up yet shows
// your last real budget instead of $0 until you explicitly change it.
function yearSettings(year){
  const py = state.settings.perYear || {};
  if(py[year]) return py[year];
  const known = Object.keys(py).map(Number).sort((a,b)=>a-b);
  if(!known.length) return { yearBudgetUSD: 0, baseRate: 17.5 };
  const prior = known.filter(y=>y<=year);
  const y = prior.length ? Math.max(...prior) : known[0];
  return py[y];
}
async function setYearSetting(year, patch){
  state.settings.perYear = state.settings.perYear || {};
  state.settings.perYear[year] = { ...yearSettings(year), ...patch };
  return dbSetSettings();
}
// The earliest month rollover/YTD math ever needs to walk back to — Jan of
// the earliest year you've configured. Nothing meaningful happened before
// that, so there's no reason to walk further back than it.
function earliestYM(){
  const years = Object.keys(state.settings.perYear||{}).map(Number);
  const y = years.length ? Math.min(...years) : yearOfYM(ui.ym);
  return ymOf(y, 0);
}
// How far year navigation (the header widget's year arrows and the Year
// Grid) is allowed to travel. Not a fixed calendar year like 2000 — that
// would be arbitrary for an app meant to be used for decades. Instead:
// one year of headroom behind whichever is earlier, the earliest year
// you've actually configured or the real current year (so a brand-new
// install can still step one year back from today before hitting the
// wall), and 30 years of headroom ahead of today for long-range planning.
function yearNavBounds(){
  const minYear = Math.min(yearOfYM(earliestYM()), yearOfYM(todayYM())) - 1;
  const maxYear = yearOfYM(todayYM()) + 30;
  return { minYear, maxYear };
}

/* ---------------------------------------------------------------
   DB LAYER
--------------------------------------------------------------- */
// This is a standalone iPhone-homescreen prototype: everything lives in
// this device's own localStorage, full stop. There used to be an optional
// cloud "db" capability path here with a local-storage fallback for when it
// wasn't available — that added a whole seed/migrate-on-the-cloud code path
// or an iOS homescreen install could silently drift between two different
// copies of your data, no warning either way, which is exactly what
// happened. One storage mechanism, always on, same as any native app.
async function initDB(){
  loadLocalFallback();
  migrateToMultiYear();
  migrateCategoryBaseAmounts().forEach(c=> dbSet("categories", c.id, c));
  migrateCategoryOrders().forEach(c=> dbSet("categories", c.id, c));
  ui.monthlyView = state.settings.monthlyDefaultView || "ledger";
  ui.loaded = true;
  render();
}

function loadLocalFallback(){
  const seed = buildSeed();
  state.categories = seed.categories;
  state.lineitems = seed.lineitems;
  state.actuals = [];
  state.fundevents = [];
  state.transfers = [];
  try{
    const saved = JSON.parse(localStorage.getItem("ledgercasa_local")||"null");
    if(saved){ state = Object.assign(state, saved); }
  } catch(e){}
}
function persistLocalFallback(){
  try{ localStorage.setItem("ledgercasa_local", JSON.stringify(state)); }catch(e){}
}

// These keep their old names/signatures (and stay async) purely so every
// existing call site throughout the app — there are dozens — didn't need
// touching. All five now do exactly one thing: write the whole state to
// this device's localStorage.
async function dbSet(collection, id, data){
  persistLocalFallback();
}
async function dbUpdate(collection, id, data){
  persistLocalFallback();
}
async function dbDelete(collection, id){
  persistLocalFallback();
}
async function dbSetSettings(){
  persistLocalFallback();
}
// monthCategoryData is a single document (like settings/main), not a
// collection — one plain nested object {ym:{catId:entry}}, rewritten whole
// on every change. Mirrors dbSetSettings exactly.
async function dbSetMonthCategoryData(){
  persistLocalFallback();
}

/* ---------------------------------------------------------------
   MONEY HELPERS
--------------------------------------------------------------- */
// Floating-point sums of independently-computed money values (a typed
// base allocation vs. a reduce() over several converted actuals, etc.)
// routinely land a few trillionths off zero instead of exactly on it.
// Rounding to the cent at the point a value is computed (not just when
// displayed) keeps both its printed text AND any >=0 sign check used for
// color consistent with each other.
function roundCents(n){ return Math.round(n*100)/100; }
// Largest-remainder allocation: split `targetUnits` (an integer) across the
// exact, unrounded `exact` values (already expressed in those same units) so
// the rounded parts always add up to the target exactly. Used wherever a
// card shows rows plus a total that must agree with the header — rounding
// each row on its own can leave the rows 1 unit off the total.
function allocateUnits(exact, targetUnits){
  const fl = exact.map(x=> Math.floor(x + 1e-6));
  let diff = targetUnits - fl.reduce((a,b)=> a+b, 0);
  const order = exact.map((_,i)=>i).sort((a,b)=> (exact[b]-fl[b]) - (exact[a]-fl[a]));
  let i = 0;
  while(diff>0 && order.length){ fl[order[i % order.length]]++; diff--; i++; }
  i = order.length-1;
  while(diff<0 && order.length){ fl[order[i]]--; diff++; i = i>0 ? i-1 : order.length-1; }
  return fl;
}
function allocateCents(exactUSD, targetUSD){
  return allocateUnits(exactUSD.map(x=> x*100), Math.round(targetUSD*100)).map(c=> c/100);
}
// Shares of a whole as tenths of a percent (123 = 12.3%) that add to exactly 100.0%.
function allocateTenths(values){
  const total = values.reduce((a,b)=> a+b, 0);
  if(!(total>0)) return values.map(()=>0);
  return allocateUnits(values.map(v=> v/total*1000), 1000);
}
function fmtUSD(n){ n = roundCents(n) || 0; const s = (n<0?"-":"") + "$" + Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); return s; }
function fmtMXN(n){ return (n<0?"-":"") + "MX$" + Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0}); }
function toUSD(amount, currency, rate){ return currency==="MXN" ? amount/rate : amount; }
function toMXN(amount, currency, rate){ return currency==="MXN" ? amount : amount*rate; }

/* ---------------------------------------------------------------
   DERIVED BUDGET MATH — everything below takes ym (a linear year*12+month
   index, see ymOf/yearOfYM/monthOfYM above), not a bare 0-11 month.
--------------------------------------------------------------- */
// Target/Allocated for a category — a single fixed amount the category
// carries directly (set once via the "New category"/category-detail amount
// field, edited any time). Line items never redefine or override it, no
// matter how many items the category has — they're planning templates only
// (see categoryPlannedForMonth below for what they add up to). A category
// with no amount set yet has a $0 Target, same as a blank Allocated cell in
// a spreadsheet.
function categoryBaseForMonth(catId, ym){
  if(isMonthSeeded(ym)){
    // Set-up months are forked — the category's budget for this month comes
    // only from its own independent copy (state.monthCategoryData), never
    // from the live template. A category not included in this month (never
    // added, or since removed) contributes nothing here — its balance (if
    // any) is just no longer tracked under its own name; the whole-pot
    // total (totalAvailableForMonth) never subtracted it in the first
    // place, so there's nothing to sweep back.
    const entry = state.monthCategoryData[ym] && state.monthCategoryData[ym][catId];
    return entry ? (entry.baseAmountUSD || 0) : 0;
  }
  // Not yet set up: a live preview straight from the template, so an
  // unconfigured month's forecast always reflects Budget Setup's current
  // numbers rather than freezing at whatever they were when this ran.
  const c = state.categories.find(x=>x.id===catId);
  return c ? (c.baseAmountUSD || 0) : 0;
}

// Purely informational: what this category's line items currently add up
// to for the given month — used by Budget Setup's Budget/Planned/
// Unallocated readout. Never feeds into categoryBaseForMonth; items seed a
// month's actual spend (state.actuals) when that month is set up, but they
// never change the category's own budget.
function categoryPlannedForMonth(catId, ym){
  const mIdx = monthOfYM(ym);
  const rate = yearSettings(yearOfYM(ym)).baseRate;
  return roundCents(state.lineitems
    .filter(li=>li.categoryId===catId && (!li.onlyYM || li.onlyYM===ym))
    .reduce((sum,li)=> sum + toUSD(li.schedule[mIdx]||0, li.currency, li.rate||rate), 0));
}

// Whether a category belongs to this month at all — a global category (no
// onlyYM, or onlyYM pointing at a different month) always does; a
// month-only category only belongs to its own onlyYM month.
function categoryAppliesToYM(c, ym){ return !c.onlyYM || c.onlyYM===ym; }

// Net of transfers moved into/out of a category for a given month —
// manual "move funds" adjustments, separate from automatic rollover.
function categoryAdjustmentForMonth(catId, ym){
  let net = 0;
  state.transfers.forEach(t=>{
    if(ymOfDate(t.date)!==ym) return;
    if(t.toCategoryId===catId) net += t.amountUSD;
    if(t.fromCategoryId===catId) net -= t.amountUSD;
  });
  return roundCents(net);
}

// A fund event's mode decides which months it touches and how much of it
// lands in each:
//   oneshot      — exactly its targetYM, the full amount (Monthly's
//                  "Add funds" always writes this — Monthly is one month,
//                  there's nothing to spread).
//   evenly       — amount/12, every month of targetYM's calendar year,
//                  regardless of which month targetYM itself is (Settings'
//                  "Apply evenly across all 12 months").
//   redistribute — amount/(months remaining), spread from targetYM through
//                  December of that same year (Settings' "Apply from
//                  active month moving forward").
// fundAdjustmentPortion returns how much of `fe` lands in `ym` (0 if none)
// — the one place this logic lives, so the monthly total and the fund-
// adjustments list can never disagree about which months an event touches.
function fundAdjustmentPortion(fe, ym){
  if(fe.mode==="oneshot") return fe.targetYM===ym ? fe.amountUSD : 0;
  if(fe.mode==="evenly") return yearOfYM(ym)===yearOfYM(fe.targetYM) ? fe.amountUSD/12 : 0;
  // redistribute
  const start = fe.targetYM;
  const yearEnd = yearOfYM(start)*12 + 12;
  const span = yearEnd - start;
  return (ym>=start && ym<yearEnd && span>0) ? fe.amountUSD/span : 0;
}
function fundAdjustmentForMonth(ym){
  return roundCents(state.fundevents.reduce((sum,fe)=> sum + fundAdjustmentPortion(fe, ym), 0));
}

// Count of fund events + transfers touching this month — drives the
// numbered badge on Monthly's subhead "adjustments" icon. Same filters as
// openFundAdjustmentsSheet, kept in sync with it.
// Badge count on the sliders icon — itemized, actionable rows only (fund
// events + transfers), so it always matches the list length in the sheet
// exactly, 1:1. Rollover and Excluded are states, not items (v94 tried
// folding them into this same number and it broke down the moment someone
// excluded 3 categories and the badge stayed at "1" — a number implies
// counting, and these aren't counted, they're on/off). They get their own
// non-numeric signal instead — see excludedCountForMonth/rolloverSignForMonth/dotFor below.
function fundAdjustmentsCountForMonth(ym){
  const fe = state.fundevents.filter(f=> fundAdjustmentPortion(f, ym) !== 0);
  const tr = state.transfers.filter(t=> ymOfDate(t.date)===ym);
  return fe.length + tr.length;
}
// Slider-icon dot inputs. Excluded = how many categories are Excluded this
// month (a count, so the dot can pulse every time it goes UP — un-excluding
// never pulses). Rollover = sign of what carried in from last month
// (0 none, 1 surplus, -1 deficit). Neither is shown as a number.
function excludedCountForMonth(ym){
  const data = state.monthCategoryData[ym] || {};
  return Object.keys(data).filter(id=> id!==DROPPED_CREDITS_KEY && data[id] && data[id].excluded).length;
}
function rolloverSignForMonth(ym){
  const r = carriedInFromLastMonth(ym);
  return (r===null || r===0) ? 0 : (r>0 ? 1 : -1);
}
// Last Excluded count each screen rendered with, so the pulse plays only
// when the count actually increases — not on first sight of a month, not on
// re-render, not on navigation. The first render of a key only records.
// pulseUntil keeps the class on across a quick double render() so the pulse
// isn't cut off by the second render replacing the element.
const excludedSeen = {};
let pulseUntil = 0;
function dotFor(key, exclCount, rollSign){
  const prev = excludedSeen[key];
  if(prev!==undefined && exclCount>prev) pulseUntil = Date.now() + 700;
  excludedSeen[key] = exclCount;
  if(exclCount>0){
    const centre = rollSign===0 ? "" : `<i class="${rollSign>0?"pos":"neg"}"></i>`;
    return `<span class="iconbtn-dot${Date.now()<pulseUntil?" pulse":""}">${centre}</span>`;
  }
  if(rollSign!==0) return `<span class="iconbtn-dot solo ${rollSign>0?"pos":"neg"}"></span>`;
  return "";
}

// Actual Spend for a category — independent of Target. Sums the actual-
// spend entries logged in Monthly for that category and month, whether
// that's one lump total or several itemized entries.
function spentForMonth(catId, ym){
  return roundCents(state.actuals
    .filter(a=>a.categoryId===catId && ymOfDate(a.date)===ym)
    .reduce((sum,a)=> sum + toUSD(a.amount||0, a.currency, a.rate||yearSettings(yearOfYM(ym)).baseRate), 0));
}

// Three fixed, reserved states, read straight off the dollar sign of
// `remaining` — not a percentage threshold, so there's no judgment call
// about where "approaching" starts: green (still under — money left),
// gray/neutral (exactly met — spent precisely the target, a normal,
// healthy outcome, not a warning), red (over — spent past the target).
// A category with no target set (hasTarget===false) never enters this at
// all: it's unbudgeted, not "under" or "met" or "over", so it always gets
// its own neutral "No budget set" label, never a dollar figure dressed up
// as a status.
const BUDGET_STATUS = { UNDER:"under", MET:"met", OVER:"over" };
function budgetStatus(hasTarget, remaining){
  if(!hasTarget) return null;
  if(remaining > 0) return BUDGET_STATUS.UNDER;
  if(remaining < 0) return BUDGET_STATUS.OVER;
  return BUDGET_STATUS.MET;
}
function budgetStatusColor(status){
  if(status===BUDGET_STATUS.UNDER) return "var(--good)";
  if(status===BUDGET_STATUS.OVER) return "var(--bad)";
  return "var(--status-met)"; // met, or no target at all
}
// Always the signed number, consistently formatted — no "Budget met"
// substitution for the exactly-met case. A category with no target set
// gets one fixed neutral label instead of a dollar figure at all — there's
// nothing to be "$0.00 left" of when nothing was ever budgeted. "Over"
// carries its own sign via the word, not a leading "-" (same as "left"
// carries no "+") — stacking a minus on top of the word and the red color
// would just be redundant signage.
function remainingDisplay(hasTarget, remaining){
  if(!hasTarget) return { text: "No budget set", color: "inherit", status: null };
  const status = budgetStatus(hasTarget, remaining);
  const text = remaining>=0 ? `${fmtUSD(remaining)} left` : `${fmtUSD(Math.abs(remaining))} over`;
  return { text, color: budgetStatusColor(status), status };
}
// The category progress bar's fill is a flat color straight off the same
// three states — no gradient, no segment/gap. A gradient or a gap reads as
// a continuous measure (how close to some threshold), which isn't what
// this is: there's no "approaching" state, only under/met/over, so three
// solid colors say that more plainly than a blend or a broken bar ever could.
function budgetBarStyle(hasTarget, remaining, pct){
  const width = Math.max(0, Math.min(100, pct));
  if(!hasTarget) return `width:${width}%; background:var(--accent)`;
  return `width:${width}%; background:${budgetStatusColor(budgetStatus(hasTarget, remaining))}`;
}

// rollover(ym) computed from the earliest configured month up through ym,
// recursively, from actuals entered so far — including any manual
// transfers moved into/out of the category each month. Walking a linear ym
// instead of a 0-11 month is what lets this cross a Dec→Jan year boundary
// without special-casing it: a Dec surplus is just one more step in the
// same loop as any other month.
function rolloverForMonth(catId, ym){
  let roll = 0;
  const start = earliestYM();
  for(let k=start;k<ym;k++){
    // An unseeded month was never actually opened/set up — it has no real
    // budget or spend yet, so it must contribute nothing to the running
    // rollover rather than being treated as a zero-spend month with its
    // full budget silently credited as surplus.
    if(!isMonthSeeded(k)) continue;
    // A category not included in a seeded month resets the chain — its
    // carried balance up to that point simply stops being tracked under
    // its own name (the whole-pot total was never reduced by it, so
    // nothing needs crediting back elsewhere), and if the category
    // reappears in a later month it starts fresh at that month's own
    // budget.
    const included = !!(state.monthCategoryData[k] && state.monthCategoryData[k][catId]);
    if(!included){
      roll = 0;
      continue;
    }
    const base = categoryBaseForMonth(catId, k);
    const adj = categoryAdjustmentForMonth(catId, k);
    const avail = roundCents(base + roll + adj);
    const spent = spentForMonth(catId, k);
    const result = roundCents(avail - spent);
    // A month where this category genuinely had no money at stake (no
    // Base, no rollover in, no transfer — avail===0, shown as "No budget
    // set") is intentionally unplanned. Its own overspend shouldn't
    // manufacture a debt the next month silently inherits — that forced
    // typing a fake baseline back into an already-closed month just to
    // zero it out. But a category funded by transfer instead of Base had
    // real money this month (avail!==0) — an overspend there is a genuine
    // deficit and must carry forward like any other overspend. Only
    // avail===0 (truly no money, from any source) floors the result.
    roll = (avail===0 && result<0) ? 0 : result;
  }
  return roll;
}
// Legacy data may still carry this key in an old month's
// monthCategoryData from before the cash-out/dropped-credits bookkeeping
// below was removed (see totalAvailableForMonth) — every place that
// enumerates state.monthCategoryData[ym]'s keys as category ids
// (monthCategoryList, the new-local-category color index) still has to
// skip it, permanently, so a stale saved value never gets read back as a
// category.
const DROPPED_CREDITS_KEY = "__droppedCredits";
function availableForMonth(catId, ym){
  return roundCents(categoryBaseForMonth(catId, ym) + rolloverForMonth(catId, ym) + categoryAdjustmentForMonth(catId, ym));
}
function remainingForMonth(catId, ym){
  return roundCents(availableForMonth(catId, ym) - spentForMonth(catId, ym));
}

// The month's total pool is that year's annual Target ÷ 12, not the sum of
// what's been allocated to categories — unallocated dollars are still real
// budget, and count as buffer for the whole month the same way an under-
// spent category's leftover does. Using sum(categoryBase) here would
// silently drop the unallocated slice from every month-level number.
// A category-to-category transfer nets to zero across categories by
// construction, so it never needs to appear here — no new money entered
// the system, it just moved between buckets that were already counted.
// An External-source transfer is different: it's new money brought in
// from outside the budget, the same role a Settings fund event plays,
// just entered through the Transfer dialog instead. It has to raise the
// whole-pot total the same way a fund event does, or every dollar it
// funds shows up as spend with nothing offsetting it.
function externalTransfersInForMonth(ym){
  return roundCents(state.transfers
    .filter(t=> t.fromCategoryId===null && ymOfDate(t.date)===ym)
    .reduce((s,t)=> s + t.amountUSD, 0));
}
function totalBudgetForMonth(ym){
  return roundCents((yearSettings(yearOfYM(ym)).yearBudgetUSD/12) + fundAdjustmentForMonth(ym) + externalTransfersInForMonth(ym));
}
// Every actual dollar logged this month, full stop — NOT a sum over
// state.categories (the live Budget Setup template list). Summing over
// state.categories undercounts (misses spend logged against a purely
// month-local category, which never lives in state.categories) and can
// disagree with what's actually configured for THIS month (a category
// removed from this month, or never added to it, but still present in the
// live template, still had its spend counted here regardless). Reading
// straight off state.actuals is what the header's own "Spent is every
// actual dollar logged this month, budgeted or not" promise requires —
// this way it can never drift from reality or from the category list.
function totalSpentForMonth(ym){
  return roundCents(state.actuals
    .filter(a=> ymOfDate(a.date)===ym)
    .reduce((s,a)=> s + toUSD(a.amount||0, a.currency, a.rate||yearSettings(yearOfYM(ym)).baseRate), 0));
}
// Every actual dollar logged this month against a category the user has
// marked Excluded for that specific month — real spend, just already paid
// for in some earlier month (a prepaid rent/deposit), so it shouldn't be
// judged against THIS month's numbers. Used only by the "visible*" display
// wrappers right below — never by totalSpentForMonth/totalBudgetForMonth/
// totalAvailableForMonth themselves, which stay the true, unadjusted
// ground truth that rollover and the cross-month running balance both
// depend on (see totalAvailableForMonth's own comment below).
function excludedSpendForMonth(ym){
  const data = state.monthCategoryData[ym] || {};
  return roundCents(Object.keys(data)
    .filter(id => id!==DROPPED_CREDITS_KEY && data[id] && data[id].excluded)
    .reduce((s,id)=> s + spentForMonth(id, ym), 0));
}
// Display-only Spent/Budget/Available, with every Excluded category's real
// spend removed from BOTH sides of the subtraction by the same amount —
// Surplus (Available minus Spent) always comes out exactly the same either
// way, by construction. That's deliberate: excluding a prepaid category
// should stop its already-settled cost from distorting what a given month
// looks like, never manufacture extra "surplus" that isn't really there.
// Every screen that shows a whole-month Spent/Available/Surplus trio reads
// from these, not the raw totals above.
function visibleSpentForMonth(ym){
  return roundCents(totalSpentForMonth(ym) - excludedSpendForMonth(ym));
}
function visibleBudgetForMonth(ym){
  return roundCents(totalBudgetForMonth(ym) - excludedSpendForMonth(ym));
}
function visibleAvailableForMonth(ym){
  return roundCents(totalAvailableForMonth(ym) - excludedSpendForMonth(ym));
}
// A single running balance for the whole pot, not a sum of each category's
// own rollover — the Unallocated slice belongs to no category, so summing
// per-category rollovers silently drops it. Walking from earliestYM means
// this carries across a year boundary exactly the same way category
// rollover does, per your call on that.
//
// totalBudgetForMonth(k) - totalSpentForMonth(k) is already the complete,
// category-independent answer for "how much of month k's whole pot went
// unspent" — totalBudgetForMonth is a flat annual/12 + adjustments figure
// that was never reduced by removing a category, and totalSpentForMonth
// (above) counts every dollar actually spent regardless of whether its
// category is still configured for that month. An earlier version of this
// function ALSO added back a removed category's leftover balance via
// categoryCashOutForMonth/droppedCreditsForMonth, on the theory that
// removing a category "orphaned" its balance — but that balance was never
// subtracted from the pot to begin with, so adding it back double-counted
// it. Verified: a $100 category present for two $500/month budgets, with
// nothing ever spent, removed after month 2 — true available going into
// month 3 is $1,500 (three untouched months); the old formula returned
// $1,700, counting the category's $100 twice.
function totalAvailableForMonth(ym){
  let bal = 0;
  const start = earliestYM();
  for(let k=start;k<ym;k++){
    if(!isMonthSeeded(k)) continue;
    bal = roundCents(bal + totalBudgetForMonth(k) - totalSpentForMonth(k));
  }
  return roundCents(totalBudgetForMonth(ym) + bal);
}

// The real FX impact for the month. Not just ATM withdrawals — a credit
// card statement converts at its own rate too, and so does any purchase
// that actually involved pesos, regardless of which currency the entry is
// flagged as or how it was paid. So the trigger is simply: did this entry
// have an actual rate recorded? Every entry's USD and MXN fields are kept
// in sync by that rate at entry time (wireLinkedCurrency), so whichever
// currency ended up saved, the other side is always recoverable — that's
// what lets a USD-flagged card charge still carry a real, comparable rate.
// Entries with no rate recorded at all are left out entirely (nothing to
// compare), never assumed to be at baseline.
function exchangeImpactForMonth(ym){
  const entries = state.actuals.filter(a=>ymOfDate(a.date)===ym && a.amount && a.rate);
  if(!entries.length) return null;
  const baseRate = yearSettings(yearOfYM(ym)).baseRate;
  let mxnTotal = 0, actualUSD = 0;
  entries.forEach(a=>{
    const mxnEquiv = a.currency==="MXN" ? a.amount : a.amount * a.rate;
    const usdAtRate = a.currency==="MXN" ? a.amount / a.rate : a.amount;
    mxnTotal += mxnEquiv;
    actualUSD += usdAtRate;
  });
  const avgRate = mxnTotal / actualUSD;
  const baselineUSD = mxnTotal / baseRate;
  const deltaUSD = actualUSD - baselineUSD;
  return { mxnTotal, actualUSD, avgRate, baselineUSD, deltaUSD, count: entries.length };
}

// Same math as exchangeImpactForMonth but across one whole year — Annual
// Outlook shows one year at a time (picked via the year grid), so this
// takes that year explicitly rather than assuming "all actuals ever."
function exchangeImpactForYear(year){
  const entries = state.actuals.filter(a=> yearOfDate(a.date)===year && a.amount && a.rate);
  if(!entries.length) return null;
  const baseRate = yearSettings(year).baseRate;
  let mxnTotal = 0, actualUSD = 0;
  entries.forEach(a=>{
    const mxnEquiv = a.currency==="MXN" ? a.amount : a.amount * a.rate;
    const usdAtRate = a.currency==="MXN" ? a.amount / a.rate : a.amount;
    mxnTotal += mxnEquiv;
    actualUSD += usdAtRate;
  });
  const avgRate = mxnTotal / actualUSD;
  const baselineUSD = mxnTotal / baseRate;
  const deltaUSD = actualUSD - baselineUSD;
  return { mxnTotal, actualUSD, avgRate, baselineUSD, deltaUSD, count: entries.length };
}

// Whether a month has been reached yet — has any actuals logged at all
// (seeded or otherwise). Drives the actual/estimate split in Annual
// Outlook's charts: reached months plot real figures, the rest plot the
// plan in the muted "estimate" treatment.
function hasActualsForMonth(ym){
  return state.actuals.some(a=>ymOfDate(a.date)===ym);
}

// Year-to-date, bounded to the same calendar year as uptoYM — Jan of that
// year through uptoYM, not a running total since the app began.
function ytdActual(uptoYM){
  const start = ymOf(yearOfYM(uptoYM), 0);
  let s = 0;
  for(let k=start;k<=uptoYM;k++) s = roundCents(s + totalSpentForMonth(k));
  return s;
}
function ytdBudget(uptoYM){
  const start = ymOf(yearOfYM(uptoYM), 0);
  let s = 0;
  for(let k=start;k<=uptoYM;k++) s = roundCents(s + totalBudgetForMonth(k));
  return s;
}
// Same "remove the same figure from both sides" adjustment as
// visibleSpentForMonth/visibleBudgetForMonth, carried through the
// year-to-date totals Annual Outlook shows — so a category excluded in
// several months this year doesn't inflate the running "under/over plan"
// figure there either.
function excludedSpendYTD(uptoYM){
  const start = ymOf(yearOfYM(uptoYM), 0);
  let s = 0;
  for(let k=start;k<=uptoYM;k++) s = roundCents(s + excludedSpendForMonth(k));
  return s;
}
function visibleYtdActual(uptoYM){
  return roundCents(ytdActual(uptoYM) - excludedSpendYTD(uptoYM));
}
function visibleYtdBudget(uptoYM){
  return roundCents(ytdBudget(uptoYM) - excludedSpendYTD(uptoYM));
}

// What the single most recent seeded month actually handed off — that
// month's own displayed Surplus (visibleAvailable − visibleSpent), which
// is already cumulative by construction (it includes whatever that month
// itself carried in from before it). So this is never "just last month's
// new money" in isolation — it's last month's whole ending number, exactly
// what Available silently folded in. Returns null when there's no prior
// seeded month to report (first month ever used), so the subhead note can
// tell "nothing to show" apart from "exactly $0 carried in".
function carriedInFromLastMonth(ym){
  for(let k=ym-1; k>=earliestYM(); k--){
    if(isMonthSeeded(k)) return roundCents(visibleAvailableForMonth(k) - visibleSpentForMonth(k));
  }
  return null;
}

--------------------------------------------------------------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab===ui.tab);
  });
  // Viewing a month never seeds it or prompts anything — this just quietly
  // marks months that already have real data (imported, or seeded before
  // this tracking existed) so they don't later show as "not set up".
  if(ui.loaded) ensureMonthSeeded(ui.ym);
  renderHeaderStepper();
  renderSubhead();
  const main = document.getElementById("main");
  main.innerHTML = "";
  // Switching top-level tabs (Monthly / Annual Outlook / Budget Setup /
  // Settings) should always land at the top of the new tab's content, never
  // mid-scroll from wherever the previous tab was left. This only fires when
  // ui.tab actually changed since the last render — a re-render of the same
  // tab (e.g. after an edit) must not yank scroll position around.
  if(ui.tab!==lastRenderedTab){
    window.scrollTo({top:0, behavior:"instant"});
    lastRenderedTab = ui.tab;
  }
  if(!ui.loaded){ renderSkeleton(main); return; }
  if(ui.tab==="monthly") renderMonthly(main);
  else if(ui.tab==="outlook") renderOutlook(main);
  else if(ui.tab==="categories") renderCategories(main);
  else if(ui.tab==="cashflow") renderCashFlow(main);
  else if(ui.tab==="settings") renderSettings(main);
}

// The one place the current period is displayed, full stop — every other
// date label in the body (Monthly's old subhead label, the Year-to-Date
// card's own year) was removed in favor of this, so there's never a
// duplicate to fall out of sync. Granularity follows the tab: Monthly is
// month-scoped, Annual Outlook is year-scoped. Budget Setup is a template
// (not tied to any one month) and Settings has its own independent year
// control, so both render nothing here. A single compact widget: the
// calendar icon is the real tap target (opens the Year Grid — month+year
// on Monthly, year-only on Outlook); the chevrons just step one unit
// without opening anything.

function renderHeaderStepper(){

      </div>

      <div class="cal-stack">
