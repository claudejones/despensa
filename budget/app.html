// Everything that spans the full year lives here instead of on Monthly:
// year-to-date progress, budget vs. actual by month, and the exchange-rate
// trend. No month picker — "through" uses whatever month Monthly last
// pointed at, since that's the one piece of month-state the app tracks.
function renderOutlook(main){
  const ym = ui.ym;
  const year = yearOfYM(ym);
  const yearBudget = yearSettings(year).yearBudgetUSD;
  const ytdSpent = visibleYtdActual(ym);
  const ytdBud = visibleYtdBudget(ym);
  const ytdDiff = roundCents(ytdBud - ytdSpent);

  const wrap = el("div", "stack");

  const ytdCard = el("div","card stack");
  ytdCard.innerHTML = `
    <div class="eyebrow">Year to date</div>
  `;
  const bar = el("div");
  const pct = Math.min(100, (ytdSpent/Math.max(yearBudget,1))*100);
  bar.innerHTML = `
    <div class="row"><span class="muted num">${fmtUSD(ytdSpent)} spent</span><span class="muted num">${fmtUSD(yearBudget)} annual budget</span></div>
    <div class="catbar" style="margin-top:6px"><div style="width:${pct}%; background:var(--primary)"></div></div>
    <div class="muted" style="margin-top:6px">${fmtUSD(ytdDiff)} ${ytdDiff>=0?"under":"over"} plan through ${MONTHS[monthOfYM(ym)]}</div>
  `;
  ytdCard.appendChild(bar);
  wrap.appendChild(ytdCard);

  const chartCard = el("div","card stack");
  chartCard.innerHTML = `
    <div class="eyebrow">Budget vs. actual, by month</div>
    <canvas id="chartMonthly" height="180"></canvas>
    <div class="muted" style="margin-top:2px">Solid bars are logged months; the lighter bars are your plan for months you haven't reached yet.</div>
  `;
  wrap.appendChild(chartCard);

  // The month-by-month exchange-rate line moved to the Monthly dashboard
  // (one dot per entry). This card is the year view: what rate each payment
  // method actually got, against the year's baseline.
  wrap.appendChild(rateByMethodCard(year));

  main.appendChild(wrap);

  drawMonthlyChart();
}

// Rate paid by payment method, year to date. Dot = amount-weighted average
// rate for entries that carry one; the bar runs from the baseline to the dot,
// and the right-hand figure is what that gap cost (or saved) in USD. Bank
// transfers carry no rate, so they're listed but not compared. Changing the
// year's baseline restates the dollar figures (they're measured against it)
// but never the rates themselves — each entry keeps the rate it was logged at.
function rateByMethodCard(year){
  const card = el("div","card stack");
  const baseRate = yearSettings(year).baseRate;
  const all = state.actuals.filter(a=> yearOfDate(a.date)===year && a.amount);
  const withRate = all.filter(a=> a.rate);
  const methods = [["cash","Cash"],["card","Card"],["service","Transfer service"],["transfer","Bank transfer"]];
  const rows = methods.map(([k,label])=>{
    const count = all.filter(a=>a.paymentMethod===k).length;
    if(k==="transfer") return { label, count, none:"no rate" };
    const L = withRate.filter(a=>a.paymentMethod===k);
    if(!L.length) return { label, count, none: count ? "no rate" : "none yet" };
    let mxn=0, usd=0;
    L.forEach(a=>{ mxn += toMXN(a.amount, a.currency, a.rate); usd += toUSD(a.amount, a.currency, a.rate); });
    return { label, count, n:L.length, avg: mxn/usd, delta: roundCents(usd - mxn/baseRate) };
  });
  const rates = rows.filter(r=>r.avg).map(r=>r.avg).concat([baseRate]);
  const lo = Math.floor((Math.min(...rates)-0.1)*10)/10, hi = Math.ceil((Math.max(...rates)+0.1)*10)/10;
  const pos = r=> ((r-lo)/(hi-lo)*100).toFixed(2);
  const fx = exchangeImpactForYear(year);
  const eyeBtn = withRate.length ? `<button type="button" class="infobtn" id="rbmDetail" aria-label="View entries with a rate">${iconDocument()}</button>` : "";
  card.innerHTML = `
    <div class="row" style="align-items:center">
      <div class="eyebrow" style="flex:1">Rate paid by payment method</div>
      ${eyeBtn}
    </div>
    ${withRate.length ? `
      <div style="display:grid; grid-template-columns:88px 1fr 112px; column-gap:8px; row-gap:10px; align-items:center">
        <span></span>
        <span style="position:relative; height:14px"><span class="muted" style="position:absolute; left:${pos(baseRate)}%; transform:translateX(-50%); font-size:10px; white-space:nowrap">Baseline ${baseRate.toFixed(2)}</span></span>
        <span></span>
        ${rows.map(r=>`
          <span><span style="display:block; font-weight:600; font-size:13px">${r.label}</span><span class="muted" style="display:block; font-size:11px">${r.avg ? r.n+" with a rate" : (r.count+" "+(r.count===1?"entry":"entries"))}</span></span>
          <span style="position:relative; height:26px">
            <span style="position:absolute; left:0; right:0; top:13px; border-top:1px solid var(--line)"></span>
            <span style="position:absolute; left:${pos(baseRate)}%; top:5px; height:16px; border-left:2px solid var(--ink-soft)"></span>
            ${r.avg ? `
              <span style="position:absolute; left:${Math.min(pos(r.avg),pos(baseRate))}%; width:${Math.abs(pos(r.avg)-pos(baseRate))}%; top:12px; height:3px; background:var(--primary)"></span>
              <span style="position:absolute; left:${pos(r.avg)}%; top:8px; width:10px; height:10px; margin-left:-5px; border-radius:50%; background:var(--primary); border:2px solid var(--surface); box-sizing:content-box"></span>
              <span class="num" style="position:absolute; left:${pos(r.avg)}%; top:-8px; transform:translateX(-50%); font-size:10px; font-weight:600">${r.avg.toFixed(2)}</span>
            ` : `<span class="muted" style="position:absolute; left:6px; top:5px; font-size:11px">${r.none}</span>`}
          </span>
          <span class="num" style="text-align:right; font-size:12px; white-space:nowrap; color:${r.avg ? (r.delta<=0?'var(--good)':'var(--bad)') : 'var(--ink-soft)'}">${r.avg ? (r.delta<=0?'Saved '+fmtUSD(Math.abs(r.delta)):'Cost you '+fmtUSD(r.delta)) : "n/a"}</span>
        `).join("")}
      </div>
      <div class="muted" style="font-size:11px">Dot = average rate paid, weighted by amount. Right = cost vs. your ${baseRate.toFixed(2)} baseline. Bank transfers carry no rate.</div>
      ${fx ? `<div class="num" style="font-weight:600; color:${fx.deltaUSD<=0?'var(--good)':'var(--bad)'}">${fx.deltaUSD<=0?'Saved you '+fmtUSD(Math.abs(fx.deltaUSD)):'Cost you '+fmtUSD(fx.deltaUSD)} vs. your baseline, all ${fx.count} entries with a rate (avg ${fx.avgRate.toFixed(2)})</div>` : ""}
    ` : `<div class="empty">No rate entries logged yet this year.</div>`}
  `;
  const detailBtn = card.querySelector("#rbmDetail");
  if(detailBtn) detailBtn.onclick = ()=> openRateEntriesSheet(`Entries with a rate, ${year}`, withRate.slice().sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0), baseRate);
  return card;
}

let charts = {};
// Reached months (hasActualsForMonth) plot the real figure in full
// strength; months you haven't gotten to yet plot the plan instead, in a
// visibly lighter fill — same underlying "Budget" series, no fabricated
// numbers, just a muted treatment so it reads as projection, not fact.
function drawMonthlyChart(){
  const ctx = document.getElementById("chartMonthly");
  if(!ctx || typeof Chart==="undefined") return;
  const year = yearOfYM(ui.ym);
  const yms = MONTHS.map((_,i)=> ymOf(year, i));
  const budgets = yms.map(ym=> visibleBudgetForMonth(ym));
  const actuals = yms.map(ym=> hasActualsForMonth(ym) ? visibleSpentForMonth(ym) : null);
  // One consistent color for every "Budget / plan" bar — the dark "Actual"
  // bar in front of it already signals which months have logged data, so
  // a second, unlabeled color on the plan bar itself only broke the
  // legend (whose single swatch could never represent two colors at once).
  try{
    if(charts.monthly) charts.monthly.destroy();
    charts.monthly = new Chart(ctx, {
      type:"bar",
      data:{ labels:MONTHS, datasets:[
        { label:"Budget / plan", data:budgets, backgroundColor: hexToRgba(cssVar("--ink-soft"), 0.18), borderRadius:4 },
        { label:"Actual", data:actuals, backgroundColor: cssVar("--primary"), borderRadius:4 },
      ]},
      options:{
        responsive:true,
        plugins:{
          legend:{ labels:{ color:cssVar("--ink-soft"), font:{family:"Work Sans"} } },
          // Chart.js's default tooltip formatter shows up to 3 decimal
          // places on a raw JS number, which is why a summed actual like
          // 5372.335999... read as "$5,372.336" — every dollar figure in
          // this app is 2 decimals, tooltips included.
          tooltip: chartTooltip({ label:(c)=> `${c.dataset.label}: ${fmtUSD(c.parsed.y)}` }),
        },
        scales:{
          x:{ ticks:{color:cssVar("--ink-soft")}, grid:{display:false} },
          y:{ ticks:{color:cssVar("--ink-soft")}, grid:{color:cssVar("--line")} }
        }
      }
    });
  } catch(e){
    chartRenderError(ctx, e);
  }
}
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#888"; }

// This app's CSS custom properties are always plain hex (see :root above),
// so a straight hex->rgba conversion is safe here without a general parser.
function hexToRgba(hex, alpha){
  const h = hex.replace("#","");
  const full = h.length===3 ? h.split("").map(c=>c+c).join("") : h;
  const n = parseInt(full, 16);
  const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return `rgba(${r},${g},${b},${alpha})`;
}

// If a Chart.js construction ever throws, show the real error on the card
// instead of leaving a silent blank rectangle — the failure mode a blank
// canvas gives no way to diagnose after the fact.
function chartRenderError(canvas, err){
  const card = canvas.closest(".card");
  if(!card) return;
  const msg = el("div","muted");
  msg.style.color = "var(--bad)";
  msg.textContent = "Chart failed to render: " + (err && err.message ? err.message : String(err));
  card.appendChild(msg);
}

/* ---------------------------------------------------------------
   RENDER: MONTHLY (calendar-driven entry)
--------------------------------------------------------------- */
// The first time a month is viewed, it's pre-populated with actual-spend
// entries matching Budget Setup's items — so a month starts already
// reflecting the plan, and you manage each category from there (edit an
// entry that didn't match, delete one that didn't happen, add anything
// unplanned). Runs once per month, tracked in settings, so it's never
// redone — a month that already has real logged spend (e.g. imported data)
// is left untouched and just marked as seeded, so nothing gets duplicated.
// First time a month is opened, it's unseeded — rather than silently
// copying every master line item into it (the old behavior), ask what to
// do: apply the whole Budget Setup template, hand-pick a subset, or start
// from nothing. A month that already has actuals logged (imported data,
// or one seeded before this tracking existed) is left untouched and just
// marked seeded, same as before.
function ensureMonthSeeded(ym){
  const seeded = state.settings.seededYMs || [];
  if(seeded.includes(ym)) return;
  const hasActuals = state.actuals.some(a=>ymOfDate(a.date)===ym);
  if(hasActuals){
    state.settings.seededYMs = [...seeded, ym];
    dbSetSettings();
  }
  // No else branch — an unconfigured month with no actuals just stays
  // unconfigured until the person explicitly taps "Set up this month".
  // Viewing it (ledger, dashboard, year grid, prev/next) never pops the
  // setup sheet on its own.
}

function isMonthSeeded(ym){
  return (state.settings.seededYMs||[]).includes(ym);
}

function markMonthSeeded(ym){
  const seeded = state.settings.seededYMs || [];
  if(!seeded.includes(ym)) state.settings.seededYMs = [...seeded, ym];
  dbSetSettings();
}

// Copies one Budget Setup item's amount for this month into an actual-
// spend entry — the same effect the old silent auto-seed had, just now
// applied deliberately, one item (or all of them) at a time.
function seedItemIntoMonth(li, ym){
  const mIdx = monthOfYM(ym);
  const amt = li.schedule[mIdx]||0;
  if(!amt) return;
  const dateStr = new Date(yearOfYM(ym), mIdx, 1).toISOString().slice(0,10);
  const rate = li.rate || yearSettings(yearOfYM(ym)).baseRate;
  const rec = { id: uid("act"), categoryId: li.categoryId, name: li.name, date: dateStr, amount: amt, currency: li.currency, rate, paymentMethod: li.paymentMethod };
  state.actuals.push(rec);
  dbSet("actuals", rec.id, rec);
}

// Forks every template category applying to `ym` into its own independent
// copy in state.monthCategoryData[ym] — from this moment on, edits to this
// month's categories/items never touch the template, and template edits
// never retroactively touch this month. `itemFilter(li)` decides which of a
// category's eligible line items get copied in as the month's own local
// items (their amount frozen at that item's schedule[mIdx] right now).
function forkTemplateIntoMonth(ym, itemFilter){
  const mIdx = monthOfYM(ym);
  const data = {};
  state.categories.filter(c=>categoryAppliesToYM(c, ym)).forEach(c=>{
    const items = state.lineitems
      .filter(li=>li.categoryId===c.id && (!li.onlyYM || li.onlyYM===ym) && itemFilter(li))
      .map(li=>({ id: uid("mli"), name: li.name, amount: li.schedule[mIdx]||0, paymentMethod: li.paymentMethod }));
    // name is snapshotted here too, same as everything else — once
    // forked, this month's display never depends on the template still
    // existing (see categoryDisplayInfo, which falls back to this exact
    // field the moment the template is gone).
    // excludedDefault is only ever a starting point: it's copied into this
    // month's own `excluded` flag right here, once, same as baseAmountUSD —
    // from here on this month's flag is independent, exactly like every
    // other already-seeded month and the template itself.
    data[c.id] = { baseAmountUSD: c.baseAmountUSD || 0, items, source: "template", name: c.name, excluded: !!c.excludedDefault };
  });
  state.monthCategoryData[ym] = data;
  dbSetMonthCategoryData();
}

function openMonthSeedChoiceDialog(ym){
  const dlg = document.getElementById("dlg");
  const body = document.getElementById("dlgBody");
  const mIdx = monthOfYM(ym);
  const eligible = state.lineitems.filter(li=> (!li.onlyYM || li.onlyYM===ym) && (li.schedule[mIdx]||0));
  body.innerHTML = `
    <h3>Set up ${MONTHS[mIdx]} ${yearOfYM(ym)}</h3>
    <p class="muted">This month hasn't been opened yet. Start it from your Budget Setup items, or skip and build it up as you go.</p>
    <div class="stack" style="gap:10px">
      <button class="btn primary block" id="msAll">Apply all categories${eligible.length?` (${eligible.length} item${eligible.length===1?"":"s"})`:""}</button>
      <button class="btn block" id="msChoose">Choose which to include</button>
      <button class="btn ghost block" id="msNone">Start with nothing</button>
    </div>
  `;
  body.querySelector("#msAll").onclick = ()=>{
    eligible.forEach(li=> seedItemIntoMonth(li, ym));
    // "Apply all" forks every applicable template category in with ALL of
    // its eligible (nonzero-this-month) items, mirroring exactly what just
    // got seeded into actuals above.
    forkTemplateIntoMonth(ym, li=> (li.schedule[mIdx]||0));
    markMonthSeeded(ym);
    dlg.close();
    showToast(`${MONTHS[mIdx]} set up from Budget Setup`);
    render();
  };
  body.querySelector("#msNone").onclick = ()=>{
    // Start with nothing: no category exists in this month at all yet — the
    // user builds it up from scratch via the Monthly "+ Add category" UI.
    state.monthCategoryData[ym] = {};
    dbSetMonthCategoryData();
    markMonthSeeded(ym);
    dlg.close();
    render();
  };
  body.querySelector("#msChoose").onclick = ()=> openMonthSeedChecklistDialog(ym, eligible);
  openSheet();
}

// The hand-picked variant of the seed choice — same eligible items, but
// each one is an individual checkbox instead of an all-or-nothing switch.
function openMonthSeedChecklistDialog(ym, eligible){
  const dlg = document.getElementById("dlg");
  const body = document.getElementById("dlgBody");
  const mIdx = monthOfYM(ym);
  const rate = yearSettings(yearOfYM(ym)).baseRate;
  const rows = eligible.length ? eligible.map(li=>{
    const c = state.categories.find(x=>x.id===li.categoryId);
    const amt = toUSD(li.schedule[mIdx]||0, li.currency, li.rate||rate);
    return `
      <label class="sheet-row" style="flex-direction:row; align-items:center; gap:10px">
        <input type="checkbox" class="msItem" data-id="${li.id}" style="width:auto">
        <span style="flex:1">${escapeHtml(li.name)} <span class="muted">· ${c?escapeHtml(c.name):""}</span></span>
        <span class="num muted">${fmtUSD(amt)}</span>
      </label>
    `;
  }).join("") : `<div class="empty">No Budget Setup items have an amount for this month.</div>`;
  body.innerHTML = `
    <h3>Choose items for ${MONTHS[mIdx]} ${yearOfYM(ym)}</h3>
    ${eligible.length ? `
    <label class="sheet-row" id="mcSelectAllRow" style="flex-direction:row; align-items:center; gap:10px; border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:2px">
      <input type="checkbox" id="mcSelectAll" style="width:auto">
      <span style="flex:1; font-weight:600">Select all</span>
    </label>` : ""}
    <div class="stack" id="mcList" style="gap:2px">${rows}</div>
    <div class="dialog-actions">
      <button class="btn ghost" id="mcCancel">Back</button>
      <button class="btn primary" id="mcSave" disabled>Apply selected</button>
    </div>
  `;
  const itemBoxes = [...body.querySelectorAll(".msItem")];
  const selectAll = body.querySelector("#mcSelectAll");
  const saveBtn = body.querySelector("#mcSave");
  // Reflects (and updates live as) whether all/some/none of the item
  // checkboxes are checked — a real tri-state control, not just a one-way
  // "check everything" button. "Apply selected" with nothing checked isn't
  // a real choice — "Start with nothing" (one screen back) is the only
  // button that actually produces an empty month — so it stays disabled
  // until at least one item is checked, exactly like the Transfer-funds
  // dialog disables "Move" with no source selected.
  function syncSelectAll(){
    const checkedCount = itemBoxes.filter(b=>b.checked).length;
    if(selectAll){
      selectAll.checked = checkedCount>0 && checkedCount===itemBoxes.length;
      selectAll.indeterminate = checkedCount>0 && checkedCount<itemBoxes.length;
    }
    saveBtn.disabled = checkedCount===0;
  }
  if(selectAll){
    selectAll.addEventListener("change", ()=>{
      itemBoxes.forEach(b=> b.checked = selectAll.checked);
      syncSelectAll();
    });
    itemBoxes.forEach(b=> b.addEventListener("change", syncSelectAll));
  }
  syncSelectAll();
  body.querySelector("#mcCancel").onclick = ()=> openMonthSeedChoiceDialog(ym);
  body.querySelector("#mcSave").onclick = ()=>{
    const checked = new Set(itemBoxes.filter(b=>b.checked).map(b=>b.dataset.id));
    if(checked.size===0) return;
    eligible.filter(li=>checked.has(li.id)).forEach(li=> seedItemIntoMonth(li, ym));
    // "Choose which" forks EVERY applicable template category into the
    // month regardless of what got checked — the checklist only controls
    // which items get pre-seeded as actuals, not which categories exist in
    // the month. A category with a flat budget and zero checked items still
    // gets forked in with that budget and an empty item list.
    forkTemplateIntoMonth(ym, li=> checked.has(li.id));
    markMonthSeeded(ym);
    dlg.close();
    showToast(`${MONTHS[mIdx]} set up with ${checked.size} item${checked.size===1?"":"s"}`);
    render();
  };
  openSheet();
}

// Shared empty state for an unconfigured month — shown on both the Ledger
// and Dashboard sub-views instead of letting zeroed-out figures pass for
// "configured with nothing budgeted", which is a different, misleading
// state. Setup only ever happens from the explicit button here.
// Quiet empty state for an unconfigured PAST month only — nobody's going to
// retroactively fill it in, so it's a low-emphasis "no data" read, not a
// pending task. A current/future unconfigured month instead gets a real
// forecast — see appendMonthForecast below.
function monthNotSetUpCard(ym){
  const mIdx = monthOfYM(ym);
  const card = el("div","card stack");
  card.innerHTML = `
    <div class="empty" style="padding:34px 10px">
      <div style="font-weight:600; color:var(--ink-soft); margin-bottom:4px">No data recorded</div>
      <div class="muted" style="margin-bottom:14px">${MONTHS[mIdx]} ${yearOfYM(ym)} has no budget configured.</div>
      <button type="button" id="setupMonthBtn" style="background:none; border:none; color:var(--ink-soft); font-size:12px; cursor:pointer; text-decoration:underline; padding:0">Set up this month anyway</button>
    </div>
  `;
  card.querySelector("#setupMonthBtn").onclick = ()=> openMonthSeedChoiceDialog(ym);
  return card;
}

// A simple call-to-action for a CURRENT or FUTURE unconfigured month. The
// subhead above already shows a real Available figure (template budget +
// whatever has genuinely rolled forward from already-seeded prior months);
// there's nothing else real to show until the month is actually set up, so
// this is just a prominent CTA — no per-category breakdown, no "projected"
// numbers, no forecast label. Appends its card straight onto `wrap` for
// consistency with the (single-card) monthNotSetUpCard above.
function appendMonthForecast(wrap, ym){
  const mIdx = monthOfYM(ym);
  const card = el("div","card stack");
  card.innerHTML = `
    <div class="empty" style="padding:34px 10px">
      <div style="font-weight:600; margin-bottom:4px">This month hasn't been set up yet</div>
      <div class="muted" style="margin-bottom:14px">${MONTHS[mIdx]} ${yearOfYM(ym)} has no budget configured, so there's nothing to show here yet.</div>
      <button class="btn primary block" id="setupMonthBtn" type="button">Set up this month</button>
    </div>
  `;
  card.querySelector("#setupMonthBtn").onclick = ()=> openMonthSeedChoiceDialog(ym);
  wrap.appendChild(card);
}

// Resolves a catId to display info for Monthly, whether it's a real
// template category (state.categories) or a purely month-local one that
// only exists inside state.monthCategoryData[ym] (source:"local", no
// template counterpart at all).
function categoryDisplayInfo(catId, ym){
  const tmpl = state.categories.find(c=>c.id===catId);
  if(tmpl) return { id: tmpl.id, name: tmpl.name, isLocal:false };
  const entry = (state.monthCategoryData[ym]||{})[catId];
  return { id: catId, name: (entry && entry.name) || "Untitled", isLocal:true };
}

// Display name for either end of a transfer, resolved in the month of the
// transfer's own date so a month-only category isn't shown as "?".
function transferCatName(catId, t){
  if(catId===null || catId===undefined) return "External source";
  return categoryDisplayInfo(catId, ymOfDate(t.date)).name;
}

// Every category that's actually part of a SET-UP month — driven by
// state.monthCategoryData[ym], never by the live template list, since a
// seeded month only shows what it was actually forked with (plus whatever
// has since been added/removed directly in that month). Template-matched
// categories keep the template's own order; purely month-local ones (no
// template counterpart) follow at the end in the order they were added.
function monthCategoryList(ym){
  const data = state.monthCategoryData[ym] || {};
  const ids = Object.keys(data).filter(id=> id!==DROPPED_CREDITS_KEY);
  const templateIds = ids.filter(id=> state.categories.some(c=>c.id===id))
    .sort((a,b)=> state.categories.find(c=>c.id===a).order - state.categories.find(c=>c.id===b).order);
  const localIds = ids.filter(id=> !state.categories.some(c=>c.id===id));
  return [...templateIds, ...localIds].map(id=>{
    const info = categoryDisplayInfo(id, ym);
    return { id, name: info.name, entry: data[id] };
  });
}

function renderMonthly(main){
  const ym = ui.ym;
  // The subhead (Available/Spent/Surplus + prev/next) is shared by both
  // sub-views; only the body below it switches.
  if(ui.monthlyView==="dash"){
    renderMonthlyDash(main, ym);
    return;
  }

  const wrap = el("div","stack");

  if(!isMonthSeeded(ym)){
    if(ym < todayYM()) wrap.appendChild(monthNotSetUpCard(ym));
    else appendMonthForecast(wrap, ym);
    main.appendChild(wrap);
    return;
  }

  const catsCard = el("div","card stack");
  // Driven by state.monthCategoryData[ym], not the live template list — a
  // set-up month only ever shows what it was actually forked with (plus
  // whatever's been added/removed directly in that month since), never
  // whatever Budget Setup happens to look like right now.
  const monthCats = monthCategoryList(ym);
  // No separate "N excluded" banner — it reflowed the whole list every
  // time one got toggled, and the dimmed rows below already say exactly
  // which categories are excluded without needing a second place to look.
  catsCard.innerHTML = `
    <div class="section-title">
      <div class="eyebrow">Allocated by category</div>
      <button class="infobtn accent" type="button" id="mAddCat" aria-label="Add a category to this month" style="font-size:18px; line-height:1">+</button>
    </div>
  `;
  catsCard.querySelector("#mAddCat").onclick = ()=> openMonthAddCategorySheet(ym);
  // A seeded month can legitimately have zero categories (chose "Start
  // with nothing", or removed its last one since) — distinct from never
  // having been set up at all. Without this, the card just goes blank,
  // which reads as broken rather than as "empty, build it up from here."
  if(monthCats.length===0){
    catsCard.appendChild(el("div","empty","No categories yet — tap + to add one."));
  }
  monthCats.forEach(({id, name, entry})=>{
    const excluded = !!(entry && entry.excluded);
    const base = categoryBaseForMonth(id, ym);
    const roll = rolloverForMonth(id, ym);
    const adj = categoryAdjustmentForMonth(id, ym);
    const avail = base + roll + adj;
    // "Has a target" used to mean "has line items" back when a category's
    // budget only ever came from summing them, then just "has a non-zero
    // Base allocation." Neither is right for a category funded by transfer
    // instead of a recurring Base (e.g. a catch-all category with no set
    // budget) — it has real money to track against even with base===0. What
    // actually decides whether there's a target to show status against is
    // whether there's any money available at all, from any source.
    const hasTarget = avail !== 0;
    const spent = spentForMonth(id, ym);
    const remaining = roundCents(avail - spent);
    const pct = avail>0 ? Math.min(100, (spent/avail)*100) : (spent>0?100:0);
    const remainingInfo = remainingDisplay(hasTarget, remaining);
    // Rollover is already carried into `avail` above — a category that
    // underspends in Jan really does have more to spend in Feb, the math
    // has done that all along. What was missing was ever showing it: two
    // months with the same leftover dollar figure look identical unless
    // you can also see the base grew. This line is that proof.
    const showRoll = hasTarget && Math.abs(roll) > 0.005;
    // Same reasoning as showRoll just above, for the other number that
    // feeds Available: a transfer moved real money into or out of this
    // category this month just as surely as rollover carried it in from
    // last month, and hiding one while showing the other makes Available
    // look unexplained whenever a category is funded (or drained) by
    // transfer instead of — or in addition to — its own Base.
    const showAdj = hasTarget && Math.abs(adj) > 0.005;
    const row = el("div","catrow");
    if(excluded) row.classList.add("is-excluded");
    row.innerHTML = `
      <div class="head">
        <span class="name">${name}</span>
        <button class="infobtn" type="button" data-add aria-label="Add expense to ${escapeHtml(name)}">${iconDollar()}</button>
        <button class="infobtn" type="button" data-toggleexcl aria-label="${excluded?"Include":"Exclude"} ${escapeHtml(name)} from this month's totals" style="${excluded?`color:var(--accent)`:""}">${excluded?iconToggleOff():iconToggleOn()}</button>
        <span class="rowchev" aria-hidden="true">${iconChevronRight()}</span>
      </div>
      <div class="muted" style="font-size:10px; letter-spacing:.04em; text-transform:uppercase; margin-top:-2px; ${excluded?"color:var(--accent)":""}">${base > 0 ? `Budget ${fmtUSD(base)}` : "Budget: not set"}${excluded ? " · excluded" : ""}</div>
      <div class="catbar"><div style="${budgetBarStyle(hasTarget, remaining, pct)}"></div></div>
      <div class="row">
        <span class="muted num">${fmtUSD(spent)} spent</span>
        <span class="muted num" style="color:${remainingInfo.color}">${remainingInfo.text}</span>
      </div>
      ${showRoll ? `<div class="muted" style="font-size:11px; margin-top:-4px">${roll>0?'+':''}${fmtUSD(roll)} carried in from last month</div>` : ""}
      ${showAdj ? `<div class="muted" style="font-size:11px; margin-top:-4px">${adj>0?'+':''}${fmtUSD(adj)} moved ${adj>0?'in':'out'} this month</div>` : ""}
    `;
    row.style.cursor = "pointer";
    // Row tap (and its chevron) opens the one category-management screen —
    // same pattern as Budget Setup. The "$" icon is a shortcut that skips
    // straight to logging an expense. The exclude icon is its own
    // quick on/off for this month's Excluded flag — no dialog, matches the
    // category's own spent/left figures staying real and untouched either
    // way (only the whole-month totals above react).
    row.onclick = ()=> openMonthlyCategoryDetailSheet(id, ym);
    row.querySelector("[data-toggleexcl]").onclick = async (ev)=>{
      ev.stopPropagation();
      state.monthCategoryData[ym] = state.monthCategoryData[ym] || {};
      const e = state.monthCategoryData[ym][id];
      if(!e) return;
      e.excluded = !e.excluded;
      await dbSetMonthCategoryData();
      showToast(e.excluded ? `${name} excluded from ${MONTHS[monthOfYM(ym)]}` : `${name} counts toward ${MONTHS[monthOfYM(ym)]} again`);
      render();
    };
    row.querySelector("[data-add]").onclick = (ev)=>{
      ev.stopPropagation();
      openActualEntryDialog(id, ym, null);
    };
    catsCard.appendChild(row);
  });
  wrap.appendChild(catsCard);

  // Fund events and transfers for this month now live behind the sliders
  // icon in the subhead (openFundAdjustmentsSheet) instead of an
  // always-visible card at the bottom of the ledger.

  main.appendChild(wrap);
}

// Budget Setup's equivalent of Monthly's Fund Adjustments breakdown —
// much simpler, since the template only ever has one contributing factor
// (Excluded), not four. Still the same reconciliation shape and the same
// reasoning for keeping it out of the subhead: one consistent interaction
// pattern across both screens (quiet badge, full math one tap away) rather
// than one screen spelling its math out inline and the other not.
function openBudgetSetupBreakdownSheet(ym, rawTarget, rawAllocated, excludedAmt){
  const dlg = document.getElementById("dlg");
  const body = document.getElementById("dlgBody");
  const anyExcluded = state.categories.some(c=>categoryAppliesToYM(c,ym) && c.excludedDefault);
  const target = roundCents(rawTarget - excludedAmt);
  const allocated = roundCents(rawAllocated - excludedAmt);
  const unallocated = roundCents(target - allocated);
  const recHtml = `
    <div class="stack" style="gap:8px; background:var(--surface-2); border-radius:12px; padding:14px 16px; margin-bottom:16px">
      <div class="row"><span class="muted">Target (annual ÷ 12)</span><span class="num">${fmtUSD(rawTarget)}</span></div>
      ${anyExcluded ? `<div class="row"><span class="muted">− Excluded</span><span class="num">${fmtUSD(excludedAmt>0 ? -excludedAmt : 0)}</span></div>` : ""}
      <div class="row" style="border-top:1px solid var(--line); padding-top:8px"><span style="font-weight:600">= Target (adjusted)</span><span class="num" style="font-weight:600">${fmtUSD(target)}</span></div>
    </div>
    <div class="stack" style="gap:8px; background:var(--surface-2); border-radius:12px; padding:14px 16px; margin-bottom:16px">
      <div class="row"><span class="muted">Allocated</span><span class="num">${fmtUSD(rawAllocated)}</span></div>
      ${anyExcluded ? `<div class="row"><span class="muted">− Excluded</span><span class="num">${fmtUSD(excludedAmt>0 ? -excludedAmt : 0)}</span></div>` : ""}
      <div class="row" style="border-top:1px solid var(--line); padding-top:8px"><span style="font-weight:600">= Allocated (adjusted)</span><span class="num" style="font-weight:600">${fmtUSD(allocated)}</span></div>
    </div>
    <div class="row" style="padding-top:2px"><span style="font-weight:600">= Unallocated</span><span class="num" style="font-weight:600; color:${unallocated>=0?'var(--good)':'var(--bad)'}">${fmtUSD(unallocated)}</span></div>
  `;
  body.innerHTML = `
    <h3>Budget breakdown</h3>
    <p class="muted">Template — applies every month unless overridden</p>
    ${recHtml}
    <div class="dialog-actions"><button class="btn ghost" id="bbClose">Close</button></div>
  `;
  body.querySelector("#bbClose").onclick = ()=> dlg.close();
  openSheet();
}

// Itemized fund events (one-time/redistributed funding) and transfers for
// this month, with the ability to delete a transfer — moved off the main
// ledger scroll and behind the subhead's "adjustments" icon.
function openFundAdjustmentsSheet(ym){
  const dlg = document.getElementById("dlg");
  const body = document.getElementById("dlgBody");
  // Same predicate as fundAdjustmentsCountForMonth/fundAdjustmentForMonth —
  // one shared place decides which fund events touch which months.
  const fe = state.fundevents.filter(f=> fundAdjustmentPortion(f, ym) !== 0);
  const tr = state.transfers.filter(t=> ymOfDate(t.date)===ym);
  const feLabel = f=> f.mode==="oneshot" ? "One-time funds" : f.mode==="evenly" ? "Evenly across the year" : "Redistributed funds";

  const rows = (fe.length===0 && tr.length===0) ? `<div class="empty">No fund adjustments or transfers this month.</div>` : `
    <div class="stack" id="faRows" style="gap:0">
      ${fe.map(f=>`
        <div class="row">
          <span class="muted">${feLabel(f)} · ${f.date}${f.note?" · "+escapeHtml(f.note):""}</span>
          <span class="amt" style="display:flex; align-items:center; gap:10px">
            <span class="num">${fmtUSD(f.amountUSD)}</span>
            <button data-delfe="${f.id}" type="button" class="fa-iconbtn" aria-label="Delete fund adjustment">${iconTrash()}</button>
          </span>
        </div>
      `).join("")}
      ${tr.map(t=>{
        const fromLabel = transferCatName(t.fromCategoryId, t);
        const toName = transferCatName(t.toCategoryId, t);
        return `
          <div class="row taprow" role="button" tabindex="0" data-editnote="${t.id}" style="align-items:flex-start; gap:10px">
            <span class="muted" style="flex:1; min-width:0">Moved · ${escapeHtml(fromLabel)} → ${escapeHtml(toName)}${t.note?" · "+escapeHtml(t.note):""}</span>
            <span class="num" style="white-space:nowrap; flex:none">${fmtUSD(t.amountUSD)}</span>
            <span class="rowchev" aria-hidden="true">${iconChevronRight()}</span>
          </div>
        `;
      }).join("")}
    </div>
  `;

  // The reconciliation — every factor that adds up to this month's
  // Available, in the same order the math actually runs: template, then
  // what's been added (fund adjustments, transfers), then what rolled in,
  // then what's backed out for Excluded. Zero-value rows are skipped
  // (there's no reserved-height/anti-jump concern here — this is a modal
  // sheet, not a scrolling list with content below that a reflow would
  // shift). Rollover and Excluded are each a single aggregate line, same
  // as the badge counts them as a single factor regardless of how many
  // months or categories feed into them — not itemized here, since neither
  // is something added or removed from THIS sheet (Rollover isn't a
  // logged event at all; Excluded categories are toggled from the category
  // row/detail sheet, a different action in a different place).
  const templateOnly = roundCents(yearSettings(yearOfYM(ym)).yearBudgetUSD/12);
  const fundAdj = fundAdjustmentForMonth(ym);
  const extIn = externalTransfersInForMonth(ym);
  const rollover = carriedInFromLastMonth(ym) || 0;
  const excludedAmt = excludedSpendForMonth(ym);
  const availTotal = visibleAvailableForMonth(ym);
  const recRows = [
    ["Available Budget", templateOnly, null],
    fundAdj!==0 ? ["+ Fund adjustments", fundAdj, "good"] : null,
    extIn!==0 ? ["+ External transfers in", extIn, "good"] : null,
    rollover!==0 ? [`+ Carried in from last month`, rollover, rollover>0?"good":"bad"] : null,
    excludedCountForMonth(ym)>0 ? ["− Excluded", excludedAmt>0 ? -excludedAmt : 0, "bad"] : null,
  ].filter(Boolean);
  const recHtml = `
    <div class="stack" style="gap:8px; background:var(--surface-2); border-radius:12px; padding:14px 16px; margin-bottom:16px">
      ${recRows.map(([label,val])=> `<div class="row"><span class="muted">${label}</span><span class="num">${fmtUSD(val)}</span></div>`).join("")}
      <div class="row" style="border-top:1px solid var(--line); padding-top:8px"><span style="font-weight:600">Available this month</span><span class="num" style="font-weight:600">${fmtUSD(availTotal)}</span></div>
    </div>
  `;

  body.innerHTML = `
    <h3>Fund adjustments</h3>
    <p class="muted">${MONTHS[monthOfYM(ym)]} ${yearOfYM(ym)}</p>
    ${recHtml}
    <button class="btn accent block" id="faAddFunds">${iconPlus()}<span>Add funds</span></button>
    <div class="eyebrow" style="margin-top:14px">Itemized this month</div>
    ${rows}
    <div class="dialog-actions"><button class="btn ghost" id="faClose">Close</button></div>
  `;
  // Old data may still carry a transfer linked to a fund event from
  // before External-source transfers stopped creating one (same
  // externalSourceLinkId on both) — deleting either side of a leftover
  // pair still cascades to remove both, so no orphaned fund event is ever
  // left behind. A transfer saved under the current code never has this
  // link at all.
  body.querySelectorAll("[data-delfe]").forEach(btn=>{
    btn.onclick = ()=>{
      const f = fe.find(x=>x.id===btn.dataset.delfe);
      const linkedTr = f.externalSourceLinkId ? state.transfers.find(t=>t.externalSourceLinkId===f.externalSourceLinkId) : null;
      const scopeNote = f.mode==="oneshot" ? "" : " This fund event applies to more than just this month — deleting it removes it everywhere it applies.";
      const msg = linkedTr
        ? `Delete this ${fmtUSD(f.amountUSD)} addition? This also removes the matching category credit.`
        : `Delete this ${fmtUSD(f.amountUSD)} fund adjustment?${scopeNote}`;
      confirmAction(msg, async ()=>{
        state.fundevents = state.fundevents.filter(x=>x.id!==f.id);
        await dbDelete("fundevents", f.id);
        if(linkedTr){
          state.transfers = state.transfers.filter(x=>x.id!==linkedTr.id);
          await dbDelete("transfers", linkedTr.id);
        }
        showToast("Deleted");
        render();
        openFundAdjustmentsSheet(ym);
      }, ()=> openFundAdjustmentsSheet(ym));
    };
  });
  body.querySelectorAll("[data-editnote]").forEach(btn=>{
    const open = ()=> openEditTransferNoteSheet(tr.find(x=>x.id===btn.dataset.editnote), ym);
    btn.onclick = open;
    btn.onkeydown = (ev)=>{ if(ev.key==="Enter" || ev.key===" "){ ev.preventDefault(); open(); } };
  });
  // Pre-filled to the month you're already looking at (month/year locked,
  // not re-selectable — you're already here) — this was previously
  // view-only, with the only way to add funds at all being Settings.
  // Returns here on both Save and Cancel, same as the delete-transfer flow
  // above, instead of just dropping you with nothing open.
  body.querySelector("#faAddFunds").onclick = ()=> openFundDialog(ym, {
    onSaved: ()=> openFundAdjustmentsSheet(ym),
    onCancel: ()=> openFundAdjustmentsSheet(ym),
    lockMonth: true,
  });
  body.querySelector("#faClose").onclick = ()=> dlg.close();
  openSheet();
}

// Deleting a transfer (and, for a leftover linked external-source pair, its
// matching fund event so nothing is orphaned) — reached from inside the
// transfer's own detail sheet. Returns to the Fund adjustments list.
function confirmDeleteTransfer(t, ym){
  const fromLabel = transferCatName(t.fromCategoryId, t);
  const toName = transferCatName(t.toCategoryId, t);
  const linkedFe = t.externalSourceLinkId ? state.fundevents.find(f=>f.externalSourceLinkId===t.externalSourceLinkId) : null;
  const msg = linkedFe
    ? `Delete this ${fmtUSD(t.amountUSD)} addition (${fromLabel} → ${toName})? This also removes the matching funds added to the budget.`
    : `Delete this ${fmtUSD(t.amountUSD)} move (${fromLabel} → ${toName})?`;
  confirmAction(msg, async ()=>{
    state.transfers = state.transfers.filter(x=>x.id!==t.id);
    await dbDelete("transfers", t.id);
    if(linkedFe){
      state.fundevents = state.fundevents.filter(x=>x.id!==linkedFe.id);
      await dbDelete("fundevents", linkedFe.id);
    }
    showToast("Deleted");
    render();
    openFundAdjustmentsSheet(ym);
  }, ()=> openEditTransferNoteSheet(t, ym));
}

// Editing a transfer only ever touches its note here — amount, date, and
// From/To are fixed once saved, since changing any of those is really a
// different move, not a correction to this one (delete and re-enter
// instead). Keeping this to one field is deliberate, not a missing
// feature: it's the one thing worth fixing after the fact (a typo, more
// context) without reopening the whole linked bookkeeping.
function openEditTransferNoteSheet(t, ym){
  const dlg = document.getElementById("dlg");
  const body = document.getElementById("dlgBody");
  const fromLabel = transferCatName(t.fromCategoryId, t);
  const toName = transferCatName(t.toCategoryId, t);
  body.innerHTML = `
    <h3>Edit note</h3>
    <p class="muted">${fmtUSD(t.amountUSD)} · ${escapeHtml(fromLabel)} → ${escapeHtml(toName)} · ${t.date}</p>
    <label>Note<input type="text" id="etnNote" value="${t.note ? escapeHtml(t.note) : ""}" placeholder="e.g. covered grocery overrun"></label>
    <div class="dialog-actions" style="justify-content:space-between">
      <button class="btn small danger" id="etnDelete">${iconTrash()}<span>Delete transfer</span></button>
      <div style="display:flex; gap:10px">
        <button class="btn ghost" id="etnCancel">Cancel</button>
        <button class="btn primary" id="etnSave">Save</button>
      </div>
    </div>
  `;
  body.querySelector("#etnCancel").onclick = ()=> openFundAdjustmentsSheet(ym);
  body.querySelector("#etnDelete").onclick = ()=> confirmDeleteTransfer(t, ym);
  onceClick(body.querySelector("#etnSave"), async ()=>{
    const note = body.querySelector("#etnNote").value.trim();
    if(note) t.note = note; else delete t.note;
    await dbSet("transfers", t.id, t);
    showToast("Note updated");
    render();
    openFundAdjustmentsSheet(ym);
  });
  openSheet();
}

// One actual-spend entry — a name is optional (leave it blank for a lump
// total), linked USD/MXN amount, payment method, notes, and a date within
// the month. No "apply forward" here — actual spend happened once, by
// nature. onBack (optional) is where Cancel returns to — the dashboard's
// "$" shortcut opens this directly (no onBack: Cancel just closes the
// sheet), while the monthly category screen opens it mid-dialog and passes
// itself as onBack so Cancel lands back there instead of exiting entirely.
function openActualEntryDialog(categoryId, ym, existing, onBack){
  const dlg = document.getElementById("dlg");
  const body = document.getElementById("dlgBody");
  const baseRate = yearSettings(yearOfYM(ym)).baseRate;
  const curCurrency = existing ? existing.currency : "USD";
  const curRate = existing ? (existing.rate || baseRate) : baseRate;
  const nativeAmt = existing ? (existing.amount||0) : 0;
  const usdInit = curCurrency==="MXN" ? nativeAmt/curRate : nativeAmt;
  const mxnInit = curCurrency==="MXN" ? nativeAmt : nativeAmt*curRate;
  const defaultDate = (()=>{
    const today = new Date();
    if(ymOf(today.getFullYear(), today.getMonth())===ym) return today.toISOString().slice(0,10);
    return new Date(yearOfYM(ym), monthOfYM(ym), 1).toISOString().slice(0,10);
  })();

  body.innerHTML = `
    <h3>${existing?"Edit":"Add"} Expense</h3>
    <label>Name (optional)<input type="text" id="aName" value="${existing?escapeHtml(existing.name||""):""}" placeholder="Leave blank for a lump total"></label>
    ${currencyFieldsHTML()}
    <label>Payment method
      <select id="aPay">
        <option value="card" ${!existing||existing.paymentMethod==="card"?"selected":""}>Card</option>
        <option value="cash" ${existing&&existing.paymentMethod==="cash"?"selected":""}>Cash (ATM)</option>
        <option value="transfer" ${existing&&existing.paymentMethod==="transfer"?"selected":""}>Bank transfer</option>
        <option value="service" ${existing&&existing.paymentMethod==="service"?"selected":""}>Transfer service</option>
      </select>
    </label>
    <label>Date<input type="date" id="aDate" value="${existing?existing.date:defaultDate}"></label>
    <div class="field-block">
      <div class="muted" style="font-size:12px; margin-bottom:6px">Reimburse to</div>
      <div class="row" style="gap:6px; justify-content:flex-start" id="aReimb">
        ${REIMBURSE_OPTIONS.map(o=>`<button type="button" class="btn small ${(existing&&existing.reimburseTo||"")===o.id?"active":""}" data-reimb="${o.id}">${o.label}</button>`).join("")}
      </div>
    </div>
    <label>Notes (optional)<textarea id="aNote" rows="2" placeholder="Any detail worth remembering about this expense">${existing?escapeHtml(existing.note||""):""}</textarea></label>
    <div class="dialog-actions" style="justify-content:space-between">
      ${existing ? `<div style="display:flex; gap:8px"><button class="btn small ghost" id="aDuplicate">${iconCopy()}<span>Duplicate</span></button><button class="btn small danger" id="aDelete">${iconTrash()}<span>Delete</span></button></div>` : `<span></span>`}
      <div style="display:flex; gap:10px">
        <button class="btn ghost" id="aCancel">Cancel</button>
        <button class="btn primary" id="aSave">Save</button>
      </div>
    </div>
  `;
  const linked = wireLinkedCurrency(body, "USD");
  // Only an existing entry gets its amount pre-filled — a brand-new entry
  // leaves these blank so the "0.00" placeholder shows instead of a literal
  // 0.00 the person has to clear before typing.
  if(existing){
    body.querySelector("#itUSD").value = usdInit.toFixed(2);
    body.querySelector("#itMXN").value = mxnInit.toFixed(2);
  }
  body.querySelector("#itRate").value = curRate;
  if(curCurrency==="MXN") body.querySelector("#itCurMXN").click();

  // Bank transfers carry no rate — the bank's own spread isn't something
  // the person sees, and filling in a market rate would record a number
  // that isn't what they paid. The currency toggle, MXN and Rate fields
  // hide and the entry saves in USD with no rate, so FX stats leave it
  // out (exchangeImpact* already skip rate-less entries). A legacy bank
  // transfer that already carries a rate keeps showing it, untouched.
  const payEl = body.querySelector("#aPay");
  const hasLegacyRate = !!(existing && existing.paymentMethod==="transfer" && existing.rate);
  const noRateMode = ()=> payEl.value==="transfer" && !hasLegacyRate;
  function applyPayMode(){
    const off = noRateMode();
    if(off) body.querySelector("#itCurUSD").click();
    ["#itCurUSD","#itMXN","#itRate"].forEach(sel=>{
      const node = body.querySelector(sel);
      const holder = sel==="#itCurUSD" ? node.closest(".row") : node.closest("label");
      if(holder) holder.style.display = off ? "none" : "";
    });
    let note = body.querySelector("#aNoRateNote");
    if(off && !note){
      note = el("div","muted"); note.id = "aNoRateNote"; note.style.fontSize = "12px";
      note.textContent = "Bank transfers are recorded in USD with no exchange rate.";
      body.querySelector("#itUSD").closest("label").after(note);
    }
    if(!off && note) note.remove();
  }
  payEl.addEventListener("change", applyPayMode);
  applyPayMode();

  let reimburseTo = (existing && existing.reimburseTo) || "";
  body.querySelectorAll("[data-reimb]").forEach(b=>{
    b.onclick = ()=>{
      reimburseTo = b.dataset.reimb;
      body.querySelectorAll("[data-reimb]").forEach(x=> x.classList.toggle("active", x===b));
    };
  });

  body.querySelector("#aCancel").onclick = ()=>{ if(onBack){ onBack(); } else { dlg.close(); } };
  onceClick(body.querySelector("#aSave"), async ()=>{
    const amount = linked.getNativeAmount();
    if(!amount){ formError(body, "Enter an amount.", body.querySelector("#itUSD")); return; }
    const date = body.querySelector("#aDate").value;
    if(!date){ formError(body, "Pick a date.", body.querySelector("#aDate")); return; }
    const rec = {
      id: existing ? existing.id : uid("act"),
      categoryId,
      name: body.querySelector("#aName").value.trim(),
      date,
      amount,
      currency: linked.getCurrency(),
      rate: noRateMode() ? null : linked.getRate(),
      paymentMethod: body.querySelector("#aPay").value,
      note: body.querySelector("#aNote").value.trim(),
    };
    if(reimburseTo) rec.reimburseTo = reimburseTo;
    if(existing){
      const idx = state.actuals.findIndex(x=>x.id===existing.id);
      state.actuals[idx] = rec;
    } else {
      state.actuals.push(rec);
    }
    await dbSet("actuals", rec.id, rec);
    showToast(`${existing?"Updated":"Logged"} ${fmtUSD(toUSD(amount, rec.currency, rec.rate))}`);
    render();
    openMonthlyCategoryDetailSheet(categoryId, ym);
  });
  if(existing){
    // Duplicate clones the last-SAVED entry (same category, today's date when
    // today falls in this month, otherwise the original's date) and opens the
    // copy to edit. Disabled as soon as anything in the form changes, so
    // in-progress edits are never silently dropped — same rule as Setup.
    const dupBtn = body.querySelector("#aDuplicate");
    const markDirty = ()=>{ dupBtn.disabled = true; };
    body.querySelectorAll("input, select, textarea").forEach(n=>{ n.addEventListener("input", markDirty); n.addEventListener("change", markDirty); });
    body.querySelectorAll("[data-reimb], #itCurUSD, #itCurMXN").forEach(n=> n.addEventListener("click", markDirty));
    onceClick(dupBtn, async ()=>{
      const t = new Date();
      const todayISO = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
      const rec = { ...existing, id: uid("act"), date: ymOfDate(todayISO)===ym ? todayISO : existing.date };
      if(existing.name) rec.name = existing.name + " (copy)";
      state.actuals.push(rec);
      await dbSet("actuals", rec.id, rec);
      showToast("Duplicated — edit the copy");
      render();
      openActualEntryDialog(categoryId, ym, rec, onBack);
    });
    body.querySelector("#aDelete").onclick = ()=> confirmAction(`Delete this ${fmtUSD(toUSD(existing.amount||0, existing.currency, existing.rate||baseRate))} entry?`, async ()=>{
      state.actuals = state.actuals.filter(x=>x.id!==existing.id);
      await dbDelete("actuals", existing.id);
      showToast("Entry deleted");
      render();
      openMonthlyCategoryDetailSheet(categoryId, ym);
    }, ()=> openActualEntryDialog(categoryId, ym, existing, onBack));
  }
  openSheet();
}

// Linked USD/MXN amount entry, shared by the item editor and quick-add.
// The toggled currency is the "native" one — the amount you actually know
// (what a card statement or ATM withdrawal shows). Editing the native
// field recalculates the other via the rate; editing the *other* field
// instead recalculates the rate, so entering both amounts backs into the
// effective rate you actually got.
function currencyFieldsHTML(){
  return `
    <div class="row" style="gap:6px">
      <button type="button" class="btn small" id="itCurUSD">USD</button>
      <button type="button" class="btn small" id="itCurMXN">MXN</button>
      <span class="muted" style="margin-left:auto; font-size:11px">which one you actually know</span>
    </div>
    <div class="field-row">
      <label>USD<input type="text" inputmode="decimal" id="itUSD" placeholder="0.00"></label>
      <label>MXN<input type="text" inputmode="decimal" id="itMXN" placeholder="0.00"></label>
    </div>
    <label>Rate (USD → MXN)<input type="text" inputmode="decimal" id="itRate"></label>
  `;
}
function wireLinkedCurrency(body, initialCurrency){
  let currency = initialCurrency || "USD";
  const usdEl = body.querySelector("#itUSD");
  const mxnEl = body.querySelector("#itMXN");
  const rateEl = body.querySelector("#itRate");
  const toggleUSD = body.querySelector("#itCurUSD");
  const toggleMXN = body.querySelector("#itCurMXN");
  // Whatever year is currently in view — every caller of this helper opens
  // it from a dialog scoped to that month, so it's the right default rate
  // whenever the rate field itself is left blank.
  const defaultRate = yearSettings(yearOfYM(ui.ym)).baseRate;

  function setToggle(){
    toggleUSD.classList.toggle("active", currency==="USD");
    toggleMXN.classList.toggle("active", currency==="MXN");
  }
  function recalcFromNative(){
    const rate = parseFloat(rateEl.value||defaultRate) || defaultRate;
    if(currency==="USD"){
      const usd = parseFloat(usdEl.value||"0");
      mxnEl.value = (usd*rate).toFixed(2);
    } else {
      const mxn = parseFloat(mxnEl.value||"0");
      usdEl.value = rate>0 ? (mxn/rate).toFixed(2) : "0.00";
    }
  }
  function recalcRateFromOther(){
    const usd = parseFloat(usdEl.value||"0");
    const mxn = parseFloat(mxnEl.value||"0");
    if(usd>0) rateEl.value = (mxn/usd).toFixed(4);
  }
  setToggle();
  // Sanitize first (strips a pasted "$150.00"/"1,500.00" down to a plain
  // decimal string) so the recalculation below always has a parseable
  // value, whether typed or pasted.
  usdEl.addEventListener("input", ()=>{ usdEl.value = cleanNumStr(usdEl.value); currency==="USD" ? recalcFromNative() : recalcRateFromOther(); });
  mxnEl.addEventListener("input", ()=>{ mxnEl.value = cleanNumStr(mxnEl.value); currency==="MXN" ? recalcFromNative() : recalcRateFromOther(); });
  rateEl.addEventListener("input", ()=>{ rateEl.value = cleanNumStr(rateEl.value); recalcFromNative(); });
  toggleUSD.onclick = ()=>{ currency="USD"; setToggle(); };
  toggleMXN.onclick = ()=>{ currency="MXN"; setToggle(); };

  return {
    getCurrency: ()=> currency,
    getRate: ()=> parseFloat(rateEl.value||defaultRate) || defaultRate,
    getNativeAmount: ()=> currency==="USD" ? parseFloat(usdEl.value||"0") : parseFloat(mxnEl.value||"0"),
  };
}

// Tap-row lists instead of native <select> dropdowns — a dropdown can't
// format "name — $X left" cleanly, which is what made this screen feel
// bundled together. "From" only lists categories that actually have a
// surplus to give.
// "From" can be either a category with surplus (an ordinary zero-sum move
// — one category's surplus becomes another's) or External source (new
// money landing in a single category this month, same as Settings' Add
// Funds but scoped to one category instead of the whole year). The two
// read the same here — pick From, pick To, enter an amount — but External
// source is purely a this-month, this-category credit: it never competes
// with another category's balance, so it's never limited by surplus, and
// it never touches the whole-pot/yearly total — that stays a deliberate,
// separate action in Settings' own Add Funds. A Monthly transfer, External
// source or not, stays entirely at the monthly/category layer.
const EXTERNAL_SOURCE_ID = "__external__";
function openTransferDialog(ym){
  const dlg = document.getElementById("dlg");
  const body = document.getElementById("dlgBody");
  // The month's OWN categories (template-forked + month-only), not the live
  // template list: a category added only to this month must be selectable,
  // and one removed from this month must not be.
  const monthCats = isMonthSeeded(ym)
    ? monthCategoryList(ym).map(x=> ({ id:x.id, name:x.name }))
    : state.categories.filter(c=> categoryAppliesToYM(c, ym)).map(c=> ({ id:c.id, name:c.name }));
  const withRemaining = monthCats.map(c=>({ c, remaining: remainingForMonth(c.id, ym) }));
  const surplusSources = withRemaining.filter(x=> x.remaining > 0);
  const externalOption = { c:{ id:EXTERNAL_SOURCE_ID, name:"External source" }, remaining:null, external:true };
  const fromOptions = [externalOption, ...surplusSources];
  // Neither side starts preselected — both pickers open collapsed with a
  // plain "Choose a..." prompt, so picking is a deliberate tap, not an
  // already-made choice the user has to notice and override.
  let fromId = null;
  let toId = null;

  function rowsHTML(list, group){
    return list.map(x=>`
      <button type="button" class="setuprow" data-${group}="${x.c.id}" style="min-height:48px">
        <span class="name">${escapeHtml(x.c.name)}</span>
        ${x.external ? "" : `<span class="amt num" style="color:${x.remaining>=0?'var(--good)':'var(--bad)'}">${fmtUSD(x.remaining)}</span>`}
        <span class="chev" data-check></span>
      </button>
    `).join("");
  }
  // Collapsed to one line once a choice is made — "Category · $Amount" —
  // and expands back to the full tap-row list to change it.
  function pickerSummary(group, list){
    const sel = group==="from" ? fromId : toId;
    const x = list.find(x=>x.c.id===sel);
    if(!x) return group==="from" ? "Choose a source" : "Choose a destination category";
    const amt = x.external ? "" : ` · <span class="num" style="color:${x.remaining>=0?'var(--good)':'var(--bad)'}">${fmtUSD(x.remaining)}</span>`;
    return `${escapeHtml(x.c.name)}${amt}`;
  }

  body.innerHTML = `
    <h3>Move funds</h3>
    <p class="muted">Pull money from a category with surplus to cover one that's running over, or bring in new money from outside the budget — either way, this month only. It carries forward through rollover like any other balance change.</p>
    <details class="advanced xferpick" id="fromPicker">
      <summary><span class="eyebrow" style="margin:0">From</span><span class="pickval" id="fromSummary">${pickerSummary("from",fromOptions)}</span></summary>
      <div class="stack" id="fromList" style="gap:0">${rowsHTML(fromOptions,"from")}</div>
    </details>
    <details class="advanced xferpick list-divider" id="toPicker">
      <summary><span class="eyebrow" style="margin:0">To</span><span class="pickval" id="toSummary">${pickerSummary("to",withRemaining)}</span></summary>
      <div class="stack" id="toList" style="gap:0">${rowsHTML(withRemaining,"to")}</div>
    </details>
    <div class="list-divider stack" style="gap:16px">
      <div class="field-row">
        <label>Amount (USD)<input type="number" inputmode="decimal" id="tAmt" step="0.01" placeholder="0.00"></label>
        <label>Date<input type="date" id="tDate" value="${new Date(yearOfYM(ym), monthOfYM(ym), Math.min(new Date().getDate(),28)).toISOString().slice(0,10)}"></label>
      </div>
      <label>Note (optional)<input type="text" id="tNote" placeholder="e.g. covered grocery overrun"></label>
      <div class="dialog-actions">
        <button class="btn ghost" id="tCancel">Cancel</button>
        <button class="btn primary" id="tSave">Move</button>
      </div>
    </div>
  `;
  function refreshSelection(){
    body.querySelectorAll('[data-from]').forEach(b=>{ b.querySelector('[data-check]').innerHTML = b.dataset.from===fromId ? iconCheck() : ""; });
    body.querySelectorAll('[data-to]').forEach(b=>{ b.querySelector('[data-check]').innerHTML = b.dataset.to===toId ? iconCheck() : ""; });
    body.querySelector("#fromSummary").innerHTML = pickerSummary("from", fromOptions);
    body.querySelector("#toSummary").innerHTML = pickerSummary("to", withRemaining);
  }
  body.querySelectorAll('[data-from]').forEach(b=> b.onclick = ()=>{ fromId = b.dataset.from; refreshSelection(); body.querySelector("#fromPicker").open = false; });
  body.querySelectorAll('[data-to]').forEach(b=> b.onclick = ()=>{ toId = b.dataset.to; refreshSelection(); body.querySelector("#toPicker").open = false; });
  refreshSelection();

  body.querySelector("#tCancel").onclick = ()=> dlg.close();
  onceClick(body.querySelector("#tSave"), async ()=>{
    const amountUSD = parseFloat(body.querySelector("#tAmt").value||"0");
    const date = body.querySelector("#tDate").value;
    const note = body.querySelector("#tNote").value;
    const fromExternal = fromId===EXTERNAL_SOURCE_ID;
    if(!fromId || !toId){ formError(body, "Choose a From and To category."); return; }
    if(!fromExternal && fromId===toId){ formError(body, "From and To can't be the same category."); return; }
    if(!amountUSD){ formError(body, "Enter an amount.", body.querySelector("#tAmt")); return; }
    if(!date){ formError(body, "Pick a date.", body.querySelector("#tDate")); return; }
    const id = uid("xfer");
    const rec = { id, date, fromCategoryId: fromExternal ? null : fromId, toCategoryId:toId, amountUSD, note };
    // No linked fund event — an External-source transfer is purely a
    // this-month, this-category credit (see comment above the picker
    // setup). It never writes a second record at the yearly/whole-pot
    // layer, so it never appears in Settings' Add Funds history and never
    // moves the top-level Available/Surplus figures on its own.
    state.transfers.push(rec);
    await dbSet("transfers", id, rec);
    dlg.close();
    const fromName = fromExternal ? "External source" : categoryDisplayInfo(fromId, ym).name;
    const toName = categoryDisplayInfo(toId, ym).name;
    showToast(`Moved ${fmtUSD(amountUSD)}: ${fromName} → ${toName}`);
    render();
  });
  openSheet();
}

// Read-only per-category, per-month breakdown — base, rollover carried
// in, each transfer this month, spent, remaining. Editing the category's
// allocation itself lives only in Budget Setup; this sheet links there
// rather than duplicating an edit path.
// This month's own view of a category — base, rollover carried in, each
// transfer this month, spent, remaining, PLUS (new) this month's own items
// and the ability to edit this month's base amount and remove the category
// from the month entirely, all operating only on state.monthCategoryData[ym]
// — never on the template (state.categories/state.lineitems). Works the
// same whether the category is template-forked or purely month-local.
function openMonthlyCategoryDetailSheet(categoryId, ym){
  const dlg = document.getElementById("dlg");
  const body = document.getElementById("dlgBody");
  const info = categoryDisplayInfo(categoryId, ym);
  const entry = (state.monthCategoryData[ym]||{})[categoryId] || {};
  const excluded = !!entry.excluded;
  const base = roundCents(categoryBaseForMonth(categoryId, ym));
  const roll = rolloverForMonth(categoryId, ym);
  const adj = categoryAdjustmentForMonth(categoryId, ym);
  const avail = roundCents(base + roll + adj);
  // See the matching comment on the Monthly card list: a target to show
  // status against means real money available, from any source — base,
  // rollover, or transfer — not specifically a non-zero Base allocation.
  const hasTarget = avail !== 0;
  const spent = spentForMonth(categoryId, ym);
  const remaining = roundCents(avail - spent);
  const remainingInfo = remainingDisplay(hasTarget, remaining);
  const trs = state.transfers.filter(t=> ymOfDate(t.date)===ym && (t.toCategoryId===categoryId || t.fromCategoryId===categoryId));

  let transferBlock = "";
  if(trs.length){
    const rows = trs.map(t=>{
      const into = t.toCategoryId===categoryId;
      const otherId = into ? t.fromCategoryId : t.toCategoryId;
      // otherId is null exactly when this transfer's From is "External
      // source" (money brought in from outside the budget, not moved from
      // another category) — categoryDisplayInfo has no record for a null
      // id and would otherwise fall back to its generic "Untitled" label,
      // same as it would for any other category it can't find. Named the
      // same as every other transfer-label site in the app.
      const otherName = otherId ? categoryDisplayInfo(otherId, ym).name : "External source";
      return `<div class="row" style="align-items:flex-start; gap:10px"><span class="muted" style="flex:1; min-width:0">${into?"From":"To"} ${otherName||"?"}${t.note?" · "+escapeHtml(t.note):""}</span><span class="num" style="white-space:nowrap; flex:none; color:${into?"var(--good)":"var(--bad)"}">${into?"+":"-"}${fmtUSD(t.amountUSD)}</span></div>`;
    }).join("");
    transferBlock = `<div class="danger-zone"><div class="eyebrow" style="margin-bottom:8px">Transfers this month</div>${rows}</div>`;
  }

  // The real logged spend for this category/month — replaces the old
  // static "This month's items" snapshot, which was never actually read by
  // any budget math (Available/Spent/Remaining always came from the base
  // allocation + these same actuals) and just drifted out of sync with it.
  const rate = yearSettings(yearOfYM(ym)).baseRate;
  const entries = state.actuals.filter(a=>a.categoryId===categoryId && ymOfDate(a.date)===ym);
  const entryRows = entries.length ? entries.map(a=>{
    const amt = toUSD(a.amount||0, a.currency, a.rate||rate);
    return `
      <div class="setuprow" role="button" tabindex="0" data-entry="${a.id}">
        <span class="name-wrap">
          <span class="name">${escapeHtml(a.name || "Expense")}</span>
          <span class="meta-note ${paymentMetaClass(a.paymentMethod)}">${paymentLabel(a.paymentMethod)}${a.reimburseTo?` · Reimburse ${escapeHtml(reimburseLabel(a.reimburseTo))}`:""}</span>
        </span>
        <span class="amt num">${fmtUSD(amt)}</span>
        <span class="rowchev" aria-hidden="true">${iconChevronRight()}</span>
      </div>
    `;
  }).join("") : `<div class="empty">Nothing logged yet — add a total or itemize as you go.</div>`;

  body.innerHTML = `
    <h3>${info.isLocal ? "Edit Category" : escapeHtml(info.name)}</h3>
    ${info.isLocal ? `<label>Name<input type="text" id="mcName" value="${escapeHtml(info.name)}" placeholder="e.g. One-off repair"></label>` : ""}
    <label>Base allocation (USD)<input type="number" inputmode="decimal" step="0.01" id="mcBaseAmount" value="${(base||0).toFixed(2)}"></label>
    <label class="sheet-row" style="flex-direction:row; align-items:center; gap:10px; background:var(--surface-2); border-radius:10px; padding:10px 12px">
      <input type="checkbox" id="mcExcluded" style="width:auto" ${excluded?"checked":""}>
      <span style="flex:1">
        <span style="display:block">Excluded this month</span>
        <span class="muted" style="font-size:12px; display:block">Its real Spent/left above still shows — only ${MONTHS[monthOfYM(ym)]}'s Spent/Available/Surplus stop counting it.</span>
      </span>
    </label>
    <div class="stack" style="gap:8px">
      ${roll!==0 ? `<div class="row"><span class="muted">Rollover carried in</span><span class="num">${roll>0?"+":""}${fmtUSD(roll)}</span></div>` : ""}
      ${adj!==0 ? `<div class="row"><span class="muted">Net moved this month</span><span class="num">${adj>0?"+":""}${fmtUSD(adj)}</span></div>` : ""}
      <div class="row" style="border-top:1px solid var(--line); padding-top:8px"><span style="font-weight:600">Available</span><span class="num" id="mcAvail" style="font-weight:600">${fmtUSD(avail)}</span></div>
      <div class="row"><span class="muted">Spent</span><span class="num">${fmtUSD(spent)}</span></div>
      <div class="row" id="mcRemainingRow"><span style="font-weight:600">Remaining</span><span class="num" style="font-weight:600; color:${remainingInfo.color}">${remainingInfo.text}</span></div>
    </div>
    ${transferBlock}
    <div class="list-divider">
      <div class="eyebrow">Logged expenses</div>
      <div class="stack" id="mcEntries" style="gap:0">${entryRows}</div>
      <button class="btn accent block" id="mcAddEntry" style="margin-top:10px">${iconPlus()}<span>Add Expense</span></button>
    </div>
    <div class="dialog-actions" style="justify-content:space-between">
      <button class="btn small danger" id="mcRemoveCat">${iconTrash()}<span>Remove from month</span></button>
      <div style="display:flex; gap:10px">
        <button class="btn ghost" id="miClose">Cancel</button>
        <button class="btn primary" id="mcSave">Save</button>
      </div>
    </div>
  `;
  // Has anything in Base allocation / Name / Excluded changed since this
  // sheet opened (i.e. versus what's saved)?
  function hasPendingEdits(){
    const amountField = body.querySelector("#mcBaseAmount");
    const entry = (state.monthCategoryData[ym] || {})[categoryId];
    if(!amountField || !entry) return false;
    const amount = roundCents(parseFloat(amountField.value||"0") || 0);
    if(amount !== roundCents(entry.baseAmountUSD||0)) return true;
    const exclField = body.querySelector("#mcExcluded");
    if(exclField && exclField.checked !== !!entry.excluded) return true;
    if(info.isLocal){
      const nameField = body.querySelector("#mcName");
      if(nameField && nameField.value.trim() !== (entry.name||"")) return true;
    }
    return false;
  }
  // Commits those edits (same fields as the Save button, same blank-Name
  // rule). Returns false, with an error shown, when it can't.
  async function savePendingEdits(){
    const amountField = body.querySelector("#mcBaseAmount");
    const entry = (state.monthCategoryData[ym] || {})[categoryId];
    if(!amountField || !entry) return false;
    if(info.isLocal){
      const nameField = body.querySelector("#mcName");
      const name = nameField ? nameField.value.trim() : "";
      if(!name){ formError(body, "Enter a name.", nameField); return false; }
      entry.name = name;
    }
    entry.baseAmountUSD = parseFloat(amountField.value||"0") || 0;
    const exclField = body.querySelector("#mcExcluded");
    if(exclField) entry.excluded = exclField.checked;
    await dbSetMonthCategoryData();
    render();
    return true;
  }
  // Runs `go` straight away when nothing changed; otherwise asks first.
  function afterSavingEdits(go){
    if(!hasPendingEdits()){ go(); return; }
    promptSaveBeforeContinue(body, async ()=>{
      if(!(await savePendingEdits())) return false;
      go();
    });
  }
  const backHere = ()=> openMonthlyCategoryDetailSheet(categoryId, ym);

  // Live recompute — previously Available/Remaining only updated after
  // Save closed and reopened this sheet, which read as broken. Typing a new
  // Base allocation now recalculates both immediately; nothing is written
  // until Save is actually pressed.
  const mcBaseInput = body.querySelector("#mcBaseAmount");
  mcBaseInput.addEventListener("input", ()=>{
    const newBase = parseFloat(mcBaseInput.value||"0") || 0;
    const newAvail = newBase + roll + adj;
    const newRemaining = roundCents(newAvail - spent);
    const newHasTarget = newBase > 0;
    const newRemainingInfo = remainingDisplay(newHasTarget, newRemaining);
    body.querySelector("#mcAvail").textContent = fmtUSD(newAvail);
    body.querySelector("#mcRemainingRow").innerHTML = `<span style="font-weight:600">Remaining</span><span class="num" style="font-weight:600; color:${newRemainingInfo.color}">${newRemainingInfo.text}</span>`;
  });

  body.querySelector("#miClose").onclick = ()=> dlg.close();
  onceClick(body.querySelector("#mcSave"), async ()=>{
    const amount = parseFloat(body.querySelector("#mcBaseAmount").value||"0") || 0;
    state.monthCategoryData[ym] = state.monthCategoryData[ym] || {};
    const entry = state.monthCategoryData[ym][categoryId];
    if(!entry){ dlg.close(); showToast("Couldn't save — try reopening this category."); return; }
    // Edits only this month's own copy — the template's baseAmountUSD (and
    // every other already-seeded month) is never touched.
    entry.baseAmountUSD = amount;
    entry.excluded = body.querySelector("#mcExcluded").checked;
    if(info.isLocal){
      const name = body.querySelector("#mcName").value.trim();
      if(!name){ formError(body, "Enter a name.", body.querySelector("#mcName")); return; }
      entry.name = name;
    }
    await dbSetMonthCategoryData();
    dlg.close();
    showToast(`Updated ${info.isLocal ? (entry.name) : info.name} for ${MONTHS[monthOfYM(ym)]}`);
    render();
  });
  body.querySelectorAll("[data-entry]").forEach(row=>{
    const open = ()=> afterSavingEdits(()=>{
      const a = entries.find(x=>x.id===row.dataset.entry);
      openActualEntryDialog(categoryId, ym, a, backHere);
    });
    row.onclick = open;
    row.onkeydown = (ev)=>{
      if(ev.key==="Enter" || ev.key===" "){ ev.preventDefault(); open(); }
    };
  });
  body.querySelector("#mcAddEntry").onclick = ()=> afterSavingEdits(()=> openActualEntryDialog(categoryId, ym, null, backHere));
  body.querySelector("#mcRemoveCat").onclick = ()=>{
    confirmAction(`Remove "${info.name}" from ${MONTHS[monthOfYM(ym)]} ${yearOfYM(ym)}? Its balance stays part of this month's overall total — removing it here only stops tracking it as its own category.`, async ()=>{
      // No separate "sweep the balance into Unallocated" bookkeeping needed —
      // totalAvailableForMonth/totalSpentForMonth are whole-pot figures (the
      // month's flat budget minus every dollar actually spent, both
      // independent of which categories currently exist), so a removed
      // category's unspent balance was never subtracted from that pot in the
      // first place. Deleting its entry here is the only state change
      // required; nothing needs crediting back.
      if(state.monthCategoryData[ym]){
        delete state.monthCategoryData[ym][categoryId];
      }
      await dbSetMonthCategoryData();
      dlg.close();
      showToast(`Removed ${info.name} from ${MONTHS[monthOfYM(ym)]}`);
      render();
    }, backHere);
  };
  openSheet();
}

// Entry point for adding a category (or several at once) to an already-
// set-up month — either forking in template categories that aren't part of
// this month yet, or creating one that only ever exists inside this one
// month. Multi-select with checkboxes + Select all, matching the pattern
// openMonthSeedChecklistDialog already uses for the whole-month seed
// checklist — one tap-to-add-and-close per category was a real usability
// problem (adding several meant reopening this sheet each time), and the
// two entry points (a month started from "Start with nothing" and then
// built up one category at a time vs. starting from "Choose which to
// include") should feel like the same control, not two different ones.
function openMonthAddCategorySheet(ym){
  const dlg = document.getElementById("dlg");
  const body = document.getElementById("dlgBody");
  const data = state.monthCategoryData[ym] || {};
  const available = state.categories.filter(c=> categoryAppliesToYM(c, ym) && !data[c.id]);
  const rows = available.length ? available.map(c=>`
    <label class="sheet-row" style="flex-direction:row; align-items:center; gap:10px">
      <input type="checkbox" class="macItem" data-tmpl="${c.id}" style="width:auto">
      <span style="flex:1">${escapeHtml(c.name)}${c.excludedDefault ? `<span class="muted" style="font-size:11px; display:block">Excluded by default</span>` : ""}</span>
      <span class="num muted">${fmtUSD(c.baseAmountUSD||0)}</span>
    </label>
  `).join("") : `<div class="empty">Every Budget Setup category is already part of this month.</div>`;
  body.innerHTML = `
    <h3>Add category — ${MONTHS[monthOfYM(ym)]} ${yearOfYM(ym)}</h3>
    <p class="muted">Bring in categories from Budget Setup with their current budget, or create one just for this month.</p>
    ${available.length ? `
    <label class="sheet-row" id="macSelectAllRow" style="flex-direction:row; align-items:center; gap:10px; border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:2px">
      <input type="checkbox" id="macSelectAll" style="width:auto">
      <span style="flex:1; font-weight:600">Select all</span>
    </label>` : ""}
    <button type="button" class="btn accent block" id="macNewLocal">${iconPlus()}<span>New category just for this month</span></button>
    <div class="stack" id="macList" style="gap:2px">${rows}</div>
    <div class="dialog-actions">
      <button class="btn ghost" id="macClose">Cancel</button>
      ${available.length ? `<button class="btn primary" id="macSave" disabled>Add selected</button>` : ""}
    </div>
  `;
  const itemBoxes = [...body.querySelectorAll(".macItem")];
  const selectAll = body.querySelector("#macSelectAll");
  const saveBtn = body.querySelector("#macSave");
  // Same tri-state Select-all + disabled-until-something's-checked pattern
  // as the whole-month seed checklist (openMonthSeedChecklistDialog) — kept
  // in sync deliberately so the two feel like one control.
  function syncSelectAll(){
    const checkedCount = itemBoxes.filter(b=>b.checked).length;
    if(selectAll){
      selectAll.checked = checkedCount>0 && checkedCount===itemBoxes.length;
      selectAll.indeterminate = checkedCount>0 && checkedCount<itemBoxes.length;
    }
    if(saveBtn) saveBtn.disabled = checkedCount===0;
  }
  if(selectAll){
    selectAll.addEventListener("change", ()=>{
      itemBoxes.forEach(b=> b.checked = selectAll.checked);
      syncSelectAll();
    });
    itemBoxes.forEach(b=> b.addEventListener("change", syncSelectAll));
  }
  syncSelectAll();
  body.querySelector("#macNewLocal").onclick = ()=> openMonthNewLocalCategoryDialog(ym);
  body.querySelector("#macClose").onclick = ()=> dlg.close();
  if(saveBtn){
    onceClick(saveBtn, async ()=>{
      const checked = itemBoxes.filter(b=>b.checked).map(b=>b.dataset.tmpl);
      if(checked.length===0) return;
      state.monthCategoryData[ym] = state.monthCategoryData[ym] || {};
      checked.forEach(id=>{
        const c = state.categories.find(x=>x.id===id);
        state.monthCategoryData[ym][c.id] = { baseAmountUSD: c.baseAmountUSD||0, items: [], source:"template", excluded: !!c.excludedDefault };
      });
      await dbSetMonthCategoryData();
      dlg.close();
      showToast(`Added ${checked.length} categor${checked.length===1?"y":"ies"} to ${MONTHS[monthOfYM(ym)]}`);
      render();
    });
  }
  openSheet();
}
