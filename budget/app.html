// Category rows carry no icon — bold name text is the only marker, on
// every screen (Budget Setup list, add-to-month picker, Transfer dialog
// picker, dashboard table). Categories are unlimited/custom, so there was
// never a way to assign a meaningful per-category icon or color; a shared
// generic glyph was tried and dropped as pure clutter with no information
// of its own.

// Who an expense has to be paid back to at month-end ("" = nobody). Expenses
// only — transfers are money coming into the budget, never reimbursed.
const REIMBURSE_OPTIONS = [
  { id:"", label:"None" },
  { id:"claude", label:"Claude" },
  { id:"constance", label:"Constance" },
];
function reimburseLabel(id){ const o = REIMBURSE_OPTIONS.find(x=>x.id===id); return o && o.id ? o.label : ""; }

// Short, sentence-case forms only — every pill in the app uses these, so
// they need to be short and consistent-width, not full labels.
function paymentLabel(pm){
  return pm==="cash" ? "Cash" : pm==="transfer" ? "Bank transfer" : pm==="service" ? "Transfer service" : "Card";
}
// Only non-Monthly gets a label — Monthly is the default for nearly every
// item, so calling it out on every row would just be noise. Returns "" for
// monthly/unset so callers can skip rendering it entirely.
function freqLabel(freq){
  return freq==="weekly" ? "Weekly" : freq==="biweekly" ? "Every 2 weeks" : freq==="onetime" ? "One-time" : "";
}
// Color for the text-only meta-note variant (setuprow rows) — same
// color language the old pills used, just applied to text instead of a badge.
function paymentMetaClass(pm){
  return pm==="cash" ? "mm-cash" : pm==="transfer" ? "mm-transfer" : pm==="service" ? "mm-service" : "mm-card";
}

// All sheets share one <dialog>. Sheets can navigate to another sheet
// (e.g. a category detail sheet opening a delete confirmation) without
// closing first — showModal() throws if called on an already-open
// dialog, so every open*Sheet/Dialog function calls this instead.
let lockedScrollY = 0;
function openSheet(){
  const dlg = document.getElementById("dlg");
  if(!dlg.open){
    lockedScrollY = window.scrollY || window.pageYOffset || 0;
    dlg.showModal();
    document.body.style.top = `-${lockedScrollY}px`;
    document.body.classList.add("sheet-open");
    // showModal() autofocuses the first focusable control in the sheet —
    // usually a <select> or <input type=date> — which on mobile can pop
    // its native picker open immediately. Redirect focus to the sheet
    // itself instead, so nothing opens until the person taps a field.
    requestAnimationFrame(()=>{
      if(document.activeElement && document.activeElement !== dlg && document.activeElement.blur){
        document.activeElement.blur();
      }
      dlg.focus({preventScroll:true});
    });
  }
}

let toastTimer = null;
function showToast(message){
  const t = document.getElementById("toast");
  if(!t) return;
  clearTimeout(toastTimer);
  t.textContent = message;
  t.hidden = false;
  // rAF so the hidden->visible transition actually animates
  requestAnimationFrame(()=> t.classList.add("show"));
  toastTimer = setTimeout(()=>{
    t.classList.remove("show");
    setTimeout(()=>{ t.hidden = true; }, 200);
  }, 2200);
}

// This sandbox blocks native confirm()/prompt() dialogs, so deletes get a
// real in-page confirmation step using the same <dialog> as everything else.
// confirmAction always overwrites dlgBody — it has no idea what was on
// screen before it. When it's opened from the top level (directly off a
// page, nothing else in the sheet), the default onCancel (closing the whole
// sheet) is correct. When it's opened from INSIDE another already-open
// dialog screen, closing the whole sheet on Cancel drops the person on
// whatever's behind the sheet instead of back on the screen they were
// actually on — callers in that situation must pass an onCancel that
// reopens their own screen.
function confirmAction(message, onConfirm, onCancel){
  const dlg = document.getElementById("dlg");
  const body = document.getElementById("dlgBody");
  body.innerHTML = `
    <h3>Are you sure?</h3>
    <p class="muted">${escapeHtml(message)}</p>
    <div class="dialog-actions">
      <button class="btn ghost" id="cnCancel">Cancel</button>
      <button class="btn danger" id="cnConfirm">Delete</button>
    </div>
  `;
  body.querySelector("#cnCancel").onclick = ()=>{
    if(onCancel){ onCancel(); } else { dlg.close(); }
  };
  onceClick(body.querySelector("#cnConfirm"), async ()=>{
    dlg.close();
    await onConfirm();
  });
  openSheet();
}

// Drag the handle down far enough and the sheet follows your finger and
// closes on release — Cancel still works too, this is just the faster
// mobile-native gesture people expect from a bottom sheet's nub.
function wireSheetDrag(){
  const dlg = document.getElementById("dlg");
  const handle = document.querySelector(".sheet-handle");
  if(!handle) return;
  const CLOSE_THRESHOLD = 90;
  let dragging = false, startY = 0, dy = 0;

  handle.addEventListener("pointerdown", (e)=>{
    dragging = true; startY = e.clientY; dy = 0;
    // The sheetUp open animation uses fill-mode "both", so even after it
    // finishes playing it keeps holding `transform` and silently wins over
    // any inline style we set below — cancel it so the drag can take over.
    dlg.getAnimations().forEach(a=>a.cancel());
    dlg.style.transition = "none";
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  });
  handle.addEventListener("pointermove", (e)=>{
    if(!dragging) return;
    dy = Math.max(0, e.clientY - startY);
    dlg.style.transform = `translate(-50%, ${dy}px)`;
  });
  function endDrag(){
    if(!dragging) return;
    dragging = false;
    dlg.style.transition = "";
    dlg.style.transform = "";
    if(dy > CLOSE_THRESHOLD) dlg.close();
    dy = 0;
  }
  handle.addEventListener("pointerup", endDrag);
  handle.addEventListener("pointercancel", endDrag);
}

// The bare period-change mutation, with no entrance cue of its own — the
// single implementation both stepPeriod (header ‹/› buttons) and the
// swipe gesture's commit path call, so the two stay in sync (year bounds,
// etc.) by construction instead of two copies agreeing. Swipe already
// animates its own commit (the dragged card settling into place) and
// would double-animate if this also played a cue; stepPeriod is the one
// caller that still needs its own, since a button tap has no drag motion
// to follow. Returns whether the period actually changed (false at an
// Annual Outlook year bound).
function changePeriod(dir){
  if(ui.tab==="monthly"){
    ui.ym = ui.ym + dir;
    render();
    return true;
  } else if(ui.tab==="outlook" || ui.tab==="cashflow"){
    const year = yearOfYM(ui.ym);
    const { minYear, maxYear } = yearNavBounds();
    const newYear = year + dir;
    if(newYear>=minYear && newYear<=maxYear){
      ui.ym = ymOf(newYear, monthOfYM(ui.ym));
      render();
      return true;
    }
    return false;
  }
  return false;
}
// Same bounds check as changePeriod, without actually changing anything —
// swipe uses this up front to decide whether dragging a direction can
// ever commit (and so whether it's worth building a preview of what's
// over there at all) versus just rubber-banding in place.
function canStepPeriod(dir){
  if(ui.tab==="monthly") return true;
  if(ui.tab==="outlook" || ui.tab==="cashflow"){
    const year = yearOfYM(ui.ym);
    const { minYear, maxYear } = yearNavBounds();
    const newYear = year + dir;
    return newYear>=minYear && newYear<=maxYear;
  }
  return false;
}
function stepPeriod(dir){
  if(changePeriod(dir)) animatePeriodEnter(dir);
}

// The new content slides in from the direction of travel — forward (dir
// > 0, "next") enters from the right, back (dir < 0, "previous") enters
// from the left — a quick, cheap cue that something moved, matching the
// direction of the swipe or the ‹/› button tapped, rather than the whole
// screen just silently repainting. Web Animations API, not a CSS
// class/keyframe pair, specifically because it restarts cleanly on every
// call even when fired in rapid succession (swipe, swipe, swipe) with no
// forced-reflow trick needed. Feature-detected and a silent no-op where
// unsupported — this is a polish cue, never load-bearing.
function animatePeriodEnter(dir){
  const main = document.getElementById("main");
  if(!main || typeof main.animate !== "function") return;
  const offset = dir > 0 ? 18 : -18;
  main.animate(
    [
      { transform: `translateX(${offset}px)`, opacity: 0.5 },
      { transform: "translateX(0)", opacity: 1 },
    ],
    { duration: 180, easing: "cubic-bezier(.22,.68,.36,1)" }
  );
}

// Renders `ym` for the current tab into detached/temporary output instead
// of the live screen — Monthly's subhead and view-toggle row have no
// parameter to redirect their output, so those two get the save-swap-
// capture-restore treatment (safe because it all happens synchronously,
// with no paint in between — the live screen never actually flashes the
// neighboring period); #main's own render functions already take the
// target container as an argument, so a plain detached div is enough
// there, with nothing live ever touched. Used to build swipe's preview of
// whichever period a drag might land on.
function renderGhostContent(ym){
  const savedYm = ui.ym;
  ui.ym = ym;
  let subHTML = "", toggleHTML = "";
  if(ui.tab==="monthly"){
    const subhead = document.getElementById("subhead");
    const toggleBox = document.getElementById("monthlyToggleSticky");
    // renderSubhead() wires its buttons with real JS listeners (.onclick,
    // and whatever viewToggleRow attaches) — none of that survives a
    // round trip through innerHTML as a string, since a listener isn't
    // part of the serialized markup. Reassigning `.innerHTML = savedHTML`
    // would silently replace the live elements with inert look-alikes,
    // permanently dropping their click handlers the moment a swipe starts
    // (even one that never commits). So instead of saving strings, the
    // actual original nodes (and the attributes renderSubhead() mutates
    // directly on the containers) are moved out and put straight back —
    // same objects, so their listeners are untouched.
    const savedSubNodes = Array.from(subhead.childNodes);
    const savedSubClass = subhead.className, savedSubBorder = subhead.style.borderBottom;
    const savedToggleNodes = Array.from(toggleBox.childNodes);
    const savedToggleClass = toggleBox.className;
    renderSubhead();
    subHTML = subhead.innerHTML;
    toggleHTML = toggleBox.innerHTML;
    subhead.innerHTML = "";
    savedSubNodes.forEach(n=> subhead.appendChild(n));
    subhead.className = savedSubClass;
    subhead.style.borderBottom = savedSubBorder;
    toggleBox.innerHTML = "";
    savedToggleNodes.forEach(n=> toggleBox.appendChild(n));
    toggleBox.className = savedToggleClass;
  }
  const tmpMain = document.createElement("div");
  if(ui.tab==="monthly") renderMonthly(tmpMain);
  else if(ui.tab==="outlook") renderOutlook(tmpMain);
  else if(ui.tab==="cashflow") renderCashFlow(tmpMain);
  ui.ym = savedYm;
  return { subHTML, toggleHTML, mainHTML: tmpMain.innerHTML };
}

// Swipe over Monthly/Annual Outlook — a live, finger-tracked drag, not a
// fire-after-release gesture: the current period's content (Monthly's
// subhead + view-toggle row + ledger together, since those are three
// separate sticky elements in the DOM but read as one "card"; just the
// body on Annual Outlook, which has no subhead of its own) moves with the
// finger in real time, and the neighboring period's real content — built
// via renderGhostContent, not a placeholder — slides in from the edge
// being dragged toward, the same way switching between open apps reveals
// the next one mid-swipe. Release past roughly a third of the screen
// width commits (the preview is already fully in view, so committing is
// just swapping the live DOM to match it and dropping the preview);
// short of that, or dragging toward a blocked edge (Annual Outlook's year
// bounds), snaps back to 0 with nothing built for that side at all.
// Guards against: a dialog/sheet open, more than one finger down, and a
// mostly-vertical drag (left alone as ordinary scrolling).
function wireSwipeNav(){
  const main = document.getElementById("main");
  const SETTLE_MS = 220;
  const SETTLE_EASE = "cubic-bezier(.22,.68,.36,1)";
  let tracking=false, deciding=true, horiz=false;
  let startX=0, startY=0, dx=0, vw=0;
  let liveEls=null, ghosts={ "-1":null, "1":null };
  let settleTimer=null;

  // #subhead/#monthlyToggleSticky sit in a position:sticky container, so
  // they track the viewport the same way a position:fixed ghost does —
  // no drift there. #main is ordinary scrolling content though: its
  // on-screen position depends on the page's scroll offset, which the
  // ghost (captured once, fixed in place) knows nothing about. If the
  // page scrolls even slightly mid-drag — rubber-banding near the top or
  // bottom, residual momentum — live #main moves against its own frozen
  // ghost and the two visibly misalign.
  //
  // An earlier version of this fix locked the page by adding
  // `overflow:hidden` to html/body for the duration of the gesture. That
  // introduced a worse, confirmed-on-video regression: on any month whose
  // category list is taller than one screen, overflow:hidden clips the
  // page at the viewport's own height, so whatever was below the fold
  // (the last category or two) visibly disappears — a blank gap where
  // nav used to sit right after the last visible row — for as long as the
  // lock is held, because the content is genuinely no longer reachable,
  // not just mid-transition. Three earlier attempts (the lock itself,
  // switching nav.tabs from fixed to sticky, touch-action:pan-y) all
  // missed this because none of them touched the actual mechanism: it was
  // never iOS's toolbar or nav's positioning, it was this lock clipping
  // real content.
  //
  // touch-action:pan-y on #main (still in place below) plus this
  // handler's own e.preventDefault() once a drag is classified as
  // horizontal already stop the page from actually scrolling during the
  // gesture — which is what the lock was for — without taking anything
  // out of flow or clipping anything, so there's nothing left for a
  // lock/unlock pair to do here. Keeping both would only reintroduce the
  // clipping bug for no added protection.

  function liveElsForTab(){
    if(ui.tab==="monthly") return [
      document.getElementById("subhead"),
      document.getElementById("monthlyToggleSticky"),
      main,
    ];
    if(ui.tab==="outlook" || ui.tab==="cashflow") return [main];
    return null;
  }

  // One fixed-position overlay per live piece, positioned over that
  // piece's current viewport rect and parked just off that edge
  // (translateX ±vw) until the drag reveals it.
  function buildGhostSet(dir){
    const ym = ui.tab==="monthly" ? ui.ym+dir : ymOf(yearOfYM(ui.ym)+dir, monthOfYM(ui.ym));
    const content = renderGhostContent(ym);
    const park = dir>0 ? vw : -vw;
    const pieces = liveEls.map((el, i)=>{
      const rect = el.getBoundingClientRect();
      const g = document.createElement("div");
      // Inherits the live element's own classes (.subhead.show,
      // .monthly-toggle-sticky.show) so every bit of their real CSS —
      // padding, borders, flex layout — applies automatically, rather
      // than hand-copying each rule here and risking one getting missed.
      // <main> is the one exception: its layout comes from a bare `main`
      // tag selector, which a plain ghost <div> never picks up regardless
      // of class, so that one still needs the explicit copy below.
      g.className = "swipe-ghost "+el.className;
      g.style.top = rect.top+"px";
      g.style.left = rect.left+"px";
      g.style.width = rect.width+"px";
      g.style.height = (el===main ? Math.max(rect.height, window.innerHeight-rect.top) : rect.height)+"px";
      g.style.transform = `translateX(${park}px)`;
      g.innerHTML = el===main ? content.mainHTML : (el.id==="subhead" ? content.subHTML : content.toggleHTML);
      if(el===main) g.style.cssText += "padding-top:18px; display:flex; flex-direction:column; gap:20px; box-sizing:border-box";
      document.body.appendChild(g);
      return g;
    });
    return { dir, park, pieces };
  }

  function clearGhosts(){
    Object.keys(ghosts).forEach(k=>{
      if(ghosts[k]){ ghosts[k].pieces.forEach(g=>g.remove()); ghosts[k]=null; }
    });
  }

  function setLiveTransition(t){
    liveEls.forEach(el=> el.style.transition = t);
  }
  function setLiveTransform(x){
    liveEls.forEach(el=> el.style.transform = `translateX(${x}px)`);
  }
  function resetLiveStyles(){
    liveEls.forEach(el=>{ el.style.transform=""; el.style.transition=""; });
  }

  main.addEventListener("touchstart", (e)=>{
    // Defensive cleanup: a prior gesture's settle() removes ghosts and
    // resets live styles in a setTimeout that fires ~240ms after release.
    // Starting a new swipe before that timeout runs — a quick double-swipe
    // — would otherwise overwrite `ghosts` with a fresh set without ever
    // removing the previous gesture's panels from the DOM, leaving them
    // orphaned and visibly stacked on top of the live content. Cancelling
    // the pending timer matters too: if it's left to fire mid-new-gesture,
    // it clears THIS gesture's ghosts/styles out from under it and can
    // call changePeriod with the previous gesture's stale direction.
    if(settleTimer){ clearTimeout(settleTimer); settleTimer=null; }
    clearGhosts();
    if(liveEls) resetLiveStyles();
    if(document.getElementById("dlg").open || e.touches.length>1){ tracking=false; return; }
    if(!(ui.tab==="monthly" || ui.tab==="outlook" || ui.tab==="cashflow")){ tracking=false; return; }
    // What-if sliders keep their own horizontal drag.
    if(e.target && e.target.closest && e.target.closest('input[type="range"]')){ tracking=false; return; }
    const t = e.touches[0];
    startX=t.clientX; startY=t.clientY; dx=0;
    tracking=true; deciding=true; horiz=false;
    liveEls=null;
  }, { passive:true });

  main.addEventListener("touchmove", (e)=>{
    if(!tracking) return;
    const t = e.touches[0];
    const mdx = t.clientX-startX, mdy = t.clientY-startY;
    if(deciding){
      if(Math.abs(mdx)<8 && Math.abs(mdy)<8) return;
      deciding=false;
      horiz = Math.abs(mdx) > Math.abs(mdy)*1.3;
      if(!horiz){ tracking=false; return; } // vertical — leave it to ordinary scrolling
      liveEls = liveElsForTab();
      if(!liveEls){ tracking=false; horiz=false; return; }
      // Snap to the top before measuring/building anything below. The
      // ghost mechanism positions the incoming month's preview using
      // #main's CURRENT on-screen rect — fine if the page is scrolled
      // near the top, but if you're scrolled deep into a long category
      // list (e.g. near the bottom of November) and swipe to a month
      // with much shorter content (e.g. December, not set up yet), that
      // short content doesn't reach anywhere near your current scroll
      // position. The visible viewport ends up looking at a stretch of
      // page where neither the live content nor the incoming ghost has
      // anything to show — a dead blank/black frame, confirmed on video,
      // worse than the earlier "gap above nav" bug since nothing at all
      // is visible, not just a clipped-short list. Resetting scroll here
      // means every rect measured below is relative to the same, stable
      // reference point (top of page) for both live content and every
      // ghost, regardless of where the gesture started.
      window.scrollTo(0, 0);
      vw = window.innerWidth;
      if(canStepPeriod(1)) ghosts["1"] = buildGhostSet(1);
      if(canStepPeriod(-1)) ghosts["-1"] = buildGhostSet(-1);
      setLiveTransition("none");
    }
    if(!horiz) return;
    e.preventDefault(); // only once this is a confirmed horizontal drag
    const dir = mdx<0 ? 1 : -1;
    const blocked = !ghosts[String(dir)];
    // Dragging toward a side with no ghost (a blocked Annual Outlook year
    // bound) rubber-bands instead of tracking 1:1 — there's nothing back
    // there to reveal, so the drag should feel like it's pushing against
    // an edge, not sliding open onto nothing.
    dx = blocked ? Math.sign(mdx)*Math.min(Math.abs(mdx)*0.35, 70) : Math.max(-vw, Math.min(vw, mdx));
    setLiveTransform(dx);
    const g = ghosts[String(dir)];
    if(g) g.pieces.forEach(p=> p.style.transform = `translateX(${g.park+dx}px)`);
    const other = ghosts[String(-dir)];
    if(other) other.pieces.forEach(p=> p.style.transform = `translateX(${other.park+dx}px)`);
  }, { passive:false });

  function settle(e){
    if(!tracking) return;
    tracking=false;
    if(!horiz){ return; }
    const dir = dx<0 ? 1 : -1;
    const commit = ghosts[String(dir)] && Math.abs(dx) >= vw*0.32;
    setLiveTransition(`transform ${SETTLE_MS}ms ${SETTLE_EASE}`);
    const target = commit ? dir*vw : 0;
    setLiveTransform(target);
    Object.keys(ghosts).forEach(k=>{
      const g = ghosts[k];
      if(!g) return;
      g.pieces.forEach(p=>{
        p.style.transition = `transform ${SETTLE_MS}ms ${SETTLE_EASE}`;
        p.style.transform = `translateX(${commit && k===String(dir) ? 0 : g.park}px)`;
      });
    });
    settleTimer = setTimeout(()=>{
      settleTimer = null;
      clearGhosts();
      resetLiveStyles();
      if(commit) changePeriod(dir);
    }, SETTLE_MS + 20);
  }
  main.addEventListener("touchend", settle, { passive:true });
  main.addEventListener("touchcancel", ()=>{ dx=0; settle(); }, { passive:true });
}

/* ---------------------------------------------------------------
   BOOT
--------------------------------------------------------------- */
function start(){
  document.getElementById("dlg").addEventListener("close", ()=>{
    document.body.classList.remove("sheet-open");
    document.body.style.top = "";
    // Restores the exact scroll position the lock saved, rather than
    // trusting the browser to have kept the (now unlocked) body where it
    // visually was — that's what was leaving nav.tabs looking detached
    // from the bottom edge after a sheet closed.
    window.scrollTo(0, lockedScrollY);
  });
  wireSheetDrag();
  wireSwipeNav();
  render();
  initDB();
}
// Boot never fails silently into a blank white screen — anything thrown
// during startup (DOM not ready yet, an unexpected runtime quirk, etc.)
// replaces the page with a plain visible message instead.
function bootSafe(){
  try{
    if(window.claude && window.claude.hot && window.claude.hot.ready){
      window.claude.hot.ready(start);
    } else {
      start();
    }
  } catch(err){
    try{ console.error("Ledger Casa failed to start:", err); }catch(e){}
    document.body.innerHTML = '<div style="font-family:sans-serif; padding:40px 20px; text-align:center; color:#1E2A28">Something went wrong loading Ledger Casa — try reloading.</div>';
  }
}
bootSafe();
})();
</script>
