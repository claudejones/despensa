name: Football mobile acceptance
on:
  push:
    branches: [football-screen-by-screen-implementation, football-contextual-review, football-ticket-builder, football-week6-research, football-research-briefings, football-fixed-ticket-dock, football-drawer-polish, football-update-indicators, football-settings-modals, football-progressive-research, football-pool-performance, main]
    paths:
      - 'football/**'
      - '.github/workflows/football-mobile-acceptance.yml'
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.58.2
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/football-server.log 2>&1 &
      - name: Run mobile smoke
        run: node football/tests/mobile-smoke.cjs
      - name: Run financial acceptance
        run: node football/tests/financial-acceptance.cjs

      - name: Run ticket lifecycle and backup acceptance
        run: node football/tests/lifecycle.cjs

      - name: Run contextual review and sticky navigation
        run: node football/tests/contextual-review.cjs

      - name: Run shared ticket builder
        run: node football/tests/ticket-flow.cjs

      - name: Verify research refresh
        run: node football/tests/research-refresh.cjs

      - name: Verify research briefings
        run: node football/tests/research-briefings.cjs

      - name: Verify active ticket dock during scrolling
        run: node football/tests/ticket-dock.cjs

      - name: Verify drawer layout and navigation
        run: node football/tests/sheet-navigation.cjs

      - name: Verify change-only research badges
        run: node football/tests/research-updates.cjs

      - name: Verify preferences and custom modals
        run: node football/tests/preferences-modals.cjs

      - name: Verify progressive research and market fallback
        run: node football/tests/progressive-market.cjs

      - name: Verify Pool choices and Performance
        run: node football/tests/pool-performance.cjs

      - name: Verify update preservation and button spacing
        run: node football/tests/update-preservation.cjs

      - name: Verify pricing focus and per-leg quotes
        run: node football/tests/pricing-editor.cjs

      - name: Verify Kalshi workspace views
        run: node football/tests/workspace-views.cjs

      - name: Verify optional Pool and simplified close form
        run: node football/tests/pool-close-polish.cjs

      - name: Verify direct actions and purchase correction
        run: node football/tests/direct-actions-correction.cjs

      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-mobile-screenshots
          path: football/test-artifacts/*.png
          if-no-files-found: warn
