name: Football mobile acceptance
on:
  push:
    branches: [football-screen-by-screen-implementation, football-contextual-review, football-ticket-builder, football-week6-research, football-research-briefings, football-fixed-ticket-dock, main]
    paths:
      - 'football/**'
      - '.github/workflows/football-mobile-acceptance.yml'
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.58.2
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/football-server.log 2>&1 &
      - name: Run mobile smoke
        run: node football/tests/mobile-smoke.cjs
      - name: Run financial acceptance
        run: node football/tests/financial-acceptance.cjs

      - name: Run ticket lifecycle and backup acceptance
        run: node football/tests/lifecycle.cjs

      - name: Run contextual review and sticky navigation
        run: node football/tests/contextual-review.cjs

      - name: Run shared ticket builder
        run: node football/tests/ticket-flow.cjs

      - name: Verify research refresh
        run: node football/tests/research-refresh.cjs

      - name: Verify research briefings
        run: node football/tests/research-briefings.cjs

      - name: Verify active ticket dock during scrolling
        run: node football/tests/ticket-dock.cjs

      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-mobile-screenshots
          path: football/test-artifacts/*.png
          if-no-files-found: warn
