name: Football mobile acceptance
on:
  push:
    branches: [football-screen-by-screen-implementation]
    paths:
      - 'football/**'
      - '.github/workflows/football-mobile-acceptance.yml'
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.58.2
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/football-server.log 2>&1 &
      - name: Run mobile smoke
        run: node football/tests/mobile-smoke.cjs
