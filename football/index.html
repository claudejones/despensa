let data=null,tab='weeks',sub='',plan='',planTab='tickets',pool=JSON.parse(localStorage.getItem('football-pool-v03')||'{}'),theme=localStorage.getItem('football-theme-v03')||'light',tickets=JSON.parse(localStorage.getItem('football-v1')||'[]');const $=s=>document.querySelector(s),save=()=>localStorage.setItem('football-v1',JSON.stringify(tickets)),money=n=>'$'+Number(n||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),date=s=>new Date(s).toLocaleString('en-US',{timeZone:'America/Cancun',weekday:'long',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});const codes=['hou','jax','ten','ind','car','phi','pit','tb','bal','cle','no','nyg','chi','atl','nyj','ne','ari','lar','lac','kc','buf','lv','dal','gb','wsh','sf'],names=['Houston Texans','Jacksonville Jaguars','Tennessee Titans','Indianapolis Colts','Carolina Panthers','Philadelphia Eagles','Pittsburgh Steelers','Tampa Bay Buccaneers','Baltimore Ravens','Cleveland Browns','New Orleans Saints','New York Giants','Chicago Bears','Atlanta Falcons','New York Jets','New England Patriots','Arizona Cardinals','Los Angeles Rams','Los Angeles Chargers','Kansas City Chiefs','Buffalo Bills','Las Vegas Raiders','Dallas Cowboys','Green Bay Packers','Washington Commanders','San Francisco 49ers'];const team=(n,r)=>'<div class="team"><img alt="" src="https://a.espncdn.com/i/teamlogos/nfl/500/'+(codes[names.indexOf(n)]||'nfl')+'.png"><b>'+esc(n)+' ('+esc(r)+')</b></div>';

function icons(){if(window.lucide)window.lucide.createIcons()}function render(){let v=$('#view');document.body.classList.toggle('dark',theme==='dark');$('#weekName').textContent='Week '+Number($('#week').value);$('#title').textContent=sub==='calendar'?'Season Overview':sub==='settings'?'Settings':sub==='results'?'Performance':({weeks:'Weekly Overview',games:'Game Research',picks:'AI Game Picks',combos:'Combo Strategies',kalshi:'My Kalshi'})[tab];document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(sub==='calendar'){v.innerHTML='<h2>2026 Season</h2><div class="grid3">'+Array.from({length:18},(_,i)=>'<button data-week="'+String(i+1).padStart(2,'0')+'">Week '+(i+1)+'</button>').join('')+'</div>';icons();return}if(sub==='settings'){v.innerHTML='<div class="card"><h2>Appearance</h2><div class="grid2"><button data-theme="light">Light</button><button data-theme="dark">Dark</button></div></div><div class="card"><h2>Navigation</h2><label><input type="checkbox" id="swipePref" style="width:auto" '+(localStorage.getItem('football-swipe-v04')!=='off'?'checked':'')+'> Swipe between sections</label></div><div class="card"><h2>Data & backups</h2><p class="muted">Personal tickets are stored on this device. Export and import in Kalshi.</p><p class="muted">Kickoff times are displayed in Cancún time.</p></div>';icons();return}if(plan){v.innerHTML=planScreen();icons();return}if(sub==='results'){v.innerHTML=performanceScreen();icons();return}if(!data){v.innerHTML='<div class="card"><h2>Research not available</h2><p>Initial research planned Monday, refresh Saturday, Cancún time. Automated publication not activated.</p></div>';return}if(tab==='weeks')v.innerHTML='<div class="card"><h2>Week '+data.week+'</h2><div class="grid3"><div class="metric"><small>Games</small><b>'+data.games.length+'</b></div><div class="metric"><small>AI picks</small><b>—</b></div><div class="metric"><small>Combos</small><b>'+data.comboCandidates.length+'</b></div></div><p>'+esc(data.notes)+'</p></div><div class="card"><h3>My Kalshi portfolio</h3><p>'+tickets.filter(t=>t.status==='purchased').length+' open tickets</p><button data-tab="kalshi">Review tickets</button> <button data-action="results">Performance</button></div>';if(tab==='games')v.innerHTML=data.games.map(g=>'<div class="card"><small>'+date(g.kickoff)+'</small>'+team(g.away.name,g.away.record)+team(g.home.name,g.home.record)+g.insights.map(i=>'<details><summary>'+esc(i.category.toUpperCase())+' · '+esc(i.summary)+'</summary><ul>'+i.details.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></details>').join('')+'</div>').join('');if(tab==='picks'){let count=data.games.filter(g=>pool[data.week+'-'+g.id]).length;v.innerHTML='<div class="card"><h3>Independent AI Predictions</h3><p class="muted">AI forecasts are awaiting validation. Make your own office-pool picks independently.</p></div>'+data.games.map(g=>{let k=data.week+'-'+g.id,p=pool[k];return '<div class="card pick-card"><span class="pill">'+date(g.kickoff)+'</span>'+team(g.away.name,g.away.record)+team(g.home.name,g.home.record)+'<div style="border-top:1px solid #dce5ee;margin:12px 0"></div><div class="row" style="justify-content:space-between"><div><small>AI PREDICTED WINNER</small><div><b>Pending validation</b></div></div><div><small>AI WIN PROBABILITY</small><div>Not published</div></div></div><details class="research-acc"><summary><i data-lucide="clipboard-list"></i><span><b>Why this selection?</b><div class="muted" style="font-size:12px">Research insights available; no validated prediction.</div></span><i class="chev" data-lucide="chevron-down"></i></summary><div class="details"><ul>'+g.insights.filter(x=>x.details.some(z=>!z.includes('No verified'))).slice(0,3).flatMap(x=>x.details).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div></details><div style="margin:12px 0 7px"><small>MY OFFICE POOL PICK</small></div><div class="grid2">'+[g.away,g.home].map(t=>'<button class="pick-btn '+(p===t.name?'selected':'')+'" async function load(){data=null;render();try{let r=await fetch('data/2026/week-'+$('#week').value+'.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('not found');data=await r.json();$('#status').textContent='Research '+data.status+' · '+data.researchVersion}catch(e){$('#status').textContent='Week data not yet published'}render();icons()}function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({schemaVersion:1,tickets,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}));a.href=u;a.download='football-chatgpt-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;sub='';plan='';render();icons()}if(b.dataset.action==='calendar'){sub='calendar';plan='';render()}if(b.dataset.action==='settings'){sub='settings';plan='';render()}if(b.dataset.action==='results'){sub='results';plan='';render()}if(b.dataset.week){$('#week').value=b.dataset.week;sub='';plan='';load()}if(b.dataset.theme){theme=b.dataset.theme;localStorage.setItem('football-theme-v03',theme);render()}if(b.dataset.plan){plan=b.dataset.plan;planTab='tickets';render()}if(b.dataset.planBack){plan='';render()}if(b.dataset.planTab){planTab=b.dataset.planTab;render()}if(b.dataset.add){let t=data.comboCandidates.find(x=>x.id===b.dataset.add);tickets.push({id:String(Date.now())+Math.random(),title:t.title,source:'AI '+t.id,stake:2,payout:t.quoteSnapshot.grossPayout,market:null,proceeds:null,status:'draft',legs:t.legs});save();tab='kalshi';render()}if(b.dataset.pool){let k=data.week+'-'+b.dataset.pool;pool[k]=pool[k]===b.dataset.team?null:b.dataset.team;localStorage.setItem('football-pool-v03',JSON.stringify(pool));render()}if(b.dataset.action==='copyPool'){let chosen=data.games.filter(g=>pool[data.week+'-'+g.id]);if(!chosen.length)return alert('Select a team first.');if(chosen.length<data.games.length&&!confirm(chosen.length+' of '+data.games.length+' games selected — copy anyway?'))return;let lines=chosen.map((g,i)=>{let n=pool[data.week+'-'+g.id],w=g.away.name===n?g.away:g.home,o=g.away.name===n?g.home:g.away;return (i+1)+'. WINNER: '+w.name+' ('+w.record+')\\n   Opponent: '+o.name+' ('+o.record+')\\n   '+date(g.kickoff)});let txt='NFL Office Pool — 2026 Week '+data.week+'\\n\\nMY PICKS TO WIN:\\n\\n'+lines.join('\\n\\n')+'\\n\\nTotal selections: '+chosen.length+' of '+data.games.length;navigator.clipboard.writeText(txt).then(()=>alert('Copied')).catch(()=>prompt('Copy picks:',txt))}if(b.id==='custom'){tickets.push({id:String(Date.now()),title:'Custom ticket
