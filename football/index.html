.name?'selected':'')+'" aria-pressed="'+(p===t.name?'true':'false')+'" aria-label="Pick '+esc(t.name)+' to win" data-pool="'+g.id+'" data-team="'+esc(t.name)+'"><img alt="" src="https://a.espncdn.com/i/teamlogos/nfl/500/'+teamCode(t.name)+'.png" onerror="this.style.display=\'none\'">'+teamCode(t.name).toUpperCase()+(p===t.name?' ✓':'')+'</button>').join('')+'</div></div>'}).join('')+'<div class="card copybar"><div class="row" style="justify-content:space-between"><b>My Office Pool</b><span class="pick-count">'+count+' of '+data.games.length+'</span></div><p><button class="primary" data-action="copyPool">Copy My Picks</button></p></div>'}if(tab==='combos')v.innerHTML='<p class="muted">Explore five strategies. Open a plan to review tickets, payout sheets and timing.</p>'+Object.entries({A:'Single + Combo',B:'Simultaneous Games',C:'Staggered Games',D:'Undefeated Teams',E:'Losing-Team Streaks'}).map(([id,name])=>'<button class="card" style="width:100%;text-align:left" data-plan="'+id+'"><small>PLAN '+id+'</small><h3>'+name+'</h3><small>'+data.comboCandidates.filter(t=>t.strategy===id).length+' candidate tickets · View details</small></button>').join('');if(tab==='kalshi')v.innerHTML='<div class="grid3"><div class="metric"><small>Draft stake</small><b>'+money(tickets.filter(t=>t.status==='draft').reduce((x,t)=>x+Number(t.stake||0),0))+'</b></div><div class="metric"><small>Open risk</small><b>'+money(tickets.filter(t=>t.status==='purchased').reduce((x,t)=>x+Number(t.stake||0)*(t.remainingFraction??1),0))+'</b></div><div class="metric"><small>Closed</small><b>'+tickets.filter(t=>['won','lost','sold'].includes(t.status)).length+'</b></div></div><div class="grid2" style="margin:12px 0"><button data-action="results">Performance</button><button id="export">Export for ChatGPT</button></div>'+(showBuilder?builder():'')+'<div class="card"><h3>Build → Evaluate → Monitor → Close</h3><p class="muted">Imported candidates are drafts. Recording a purchase does not place a trade on Kalshi.</p><button id="custom">+ Create custom ticket</button><label>Import backup<input type="file" id="import" accept=".json"></label></div>'+tickets.map(t=>'<div class="card"><div class="row" style="justify-content:space-between"><div><small>'+esc(t.source||'User')+' · '+esc(t.status)+'</small><h3>'+esc(t.title)+'</h3></div><button data-del="'+t.id+'">Remove</button></div>'+(t.legs||[]).map(l=>{let g=data?.games.find(g=>g.id===l.gameId);return '<div style="margin:8px 0">'+(g?'<span class="pill">'+date(g.kickoff)+'</span>':'')+team(l.team,g?.away.name===l.team?g.away.record:g?.home.record||'—')+'<small>'+l.side+' · Kalshi '+l.marketPercent+'%</small></div>'}).join('')+(t.status==='purchased'?'<div class="soft"><h3>Monitor / partial cash-out</h3><div class="grid2"><label>Quantity sold (% of remaining)<input type="number" min="1" max="100" step="1" id="qty-'+t.id+'" value="100"></label><label>Actual sale proceeds ($)<input type="number" min="0" step=".01" id="sale-'+t.id+'" placeholder="Enter executed proceeds"></label></div><button data-sale="'+t.id+'">Record executed sale</button><p class="muted">Do not enter a cash-out offer until the sale is executed.</p></div>':'')+'<div class="grid2">'+['stake','payout','market','proceeds','fee'].map(k=>'<label>'+({stake:'Stake',payout:'Gross payout',market:'Kalshi %',proceeds:'Actual proceeds',fee:'Fees'}[k])+'<input type="number" min="0" step=".01" data-id="'+t.id+'" data-field="'+k+'" value="'+(t[k]??'')+'"></label>').join('')+'</div><label>Stage<select data-id="'+t.id+'" data-field="status">'+['draft','purchased','sold','won','lost'].map(x=>'<option '+(t.status===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><div class="soft"><div class="row" style="justify-content:space-between"><span>Break-even probability</span><b>'+(Number(t.payout)>0?(100*(Number(t.stake||0)+Number(t.fee||0))/Number(t.payout)).toFixed(1)+'%':'—')+'</b></div><div class="row" style="justify-content:space-between"><span>Potential net</span><b>'+money(Number(t.payout||0)-Number(t.stake||0)-Number(t.fee||0))+'</b></div>'+(t.status==='sold'||t.status==='won'||t.status==='lost'?'<div class="row" style="justify-content:space-between"><span>Realized net</span><b>'+money(Number(t.proceeds||0)-Number(t.stake||0)-Number(t.fee||0))+'</b></div>':'')+'</div>'+ticketJournal(t)+'</div>').join('');if(tab==='results'){let c=tickets.filter(t=>['won','lost','sold'].includes(t.status)),cost=c.reduce((a,t)=>a+Number(t.stake),0),returnValue=c.reduce((a,t)=>a+Number(t.proceeds||0),0);v.innerHTML='<div class="grid"><div class="card">Realized net<h2>'+money(returnValue-cost)+'</h2></div><div class="card">ROI<h2>'+(cost?((returnValue-cost)/cost*100).toFixed(1)+'%':'—')+'</h2></div><div class="card">Closed<h2>'+c.length+'</h2></div><div class="card">Open stake<h2>'+money(tickets.filter(t=>t.status==='purchased').reduce((a,t)=>a+Number(t.stake),0))+'</h2></div></div>'}}
async function load(){data=null;render();try{let r=await fetch('data/2026/week-'+$('#week').value+'.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('not found');data=await r.json();$('#status').textContent='Research '+data.status+' · '+data.researchVersion}catch(e){$('#status').textContent='Week data not yet published'}render();icons()}function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({schemaVersion:1,tickets,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}));a.href=u;a.download='football-chatgpt-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;sub='';plan='';render();icons()}if(b.dataset.action==='calendar'){sub=sub==='calendar'?'':'calendar';plan='';seasonMode='weeks';render()}if(b.dataset.action==='settings'){sub=sub==='settings'?'':'settings';plan='';render()}if(b.dataset.action==='results'){sub='results';plan='';render()}if(b.dataset.week){$('#week').value=b.dataset.week;localStorage.setItem('football-selected-week-2026',b.dataset.week);sub='';plan='';load()}if(b.dataset.theme){theme=b.dataset.theme;localStorage.setItem('football-theme-v03',theme);render()}if(b.dataset.seasonMode){seasonMode=b.dataset.seasonMode;render()}if(b.dataset.kalshiStage){kalshiStage=b.dataset.kalshiStage;render()}if(b.dataset.plan){plan=b.dataset.plan;planTab='tickets';render()}if(b.dataset.planBack){plan='';render()}if(b.dataset.planTab){planTab=b.dataset.planTab;render()}if(b.dataset.add){let t=data.comboCandidates.find(x=>x.id===b.dataset.add);tickets.push({id:String(Date.now())+Math.random(),title:t.title,source:'AI '+t.id,stake:2,payout:t.quoteSnapshot.grossPayout,market:null,proceeds:null,status:'draft',legs:t.legs});save();tab='kalshi';render()}if(b.dataset.pool){let k=data.week+'-'+b.dataset.pool;pool[k]=pool[k]===b.dataset.team?null:b.dataset.team;localStorage.setItem('football-pool-v03',JSON.stringify(pool));render()}if(b.dataset.action==='copyPool'){let chosen=data.games.filter(g=>pool[data.week+'-'+g.id]);if(!chosen.length)return alert('Select a team first.');if(chosen.length<data.games.length&&!confirm(chosen.length+' of '+data.games.length+' games selected — copy anyway?'))return;let lines=chosen.map((g,i)=>{let n=pool[data.week+'-'+g.id],w=g.away.name===n?g.away:g.home,o=g.away.name===n?g.home:g.away;return (i+1)+'. WINNER: '+w.name+' ('+w.record+')\\n   Opponent: '+o.name+' ('+o.record+')\\n   '+date(g.kickoff)});let txt='NFL Office Pool — 2026 Week '+data.week+'\\n\\nMY PICKS TO WIN:\\n\\n'+lines.join('\\n\\n')+'\\n\\nTotal selections: '+chosen.length+' of '+data.games.length;navigator.clipboard.writeText(txt).then(()=>alert('Copied')).catch(()=>prompt('Copy picks:',txt))}if(b.id==='custom'){showBuilder=!showBuilder;render();if(showBuilder)$('#buildLegs').innerHTML=legRow()}if(b.dataset.builder==='addLeg')$('#buildLegs').insertAdjacentHTML('beforeend',legRow());if(b.dataset.builder==='removeLeg')b.closest('.build-leg').remove();if(b.dataset.builder==='save')saveCustom();if(b.dataset.builder==='cancel'){showBuilder=false;render()}if(b.id==='export')exportData();if(b.dataset.sale){let t=tickets.find(x=>x.id===b.dataset.sale),pct=Number(document.getElementById('qty-'+t.id)?.value),amount=Number(document.getElementById('sale-'+t.id)?.value);if(!(pct>0&&pct<=100)||!(amount>=0)||!confirm('Record an executed sale of '+pct+'% for '+money(amount)+'?'))return;let remaining=t.remainingFraction??1,portion=remaining*pct/100;t.events??=[];t.events.push({kind:'sale',time:new Date().toISOString(),portion,proceeds:amount});t.proceeds=(Number(t.proceeds)||0)+amount;t.remainingFraction=Math.max(0,remaining-portion);if(t.remainingFraction<0.000001)t.status='sold';save();render()}if(b.dataset.del){tickets=tickets.filter(t=>t.id!==b.dataset.del);save();render()}});document.addEventListener('change',async e=>{if(e.target.id==='week'){localStorage.setItem('football-selected-week-2026',e.target.value);load()}if(e.target.id==='swipePref')localStorage.setItem('football-swipe-v04',e.target.checked?'on':'off');if(e.target.dataset.id){let t=tickets.find(x=>x.id===e.target.dataset.id),f=e.target.dataset.field;t[f]=f==='status'?e.target.value:e.target.value===''?null:Number(e.target.value);save();render()}if(e.target.id==='import'){try{let x=JSON.parse(await e.target.files[0].text());if(x.schemaVersion!==1||!Array.isArray(x.tickets))throw Error('Invalid backup');if(confirm('Replace local ticket records?')){tickets=x.tickets;save();render()}}catch(err){alert(err.message)}}});window.addEventListener('load',icons);let sx=0,sy=0;document.addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});document.addEventListener('touchend',e=>{if(true)return;if(sub||plan||!e.changedTouches.length)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<85||Math.abs(dx)<Math.abs(dy)*2)return;let tabs=['weeks','games','picks','combos','kalshi'],i=tabs.indexOf(tab),j=i+(dx<0?1:-1);if(j>=0&&j<tabs.length){tab=tabs[j];render();icons()}},{passive:true});let savedWeek=localStorage.getItem('football-selected-week-2026');$('#week').value=/^(0[1-9]|1[0-8])$/.test(savedWeek||'')?savedWeek:'06';load();
