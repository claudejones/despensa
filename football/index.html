<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Portfolio Lab</title><style>body{font:15px system-ui;background:#f7f9fc;color:#1b3149;margin:0;padding-bottom:100px}body.dark{background:#152439;color:#eaf3ff}body.dark .card,body.dark header,body.dark nav{background:#24364b;color:#eaf3ff}header{background:#fff;padding:14px;position:sticky;top:0;z-index:5;border-bottom:1px solid #dce5ee}nav{background:#fff;padding:8px 4px calc(8px + env(safe-area-inset-bottom));position:fixed;bottom:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;border-top:1px solid #dce5ee}nav{display:flex;gap:6px;overflow:auto}button,select,input{font:inherit;background:#fff;color:#1b3149;border:1px solid #d9e4ee;border-radius:10px;padding:10px}button{min-height:43px}nav button{border:0;display:grid;justify-items:center;align-content:center;gap:2px;font-size:11px;padding:4px}nav svg{width:20px;height:20px}nav button.active{background:#e1f1f0;color:#147980}main{max-width:800px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dce5ee;border-radius:16px;padding:15px;margin:12px 0}.team img{width:26px;height:26px}.muted,small{color:#6a7d91}.pill{display:inline-flex;background:#edf2f7;padding:5px 9px;border-radius:20px;font-size:11px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border:1px solid #dce5ee;padding:10px;border-radius:12px}.metric b{display:block;font-size:20px}.selected{background:#e1f1f0;border:2px solid #147980}.primary{background:#147980;color:#fff}.card summary{display:flex;align-items:center;gap:8px}.card summary .chev{margin-left:auto}.card details[open] .chev{transform:rotate(180deg)}small{color:#b6c8dd}details{border-top:1px solid #465c78;padding:10px 0}summary{cursor:pointer}.team{display:flex;align-items:center;gap:10px;margin:8px 0}.team img{width:35px;height:35px;object-fit:contain;background:white;border-radius:50%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin:8px 0}input{max-width:100%;box-sizing:border-box}h1{margin:0;font-size:23px}nav button{display:flex;align-items:center;gap:6px;white-space:nowrap}nav svg{width:17px;height:17px}header svg{width:23px;height:23px;vertical-align:middle}.team img{width:30px;height:30px}summary{display:list-item}</style><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script><header><h1><i data-lucide="trophy"></i> NFL Intelligence</h1><small>Week research & Kalshi · Prototype 0.2</small></header><nav id="nav"><button data-tab="weeks"><i data-lucide="calendar-days"></i> Weeks</button><button data-tab="games"><i data-lucide="shield"></i> Games</button><button data-tab="picks"><i data-lucide="brain"></i> AI Picks</button><button data-tab="combos"><i data-lucide="layers"></i> Combos</button><button data-tab="kalshi"><i data-lucide="ticket"></i> Kalshi</button><button data-tab="results"><i data-lucide="chart-no-axes-combined"></i> Results</button></nav><main><select id="week" style="display:none"><option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option><option>07</option><option>08</option><option>09</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option></select><p id="status"></p><div id="view"></div></main><script>
let data=null,tab='weeks',sub='',pool=JSON.parse(localStorage.getItem('football-pool-v03')||'{}'),theme=localStorage.getItem('football-theme-v03')||'light',tickets=JSON.parse(localStorage.getItem('football-v1')||'[]');const $=s=>document.querySelector(s),save=()=>localStorage.setItem('football-v1',JSON.stringify(tickets)),money=n=>'$'+Number(n||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),date=s=>new Date(s).toLocaleString('en-US',{timeZone:'America/Cancun',weekday:'long',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});const codes=['hou','jax','ten','ind','car','phi','pit','tb','bal','cle','no','nyg','chi','atl','nyj','ne','ari','lar','lac','kc','buf','lv','dal','gb','wsh','sf'],names=['Houston Texans','Jacksonville Jaguars','Tennessee Titans','Indianapolis Colts','Carolina Panthers','Philadelphia Eagles','Pittsburgh Steelers','Tampa Bay Buccaneers','Baltimore Ravens','Cleveland Browns','New Orleans Saints','New York Giants','Chicago Bears','Atlanta Falcons','New York Jets','New England Patriots','Arizona Cardinals','Los Angeles Rams','Los Angeles Chargers','Kansas City Chiefs','Buffalo Bills','Las Vegas Raiders','Dallas Cowboys','Green Bay Packers','Washington Commanders','San Francisco 49ers'];const team=(n,r)=>'<div class="team"><img alt="" src="https://a.espncdn.com/i/teamlogos/nfl/500/'+(codes[names.indexOf(n)]||'nfl')+'.png"><b>'+esc(n)+' ('+esc(r)+')</b></div>';
function icons(){if(window.lucide)window.lucide.createIcons()}function render(){let v=$('#view');document.body.classList.toggle('dark',theme==='dark');$('#weekName').textContent='Week '+Number($('#week').value);$('#title').textContent=sub==='calendar'?'Season Overview':sub==='settings'?'Settings':sub==='results'?'Performance':({weeks:'Weekly Overview',games:'Game Research',picks:'AI Game Picks',combos:'Combo Strategies',kalshi:'My Kalshi'})[tab];document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(sub==='calendar'){v.innerHTML='<h2>2026 Season</h2><div class="grid3">'+Array.from({length:18},(_,i)=>'<button data-week="'+String(i+1).padStart(2,'0')+'">Week '+(i+1)+'</button>').join('')+'</div>';icons();return}if(sub==='settings'){v.innerHTML='<div class="card"><h2>Appearance</h2><button data-theme="light">Light</button> <button data-theme="dark">Dark</button></div>';icons();return}if(sub==='results'){v.innerHTML='<div class="card"><h2>Performance</h2><p>Closed tickets: '+tickets.filter(t=>['sold','won','lost'].includes(t.status)).length+'</p><p>Open stake: '+money(tickets.filter(t=>t.status==='purchased').reduce((a,t)=>a+Number(t.stake),0))+'</p></div>';icons();return}if(!data){v.innerHTML='<div class="card"><h2>Research not available</h2><p>Initial research planned Monday, refresh Saturday, Cancún time. Automated publication not activated.</p></div>';return}if(tab==='weeks')v.innerHTML='<div class="card"><h2>Week '+data.week+'</h2><div class="grid3"><div class="metric"><small>Games</small><b>'+data.games.length+'</b></div><div class="metric"><small>AI picks</small><b>—</b></div><div class="metric"><small>Combos</small><b>'+data.comboCandidates.length+'</b></div></div><p>'+esc(data.notes)+'</p></div><div class="card"><h3>My Kalshi portfolio</h3><p>'+tickets.filter(t=>t.status==='purchased').length+' open tickets</p><button data-tab="kalshi">Review tickets</button> <button data-action="results">Performance</button></div>';if(tab==='games')v.innerHTML=data.games.map(g=>'<div class="card"><small>'+date(g.kickoff)+'</small>'+team(g.away.name,g.away.record)+team(g.home.name,g.home.record)+g.insights.map(i=>'<details><summary>'+esc(i.category.toUpperCase())+' · '+esc(i.summary)+'</summary><ul>'+i.details.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></details>').join('')+'</div>').join('');if(tab==='picks')v.innerHTML='<div class="card"><h2>Independent AI picks</h2><p>Forecasts pending validation. Choose your own office-pool winners.</p></div>'+data.games.map(g=>{let k=data.week+'-'+g.id;return '<div class="card"><small>'+date(g.kickoff)+'</small>'+team(g.away.name,g.away.record)+team(g.home.name,g.home.record)+'<div class="grid2">'+[g.away,g.home].map(t=>'<button class="'+(pool[k]===t.name?'selected':'')+'" data-pool="'+g.id+'" data-team="'+esc(t.name)+'">'+(codes[names.indexOf(t.name)]||'TEAM')+(pool[k]===t.name?' ✓':'')+'</button>').join('')+'</div></div>'}).join('')+'<div class="card"><button class="primary" data-action="copyPool">Copy My Picks</button></div>';if(tab==='combos')v.innerHTML=['A','B','C','D','E'].map(p=>'<h2>Plan '+p+'</h2>'+data.comboCandidates.filter(t=>t.strategy===p).map(t=>'<div class="card"><small>'+esc(t.type)+'</small><h3>'+esc(t.title)+'</h3>'+t.legs.map(l=>{let g=data.games.find(x=>x.id===l.gameId);return team(l.team,g.away.name===l.team?g.away.record:g.home.record)+'<small>'+l.side+' · Kalshi '+l.marketPercent+'% · '+date(g.kickoff)+'</small>'}).join('')+'<p>Historical $2 gross quote: '+money(t.quoteSnapshot.grossPayout)+'</p><button data-add="'+t.id+'">Add to Kalshi</button></div>').join('')).join('');if(tab==='kalshi')v.innerHTML='<h2>Personal tickets</h2><button id="custom">+ Custom ticket</button> <button id="export">Export JSON</button><label>Import backup<input type="file" id="import" accept=".json"></label>'+tickets.map(t=>'<div class="card"><b>'+esc(t.title)+'</b><small>'+esc(t.source)+'</small><div class="grid">'+['stake','payout','market','proceeds'].map(f=>'<label>'+f+'<input type="number" data-id="'+t.id+'" data-field="'+f+'" value="'+(t[f]??'')+'"></label>').join('')+'</div><label>Status<select data-id="'+t.id+'" data-field="status">'+['draft','purchased','sold','won','lost'].map(s=>'<option '+(t.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label><p>Break-even: '+(t.payout? (100*t.stake/t.payout).toFixed(1)+'%':'quote needed')+' · Potential net '+money(t.payout-t.stake)+'</p><button data-del="'+t.id+'">Remove</button></div>').join('');if(tab==='results'){let c=tickets.filter(t=>['won','lost','sold'].includes(t.status)),cost=c.reduce((a,t)=>a+Number(t.stake),0),returnValue=c.reduce((a,t)=>a+Number(t.proceeds||0),0);v.innerHTML='<div class="grid"><div class="card">Realized net<h2>'+money(returnValue-cost)+'</h2></div><div class="card">ROI<h2>'+(cost?((returnValue-cost)/cost*100).toFixed(1)+'%':'—')+'</h2></div><div class="card">Closed<h2>'+c.length+'</h2></div><div class="card">Open stake<h2>'+money(tickets.filter(t=>t.status==='purchased').reduce((a,t)=>a+Number(t.stake),0))+'</h2></div></div>'}}
async function load(){data=null;render();try{let r=await fetch('data/2026/week-'+$('#week').value+'.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('not found');data=await r.json();$('#status').textContent='Research '+data.status+' · '+data.researchVersion}catch(e){$('#status').textContent='Week data not yet published'}render();icons()}function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({schemaVersion:1,tickets,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}));a.href=u;a.download='football-chatgpt-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();icons()}if(b.dataset.add){let t=data.comboCandidates.find(x=>x.id===b.dataset.add);tickets.push({id:String(Date.now())+Math.random(),title:t.title,source:'AI '+t.id,stake:2,payout:t.quoteSnapshot.grossPayout,market:null,proceeds:null,status:'draft',legs:t.legs});save();tab='kalshi';render()}if(b.dataset.pool){let k=data.week+'-'+b.dataset.pool;pool[k]=pool[k]===b.dataset.team?null:b.dataset.team;localStorage.setItem('football-pool-v03',JSON.stringify(pool));render()}if(b.dataset.action==='copyPool'){let chosen=data.games.filter(g=>pool[data.week+'-'+g.id]);if(!chosen.length)return alert('Select a team first.');if(chosen.length<data.games.length&&!confirm(chosen.length+' of '+data.games.length+' games selected — copy anyway?'))return;let lines=chosen.map((g,i)=>{let n=pool[data.week+'-'+g.id],w=g.away.name===n?g.away:g.home,o=g.away.name===n?g.home:g.away;return (i+1)+'. WINNER: '+w.name+' ('+w.record+')\\n   Opponent: '+o.name+' ('+o.record+')\\n   '+date(g.kickoff)});let txt='NFL Office Pool — 2026 Week '+data.week+'\\n\\nMY PICKS TO WIN:\\n\\n'+lines.join('\\n\\n')+'\\n\\nTotal selections: '+chosen.length+' of '+data.games.length;navigator.clipboard.writeText(txt).then(()=>alert('Copied')).catch(()=>prompt('Copy picks:',txt))}if(b.id==='custom'){tickets.push({id:String(Date.now()),title:'Custom ticket',source:'User',stake:2,payout:0,status:'draft'});save();render()}if(b.id==='export')exportData();if(b.dataset.del){tickets=tickets.filter(t=>t.id!==b.dataset.del);save();render()}});document.addEventListener('change',async e=>{if(e.target.id==='week')load();if(e.target.dataset.id){let t=tickets.find(x=>x.id===e.target.dataset.id),f=e.target.dataset.field;t[f]=f==='status'?e.target.value:e.target.value===''?null:Number(e.target.value);save();render()}if(e.target.id==='import'){try{let x=JSON.parse(await e.target.files[0].text());if(x.schemaVersion!==1||!Array.isArray(x.tickets))throw Error('Invalid backup');if(confirm('Replace local ticket records?')){tickets=x.tickets;save();render()}}catch(err){alert(err.message)}}});window.addEventListener('load',icons);load();
</script></html>
