<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Approved UI References</title><script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fb;color:#19334a;font:14px system-ui}.app{max-width:440px;margin:auto;background:white;min-height:100vh;padding-bottom:85px}header{padding:16px;position:sticky;top:0;background:white;border-bottom:1px solid #e0e8ef;z-index:2}h1{font-size:21px;margin:0}h2{font-size:18px;margin:0 0 10px}.muted{color:#718295;font-size:12px}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.card{border:1px solid #dfe8f0;border-radius:16px;padding:14px;margin:12px 0}.soft{background:#f1f5f8;border-radius:12px;padding:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border:1px solid #dfe8f0;border-radius:12px;padding:10px}.metric b{display:block;font-size:20px}.team{display:flex;align-items:center;gap:8px;margin:8px 0}.team img{width:26px;height:26px;object-fit:contain}.pill{display:inline-block;border-radius:20px;background:#edf3f7;padding:5px 9px;font-size:11px}button{font:inherit;border:1px solid #dce5ed;background:white;border-radius:11px;padding:10px;min-height:44px;color:#19334a;cursor:pointer}.primary{background:#147b82;color:white}.selected{border:2px solid #147b82;background:#e2f2ef}.wide{width:100%}main{padding:15px}.seg{display:flex;background:#edf3f7;padding:4px;gap:4px;border-radius:12px;margin:12px 0}.seg button{flex:1;border:0;background:transparent;font-size:12px}.seg button.active{background:white;font-weight:750}.weeks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.weeks button{display:grid;justify-items:center;min-height:85px}.weeks svg{width:19px}details{border:1px solid #dfe8f0;border-radius:12px;margin:8px 0;padding:12px}summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}summary svg{width:17px}details[open] .chev{transform:rotate(180deg)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:white;border-top:1px solid #dfe8f0;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 3px 12px}.nav button{border:0;font-size:10px;display:grid;justify-items:center;gap:3px}.nav svg{width:20px;height:20px}.nav .active{background:#e2f2ef;color:#147b82}.menu{display:flex;overflow:auto;gap:5px;padding:8px;background:#f7f9fc}.menu button{min-height:30px;padding:5px 8px;white-space:nowrap;font-size:11px}.choice{width:100%;display:flex;align-items:center;justify-content:center;gap:7px}.choice img{width:22px;height:22px}input{width:100%;padding:10px;border:1px solid #dce5ed;border-radius:10px;font:16px system-ui}</style><div class="app"><header><div class="row between"><div><div class="muted">NFL INTELLIGENCE · APPROVED UI</div><h1 id="title">Weekly Overview</h1><div class="muted">Week 6 · 2026</div></div><div class="row"><button data-page="season" aria-label="Season calendar">▦</button><button data-page="settings" aria-label="Settings">⚙</button></div></div></header><div class="menu" id="menu"></div><main id="main"></main><nav class="nav" id="nav"></nav></div><script>
const pages=['home','season','games','picks','combos','plan','kalshi','performance','settings'],titles=['Weekly Overview','Season Overview','Game Research','AI Game Picks','Combo Strategies','Plan A Detail','My Kalshi','Performance','Settings'];let page=new URLSearchParams(location.search).get('screen')||'home',week=6,mode='weeks',pool={},tab='tickets',stage='build';const $=s=>document.querySelector(s),i=n=>'<i data-lucide="'+n+'"></i>',team=(n,r,c)=>'<div class="team"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/'+c+'.png" alt=""><b>'+n+' ('+r+')</b></div>',metrics=(arr)=>'<div class="grid3">'+arr.map(x=>'<div class="metric"><span class="muted">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'</div>',acc=(n,s)=>'<details><summary><span><b>'+n+'</b><div class="muted">'+s+'</div></span><span class="chev">'+i('chevron-down')+'</span></summary><ul><li>Supporting research details and sources.</li><li>Additional context for decision-making.</li></ul></details>';const g=[['New York Giants','3–1–1','nyg','New Orleans Saints','1–4','no','Sunday · 12:00 PM'],['Los Angeles Chargers','0–5','lac','Kansas City Chiefs','4–0','kc','Sunday · 3:25 PM'],['Washington Commanders','1–3–1','wsh','San Francisco 49ers','5–0','sf','Monday · 7:15 PM']];const match=x=>team(...x.slice(0,3))+team(...x.slice(3,6));function draw(){if(!pages.includes(page))page='home';$('#title').textContent=titles[pages.indexOf(page)];$('#menu').innerHTML=pages.map(x=>'<button data-page="'+x+'" class="'+(page===x?'selected':'')+'">'+x+'</button>').join('');$('#nav').innerHTML=[['home','house'],['games','shield'],['picks','brain'],['combos','layers'],['kalshi','wallet']].map(x=>'<button data-page="'+x[0]+'" class="'+(page===x[0]?'active':'')+'">'+i(x[1])+x[0]+'</button>').join('');$('#main').innerHTML=views[page]();if(window.lucide)window.lucide.createIcons()}
const views={
home:()=>'<div class="card"><h2>Week '+week+'</h2>'+metrics([['Games','13'],['AI Picks','—'],['Candidates','15']])+'<p class="muted">Preliminary research available; AI forecasts awaiting validation.</p></div>'+acc('Weekly research','13 games · Preliminary')+acc('AI predictions','Pending validation')+acc('Combo strategies','15 historical candidates')+'<div class="card"><b>My Kalshi portfolio</b><p class="muted">Open positions and realized results.</p><button data-page="performance">View Performance</button></div>',
season:()=>'<div class="card"><div class="row between"><h2>Season Overview</h2><button data-page="home" aria-label="Close">'+i('x')+'</button></div><div class="seg"><button data-mode="weeks" class="'+(mode==='weeks'?'active':'')+'">Weeks</button><button data-mode="summary" class="'+(mode==='summary'?'active':'')+'">Season Summary</button></div>'+(mode==='weeks'?'<div class="weeks">'+Array.from({length:18},(_,j)=>'<button data-week="'+(j+1)+'" class="'+(week===j+1?'selected':'')+'"><b>Week '+(j+1)+'</b>'+i(j===5?'check-circle-2':'clock')+'<span class="muted">'+(j===5?'Research available':'Not published')+'</span></button>').join('')+'</div><div class="soft" style="margin-top:12px"><b>Week '+week+'</b><p class="muted">'+(week===6?'Research published · 13 games':'Research not confirmed')+'</p><button class="primary wide" data-page="home">Open Week</button></div>':metrics([['Research weeks','1'],['Selected',week],['AI accuracy','—']])+'<p>Season P&L and historical accuracy require actual records.</p><button data-page="performance">Open Performance</button>')+'</div>',
games:()=>g.map(x=>'<div class="card"><span class="pill">Afternoon</span> <span class="muted">'+x[6]+'</span>'+match(x)+'<hr><b>Research insights</b>'+['Team Form','Injuries & Availability','Matchup Analysis','Market & Probability','Historical Insights'].map(n=>acc(n,'Concise research summary')).join('')+'</div>').join(''),
picks:()=>'<div class="soft">Independent AI predictions remain separate from your Office Pool.</div>'+g.map((x,j)=>'<div class="card"><span class="pill">Game window</span> <span class="muted">'+x[6]+'</span>'+match(x)+'<hr><div class="row between"><b>AI prediction: pending</b><span class="muted">Probability: —</span></div>'+acc('Why this selection?','Research-backed rationale')+'<p class="muted">MY OFFICE POOL PICK</p><div class="grid">'+[[x[0],x[2]],[x[3],x[5]]].map(t=>'<button class="choice '+(pool[j]===t[0]?'selected':'')+'" data-pick="'+j+'" data-team="'+t[0]+'"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/'+t[1]+'.png" alt="">'+t[1].toUpperCase()+'</button>').join('')+'</div></div>').join('')+'<div class="card"><b>My Office Pool · '+Object.values(pool).filter(Boolean).length+'/3</b><p><button class="primary wide" data-copy="1">Copy My Picks</button></p></div>',
combos:()=>[['A','Single + Combo'],['B','Simultaneous Games'],['C','Staggered Games'],['D','Undefeated Teams'],['E','Losing-Team Streaks']].map(x=>'<button class="card wide" data-page="plan" style="text-align:left"><div class="muted">PLAN '+x[0]+'</div><b>'+x[1]+'</b><p class="muted">Review tickets, outcomes and timing →</p></button>').join(''),
plan:()=>'<button data-page="combos">← Strategies</button><h2>Plan A · Single + Combo</h2><div class="soft">Pair the Giants single with Giants + Chiefs combo; shared Giants exposure.</div>'+metrics([['Stake','$4.00'],['Best net','+$4.95'],['Worst net','−$4.00']])+'<div class="seg">'+['tickets','outcomes','timing'].map(x=>'<button data-tab="'+x+'" class="'+(tab===x?'active':'')+'">'+x+'</button>').join('')+'</div><div class="card">'+(tab==='tickets'?'<b>A1 · Single Game Bet</b>'+match(g[0])+'<p>Stake $2 · Gross payout $3.95</p><hr><b>A2 · Two-Game Combo</b>'+match(g[0])+team('Kansas City Chiefs','4–0','kc')+'<p>Stake $2 · Gross payout $5.00</p>':tab==='outcomes'?'<b>Settlement outcomes</b><p>Both win: +$4.95</p><p>Giants win, Chiefs lose: −$0.05</p><p>Giants lose: −$4.00</p>':'<b>Timing checkpoints</b><p>Sunday 12 PM · Giants</p><p>Sunday 3:25 PM · Chiefs</p>')+'</div><div class="card"><b>Plan A payout sheet</b><p>A1 $3.95 · A2 $5.00</p><button data-page="kalshi">Add to Kalshi drafts (reference)</button></div>',
kalshi:()=>'<div class="grid3">'+[['Draft','$4'],['Open risk','—'],['Realized','—']].map(x=>'<div class="metric"><span class="muted">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'</div><div class="seg">'+['build','evaluate','monitor','close'].map(x=>'<button data-stage="'+x+'" class="'+(stage===x?'active':'')+'">'+x+'</button>').join('')+'</div><div class="card"><h2>'+stage[0].toUpperCase()+stage.slice(1)+'</h2><p class="muted">Approved '+stage+' workflow, tickets and calculations.</p><button>Custom ticket (production behavior)</button></div><button data-page="performance">View Performance</button>',
performance:()=>'<div class="seg"><button class="active">Season</button><button>Selected Week</button></div>'+metrics([['Realized net','—'],['ROI','—'],['Open risk','—']])+['Trading Performance','AI & Office Pool','Historical Learning'].map(x=>acc(x,'Expand for results and trends')).join(''),
settings:()=>'<div class="card"><h2>Settings</h2><p>Light appearance only. Five bottom tabs, no swipe.</p></div><div class="card"><b>Game display</b><p>Always show small team logos, records and Cancún kickoff times.</p></div><div class="card"><b>Data & backups</b><p>Keep personal tickets separate from published research.</p></div>'};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;draw()}if(b.dataset.mode){mode=b.dataset.mode;draw()}if(b.dataset.week){week=Number(b.dataset.week);page='home';draw()}if(b.dataset.tab){tab=b.dataset.tab;draw()}if(b.dataset.stage){stage=b.dataset.stage;draw()}if(b.dataset.pick){let k=b.dataset.pick;pool[k]=pool[k]===b.dataset.team?null:b.dataset.team;draw()}if(b.dataset.copy){let lines=g.filter((x,j)=>pool[j]).map((x,j)=>'WINNER: '+pool[g.indexOf(x)]+'\nOpponent: '+(pool[g.indexOf(x)]===x[0]?x[3]:x[0]));let t='NFL Office Pool — Week 6 (2026)\nMY PICKS TO WIN\n\n'+lines.join('\n\n');navigator.clipboard.writeText(t).then(()=>alert('Copied')).catch(()=>prompt('Copy',t))}});$('#calendar').onclick=()=>{page=page==='season'?'home':'season';draw()};$('#settings').onclick=()=>{page=page==='settings'?'home':'settings';draw()};draw();
</script></html>
