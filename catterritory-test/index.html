/* V21 inline post-win celebration: keep the solved board visible. */
.completionPanel{
  width:min(100%,880px);margin:0 auto 12px;padding:14px 16px 16px;

}

.completionTop{display:flex;align-items:center;justify-content:center;gap:10px;text-align:left}

.completionScores{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:11px 0}
.completionScore{background:#f5f5f2;border-radius:12px;padding:9px 10px;text-align:center;min-height:68px}
.completionScore small{display:block;color:#75808a;font-size:9px;font-weight:900;letter-spacing:.11em}
.completionScore strong{display:block;font-size:22px;line-height:1.15;margin-top:1px}
.completionScore .newbest{min-height:13px;margin-top:2px}
.completionContinue{width:100%;min-height:44px}

 const off=resume&&SND.pos[k]?SND.pos[k]:0;
 g.gain.setValueAtTime(0.0001,now);g.gain.linearRampToValueAtTime(MUSIC_VOL*m.gain,now+(off?0.8:0.4));
 s.connect(g);g.connect(SND.mus);s.start(now,off);
 SND.src=s;SND.gain=g;SND.t0=now;SND.off=off;
 if(!loop)s.onended=()=>{if(SND.src===s){SND.src=null;SND.key=null;setTimeout(()=>{if(!SND.src&&SND.want)mfPlay(SND.want,true,true)},400)}};
}
function mfStop(fade){
 if(!SND.src||!SND.ctx){SND.src=null;SND.key=null;return}
 if(SND.loop)SND.pos[SND.key]=mfPosNow();
 const s=SND.src,g=SND.gain,t=SND.ctx.currentTime,f=fade||0.2;
 g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0.0001,t+f);
 try{s.stop(t+f+0.02)}catch(e){}
 SND.src=null;SND.key=null;
}
// the song for the screen in front: the puzzle song while solving, the home song everywhere else
function screenMusic(){SND.want=$("game").classList.contains("active")?"puzzle":"home";if(sndPref("music"))mfPlay(SND.want,true,true);else mfStop(0.2)}
// Territory Complete: the owner's jingle once (then the screen's song comes back), or a code-made fanfare
async function jingle(){
 await mfMeta();
 if(sndPref("music")&&hasSong("jingle")&&sndOk()){SND.last="jingle";mfStop(0.3);mfPlay("jingle",false);return}
 sfx("fanfare");
}
function soundSettings(){
 const box=document.createElement("div");box.className="settingsSection";
 box.innerHTML=`<h3>Sound</h3><label class="toggle"><input id="dMusic" type="checkbox" ${sndPref("music")?"checked":""}> Music</label><label class="toggle"><input id="dSfx" type="checkbox" ${sndPref("sfx")?"checked":""}> Sound effects</label>`;
 const first=$("drawerContent").querySelector(".settingsSection");if(first)first.after(box);else $("drawerContent").prepend(box);
 $("dMusic").onchange=e=>{data.settings.music=e.target.checked;save();if(e.target.checked){sndUnlock();screenMusic()}else{mfStop(0.3);sndTag(sndPref("sfx"))}};
 $("dSfx").onchange=e=>{data.settings.sfx=e.target.checked;save();if(e.target.checked){sndUnlock();sfx("place")}else sndTag(sndPref("music"))};
}
function startAudio(){
 mfMeta();
 ["pointerup","touchend","keydown"].forEach(ev=>document.addEventListener(ev,sndUnlock,true));
 document.addEventListener("visibilitychange",()=>{if(!SND.ctx)return;if(document.hidden){sndTag(false);SND.ctx.suspend().catch(()=>{})}else if(sndPref("music")||sndPref("sfx"))sndUnlock()});
 const _cycle=cycle;cycle=function(i){
   const before=cur&&!cur.done?cur.state[i]:null;_cycle(i);
   if(before===null||!cur||cur.done)return;const now=cur.state[i];
   if(now===before)return;
   if(now===2)sfx("place");else if(before===2&&now===0)sfx("remove");else if(now===1)sfx("mark");else sfx("unmark");
 };
 const _shake=shakeCell;shakeCell=function(i){sfx("reject");_shake(i)};
 const _win=puzzleWin;puzzleWin=function(...a){sfx("win");_win(...a)};
 const _tw=territoryWin;territoryWin=function(t){_tw(t);$("modalBox").classList.add("winModal");jingle()};
 const _fin=finale;finale=function(){_fin();$("modalBox").classList.add("winModal");jingle()};
 // follow the screen itself (some buttons hold the original home/open functions)
 new MutationObserver(()=>{const w=$("game").classList.contains("active")?"puzzle":"home";if(w!==SND.want)screenMusic()}).observe($("game"),{attributes:true,attributeFilter:["class"]});
 const _set=settingsPanel;settingsPanel=function(){_set();soundSettings()};$("settingsTopBtn").onclick=()=>settingsPanel();
 screenMusic();
}
/* QA-START */
// QA mode + test hooks (source and test builds only; tools/build.mjs cuts this block from the public game).
function qaScreen(){return $("modal").classList.contains("show")?"modal":$("drawer").classList.contains("show")?"drawer":$("game").classList.contains("active")?"game":"home"}
function qaSolve(){if(!cur||cur.done)return false;cur.state=Array(cur.n*cur.n).fill(0);cur.sol.forEach((c,r)=>cur.state[r*cur.n+c]=2);cur.moves+=cur.n;return check()}
function qaUnlockAll(){data.unlockedTiers=[true,true,true];for(let t=0;t<3;t++)for(let p=0;p<25;p++){const k=tiers[t].id+"-"+p,r=data.puzzles[k]||{};if(!r.done)Object.assign(r,{done:true,solves:1,bestTime:60+p,bestMoves:tiers[t].sizes[p],lastTime:60+p,lastMoves:tiers[t].sizes[p],totalTime:60+p});data.puzzles[k]=r}save();if(!cur)renderHome()}
function qaFinishTerritory(t){for(let p=0;p<24;p++){const k=tiers[t].id+"-"+p;data.puzzles[k]=Object.assign(data.puzzles[k]||{},{done:true,solves:1,bestTime:60,bestMoves:9,lastTime:60,lastMoves:9,totalTime:60})}for(let x=0;x<=t;x++)data.unlockedTiers[x]=true;save();hideModal();closeDrawer();open(t,24)}
function qaClear(){localStorage.removeItem(KEY);localStorage.removeItem(KEY+"-backup");location.reload()}
function setupQA(){
 const box=document.createElement("div");box.id="qa";box.hidden=true;box.setAttribute("role","dialog");box.setAttribute("aria-label","QA mode");
 box.innerHTML=`<h3>QA mode</h3><p id="qaInfo"></p><div class="qaBtns"><button data-qa="solve">Solve this puzzle</button><button data-qa="t0">Finish Kitten Grounds</button><button data-qa="t1">Finish Cat's Domain</button><button data-qa="t2">Finish Lion's Territory</button><button data-qa="unlock">Unlock all</button><button data-qa="clear">Clear save</button><button data-qa="close">Close</button></div>`;
 document.body.appendChild(box);
 const show=()=>{$("qaInfo").textContent=`${versionText()} · ${innerWidth}×${innerHeight} · save ${KEY} · ${total()}/75 done · ${navigator.userAgent.replace(/^.*?\(/,"(").slice(0,90)}`;box.hidden=false};
 box.onclick=e=>{const a=e.target.dataset?.qa;if(!a)return;box.hidden=true;if(a==="solve")qaSolve();else if(a==="unlock"){qaUnlockAll();if(!cur||!$("game").classList.contains("active"))renderHome()}else if(a==="clear")qaClear();else if(a[0]==="t")qaFinishTerritory(+a[1])};
 let taps=0,tt=0;$("version").onclick=()=>{clearTimeout(tt);tt=setTimeout(()=>taps=0,1500);if(++taps>=5){taps=0;show()}};
 if(location.hash==="#qa")setTimeout(show,300);
 window.__ct={state:()=>({screen:qaScreen(),version:VERSION,build:BUILD,saveKey:KEY,done:total(),unlocked:data.unlockedTiers.slice(),settings:{...data.settings},
   puzzle:cur&&$("game").classList.contains("active")?{t:cur.t,p:cur.p,n:cur.n,tool:cur.tool,done:!!cur.done,moves:cur.moves,cats:cats().length,state:cur.state.slice(),cursor:cellIndex(document.activeElement)}:null}),
   open:(t,p)=>{hideModal();closeDrawer();open(t,p)},solve:qaSolve,unlockAll:qaUnlockAll,finishTerritory:qaFinishTerritory,clear:qaClear,showQA:show,solution:()=>cur?.sol.slice(),
   audio:()=>({ctx:SND.ctx?SND.ctx.state:null,playing:SND.src?SND.key:null,want:SND.want,songs:SND.meta?Object.keys(SND.meta):null,bad:Object.keys(SND.bad),music:sndPref("music"),sfx:sndPref("sfx"),last:SND.last})};
}
setTimeout(setupQA,0);
/* QA-END */
load();renderHome();idlePreloadAssets();startV30();startAudio();
})();
